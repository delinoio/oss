syntax = "proto3";

package devhud.deck.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/delinoio/oss/protos/devhud-deck/gen/go/devhud-deck/v1;deckv1";

// UuidV7 carries the canonical lowercase string form of a UUID v7 identifier.
message UuidV7 {
  string value = 1;
}

// Revision is the synchronized resource version. etag is opaque to clients.
message Revision {
  uint64 value = 1;
  string etag = 2;
}

// PageRequest requests an opaque-cursor page. page_size is a server-bounded hint.
message PageRequest {
  uint32 page_size = 1;
  string cursor = 2;
}

// PageResponse provides an empty next_cursor when no later page exists.
message PageResponse {
  string next_cursor = 1;
}

// UsdMicros is a signed count of USD micro-units (1 USD = 1,000,000).
message UsdMicros {
  int64 value = 1;
}

// IdempotencyKey is a client-generated UUID v7 replay identity.
message IdempotencyKey {
  UuidV7 value = 1;
}

// OwnerScope is closed in v1. Views cannot move between these scopes.
enum OwnerScope {
  OWNER_SCOPE_UNSPECIFIED = 0;
  OWNER_SCOPE_PERSONAL = 1;
  OWNER_SCOPE_ORGANIZATION = 2;
}

// Owner identifies exactly one personal account or organization.
message Owner {
  OwnerScope scope = 1;
  oneof owner_id {
    UuidV7 account_id = 2;
    UuidV7 organization_id = 3;
  }
}

// BillingSelection is server-authorized and never conveys a caller role.
message BillingSelection {
  UuidV7 organization_id = 1;
  UuidV7 team_id = 2;
}

// ViewKind is the closed internal view registry. It is not a plugin registry.
enum ViewKind {
  VIEW_KIND_UNSPECIFIED = 0;
  VIEW_KIND_GITHUB_PULL_REQUESTS = 1;
}

enum ViewSort {
  VIEW_SORT_UNSPECIFIED = 0;
  VIEW_SORT_RECENTLY_UPDATED = 1;
  VIEW_SORT_RECENTLY_CREATED = 2;
  VIEW_SORT_ATTENTION = 3;
  VIEW_SORT_CHECKS = 4;
  VIEW_SORT_REVIEW_STATE = 5;
}

enum ViewGrouping {
  VIEW_GROUPING_UNSPECIFIED = 0;
  VIEW_GROUPING_NONE = 1;
  VIEW_GROUPING_REPOSITORY = 2;
  VIEW_GROUPING_AUTHOR = 3;
  VIEW_GROUPING_REVIEWER = 4;
  VIEW_GROUPING_STATUS = 5;
}

enum PullRequestMutationKind {
  PULL_REQUEST_MUTATION_KIND_UNSPECIFIED = 0;
  PULL_REQUEST_MUTATION_KIND_ASSIGN_USERS = 1;
  PULL_REQUEST_MUTATION_KIND_UNASSIGN_USERS = 2;
  PULL_REQUEST_MUTATION_KIND_REQUEST_REVIEWERS = 3;
  PULL_REQUEST_MUTATION_KIND_REMOVE_REVIEWERS = 4;
  PULL_REQUEST_MUTATION_KIND_ADD_LABELS = 5;
  PULL_REQUEST_MUTATION_KIND_REMOVE_LABELS = 6;
  PULL_REQUEST_MUTATION_KIND_MARK_DRAFT = 7;
  PULL_REQUEST_MUTATION_KIND_MARK_READY = 8;
  PULL_REQUEST_MUTATION_KIND_CLOSE = 9;
  PULL_REQUEST_MUTATION_KIND_REOPEN = 10;
  PULL_REQUEST_MUTATION_KIND_MERGE = 11;
  PULL_REQUEST_MUTATION_KIND_ENABLE_AUTO_MERGE = 12;
  PULL_REQUEST_MUTATION_KIND_CANCEL_AUTO_MERGE = 13;
}

enum ConnectionState {
  CONNECTION_STATE_UNSPECIFIED = 0;
  CONNECTION_STATE_DISCONNECTED = 1;
  CONNECTION_STATE_PENDING = 2;
  CONNECTION_STATE_CONNECTED = 3;
  CONNECTION_STATE_REAUTHENTICATION_REQUIRED = 4;
}

enum RefreshOutcome {
  REFRESH_OUTCOME_UNSPECIFIED = 0;
  REFRESH_OUTCOME_REFRESHED = 1;
  REFRESH_OUTCOME_CACHE_HIT = 2;
  REFRESH_OUTCOME_COALESCED = 3;
  REFRESH_OUTCOME_RESERVATION_REJECTED = 4;
  REFRESH_OUTCOME_PROVIDER_PERMISSION_DENIED = 5;
  REFRESH_OUTCOME_PROVIDER_RATE_LIMITED = 6;
  REFRESH_OUTCOME_PROVIDER_TIMEOUT = 7;
  REFRESH_OUTCOME_PROVIDER_FAILED = 8;
  REFRESH_OUTCOME_DISCONNECTED = 9;
  REFRESH_OUTCOME_PROVIDER_CONCURRENCY_LIMITED = 10;
  REFRESH_OUTCOME_AUTOMATIC_REFRESH_NOT_ELIGIBLE = 11;
}

enum NotificationTransition {
  NOTIFICATION_TRANSITION_UNSPECIFIED = 0;
  NOTIFICATION_TRANSITION_ASSIGNED = 1;
  NOTIFICATION_TRANSITION_REVIEW_REQUESTED = 2;
  NOTIFICATION_TRANSITION_CHECKS_FAILED = 3;
  NOTIFICATION_TRANSITION_BECAME_MERGEABLE = 4;
  NOTIFICATION_TRANSITION_CONFLICTED = 5;
  NOTIFICATION_TRANSITION_MERGED = 6;
  NOTIFICATION_TRANSITION_CLOSED = 7;
}

enum FreshnessState {
  FRESHNESS_STATE_UNSPECIFIED = 0;
  FRESHNESS_STATE_FRESH = 1;
  FRESHNESS_STATE_STALE = 2;
  FRESHNESS_STATE_OFFLINE = 3;
  FRESHNESS_STATE_DISCONNECTED = 4;
  FRESHNESS_STATE_NEVER_REFRESHED = 5;
}

// DeckLimit encodes the fixed v1 product limits in the descriptor.
enum DeckLimit {
  DECK_LIMIT_UNSPECIFIED = 0;
  DECK_LIMIT_MAX_SHORTCUTS_PER_ACCOUNT_DEVICE = 20;
  DECK_LIMIT_MAX_PERSONAL_VIEWS = 50;
  DECK_LIMIT_MAX_ORGANIZATION_VIEWS = 250;
  DECK_LIMIT_MAX_PULL_REQUEST_RESULTS = 500;
}

enum IdempotentOperation {
  IDEMPOTENT_OPERATION_UNSPECIFIED = 0;
  IDEMPOTENT_OPERATION_CREATE_VIEW = 1;
  IDEMPOTENT_OPERATION_REFRESH_VIEW = 2;
  IDEMPOTENT_OPERATION_REGISTER_DEVICE = 3;
  IDEMPOTENT_OPERATION_DELETE_FEATURE_DATA = 4;
}

message IdempotencyResult {
  IdempotentOperation operation = 1;
  bool replayed = 2;
}

enum ErrorReason {
  ERROR_REASON_UNSPECIFIED = 0;
  ERROR_REASON_AUTHENTICATION_REQUIRED = 1;
  ERROR_REASON_INVALID_CREDENTIALS = 2;
  ERROR_REASON_SUBJECT_MISMATCH = 3;
  ERROR_REASON_PERMISSION_DENIED = 4;
  ERROR_REASON_GITHUB_PERMISSION_DENIED = 5;
  ERROR_REASON_NOT_FOUND = 6;
  ERROR_REASON_INVALID_ARGUMENT = 7;
  ERROR_REASON_STALE_REVISION = 8;
  ERROR_REASON_IDEMPOTENCY_CONFLICT = 9;
  ERROR_REASON_PERSONAL_VIEW_LIMIT_REACHED = 10;
  ERROR_REASON_ORGANIZATION_VIEW_LIMIT_REACHED = 11;
  ERROR_REASON_RESULT_LIMIT_TRUNCATED = 12;
  ERROR_REASON_RATE_LIMITED = 13;
  ERROR_REASON_PROVIDER_CONCURRENCY_LIMITED = 14;
  ERROR_REASON_BILLING_CATALOG_UNAVAILABLE = 15;
  ERROR_REASON_BILLING_PREFLIGHT_REQUIRED = 16;
  ERROR_REASON_BILLING_PREFLIGHT_EXPIRED = 17;
  ERROR_REASON_BILLING_PREFLIGHT_MISMATCH = 18;
  ERROR_REASON_BILLING_RESERVATION_FAILED = 19;
  ERROR_REASON_PROVIDER_FAILED = 20;
  ERROR_REASON_PROVIDER_RATE_LIMITED = 21;
  ERROR_REASON_PROVIDER_TIMEOUT = 22;
  ERROR_REASON_OFFLINE = 23;
  ERROR_REASON_STALE = 24;
  ERROR_REASON_DISCONNECTED = 25;
  ERROR_REASON_UNSUPPORTED_GITHUB_HOST = 26;
  ERROR_REASON_UNSUPPORTED_ACTION = 27;
  ERROR_REASON_MERGE_CONFIRMATION_REQUIRED = 28;
  ERROR_REASON_BRANCH_PROTECTION_BLOCKED = 29;
  ERROR_REASON_REGISTRATION_CLEANUP_PENDING = 30;
  ERROR_REASON_REGISTRATION_EXPIRED = 31;
  ERROR_REASON_NOTIFICATION_UNAVAILABLE = 32;
  ERROR_REASON_DELETION_IN_PROGRESS = 33;
  ERROR_REASON_DEPENDENCY_UNAVAILABLE = 34;
}

// ErrorDetail is attached to non-OK Connect responses. message is display-safe.
message ErrorDetail {
  ErrorReason reason = 1;
  string message = 2;
  UuidV7 resource_id = 3;
  Revision current_revision = 4;
  google.protobuf.Duration retry_after = 5;
  google.protobuf.Timestamp occurred_at = 6;
}
