syntax = "proto3";

package bundlewhy.v1;

option go_package = "github.com/delinoio/oss/protos/gen/go/bundlewhy/v1;bundlewhyv1";

// AnalysisService is served by the bundlewhy local server on 127.0.0.1 only.
// Every request requires the per-run bearer token and a matching Origin.
// Exported HTML reports serve the same service from an in-memory transport.
// No method accepts a filesystem path, shell command or build option.
service AnalysisService {
  // Returns the lifecycle state of the selected run. Clients poll it while the
  // run is in progress.
  rpc GetRunProgress(GetRunProgressRequest) returns (GetRunProgressResponse);
  // Returns diagnostics, coverage, sizes and engine identity without source
  // content. Available for complete, partial, cancelled and failed runs.
  rpc GetAnalysis(GetAnalysisRequest) returns (GetAnalysisResponse);
  // Returns one stored source file by its bundle-local identifier.
  rpc GetSourceFile(GetSourceFileRequest) returns (GetSourceFileResponse);
  // Cancels the active run. Saved and exported reports reject this method.
  rpc CancelRun(CancelRunRequest) returns (CancelRunResponse);
  // Lists saved runs in the output directory of the active run.
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
  // Switches the served analysis to another saved run from ListRuns.
  rpc SelectRun(SelectRunRequest) returns (SelectRunResponse);
  // Writes a self-contained HTML report into the active run directory.
  rpc ExportReport(ExportReportRequest) returns (ExportReportResponse);
}

enum OptimizationCategory {
  OPTIMIZATION_CATEGORY_UNSPECIFIED = 0;
  OPTIMIZATION_CATEGORY_TREE_SHAKING = 1;
  OPTIMIZATION_CATEGORY_DEAD_CODE_ELIMINATION = 2;
  OPTIMIZATION_CATEGORY_INLINING = 3;
  OPTIMIZATION_CATEGORY_CONSTANT_FOLDING = 4;
  OPTIMIZATION_CATEGORY_NAME_MANGLING = 5;
  OPTIMIZATION_CATEGORY_MODULE_CONCATENATION = 6;
  OPTIMIZATION_CATEGORY_CHUNK_SPLITTING = 7;
  OPTIMIZATION_CATEGORY_DUPLICATE_MODULES = 8;
}

// Confirmed: observed in the analysis engine output or configuration.
// Inferred: derived by bundlewhy from supporting analysis; not an observed
// engine decision. Unavailable: the evidence could not be collected.
enum EvidenceStatus {
  EVIDENCE_STATUS_UNSPECIFIED = 0;
  EVIDENCE_STATUS_CONFIRMED = 1;
  EVIDENCE_STATUS_INFERRED = 2;
  EVIDENCE_STATUS_UNAVAILABLE = 3;
}

enum ConditionOutcome {
  CONDITION_OUTCOME_UNSPECIFIED = 0;
  CONDITION_OUTCOME_MET = 1;
  CONDITION_OUTCOME_UNMET = 2;
  CONDITION_OUTCOME_UNKNOWN = 3;
}

enum RunStatus {
  RUN_STATUS_UNSPECIFIED = 0;
  RUN_STATUS_RUNNING = 1;
  RUN_STATUS_COMPLETE = 2;
  RUN_STATUS_PARTIAL = 3;
  RUN_STATUS_CANCELLED = 4;
  RUN_STATUS_FAILED = 5;
}

enum RunStage {
  RUN_STAGE_UNSPECIFIED = 0;
  RUN_STAGE_DETECTING = 1;
  RUN_STAGE_BUILDING = 2;
  RUN_STAGE_COLLECTING = 3;
  RUN_STAGE_ANALYZING = 4;
  RUN_STAGE_MEASURING = 5;
  RUN_STAGE_SAVING = 6;
  RUN_STAGE_FINISHED = 7;
}

enum Bundler {
  BUNDLER_UNSPECIFIED = 0;
  BUNDLER_VITE = 1;
  BUNDLER_RSPACK = 2;
}

enum EngineSupport {
  ENGINE_SUPPORT_UNSPECIFIED = 0;
  // The installed engine matches the frozen compatibility matrix.
  ENGINE_SUPPORT_SUPPORTED = 1;
  // The installed engine is outside the matrix and the user explicitly
  // selected analysis with it.
  ENGINE_SUPPORT_UNSUPPORTED_SELECTED = 2;
}

enum CoverageState {
  COVERAGE_STATE_UNSPECIFIED = 0;
  // Verified detectors ran for this category.
  COVERAGE_STATE_COVERED = 1;
  // The category does not apply to the selected engine.
  COVERAGE_STATE_NOT_APPLICABLE = 2;
  // The category applies but no evidence could be collected.
  COVERAGE_STATE_UNAVAILABLE = 3;
  // Detectors ran on incomplete input.
  COVERAGE_STATE_PARTIAL = 4;
}

enum LocationKind {
  LOCATION_KIND_UNSPECIFIED = 0;
  LOCATION_KIND_ORIGINAL = 1;
  LOCATION_KIND_GENERATED = 2;
}

enum SourceOrigin {
  SOURCE_ORIGIN_UNSPECIFIED = 0;
  SOURCE_ORIGIN_PROJECT = 1;
  SOURCE_ORIGIN_DEPENDENCY = 2;
  SOURCE_ORIGIN_VIRTUAL = 3;
  SOURCE_ORIGIN_GENERATED = 4;
}

// Whether original source text is proven to be the revision read by the build.
enum SourceRevisionEvidence {
  SOURCE_REVISION_EVIDENCE_UNSPECIFIED = 0;
  SOURCE_REVISION_EVIDENCE_BUILD_SNAPSHOT = 1;
  SOURCE_REVISION_EVIDENCE_UNAVAILABLE = 2;
}

enum AttributionState {
  ATTRIBUTION_STATE_UNSPECIFIED = 0;
  ATTRIBUTION_STATE_SUPPORTED = 1;
  ATTRIBUTION_STATE_UNAVAILABLE = 2;
}

enum ProblemSeverity {
  PROBLEM_SEVERITY_UNSPECIFIED = 0;
  PROBLEM_SEVERITY_WARNING = 1;
  PROBLEM_SEVERITY_ERROR = 2;
}

enum ReportMode {
  REPORT_MODE_UNSPECIFIED = 0;
  // Served while `bundlewhy analyze` owns the run.
  REPORT_MODE_LIVE = 1;
  // Served by `bundlewhy open` from a saved result bundle.
  REPORT_MODE_SAVED = 2;
  // Embedded in a self-contained HTML export.
  REPORT_MODE_EXPORTED = 3;
}

message EngineIdentity {
  Bundler bundler = 1;
  string bundler_package = 2;
  string bundler_version = 3;
  string minifier = 4;
  string minifier_version = 5;
  // True when the minifier is the bundler's default JavaScript minifier.
  bool default_minifier = 6;
  // Collector adapter identity, for example "bundlewhy-collector-vite".
  string adapter_id = 7;
  string adapter_version = 8;
  EngineSupport support = 9;
  // Frozen matrix entry the run was compared with.
  string supported_versions = 10;
  // Always true: bundlewhy runs a separate diagnostic build with collection
  // overrides. Findings describe that build.
  bool diagnostic_engine = 11;
  string diagnostic_notice = 12;
  // Overrides applied to the project configuration for the diagnostic build.
  repeated string overrides = 13;
}

message SourceLocation {
  LocationKind kind = 1;
  // Bundle-local source identifier for original locations.
  string source_id = 2;
  // Display path: project-relative, dependency-relative or generated file.
  string path = 3;
  uint32 line = 4;
  uint32 column = 5;
}

message CodeSnippet {
  LocationKind kind = 1;
  string path = 2;
  uint32 start_line = 3;
  uint32 highlight_line = 4;
  string text = 5;
}

message Condition {
  string description = 1;
  ConditionOutcome outcome = 2;
  string detail = 3;
}

message Evidence {
  // Where the evidence came from, for example "rspack stats optimizationBailout".
  string provenance = 1;
  string detail = 2;
  EvidenceStatus status = 3;
}

message DependencyPath {
  // Display paths from an entry module to the diagnostic module.
  repeated string modules = 1;
}

message CorrectiveAction {
  string direction = 1;
  // Conditions that must hold before applying the direction safely.
  string safety = 2;
}

message Diagnostic {
  string id = 1;
  OptimizationCategory category = 2;
  // Stable rule identifier, for example "rspack/module-concatenation-bailout".
  string rule = 3;
  EvidenceStatus status = 4;
  string title = 5;
  string summary = 6;
  repeated Condition conditions = 7;
  SourceLocation location = 8;
  // Generated location when one is known in addition to the original.
  SourceLocation generated_location = 9;
  CodeSnippet snippet = 10;
  string module = 11;
  repeated DependencyPath dependency_paths = 12;
  repeated Evidence evidence = 13;
  CorrectiveAction corrective_action = 14;
  // Engine identity summary, for example "rspack 2.2.9 + SwcJsMinimizerRspackPlugin".
  string engine = 15;
  bool dependency = 16;
}

message CategoryCoverage {
  OptimizationCategory category = 1;
  CoverageState state = 2;
  string note = 3;
  repeated string rules = 4;
}

message SourceAttribution {
  string path = 1;
  uint32 generated_bytes = 2;
}

message ChunkSize {
  string file = 1;
  uint32 raw_bytes = 2;
  uint32 gzip_bytes = 3;
  uint32 brotli_bytes = 4;
  AttributionState attribution = 5;
  // Generated bytes attributed to original sources through the source map.
  // Ranges never overlap, so the values sum to at most raw_bytes.
  repeated SourceAttribution sources = 6;
  uint32 unmapped_bytes = 7;
  bool entry = 8;
}

message Problem {
  // Stable error code, for example "BW_SOURCE_MAP_MISSING".
  string code = 1;
  ProblemSeverity severity = 2;
  string message = 3;
  string recovery = 4;
}

message ConfigEntry {
  string key = 1;
  string value = 2;
}

message SourceFile {
  string id = 1;
  string path = 2;
  SourceOrigin origin = 3;
  string sha256 = 4;
  // Empty when the source was excluded from the bundle or export.
  string content = 5;
  bool content_included = 6;
  // True when the saved hash differs from the current project file.
  bool stale = 7;
  SourceRevisionEvidence revision_evidence = 8;
}

message SourceFileSummary {
  string id = 1;
  string path = 2;
  SourceOrigin origin = 3;
  string sha256 = 4;
  bool content_included = 5;
  bool stale = 6;
  SourceRevisionEvidence revision_evidence = 7;
}

message Analysis {
  uint32 schema_version = 1;
  string run_id = 2;
  string project_name = 3;
  string config_file = 4;
  RunStatus status = 5;
  EngineIdentity engine = 6;
  repeated Diagnostic diagnostics = 7;
  repeated CategoryCoverage coverage = 8;
  repeated ChunkSize chunks = 9;
  repeated Problem problems = 10;
  repeated ConfigEntry config_summary = 11;
  repeated SourceFileSummary sources = 12;
  string started_at = 13;
  string finished_at = 14;
  uint32 duration_ms = 15;
  ReportMode mode = 16;
  string tool_version = 17;
}

message RunProgress {
  string run_id = 1;
  RunStatus status = 2;
  RunStage stage = 3;
  string message = 4;
  uint32 elapsed_ms = 5;
  ReportMode mode = 6;
  bool cancellable = 7;
}

message GetRunProgressRequest {}

message GetRunProgressResponse {
  RunProgress progress = 1;
}

message GetAnalysisRequest {}

message GetAnalysisResponse {
  Analysis analysis = 1;
}

message GetSourceFileRequest {
  string source_id = 1;
}

message GetSourceFileResponse {
  SourceFile source = 1;
}

message CancelRunRequest {}

message CancelRunResponse {
  RunProgress progress = 1;
}

message RunSummary {
  string run_id = 1;
  RunStatus status = 2;
  string project_name = 3;
  Bundler bundler = 4;
  string started_at = 5;
  bool active = 6;
}

message ListRunsRequest {}

message ListRunsResponse {
  repeated RunSummary runs = 1;
}

message SelectRunRequest {
  string run_id = 1;
}

message SelectRunResponse {
  RunProgress progress = 1;
}

message ExportReportRequest {
  bool include_sources = 1;
}

message ExportReportResponse {
  // File name inside the run directory.
  string file_name = 1;
  bool sources_included = 2;
  uint32 size_bytes = 3;
}
