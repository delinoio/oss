syntax = "proto3";

package devhud.v1;

option go_package = "github.com/delinoio/oss/protos/devhud/v1;devhudv1";

import "devhud/v1/common.proto";

service BootstrapService {
  // GetBootstrap is the only unauthenticated business RPC.
  rpc GetBootstrap(GetBootstrapRequest) returns (GetBootstrapResponse);
}

message GetBootstrapRequest {}

message LogtoPublicClientIds {
  string desktop = 1;
  string ios = 2;
  string android = 3;
  string admin = 4;
}

message LogtoConfiguration {
  string issuer = 1;
  string audience = 2;
  LogtoPublicClientIds public_client_ids = 3;
  // native_redirect_uri is exactly devhud://auth/callback.
  string native_redirect_uri = 4;
  // admin_redirect_uri is the exact deployment-configured callback URI.
  string admin_redirect_uri = 5;
}

message UploadLimits {
  uint64 maximum_object_bytes = 1;
  uint32 maximum_images_per_submission = 2;
  uint64 rolling_upload_bytes = 3;
  uint64 rolling_upload_window_seconds = 4;
  uint64 maximum_stored_bytes = 5;
  uint32 signed_urls_per_window = 6;
  uint64 signed_url_window_seconds = 7;
  uint32 public_gets_per_ip_per_window = 8;
  uint64 public_get_window_seconds = 9;
  uint32 maximum_image_width = 10;
  uint32 maximum_image_height = 11;
  uint64 maximum_image_pixels = 12;
  uint64 staging_retention_seconds = 13;
}

message GetBootstrapResponse {
  uint32 schema_version = 1;
  string protocol_version = 2;
  string api_version = 3;
  LogtoConfiguration logto = 4;
  string public_asset_base_url = 5;
  repeated Capability capabilities = 6;
  UploadLimits upload_limits = 7;
}
