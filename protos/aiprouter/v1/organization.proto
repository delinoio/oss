syntax = "proto3";
package aiprouter.v1;

import "aiprouter/v1/common.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/delinoio/oss/protos/aiprouter/v1;aiprouterv1";

message Organization {
  string id = 1;
  string name = 2;
  Role role = 3;
  google.protobuf.Timestamp created_at = 4;
}
message Member {
  string user_id = 1;
  string display_name = 2;
  string email = 3;
  Role role = 4;
  google.protobuf.Timestamp joined_at = 5;
}
message Invitation {
  string id = 1;
  string organization_id = 2;
  string email = 3;
  LifecycleState state = 4;
  DeliveryState delivery_state = 5;
  google.protobuf.Timestamp expires_at = 6;
  uint32 delivery_attempts = 7;
  google.protobuf.Timestamp next_attempt_at = 8;
  google.protobuf.Timestamp resend_available_at = 9;
  string organization_name = 10;
  // Invitations currently grant MEMBER only; administrator promotion is a separate owner action.
  Role role = 11;
  google.protobuf.Timestamp created_at = 12;
}
message OwnershipTransfer {
  string id = 1;
  string organization_id = 2;
  string from_user_id = 3;
  string to_user_id = 4;
  LifecycleState state = 5;
  google.protobuf.Timestamp expires_at = 6;
}
service AccountService {
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse) {
    option (auth_scope) = AUTH_SCOPE_WEB_SESSION;
  }
  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (auth_scope) = AUTH_SCOPE_WEB_SESSION;
  }
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse) {
    option (auth_scope) = AUTH_SCOPE_WEB_SESSION;
  }
}
message GetSessionRequest {}
message GetSessionResponse {
  string user_id = 1;
  string display_name = 2;
  string email = 3;
  bool is_instance_operator = 4;
  google.protobuf.Timestamp authenticated_at = 5;
  google.protobuf.Timestamp expires_at = 6;
}
message LogoutRequest {}
message LogoutResponse {}
message DeleteAccountRequest {}
message DeleteAccountResponse {}
service OrganizationService {
  rpc CreateOrganization(CreateOrganizationRequest) returns (CreateOrganizationResponse) {
    option (auth_scope) = AUTH_SCOPE_WEB_SESSION;
  }
  rpc ListOrganizations(ListOrganizationsRequest) returns (ListOrganizationsResponse) {
    option (auth_scope) = AUTH_SCOPE_WEB_SESSION;
  }
  rpc GetOrganization(GetOrganizationRequest) returns (GetOrganizationResponse) {
    option (auth_scope) = AUTH_SCOPE_ORGANIZATION_MEMBER;
  }
  rpc UpdateOrganization(UpdateOrganizationRequest) returns (UpdateOrganizationResponse) {
    option (auth_scope) = AUTH_SCOPE_ORGANIZATION_ADMINISTRATOR;
  }
  rpc DeleteOrganization(DeleteOrganizationRequest) returns (DeleteOrganizationResponse) {
    option (auth_scope) = AUTH_SCOPE_ORGANIZATION_OWNER;
  }
  rpc LeaveOrganization(LeaveOrganizationRequest) returns (LeaveOrganizationResponse) {
    option (auth_scope) = AUTH_SCOPE_ORGANIZATION_MEMBER;
  }
}
message CreateOrganizationRequest {
  string name = 1;
}
message CreateOrganizationResponse {
  Organization organization = 1;
}
message ListOrganizationsRequest {
  PageRequest page = 1;
}
message ListOrganizationsResponse {
  repeated Organization organizations = 1;
  PageResponse page = 2;
}
message GetOrganizationRequest {
  string organization_id = 1;
}
message GetOrganizationResponse {
  Organization organization = 1;
}
message UpdateOrganizationRequest {
  string organization_id = 1;
  string name = 2;
}
message UpdateOrganizationResponse {
  Organization organization = 1;
}
message DeleteOrganizationRequest {
  string organization_id = 1;
}
message DeleteOrganizationResponse {}
message LeaveOrganizationRequest {
  string organization_id = 1;
}
message LeaveOrganizationResponse {}

// Administrators can remove ordinary members only; owners can manage administrators.
// Reject owner role mutation here: ownership changes only through accepted transfers.
service MembershipService {
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse) {
    option (auth_scope) = AUTH_SCOPE_ORGANIZATION_MEMBER;
  }
  rpc SetMemberRole(SetMemberRoleRequest) returns (SetMemberRoleResponse) {
    option (auth_scope) = AUTH_SCOPE_ORGANIZATION_OWNER;
  }
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse) {
    option (auth_scope) = AUTH_SCOPE_ORGANIZATION_ADMINISTRATOR;
  }
}
message ListMembersRequest {
  string organization_id = 1;
  PageRequest page = 2;
}
message ListMembersResponse {
  repeated Member members = 1;
  PageResponse page = 2;
}
message SetMemberRoleRequest {
  string organization_id = 1;
  string user_id = 2;
  Role role = 3;
}
message SetMemberRoleResponse {
  Member member = 1;
}
message RemoveMemberRequest {
  string organization_id = 1;
  string user_id = 2;
}
message RemoveMemberResponse {}

// Invitations are email-bound, single-use, and expire after seven days.
// Resend invalidates old links/jobs. Retry timing and SMTP limits remain server policy.
service InvitationService {
  // Requires a verified session email and possession of the link token. Invalid tokens
  // return NOT_FOUND. Wrong email returns PERMISSION_DENIED with ErrorDetail reason
  // INVITATION_EMAIL_MISMATCH and no recipient or organization metadata.
  // Matching recipients can inspect pending or terminal lifecycle states.
  rpc GetInvitation(GetInvitationRequest) returns (GetInvitationResponse) {
    option (auth_scope) = AUTH_SCOPE_WEB_SESSION;
  }
  // Only actionable pending invitations addressed to the current verified email.
  // No email/user selector or raw link token is exposed. Page tokens are session-scoped.
  rpc ListMyInvitations(ListMyInvitationsRequest) returns (ListMyInvitationsResponse) {
    option (auth_scope) = AUTH_SCOPE_WEB_SESSION;
  }
  rpc CreateInvitation(CreateInvitationRequest) returns (CreateInvitationResponse) {
    option (auth_scope) = AUTH_SCOPE_ORGANIZATION_ADMINISTRATOR;
  }
  rpc ListInvitations(ListInvitationsRequest) returns (ListInvitationsResponse) {
    option (auth_scope) = AUTH_SCOPE_ORGANIZATION_ADMINISTRATOR;
  }
  rpc ResendInvitation(ResendInvitationRequest) returns (ResendInvitationResponse) {
    option (auth_scope) = AUTH_SCOPE_ORGANIZATION_ADMINISTRATOR;
  }
  rpc CancelInvitation(CancelInvitationRequest) returns (CancelInvitationResponse) {
    option (auth_scope) = AUTH_SCOPE_ORGANIZATION_ADMINISTRATOR;
  }
  rpc AcceptInvitation(AcceptInvitationRequest) returns (AcceptInvitationResponse) {
    option (auth_scope) = AUTH_SCOPE_WEB_SESSION;
  }
}
message GetInvitationRequest {
  // Sensitive link token: never log request bodies or echo tokens in responses/errors.
  string token = 1;
}
message GetInvitationResponse {
  Invitation invitation = 1;
}
message ListMyInvitationsRequest {
  PageRequest page = 1;
}
message ListMyInvitationsResponse {
  repeated Invitation invitations = 1;
  PageResponse page = 2;
}
message CreateInvitationRequest {
  string organization_id = 1;
  string email = 2;
}
message CreateInvitationResponse {
  Invitation invitation = 1;
}
message ListInvitationsRequest {
  string organization_id = 1;
  PageRequest page = 2;
}
message ListInvitationsResponse {
  repeated Invitation invitations = 1;
  PageResponse page = 2;
}
message ResendInvitationRequest {
  string organization_id = 1;
  string invitation_id = 2;
}
message ResendInvitationResponse {
  Invitation invitation = 1;
}
message CancelInvitationRequest {
  string organization_id = 1;
  string invitation_id = 2;
}
message CancelInvitationResponse {}
message AcceptInvitationRequest {
  // Exactly one nonempty selector is required. Preserve token-based link acceptance.
  string token = 1;
  // ID-based onboarding acceptance still requires the matching verified session email.
  // IDs confer no authority. Recheck email, pending state and expiry atomically.
  optional string invitation_id = 2;
}
message AcceptInvitationResponse {
  Organization organization = 1;
}

// One pending nomination per organization; replacement invalidates the prior request.
// Expiry is seven days. Acceptance rechecks both memberships and current ownership.
service OwnershipService {
  rpc GetOwnershipTransfer(GetOwnershipTransferRequest) returns (GetOwnershipTransferResponse) {
    option (auth_scope) = AUTH_SCOPE_ORGANIZATION_MEMBER;
  }
  rpc NominateOwner(NominateOwnerRequest) returns (NominateOwnerResponse) {
    option (auth_scope) = AUTH_SCOPE_ORGANIZATION_OWNER;
  }
  rpc AcceptOwnership(AcceptOwnershipRequest) returns (AcceptOwnershipResponse) {
    option (auth_scope) = AUTH_SCOPE_ORGANIZATION_MEMBER;
  }
  rpc CancelOwnershipTransfer(CancelOwnershipTransferRequest) returns (CancelOwnershipTransferResponse) {
    option (auth_scope) = AUTH_SCOPE_ORGANIZATION_OWNER;
  }
}
message GetOwnershipTransferRequest {
  string organization_id = 1;
}
message GetOwnershipTransferResponse {
  OwnershipTransfer transfer = 1;
}
message NominateOwnerRequest {
  string organization_id = 1;
  string user_id = 2;
}
message NominateOwnerResponse {
  OwnershipTransfer transfer = 1;
}
message AcceptOwnershipRequest {
  string organization_id = 1;
  string transfer_id = 2;
}
message AcceptOwnershipResponse {
  Organization organization = 1;
}
message CancelOwnershipTransferRequest {
  string organization_id = 1;
  string transfer_id = 2;
}
message CancelOwnershipTransferResponse {}
