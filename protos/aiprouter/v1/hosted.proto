syntax = "proto3";
package aiprouter.v1;

import "aiprouter/v1/common.proto";

option go_package = "github.com/delinoio/oss/protos/aiprouter/v1;aiprouterv1";

// Backend defaults never select credentials. Missing personal targets fail closed.
enum HostedSearchBackend {
  HOSTED_SEARCH_BACKEND_UNSPECIFIED = 0;
  HOSTED_SEARCH_BACKEND_OPENAI = 1;
  HOSTED_SEARCH_BACKEND_ANTHROPIC = 2;
  HOSTED_SEARCH_BACKEND_XAI = 3;
  HOSTED_SEARCH_BACKEND_GEMINI = 4;
  HOSTED_SEARCH_BACKEND_EXA = 5;
  HOSTED_SEARCH_BACKEND_DEVIN = 6;
}
enum HostedVisionBackend {
  HOSTED_VISION_BACKEND_UNSPECIFIED = 0;
  HOSTED_VISION_BACKEND_OPENAI = 1;
  HOSTED_VISION_BACKEND_ANTHROPIC = 2;
  HOSTED_VISION_BACKEND_ROUTED = 3;
}

// Every helper independently resolves an eligible credential from this user's resources
// in the selected organization. Never inherit the parent model credential or operator keys.
message HostedHelperTarget {
  oneof selection {
    string connection_id = 1;
    string pool_id = 2;
  }
  string model_id = 3;
}
message HostedXSearchOptions {
  bool enabled = 1;
  // Allow and exclude lists are mutually exclusive, with at most 20 handles each.
  repeated string allowed_x_handles = 2;
  repeated string excluded_x_handles = 3;
  // Optional ISO dates in YYYY-MM-DD format.
  optional string from_date = 4;
  optional string to_date = 5;
}
message HostedSearchSettings {
  // Absent enabled retains pinned backend eligibility defaults, never parent credential fallback.
  optional bool enabled = 1;
  HostedHelperTarget target = 2;
  // Absent backend defaults to OPENAI; explicit UNSPECIFIED is invalid.
  optional HostedSearchBackend backend = 3;
  // Absent reasoning defaults to MINIMAL.
  optional ReasoningEffort reasoning = 4;
  // Absent defaults to 3 searches per turn and 60000 ms.
  optional uint32 max_searches_per_turn = 5;
  optional uint32 timeout_ms = 6;
  HostedXSearchOptions x_search = 7;
}
message HostedVisionSettings {
  optional bool enabled = 1;
  // Connection/pool selection and routed model selection are mutually exclusive.
  oneof selection {
    HostedHelperTarget target = 2;
    string route_model = 3;
  }
  // ROUTED requires explicit selection and an owner-scoped route; never infer it.
  optional HostedVisionBackend backend = 4;
  // Absent defaults to 8; explicit zero disables description calls.
  optional uint32 max_descriptions_per_turn = 5;
  // Absent defaults to 45000 ms.
  optional uint32 timeout_ms = 6;
}
message HostedImageSettings {
  // Shared XAI API-key connection/pool for image and video bridges, selected independently
  // of the parent model. The explicit bridge model fields override target.model_id.
  HostedHelperTarget target = 1;
  bool bridge_enabled = 2;
  // Absent defaults to grok-imagine-image-quality.
  optional string bridge_model = 3;
  // At most 300000 ms; absence retains the pinned image-path default.
  optional uint32 timeout_ms = 4;
  bool video_bridge_enabled = 5;
  // Absent defaults to grok-imagine-video.
  optional string video_bridge_model = 6;
  // Absent defaults to 300000 ms; maximum 300000 ms, including polling.
  optional uint32 video_timeout_ms = 7;
}
message HostedSettings {
  HostedSearchSettings search = 1;
  HostedVisionSettings vision = 2;
  HostedImageSettings images = 3;
}

// Personal settings only: organization administrators/operators cannot inspect another
// user's helpers. Current membership and ownership are rechecked on reads and writes.
service HostedSettingsService {
  rpc GetHostedSettings(GetHostedSettingsRequest) returns (GetHostedSettingsResponse) {
    option (auth_scope) = AUTH_SCOPE_ORGANIZATION_MEMBER;
  }
  // Replace the complete settings. Omitted sections remove their saved configuration.
  // Validate every selected connection/pool/route against current personal ownership.
  rpc UpdateHostedSettings(UpdateHostedSettingsRequest) returns (UpdateHostedSettingsResponse) {
    option (auth_scope) = AUTH_SCOPE_ORGANIZATION_MEMBER;
  }
}
message GetHostedSettingsRequest {
  string organization_id = 1;
}
message GetHostedSettingsResponse {
  HostedSettings settings = 1;
}
message UpdateHostedSettingsRequest {
  string organization_id = 1;
  HostedSettings settings = 2;
}
message UpdateHostedSettingsResponse {
  HostedSettings settings = 1;
}
