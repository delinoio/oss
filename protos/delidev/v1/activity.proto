syntax = "proto3";
package delidev.v1;

import "delidev/v1/common.proto";

option go_package = "github.com/delinoio/oss/protos/gen/go/delidev/v1;delidevv1";

service ActivityService {
  rpc ListActivity(ListActivityRequest) returns (ListActivityResponse);
}

enum ActivityKind {
  ACTIVITY_KIND_UNSPECIFIED = 0;
  // Accepted dispatch is not proof that native input started.
  ACTIVITY_KIND_EXECUTION_ACCEPTED = 1;
  // Observed native outcomes do not assert process cleanup.
  ACTIVITY_KIND_EXECUTION_SUCCEEDED = 2;
  ACTIVITY_KIND_EXECUTION_FAILED = 3;
  ACTIVITY_KIND_EXECUTION_STOPPED = 4;
  ACTIVITY_KIND_SCHEDULE_CRON = 5;
  ACTIVITY_KIND_SCHEDULE_RUN_NOW = 6;
  ACTIVITY_KIND_PR_PROBLEM_OBSERVED = 7;
  ACTIVITY_KIND_PR_PROBLEM_DISMISSED = 8;
  // Attempt success never establishes that the original problems were handled.
  ACTIVITY_KIND_PR_REMEDIATION_ATTEMPT = 9;
  // Requires its own immutable verification source, never attempt success.
  ACTIVITY_KIND_PR_VERIFIED_HANDLED = 10;
}
enum ActivityPRAttemptState {
  ACTIVITY_PR_ATTEMPT_STATE_UNSPECIFIED = 0;
  ACTIVITY_PR_ATTEMPT_STATE_RESERVED = 1;
  ACTIVITY_PR_ATTEMPT_STATE_BOUND = 2;
  ACTIVITY_PR_ATTEMPT_STATE_RUNNING = 3;
  ACTIVITY_PR_ATTEMPT_STATE_UNCERTAIN = 4;
  ACTIVITY_PR_ATTEMPT_STATE_SUCCEEDED = 5;
  ACTIVITY_PR_ATTEMPT_STATE_FAILED = 6;
  ACTIVITY_PR_ATTEMPT_STATE_STOPPED = 7;
  ACTIVITY_PR_ATTEMPT_STATE_CANCELED = 8;
  ACTIVITY_PR_ATTEMPT_STATE_NOT_STARTED = 9;
}
enum ActivityPRMode {
  ACTIVITY_PR_MODE_UNSPECIFIED = 0;
  ACTIVITY_PR_MODE_MANUAL = 1;
  ACTIVITY_PR_MODE_AUTOMATIC = 2;
}
message ActivityPRProblemReference {
  string id = 1;
  string content_version = 2;
}
enum ActivityPRActorType {
  ACTIVITY_PR_ACTOR_TYPE_UNSPECIFIED = 0;
  ACTIVITY_PR_ACTOR_TYPE_OWNER = 1;
  ACTIVITY_PR_ACTOR_TYPE_CLIENT = 2;
}
// Only metadata; no PR title, feedback, tool output or provider diagnostics.
message ActivityPRMetadata {
  string problem_set_id = 1;
  string remote_repository_id = 2;
  string pull_request_id = 3;
  string number = 4;
  string owner = 5;
  string name = 6;
  string source_id = 7;
  repeated ActivityPRProblemReference problems = 8;
  ActivityPRActorType actor_type = 9;
  string device_id = 10;
  string request_id = 11;
  ActivityPRAttemptState attempt_state = 12;
  ActivityPRMode mode = 13;
  string verification_id = 14;
}
enum ActivityCapability {
  ACTIVITY_CAPABILITY_UNSPECIFIED = 0;
  ACTIVITY_CAPABILITY_PR_HANDLING_V1 = 1;
}
enum ActivityOccurrenceState {
  ACTIVITY_OCCURRENCE_STATE_UNSPECIFIED = 0;
  ACTIVITY_OCCURRENCE_STATE_WAITING = 1;
  ACTIVITY_OCCURRENCE_STATE_ACTIVE = 2;
  ACTIVITY_OCCURRENCE_STATE_SUCCEEDED = 3;
  ACTIVITY_OCCURRENCE_STATE_FAILED = 4;
  ACTIVITY_OCCURRENCE_STATE_STOPPED = 5;
  ACTIVITY_OCCURRENCE_STATE_SKIPPED = 6;
}
enum ActivityJobState {
  ACTIVITY_JOB_STATE_UNSPECIFIED = 0;
  ACTIVITY_JOB_STATE_QUEUED = 1;
  ACTIVITY_JOB_STATE_CLAIMED = 2;
  ACTIVITY_JOB_STATE_SUCCEEDED = 3;
  ACTIVITY_JOB_STATE_FAILED = 4;
  ACTIVITY_JOB_STATE_UNCERTAIN = 5;
  ACTIVITY_JOB_STATE_CANCELED = 6;
}
message ListActivityRequest {
  string session_id = 1;
  string project_id = 2;
  uint32 page_size = 3;
  string page_token = 4;
}
// Metadata only. PR transitions have their own immutable activity identity.
message ActivityEntry {
  string id = 1;
  EntityKind source_kind = 2;
  uint64 source_revision = 3;
  int64 observed_at_unix_ms = 4;
  ActivityKind kind = 5;
  string session_id = 6;
  string project_id = 7;
  string execution_id = 8;
  string account_id = 9;
  string job_id = 10;
  string schedule_id = 11;
  string occurrence_id = 12;
  // Current occurrence state, distinct from its original acceptance time.
  ActivityOccurrenceState occurrence_state = 13;
  // Current dispatch/cleanup job state, including pre-native failure.
  ActivityJobState job_state = 14;
  ActivityPRMetadata pull_request = 15;
}
message ListActivityResponse {
  repeated ActivityEntry entries = 1;
  string next_page_token = 2;
  repeated ActivityCapability capabilities = 3;
}
