syntax = "proto3";

package delidev.v1;

import "delidev/v1/common.proto";

option go_package = "github.com/delinoio/oss/protos/gen/go/delidev/v1;delidevv1";

enum SubscriptionAction {
  SUBSCRIPTION_ACTION_UNSPECIFIED = 0;
  SUBSCRIPTION_ACTION_LOGIN = 1;
  SUBSCRIPTION_ACTION_REFRESH = 2;
  SUBSCRIPTION_ACTION_LOGOUT = 3;
  SUBSCRIPTION_ACTION_EXECUTE = 4;
  SUBSCRIPTION_ACTION_QUOTA = 5;
  SUBSCRIPTION_ACTION_RESET_CREDIT = 6;
}

// Public lifecycle operations and an independently authorized protected Worker
// lane. Bundles never enter Resource, Job, events, receipts, or execution output.
enum SubscriptionLoginState {
  SUBSCRIPTION_LOGIN_STATE_UNSPECIFIED = 0;
  SUBSCRIPTION_LOGIN_STATE_PREPARING = 1;
  SUBSCRIPTION_LOGIN_STATE_WAITING = 2;
  SUBSCRIPTION_LOGIN_STATE_SUCCEEDED = 3;
  SUBSCRIPTION_LOGIN_STATE_CANCELED = 4;
  SUBSCRIPTION_LOGIN_STATE_EXPIRED = 5;
  SUBSCRIPTION_LOGIN_STATE_UNSUPPORTED = 6;
  SUBSCRIPTION_LOGIN_STATE_RECOVERY_REQUIRED = 7;
  SUBSCRIPTION_LOGIN_STATE_FAILED = 8;
}

service SubscriptionService {
  rpc SetAutomaticResetCreditConsent(SetAutomaticResetCreditConsentRequest) returns (SetAutomaticResetCreditConsentResponse);
  rpc CleanupFailedSubscriptions(CleanupFailedSubscriptionsRequest) returns (CleanupFailedSubscriptionsResponse);
  rpc GetFailedSubscriptionCleanup(GetFailedSubscriptionCleanupRequest) returns (GetFailedSubscriptionCleanupResponse);
  rpc RequestSubscriptionObservation(RequestSubscriptionObservationRequest) returns (RequestSubscriptionObservationResponse);
  rpc RefreshAllSubscriptionQuotas(RefreshAllSubscriptionQuotasRequest) returns (RefreshAllSubscriptionQuotasResponse);
  rpc ReconcileSubscriptionCredit(ReconcileSubscriptionCreditRequest) returns (ReconcileSubscriptionCreditResponse);
  rpc ClaimSubscriptionObservation(ClaimSubscriptionObservationRequest) returns (ClaimSubscriptionObservationResponse);
  rpc PublishSubscriptionObservation(PublishSubscriptionObservationRequest) returns (PublishSubscriptionObservationResponse);

  rpc RequestSubscription(RequestSubscriptionRequest) returns (RequestSubscriptionResponse);
  rpc CancelSubscription(CancelSubscriptionRequest) returns (CancelSubscriptionResponse);
  rpc GetSubscriptionProgress(GetSubscriptionProgressRequest) returns (GetSubscriptionProgressResponse);
  rpc SubmitSubscriptionLoginCode(SubmitSubscriptionLoginCodeRequest) returns (SubmitSubscriptionLoginCodeResponse);
  rpc TakeSubscriptionLoginCode(TakeSubscriptionLoginCodeRequest) returns (TakeSubscriptionLoginCodeResponse);
  rpc ForwardSubscriptionCallback(ForwardSubscriptionCallbackRequest) returns (ForwardSubscriptionCallbackResponse);
  rpc WatchSubscription(WatchSubscriptionRequest) returns (stream WatchSubscriptionResponse);
  rpc TakeSubscription(TakeSubscriptionRequest) returns (TakeSubscriptionResponse);
  rpc PublishSubscriptionProgress(PublishSubscriptionProgressRequest) returns (PublishSubscriptionProgressResponse);
  rpc FinishSubscription(FinishSubscriptionRequest) returns (FinishSubscriptionResponse);
  // Worker-only managed ChatGPT execution recovery, negotiated by Worker
  // capability MANAGED_CODEX_RECOVERY_V1. None of these operations delivers a
  // credential generation, admits a Take or replaces the original Finish receipt.
  rpc SyncSubscriptionRecoveryCapture(SyncSubscriptionRecoveryCaptureRequest) returns (SyncSubscriptionRecoveryCaptureResponse);
  rpc ReadSubscriptionRecoveryCapture(ReadSubscriptionRecoveryCaptureRequest) returns (ReadSubscriptionRecoveryCaptureResponse);
  rpc RecoverSubscription(RecoverSubscriptionRequest) returns (RecoverSubscriptionResponse);

  // Server-owned Claude usage tracking. A separate, explicitly linked read-only
  // login of a server-token Claude account; none of these operations changes the
  // execution setup-token or execution readiness. Gated by
  // SYSTEM_CAPABILITY_CLAUDE_SERVER_USAGE_V1.
  rpc StartClaudeUsage(StartClaudeUsageRequest) returns (StartClaudeUsageResponse);
  rpc GetClaudeUsageProgress(GetClaudeUsageProgressRequest) returns (GetClaudeUsageProgressResponse);
  rpc SubmitClaudeUsageCode(SubmitClaudeUsageCodeRequest) returns (SubmitClaudeUsageCodeResponse);
  rpc ConfirmClaudeUsageLink(ConfirmClaudeUsageLinkRequest) returns (ConfirmClaudeUsageLinkResponse);
  rpc CancelClaudeUsage(CancelClaudeUsageRequest) returns (CancelClaudeUsageResponse);
  rpc DisconnectClaudeUsage(DisconnectClaudeUsageRequest) returns (DisconnectClaudeUsageResponse);
}

// Explicit server-owned cleanup of failed initial logins. No native login or
// callback authority is granted by these metadata-only operations.
message CleanupFailedSubscriptionsRequest {
  string request_id = 1;
}
message CleanupFailedSubscriptionsResponse {
  FailedSubscriptionCleanupJob job = 1;
  string request_id = 2;
  bool replayed = 3;
}
message GetFailedSubscriptionCleanupRequest {
  string job_id = 1;
  string page_token = 2;
}
message GetFailedSubscriptionCleanupResponse {
  FailedSubscriptionCleanupJob job = 1;
  // Fixed pages of at most 50 original account outcomes.
  repeated FailedSubscriptionCleanupResult results = 2;
  string next_page_token = 3;
}
message FailedSubscriptionCleanupJob {
  string id = 1;
  uint64 revision = 2;
  FailedSubscriptionCleanupState state = 3;
  uint32 total = 4;
  uint32 processed = 5;
  uint32 deleted = 6;
  uint32 retained = 7;
  string problem_code = 8;
}
message FailedSubscriptionCleanupResult {
  string account_id = 1;
  string alias = 2;
  FailedSubscriptionCleanupOutcome outcome = 3;
  FailedSubscriptionCleanupReason reason = 4;
  string problem_code = 5;
}
enum FailedSubscriptionCleanupState {
  FAILED_SUBSCRIPTION_CLEANUP_STATE_UNSPECIFIED = 0;
  FAILED_SUBSCRIPTION_CLEANUP_STATE_PENDING = 1;
  FAILED_SUBSCRIPTION_CLEANUP_STATE_COMPLETED = 2;
  FAILED_SUBSCRIPTION_CLEANUP_STATE_FAILED = 3;
}
enum FailedSubscriptionCleanupOutcome {
  FAILED_SUBSCRIPTION_CLEANUP_OUTCOME_UNSPECIFIED = 0;
  FAILED_SUBSCRIPTION_CLEANUP_OUTCOME_PENDING = 1;
  FAILED_SUBSCRIPTION_CLEANUP_OUTCOME_DELETED = 2;
  FAILED_SUBSCRIPTION_CLEANUP_OUTCOME_RETAINED = 3;
}
enum FailedSubscriptionCleanupReason {
  FAILED_SUBSCRIPTION_CLEANUP_REASON_UNSPECIFIED = 0;
  FAILED_SUBSCRIPTION_CLEANUP_REASON_CHANGED = 1;
  FAILED_SUBSCRIPTION_CLEANUP_REASON_REFERENCED = 2;
  FAILED_SUBSCRIPTION_CLEANUP_REASON_CLEANUP_UNCONFIRMED = 3;
  FAILED_SUBSCRIPTION_CLEANUP_REASON_INVALID_OWNERSHIP = 4;
  FAILED_SUBSCRIPTION_CLEANUP_REASON_AUTHORIZATION = 5;
  FAILED_SUBSCRIPTION_CLEANUP_REASON_UNAVAILABLE = 6;
}

message RequestSubscriptionRequest {
  Mutation mutation = 1;
  string machine_id = 2;
  SubscriptionAction action = 3;
  bool device_code = 4;
}
message RequestSubscriptionResponse {
  Resource account = 1;
  string operation_id = 2;
  bool replayed = 3;
}
message CancelSubscriptionRequest {
  Mutation mutation = 1;
}
message CancelSubscriptionResponse {
  Resource account = 1;
  bool replayed = 2;
}
message GetSubscriptionProgressRequest {
  string account_id = 1;
  string operation_id = 2;
}
message GetSubscriptionProgressResponse {
  // Short-lived presentation data, never persisted or logged.
  string url = 1;
  string user_code = 2;
  bool canceled = 3;
  SubscriptionLoginState state = 4;
  string suggested_name = 5;
  string generation = 6;
  // Safe metadata for the original native failure; absent on older servers.
  CodexDiagnostic diagnostic = 7;
  SubscriptionLoginMethod login_method = 8;
  NativeSubscriptionDiagnostic native_diagnostic = 9;
  // Safe metadata for the original Grok Build failure; absent on older servers.
  GrokDiagnostic grok_diagnostic = 10;
}
message WatchSubscriptionRequest {
  string machine_id = 1;
  string instance_id = 2;
}
message WatchSubscriptionResponse {
  Resource account = 1;
}
message TakeSubscriptionRequest {
  Mutation mutation = 1;
  string machine_id = 2;
  string instance_id = 3;
  // Original public operation or independently owned execution job.
  string operation_id = 4;
  SubscriptionAction action = 5;
}
message TakeSubscriptionResponse {
  string lease_id = 1;
  string generation_id = 2;
  bytes bundle = 3;
  uint64 lease_revision = 4;
  bytes installation_json = 5;
  // Opaque original-Runner profile reference, never authentication bytes.
  string native_profile_id = 6;
  // Reserved: the account-owner lease a negotiated execution member joined. It is
  // empty for a founding or legacy singleton lease. A member response never
  // carries authentication bytes.
  string owner_lease_id = 7;
}
message PublishSubscriptionProgressRequest {
  string account_id = 1;
  string lease_id = 2;
  string machine_id = 3;
  string instance_id = 4;
  string url = 5;
  string user_code = 6;
  SubscriptionLoginState state = 7;
  SubscriptionLoginMethod login_method = 8;
  NativeSubscriptionDiagnostic native_diagnostic = 9;
  string suggested_name = 10;
}
message PublishSubscriptionProgressResponse {
  bool canceled = 1;
}
message FinishSubscriptionRequest {
  Mutation mutation = 1;
  string lease_id = 2;
  string machine_id = 3;
  string instance_id = 4;
  string generation_id = 5;
  bytes bundle = 6;
  bool cleanup_confirmed = 7;
  bool refresh_confirmed = 8;
  bool succeeded = 9;
  NativeSubscriptionIdentity native_identity = 10;
  // Reserved: which ownership a negotiated Finish releases. Unspecified keeps the
  // legacy singleton meaning.
  SubscriptionFinishScope finish_scope = 11;
}
// Reserved: ownership released by one FinishSubscription request.
enum SubscriptionFinishScope {
  SUBSCRIPTION_FINISH_SCOPE_UNSPECIFIED = 0;
  // Releases only the exact execution member and never touches credentials.
  SUBSCRIPTION_FINISH_SCOPE_MEMBER = 1;
  // Retires the account owner after its last runnable member and writes back.
  SUBSCRIPTION_FINISH_SCOPE_OWNER = 2;
}
message FinishSubscriptionResponse {
  Resource account = 1;
  bool replayed = 2;
}

// Stores a server-vault protected capture of the latest validated bundle of one
// live or fenced managed ChatGPT EXECUTE lease before the Worker deletes its
// transient authentication. The mutation request_id is the durable capture
// identity, id is the account and expected_revision the lease revision. The
// capture grants no readiness, Take, quota access or redistribution.
message SyncSubscriptionRecoveryCaptureRequest {
  Mutation mutation = 1;
  string lease_id = 2;
  string machine_id = 3;
  string instance_id = 4;
  string generation_id = 5;
  // The exact unused bundle the lease took, used only to recognize remnants.
  bytes original = 6;
  // The latest validated bundle written back by the native process.
  bytes latest = 7;
}
message SyncSubscriptionRecoveryCaptureResponse {
  string capture_id = 1;
  bool replayed = 2;
}
// Returns the lease's own capture to its original Worker for complete retained
// history inspection. It is not a Take and never changes ownership.
message ReadSubscriptionRecoveryCaptureRequest {
  string account_id = 1;
  string lease_id = 2;
  string machine_id = 3;
  // The currently authenticated Worker instance.
  string instance_id = 4;
  // The instance that held the lease when it was granted.
  string original_instance_id = 5;
  string generation_id = 6;
}
message ReadSubscriptionRecoveryCaptureResponse {
  string capture_id = 1;
  bytes original = 2;
  bytes latest = 3;
}
// What the original Worker proved for one recovery attempt.
enum SubscriptionRecoveryReport {
  SUBSCRIPTION_RECOVERY_REPORT_UNSPECIFIED = 0;
  // Process, profile and retained-file cleanup is proven and the protected
  // capture holds the latest validated credentials.
  SUBSCRIPTION_RECOVERY_REPORT_CLEANUP_WITH_CAPTURE = 1;
  // Cleanup is proven but no usable latest credentials exist.
  SUBSCRIPTION_RECOVERY_REPORT_CLEANUP_WITHOUT_CREDENTIAL = 2;
  // Cleanup is not proven; blocked_reason names why.
  SUBSCRIPTION_RECOVERY_REPORT_BLOCKED = 3;
}
enum SubscriptionRecoveryOutcome {
  SUBSCRIPTION_RECOVERY_OUTCOME_UNSPECIFIED = 0;
  // One immutable generation was published and readiness restored.
  SUBSCRIPTION_RECOVERY_OUTCOME_RESTORED = 1;
  // All original references were retired and the account is disconnected.
  SUBSCRIPTION_RECOVERY_OUTCOME_DISCONNECTED = 2;
  // The account stays protected; blocked_reason names why.
  SUBSCRIPTION_RECOVERY_OUTCOME_BLOCKED = 3;
}
enum SubscriptionRecoveryBlockedReason {
  SUBSCRIPTION_RECOVERY_BLOCKED_REASON_UNSPECIFIED = 0;
  // Legacy evidence cannot prove the latest credentials or their cleanup.
  SUBSCRIPTION_RECOVERY_BLOCKED_REASON_CREDENTIAL_PROOF_UNAVAILABLE = 1;
  SUBSCRIPTION_RECOVERY_BLOCKED_REASON_CLEANUP_UNCONFIRMED = 2;
  SUBSCRIPTION_RECOVERY_BLOCKED_REASON_OWNERSHIP_EVIDENCE_INVALID = 3;
  SUBSCRIPTION_RECOVERY_BLOCKED_REASON_MEMBERS_UNSETTLED = 4;
  SUBSCRIPTION_RECOVERY_BLOCKED_REASON_CREDENTIAL_USERS_ACTIVE = 5;
  SUBSCRIPTION_RECOVERY_BLOCKED_REASON_ACTIVE_OWNER = 6;
}
// Settles one fenced managed ChatGPT EXECUTE lease under a durable recovery
// request identity distinct from the original Take and Finish requests. The
// mutation id is the account and expected_revision the lease revision.
message RecoverSubscriptionRequest {
  Mutation mutation = 1;
  string lease_id = 2;
  string machine_id = 3;
  string instance_id = 4;
  string original_instance_id = 5;
  string generation_id = 6;
  SubscriptionRecoveryReport report = 7;
  // The capture the cleanup report relies on.
  string capture_id = 8;
  // Every execution member of a shared owner that settled before retirement.
  repeated string settled_member_lease_ids = 9;
  SubscriptionRecoveryBlockedReason blocked_reason = 10;
}
message RecoverSubscriptionResponse {
  Resource account = 1;
  bool replayed = 2;
  SubscriptionRecoveryOutcome outcome = 3;
  SubscriptionRecoveryBlockedReason blocked_reason = 4;
}

enum SubscriptionLoginMethod {
  SUBSCRIPTION_LOGIN_METHOD_UNSPECIFIED = 0;
  SUBSCRIPTION_LOGIN_METHOD_BROWSER_CALLBACK = 1;
  SUBSCRIPTION_LOGIN_METHOD_BROWSER_CODE = 2;
}
enum NativeSubscriptionDiagnosticPhase {
  NATIVE_SUBSCRIPTION_DIAGNOSTIC_PHASE_UNSPECIFIED = 0;
  NATIVE_SUBSCRIPTION_DIAGNOSTIC_PHASE_DISCOVERY = 1;
  NATIVE_SUBSCRIPTION_DIAGNOSTIC_PHASE_VERSION = 2;
  NATIVE_SUBSCRIPTION_DIAGNOSTIC_PHASE_RUNTIME = 3;
  NATIVE_SUBSCRIPTION_DIAGNOSTIC_PHASE_LAUNCH = 4;
  NATIVE_SUBSCRIPTION_DIAGNOSTIC_PHASE_LOGIN = 5;
  NATIVE_SUBSCRIPTION_DIAGNOSTIC_PHASE_STATUS = 6;
  NATIVE_SUBSCRIPTION_DIAGNOSTIC_PHASE_EXECUTION = 7;
  NATIVE_SUBSCRIPTION_DIAGNOSTIC_PHASE_HISTORY = 8;
  NATIVE_SUBSCRIPTION_DIAGNOSTIC_PHASE_CLEANUP = 9;
}
message NativeSubscriptionDiagnostic {
  string detected_version = 1;
  string required_version = 2;
  NativeSubscriptionDiagnosticPhase phase = 3;
  string code = 4;
  string correlation_id = 5;
}
message NativeSubscriptionIdentity {
  string profile_id = 1;
  // Worker-local keyed identity comparison, never raw native account content.
  string identity_commitment = 2;
}
message SubmitSubscriptionLoginCodeRequest {
  Mutation mutation = 1;
  string operation_id = 2;
  // Transient original CLI input. Excluded from receipts, resources and logs.
  bytes code = 3;
}
message SubmitSubscriptionLoginCodeResponse {
  bool accepted = 1;
}
message TakeSubscriptionLoginCodeRequest {
  string account_id = 1;
  string lease_id = 2;
  string machine_id = 3;
  string instance_id = 4;
  string operation_id = 5;
}
message TakeSubscriptionLoginCodeResponse {
  bytes code = 1;
  string submission_id = 2;
}

// Quota reads and explicit credit consumption share the original native owner.
enum SubscriptionObservationAction {
  SUBSCRIPTION_OBSERVATION_ACTION_UNSPECIFIED = 0;
  SUBSCRIPTION_OBSERVATION_ACTION_QUOTA = 1;
  SUBSCRIPTION_OBSERVATION_ACTION_RESET_CREDIT = 2;
}
enum SubscriptionResetOutcome {
  SUBSCRIPTION_RESET_OUTCOME_UNSPECIFIED = 0;
  SUBSCRIPTION_RESET_OUTCOME_RESET = 1;
  SUBSCRIPTION_RESET_OUTCOME_ALREADY_REDEEMED = 2;
  SUBSCRIPTION_RESET_OUTCOME_NOTHING_TO_RESET = 3;
  SUBSCRIPTION_RESET_OUTCOME_NO_CREDIT = 4;
}
message RequestSubscriptionObservationRequest {
  Mutation mutation = 1;
  string machine_id = 2;
  SubscriptionObservationAction action = 3;
  string connection_id = 4;
  string generation_id = 5;
  string credit_id = 6;
  bool next_credit = 7;
  string credits_observation_id = 8;
  bool confirmed = 9;
}
message RequestSubscriptionObservationResponse {
  Resource account = 1;
  string operation_id = 2;
  bool replayed = 3;
}
message RefreshAllSubscriptionQuotasRequest {
  string request_id = 1;
}
message RefreshAllSubscriptionQuotasResponse {
  // Complete server-side accepted account IDs; no frontend page drives work.
  repeated string accounts = 1;
  string request_id = 2;
  bool replayed = 3;
}
message ReconcileSubscriptionCreditRequest {
  Mutation mutation = 1;
  string operation_id = 2;
  string connection_id = 3;
  string generation_id = 4;
}
message ReconcileSubscriptionCreditResponse {
  Resource account = 1;
  bool replayed = 2;
}
message ClaimSubscriptionObservationRequest {
  Mutation mutation = 1;
  string lease_id = 2;
  string machine_id = 3;
  string instance_id = 4;
  string operation_id = 5;
  string generation_id = 6;
}
message ClaimSubscriptionObservationResponse {
  bytes operation_json = 1;
}
message PublishSubscriptionObservationRequest {
  Mutation mutation = 1;
  string lease_id = 2;
  string machine_id = 3;
  string instance_id = 4;
  string operation_id = 5;
  string generation_id = 6;
  // Metadata-only closed Go projection, bounded to 32 KiB.
  bytes observation_json = 7;
}
message PublishSubscriptionObservationResponse {
  Resource account = 1;
  bool replayed = 2;
}

// The authenticated original initiator can forward one trusted native callback.
// Callback bytes are write-only and never enter receipts or resource documents.
message ForwardSubscriptionCallbackRequest {
  string account_id = 1;
  string operation_id = 2;
  bytes callback_query = 3;
}
message ForwardSubscriptionCallbackResponse {
  bool accepted = 1;
}

// Bounded metadata only. Never include native output, paths or credentials.
message CodexDiagnostic {
  string detected_version = 1;
  string minimum_version = 2;
  CodexDiagnosticPhase phase = 3;
  string code = 4;
  string message = 5;
  string guidance = 6;
  string correlation_id = 7;
}
message GrokDiagnostic {
  string detected_version = 1;
  string supported_version = 2;
  GrokDiagnosticPhase phase = 3;
  string code = 4;
  string message = 5;
  string guidance = 6;
  string correlation_id = 7;
}
enum GrokDiagnosticPhase {
  GROK_DIAGNOSTIC_PHASE_UNSPECIFIED = 0;
  GROK_DIAGNOSTIC_PHASE_DISCOVERY = 1;
  GROK_DIAGNOSTIC_PHASE_VERSION = 2;
  GROK_DIAGNOSTIC_PHASE_PROFILE = 3;
  GROK_DIAGNOSTIC_PHASE_RUNTIME = 4;
  GROK_DIAGNOSTIC_PHASE_LOGIN = 5;
  GROK_DIAGNOSTIC_PHASE_REFRESH = 6;
  GROK_DIAGNOSTIC_PHASE_LOGOUT = 7;
  GROK_DIAGNOSTIC_PHASE_MODELS = 8;
  GROK_DIAGNOSTIC_PHASE_EXECUTION = 9;
  GROK_DIAGNOSTIC_PHASE_HISTORY = 10;
  GROK_DIAGNOSTIC_PHASE_CLEANUP = 11;
}
enum CodexDiagnosticPhase {
  CODEX_DIAGNOSTIC_PHASE_UNSPECIFIED = 0;
  CODEX_DIAGNOSTIC_PHASE_DISCOVERY = 1;
  CODEX_DIAGNOSTIC_PHASE_VERSION = 2;
  CODEX_DIAGNOSTIC_PHASE_PROFILE = 3;
  CODEX_DIAGNOSTIC_PHASE_RUNTIME = 4;
  CODEX_DIAGNOSTIC_PHASE_LAUNCH = 5;
  CODEX_DIAGNOSTIC_PHASE_INITIALIZE = 6;
  CODEX_DIAGNOSTIC_PHASE_CONFIRM = 7;
  CODEX_DIAGNOSTIC_PHASE_LOGIN = 8;
  CODEX_DIAGNOSTIC_PHASE_MODELS = 9;
  CODEX_DIAGNOSTIC_PHASE_EXECUTION = 10;
  CODEX_DIAGNOSTIC_PHASE_HISTORY = 11;
  CODEX_DIAGNOSTIC_PHASE_CLEANUP = 12;
}

// Explicit standing consent for one original authentication generation.
message SetAutomaticResetCreditConsentRequest {
  Mutation mutation = 1;
  string connection_id = 2;
  string generation_id = 3;
  bool enabled = 4;
  bool confirmed = 5;
}
message SetAutomaticResetCreditConsentResponse {
  Resource account = 1;
  bool replayed = 2;
}

// Lifecycle of one Claude usage login. A connection becomes linked only after
// the user confirms the validated identity.
enum ClaudeUsageLoginState {
  CLAUDE_USAGE_LOGIN_STATE_UNSPECIFIED = 0;
  CLAUDE_USAGE_LOGIN_STATE_PREPARING = 1;
  CLAUDE_USAGE_LOGIN_STATE_WAITING = 2;
  CLAUDE_USAGE_LOGIN_STATE_CONFIRMING = 3;
  CLAUDE_USAGE_LOGIN_STATE_LINKED = 4;
  CLAUDE_USAGE_LOGIN_STATE_CANCELED = 5;
  CLAUDE_USAGE_LOGIN_STATE_EXPIRED = 6;
  CLAUDE_USAGE_LOGIN_STATE_UNSUPPORTED = 7;
  CLAUDE_USAGE_LOGIN_STATE_FAILED = 8;
  CLAUDE_USAGE_LOGIN_STATE_RECOVERY_REQUIRED = 9;
}

// Closed failure vocabulary. It never carries native text, identity, quota
// values, credentials or paths.
enum ClaudeUsageFailure {
  CLAUDE_USAGE_FAILURE_UNSPECIFIED = 0;
  CLAUDE_USAGE_FAILURE_TIMEOUT = 1;
  CLAUDE_USAGE_FAILURE_NETWORK = 2;
  CLAUDE_USAGE_FAILURE_ROUTE_UNSUPPORTED = 3;
  CLAUDE_USAGE_FAILURE_REDIRECT = 4;
  CLAUDE_USAGE_FAILURE_OVERSIZED = 5;
  CLAUDE_USAGE_FAILURE_MALFORMED = 6;
  CLAUDE_USAGE_FAILURE_EMPTY = 7;
  CLAUDE_USAGE_FAILURE_UNAUTHORIZED = 8;
  CLAUDE_USAGE_FAILURE_FORBIDDEN = 9;
  CLAUDE_USAGE_FAILURE_RATE_LIMITED = 10;
  CLAUDE_USAGE_FAILURE_SERVER_ERROR = 11;
  CLAUDE_USAGE_FAILURE_CREDENTIALS_UNAVAILABLE = 12;
  CLAUDE_USAGE_FAILURE_STORAGE_UNSUPPORTED = 13;
  CLAUDE_USAGE_FAILURE_REFRESH_REJECTED = 14;
  CLAUDE_USAGE_FAILURE_REFRESH_UNSUPPORTED = 15;
  CLAUDE_USAGE_FAILURE_REFRESH_UNCERTAIN = 16;
  CLAUDE_USAGE_FAILURE_IDENTITY_CHANGED = 17;
  CLAUDE_USAGE_FAILURE_LOGIN_REJECTED = 18;
  CLAUDE_USAGE_FAILURE_LOGIN_UNSUPPORTED = 19;
  CLAUDE_USAGE_FAILURE_PROFILE_UNSAFE = 20;
  CLAUDE_USAGE_FAILURE_CLEANUP_UNCERTAIN = 21;
  CLAUDE_USAGE_FAILURE_INSTALLATION_UNSUPPORTED = 22;
  CLAUDE_USAGE_FAILURE_INTERRUPTED = 23;
  CLAUDE_USAGE_FAILURE_AUTHORITY_CHANGED = 24;
  CLAUDE_USAGE_FAILURE_LOGIN_MANUAL_CODE_REQUIRED = 25;
}

// Validated OAuth identity shown for confirmation. It is a display assertion
// only and implies no equality with the execution account.
message ClaudeUsageIdentity {
  string email = 1;
  string organization = 2;
  string plan = 3;
}

message StartClaudeUsageRequest {
  // mutation.id is the Claude account, expected_revision its observed revision.
  Mutation mutation = 1;
  // The usage generation the caller observed; empty when none exists. The new
  // generation is the request ID.
  string observed_usage_generation = 2;
}
message StartClaudeUsageResponse {
  Resource account = 1;
  string operation_id = 2;
  string usage_generation = 3;
  bool replayed = 4;
}
message GetClaudeUsageProgressRequest {
  string account_id = 1;
  string operation_id = 2;
  string usage_generation = 3;
}
// Progress reads never relaunch native work.
message GetClaudeUsageProgressResponse {
  ClaudeUsageLoginState state = 1;
  // Short-lived presentation of the original login address; never persisted.
  string url = 2;
  SubscriptionLoginMethod login_method = 3;
  // Present only while the identity awaits confirmation.
  ClaudeUsageIdentity identity = 4;
  ClaudeUsageFailure failure = 5;
  // The native login accepts one manual approval code and has not received it.
  bool code_requested = 6;
  bool canceled = 7;
}
message SubmitClaudeUsageCodeRequest {
  Mutation mutation = 1;
  string operation_id = 2;
  string usage_generation = 3;
  // Transient original CLI input. Excluded from receipts, resources and logs.
  bytes code = 4;
}
message SubmitClaudeUsageCodeResponse {
  bool accepted = 1;
}
message ConfirmClaudeUsageLinkRequest {
  Mutation mutation = 1;
  string operation_id = 2;
  string usage_generation = 3;
}
message ConfirmClaudeUsageLinkResponse {
  Resource account = 1;
  bool replayed = 2;
}
message CancelClaudeUsageRequest {
  Mutation mutation = 1;
  string operation_id = 2;
  string usage_generation = 3;
}
message CancelClaudeUsageResponse {
  Resource account = 1;
  bool replayed = 2;
}
message DisconnectClaudeUsageRequest {
  Mutation mutation = 1;
  string usage_generation = 2;
}
message DisconnectClaudeUsageResponse {
  Resource account = 1;
  bool replayed = 2;
}
