syntax = "proto3";
package delidev.v1;

import "delidev/v1/common.proto";

option go_package = "github.com/delinoio/oss/protos/gen/go/delidev/v1;delidevv1";

service UsageService {
  rpc GetUsageSummary(GetUsageSummaryRequest) returns (GetUsageSummaryResponse);
  rpc GetModelPricing(GetModelPricingRequest) returns (GetModelPricingResponse);
  rpc GetPricingVersion(GetPricingVersionRequest) returns (GetPricingVersionResponse);
  rpc SetModelPricing(SetModelPricingRequest) returns (SetModelPricingResponse);
}

message GetUsageSummaryRequest {
  // Half-open server retention-time range. Zero defaults to the last 30 days.
  int64 from_unix_ms = 1;
  int64 until_unix_ms = 2;
  string session_id = 3;
  string project_id = 4;
  string account_id = 5;
  string provider_id = 6;
  string model_id = 7;
  bool general_chat = 8;
  UsageTimeGranularity granularity = 9;
  string time_zone = 10;
  UsageAccountingProfile accounting_profile = 11;
}

enum UsageTimeGranularity {
  USAGE_TIME_GRANULARITY_UNSPECIFIED = 0;
  USAGE_TIME_GRANULARITY_DAY = 1;
}

enum UsageAccountingProfile {
  // Preserve legacy response-only fields and counts.
  USAGE_ACCOUNTING_PROFILE_UNSPECIFIED = 0;
  USAGE_ACCOUNTING_PROFILE_NATIVE_UNITS_V1 = 1;
}
enum AccountingUnitKind {
  ACCOUNTING_UNIT_KIND_UNSPECIFIED = 0;
  ACCOUNTING_UNIT_KIND_CODEX_RESPONSE = 1;
  ACCOUNTING_UNIT_KIND_GROK_CLOSED_INPUT = 2;
}
message AccountingTotals {
  AccountingUnitKind kind = 1;
  uint32 units = 2;
  // Only independently supplied totals. Empty is unavailable; "0" is measured.
  string known_total = 3;
  uint32 measured_units = 4;
  uint32 unavailable_units = 5;
  // Grok units cannot be priced or contribute to estimated budgets.
  UsageCostState actual_cost = 6;
  UsageCostState estimated_cost = 7;
}
message UsageMeasure {
  // Empty is unavailable. "0" is measured zero. Decimal integer, never float.
  string known_total = 1;
  uint32 measured_responses = 2;
  uint32 unavailable_responses = 3;
}

message UsageTotals {
  uint32 responses = 1;
  UsageMeasure input = 2;
  UsageMeasure cached_input = 3;
  UsageMeasure cache_write_input = 4;
  UsageMeasure output = 5;
  UsageMeasure reasoning_output = 6;
  UsageMeasure total = 7;
  // Present only for explicitly negotiated native accounting; never summed
  // across unit kinds or added to the legacy response counters above.
  repeated AccountingTotals accounting = 8;
}

message UsageAnalyticsDay {
  int64 from_unix_ms = 1;
  int64 until_unix_ms = 2;
  UsageTotals totals = 3;
}

message UsageAnalyticsModel {
  string provider_id = 1;
  string model_id = 2;
  string provider_name = 3;
  string model_name = 4;
  UsageTotals totals = 5;
}

message UsageOtherModels {
  uint32 model_count = 1;
  UsageTotals totals = 2;
}

message UsageAnalytics {
  UsageTimeGranularity granularity = 1;
  string time_zone = 2;
  repeated UsageAnalyticsDay days = 3;
  repeated UsageAnalyticsModel models = 4;
  UsageOtherModels other_models = 5;
}

message UsageGroup {
  string session_id = 1;
  // Empty means projectless General Chat; removed projects retain their UUID.
  string project_id = 2;
  string account_id = 3;
  string provider_id = 4;
  string model_id = 5;
  UsageTotals totals = 6;
  // Current display labels only; immutable IDs above remain authoritative.
  // Missing/deleted configuration leaves its label empty.
  string session_name = 7;
  string project_name = 8;
  string account_name = 9;
  string provider_name = 10;
  string model_name = 11;
  EstimateTotals estimates = 12;
}

enum UsageCostState {
  USAGE_COST_STATE_UNSPECIFIED = 0;
  USAGE_COST_STATE_UNAVAILABLE = 1;
  USAGE_COST_STATE_KNOWN_SUBTOTAL = 2;
}

message GetUsageSummaryResponse {
  int64 from_unix_ms = 1;
  int64 until_unix_ms = 2;
  UsageTotals totals = 3;
  repeated UsageGroup groups = 4;
  UsageCoverage coverage = 5;
  UsageCostState actual_cost = 6;
  UsageCostState estimated_cost = 7;
  // Accepted in this time range with no exact response retained in the range.
  // This does not assert that those executions made no calls.
  uint32 accepted_executions_without_response = 8;
  EstimateTotals estimates = 9;
  repeated PricingUsage pricing = 10;
  UsageAnalytics analytics = 11;
  UsageAccountingProfile accounting_profile = 12;
}

// User-declared token prices only. No rate or result establishes actual spend.
enum InputPricingMode {
  INPUT_PRICING_MODE_UNSPECIFIED = 0;
  INPUT_PRICING_MODE_UNIFORM = 1;
  INPUT_PRICING_MODE_CACHED_DISCOUNT = 2;
}

message TokenPricing {
  string currency = 1;
  string source = 2;
  string as_of = 3;
  InputPricingMode input_mode = 4;
  // Decimal currency units per million tokens, at most nine fractional digits.
  // Omitted is unavailable; an explicit "0" is a zero rate.
  optional string input_per_million = 5;
  optional string cached_input_per_million = 6;
  optional string output_per_million = 7;
  repeated string exclusions = 8;
}

message PricingVersion {
  string id = 1;
  string model_id = 2;
  string provider_id = 3;
  uint64 revision = 4;
  int64 created_at_unix_ms = 5;
  TokenPricing basis = 6;
}

message GetModelPricingRequest {
  string model_id = 1;
}

message GetModelPricingResponse {
  uint64 model_revision = 2;
  // Absent means no basis has been configured for the existing model.
  PricingVersion pricing = 1;
}

message GetPricingVersionRequest {
  string id = 1;
}

message GetPricingVersionResponse {
  PricingVersion pricing = 1;
}

message SetModelPricingRequest {
  // The model ID and independent pricing revision; zero creates its first basis.
  Mutation mutation = 1;
  TokenPricing basis = 2;
  // Bind the model/provider selection read with GetModelPricing.
  uint64 expected_model_revision = 3;
}

message SetModelPricingResponse {
  // Immutable accepted basis, including on a retry after a later price change.
  PricingVersion pricing = 1;
  string request_id = 2;
  bool replayed = 3;
}

message CurrencyEstimate {
  string currency = 1;
  // Exact decimal currency units. Empty is unavailable, not zero.
  string known_amount = 2;
  uint32 complete_responses = 3;
  uint32 partial_responses = 4;
  uint32 unavailable_responses = 5;
}

message EstimateTotals {
  repeated CurrencyEstimate currencies = 1;
  uint32 unpriced_responses = 2;
}

message EstimateMeasure {
  string known_amount = 1;
  string known_tokens = 2;
  uint32 priced_responses = 3;
  uint32 missing_usage_responses = 4;
  uint32 missing_price_responses = 5;
  uint32 unsupported_breakdown_responses = 6;
  uint32 not_applicable_responses = 7;
}

message PricingUsage {
  PricingVersion pricing = 1;
  CurrencyEstimate totals = 2;
  EstimateMeasure input = 3;
  EstimateMeasure cached_input = 4;
  EstimateMeasure output = 5;
}
