syntax = "proto3";
package delidev.v1;

option go_package = "github.com/delinoio/oss/protos/gen/go/delidev/v1;delidevv1";

enum EntityKind {
  ENTITY_KIND_UNSPECIFIED = 0;
  ENTITY_KIND_PROJECT = 1;
  ENTITY_KIND_REPOSITORY = 2;
  ENTITY_KIND_AGENT = 3;
  ENTITY_KIND_ACCOUNT = 4;
  ENTITY_KIND_PROVIDER = 5;
  ENTITY_KIND_MODEL = 6;
  ENTITY_KIND_MACHINE = 7;
  ENTITY_KIND_SESSION = 8;
  ENTITY_KIND_TEMPLATE = 9;
  ENTITY_KIND_SETTINGS = 10;
  ENTITY_KIND_SCHEDULE = 11;
  ENTITY_KIND_OCCURRENCE = 12;
  ENTITY_KIND_MESSAGE = 13;
  ENTITY_KIND_QUEUE = 14;
  ENTITY_KIND_INTERACTION = 15;
  ENTITY_KIND_REVIEW = 16;
  ENTITY_KIND_SNAPSHOT = 17;
  ENTITY_KIND_DEVICE = 18;
  ENTITY_KIND_INTEGRATION = 19;
  ENTITY_KIND_PULL_REQUEST = 20;
  ENTITY_KIND_PROBLEM = 21;
  ENTITY_KIND_INBOX = 22;
  ENTITY_KIND_USAGE = 23;
  ENTITY_KIND_JOB = 24;
  ENTITY_KIND_PAIRING = 25;
  ENTITY_KIND_STEER = 26;
  ENTITY_KIND_FORWARD = 27;
  ENTITY_KIND_TERMINAL = 31;
  ENTITY_KIND_NETWORK_PROFILE = 28;
  ENTITY_KIND_NETWORK_ROUTE = 29;
  ENTITY_KIND_SUBAGENT = 30;
}

// Resource documents are versioned, strictly validated UTF-8 JSON. Their closed
// schemas live in the Go domain types. Unknown fields and enum values fail.
// This envelope never permits arbitrary database writes: each mutation kind
// passes its product validator, relationship checks, and authorization rules.
message Resource {
  string id = 1;
  EntityKind kind = 2;
  uint64 revision = 3;
  string session_id = 4;
  string project_id = 5;
  uint32 schema_version = 6;
  bytes document_json = 7;
  string created_at = 8;
  string updated_at = 9;
}

message Mutation {
  string request_id = 1;
  string id = 2;
  uint64 expected_revision = 3;
}

enum UsageCoverage {
  USAGE_COVERAGE_UNSPECIFIED = 0;
  // Exact known subtotals only. Missing/legacy/child telemetry is not zero.
  USAGE_COVERAGE_OBSERVED_ROOT_RESPONSES = 1;
  // Distinct native input/step units; inherited history is excluded.
  USAGE_COVERAGE_OBSERVED_ROOT_ACCOUNTING_UNITS = 2;
}

message ForwardChange {
  Resource forward = 1;
  bool replayed = 2;
}

// Irrevocable deletion remains pending until every managed resource is confirmed.
enum SessionDeletionState {
  SESSION_DELETION_STATE_UNSPECIFIED = 0;
  SESSION_DELETION_STATE_PENDING = 1;
  SESSION_DELETION_STATE_SUCCEEDED = 2;
}
message SessionDeletionJob {
  string id = 1;
  string session_id = 2;
  uint64 revision = 3;
  SessionDeletionState state = 4;
  string accepted_at = 5;
  string finished_at = 6;
  uint32 workers_pending = 7;
  bool database_removed = 8;
  bool backups_removed = 9;
  // Removal is proved separately from filesystem allocation; bytes are unknown.
  bool reclaimed_bytes_known = 10;
}

// Native subscription identity is independent of API providers.
enum SubscriptionServiceIdentity {
  SUBSCRIPTION_SERVICE_IDENTITY_UNSPECIFIED = 0;
  SUBSCRIPTION_SERVICE_IDENTITY_CHATGPT = 1;
  SUBSCRIPTION_SERVICE_IDENTITY_CLAUDE = 2;
  SUBSCRIPTION_SERVICE_IDENTITY_GROK = 3;
}
