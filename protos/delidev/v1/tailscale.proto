syntax = "proto3";
package delidev.v1;

import "delidev/v1/device.proto";

option go_package = "github.com/delinoio/oss/protos/gen/go/delidev/v1;delidevv1";

service TailscaleService {
  rpc CancelTailscaleConnection(CancelTailscaleConnectionRequest) returns (CancelTailscaleConnectionResponse);
  rpc CancelTailscaleApproval(CancelTailscaleApprovalRequest) returns (CancelTailscaleApprovalResponse);
  rpc ListTailscaleConnections(ListTailscaleConnectionsRequest) returns (ListTailscaleConnectionsResponse);
  rpc BeginTailscaleConnection(BeginTailscaleConnectionRequest) returns (BeginTailscaleConnectionResponse);
  rpc ResumeTailscaleConnection(ResumeTailscaleConnectionRequest) returns (ResumeTailscaleConnectionResponse);
  rpc DeliverTailscaleWorker(DeliverTailscaleWorkerRequest) returns (DeliverTailscaleWorkerResponse);
  rpc DiscoverTailscale(DiscoverTailscaleRequest) returns (DiscoverTailscaleResponse);
  rpc CheckTailscale(CheckTailscaleRequest) returns (CheckTailscaleResponse);
  rpc GetTailscaleAccess(GetTailscaleAccessRequest) returns (GetTailscaleAccessResponse);
  rpc SetTailscaleAccess(SetTailscaleAccessRequest) returns (SetTailscaleAccessResponse);
  rpc RequestTailscaleApproval(RequestTailscaleApprovalRequest) returns (RequestTailscaleApprovalResponse);
  rpc GetTailscaleApproval(GetTailscaleApprovalRequest) returns (GetTailscaleApprovalResponse);
  rpc ListTailscaleApprovals(ListTailscaleApprovalsRequest) returns (ListTailscaleApprovalsResponse);
  rpc DecideTailscaleApproval(DecideTailscaleApprovalRequest) returns (DecideTailscaleApprovalResponse);
}

message DiscoverTailscaleRequest {}
message DiscoverTailscaleResponse {
  bytes document_json = 1;
}
message CheckTailscaleRequest {
  string peer_id = 1;
}
message CheckTailscaleResponse {
  bytes document_json = 1;
}
message GetTailscaleAccessRequest {}
message GetTailscaleAccessResponse {
  bytes document_json = 1;
}
message SetTailscaleAccessRequest {
  string request_id = 1;
  bool enabled = 2;
}
message SetTailscaleAccessResponse {
  bytes document_json = 1;
}
message RequestTailscaleApprovalRequest {
  string request_id = 1;
  string server_id = 2;
  string origin = 3;
  DeviceType role = 4;
  bytes requester_key = 5;
  string name = 6;
  // Worker registration binds the selected server's encrypted original grant.
  string selected_server_id = 7;
  string selected_origin = 8;
}
message RequestTailscaleApprovalResponse {
  bytes document_json = 1;
}
message GetTailscaleApprovalRequest {
  string request_id = 1;
  bytes requester_key = 2;
}
message GetTailscaleApprovalResponse {
  bytes document_json = 1;
}
message ListTailscaleApprovalsRequest {}
message ListTailscaleApprovalsResponse {
  bytes document_json = 1;
}
message DecideTailscaleApprovalRequest {
  string request_id = 1;
  string confirmation_code = 2;
  bool allow = 3;
}
message DecideTailscaleApprovalResponse {
  bytes document_json = 1;
}

message BeginTailscaleConnectionRequest {
  string request_id = 1;
  string peer_id = 2;
  string name = 3;
  DeviceType role = 4;
}
message BeginTailscaleConnectionResponse {
  bytes document_json = 1;
}
message ResumeTailscaleConnectionRequest {
  string request_id = 1;
}
message ResumeTailscaleConnectionResponse {
  bytes document_json = 1;
}
message DeliverTailscaleWorkerRequest {
  string request_id = 1;
  bytes requester_key = 2;
  bytes encrypted_grant = 3;
}
message DeliverTailscaleWorkerResponse {
  bytes document_json = 1;
}

message ListTailscaleConnectionsRequest {}
message ListTailscaleConnectionsResponse {
  bytes document_json = 1;
}

message CancelTailscaleConnectionRequest {
  string request_id = 1;
}
message CancelTailscaleConnectionResponse {
  bytes document_json = 1;
}
message CancelTailscaleApprovalRequest {
  string request_id = 1;
  bytes encrypted_confirmation = 2;
}
message CancelTailscaleApprovalResponse {
  bytes document_json = 1;
}
