syntax = "proto3";
package delidev.v1;

import "delidev/v1/common.proto";

option go_package = "github.com/delinoio/oss/protos/gen/go/delidev/v1;delidevv1";

// Owner/paired-client configuration only; credentials are write-only.
service NetworkService {
  rpc SaveNetworkProfile(SaveNetworkProfileRequest) returns (SaveNetworkProfileResponse);
  rpc DeleteNetworkProfile(DeleteNetworkProfileRequest) returns (DeleteNetworkProfileResponse);
  rpc SelectNetworkProfile(SelectNetworkProfileRequest) returns (SelectNetworkProfileResponse);
  rpc GetNetworkRoute(GetNetworkRouteRequest) returns (GetNetworkRouteResponse);
  rpc ExportWorkerNetworkMetadata(ExportWorkerNetworkMetadataRequest) returns (ExportWorkerNetworkMetadataResponse);
}
message SaveNetworkProfileRequest {
  Mutation mutation = 1;
  uint32 schema_version = 2;
  bytes document_json = 3;
  // Bounded username/password JSON, never returned or persisted in SQLite.
  bytes credential_json = 4;
  bool clear_credential = 5;
}
message DeleteNetworkProfileRequest {
  Mutation mutation = 1;
}
message SelectNetworkProfileRequest {
  Mutation mutation = 1;
  // Empty selects the server; otherwise the exact registered Worker machine.
  string machine_id = 2;
  // Empty selects built-in Direct. Nonempty requires an exact current revision.
  string profile_id = 3;
  uint64 profile_revision = 4;
}
message SaveNetworkProfileResponse {
  Resource resource = 1;
  string request_id = 2;
  bool replayed = 3;
  bool deleted = 4;
}
message DeleteNetworkProfileResponse {
  Resource resource = 1;
  string request_id = 2;
  bool replayed = 3;
  bool deleted = 4;
}
message SelectNetworkProfileResponse {
  Resource resource = 1;
  string request_id = 2;
  bool replayed = 3;
  bool deleted = 4;
}
message GetNetworkRouteRequest {
  string machine_id = 1;
}
message GetNetworkRouteResponse {
  // Absent means the explicit default Direct, generation zero.
  Resource route = 1;
}
message ExportWorkerNetworkMetadataRequest {
  string machine_id = 1;
  uint64 desired_generation = 2;
}
message ExportWorkerNetworkMetadataResponse {
  bytes metadata_json = 1;
  string authentication = 2;
}
