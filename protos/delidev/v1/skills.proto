syntax = "proto3";
package delidev.v1;

option go_package = "github.com/delinoio/oss/protos/gen/go/delidev/v1;delidevv1";
// Inventory is keyless and belongs to the selected authenticated Runner.
service SkillService {
  rpc ListSkills(ListSkillsRequest) returns (ListSkillsResponse);
  rpc ListManagedSkills(ListManagedSkillsRequest) returns (ListManagedSkillsResponse);
  rpc MutateManagedSkill(MutateManagedSkillRequest) returns (MutateManagedSkillResponse);
  rpc GetManagedSkillMutation(GetManagedSkillMutationRequest) returns (GetManagedSkillMutationResponse);
  rpc ViewManagedSkill(ViewManagedSkillRequest) returns (ViewManagedSkillResponse);
}
enum SkillProvenance {
  SKILL_PROVENANCE_UNSPECIFIED = 0;
  SKILL_PROVENANCE_USER = 1;
  SKILL_PROVENANCE_PROJECT = 2;
}
message SkillSelection {
  string inventory_id = 1;
  string skill_id = 2;
  string content_revision = 3;
  string worker_device_id = 4;
}
// Presence distinguishes an old client omission from an explicit clear.
message SkillSelectionList {
  repeated SkillSelection selections = 1;
}
message SkillEntry {
  SkillSelection selection = 1;
  string name = 2;
  string description = 3;
  SkillProvenance provenance = 4;
}
message ListSkillsRequest {
  string machine_id = 1;
  string agent_id = 2;
  string session_id = 3;
  string project_id = 4;
}
message ListSkillsResponse {
  repeated SkillEntry skills = 1;
}

// Management receipts preserve the original mutation and Worker ownership.
enum SkillMutationState {
  SKILL_MUTATION_STATE_UNSPECIFIED = 0;
  SKILL_MUTATION_STATE_PENDING = 1;
  SKILL_MUTATION_STATE_SUCCEEDED = 2;
  SKILL_MUTATION_STATE_RECOVERY_REQUIRED = 3;
  SKILL_MUTATION_STATE_FAILED = 4;
}
message ListManagedSkillsRequest {
  string machine_id = 1;
}
message ListManagedSkillsResponse {
  string worker_device_id = 1;
  bytes packages_json = 2;
}
message MutateManagedSkillRequest {
  string machine_id = 1;
  string request_id = 2;
  bytes document_json = 3;
}
message MutateManagedSkillResponse {
  string request_id = 1;
  SkillMutationState state = 2;
  bytes result_json = 3;
}
message GetManagedSkillMutationRequest {
  string machine_id = 1;
  string request_id = 2;
}
message GetManagedSkillMutationResponse {
  string request_id = 1;
  SkillMutationState state = 2;
  bytes result_json = 3;
}
message ViewManagedSkillRequest {
  string machine_id = 1;
  string package_id = 2;
  uint64 expected_revision = 3;
}
message ViewManagedSkillResponse {
  string worker_device_id = 1;
  bytes package_json = 2;
  bytes skill_markdown = 3;
  bytes manifest_json = 4;
}
