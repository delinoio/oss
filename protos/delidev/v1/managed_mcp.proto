syntax = "proto3";
package delidev.v1;

option go_package = "github.com/delinoio/oss/protos/gen/go/delidev/v1;delidevv1";

// Management is independent of native MCP execution support.
service ManagedMCPService {
  rpc ListManagedMcp(ListManagedMcpRequest) returns (ListManagedMcpResponse);
  rpc SaveManagedMcp(SaveManagedMcpRequest) returns (SaveManagedMcpResponse);
  rpc DeleteManagedMcp(DeleteManagedMcpRequest) returns (DeleteManagedMcpResponse);
  rpc AuthenticateManagedMcp(AuthenticateManagedMcpRequest) returns (AuthenticateManagedMcpResponse);
  rpc GetManagedMcpOperation(GetManagedMcpOperationRequest) returns (GetManagedMcpOperationResponse);
}
enum ManagedMcpTransport {
  MANAGED_MCP_TRANSPORT_UNSPECIFIED = 0;
  MANAGED_MCP_TRANSPORT_STDIO = 1;
  MANAGED_MCP_TRANSPORT_STREAMABLE_HTTP = 2;
}
enum ManagedMcpAuthentication {
  MANAGED_MCP_AUTHENTICATION_UNSPECIFIED = 0;
  MANAGED_MCP_AUTHENTICATION_NONE = 1;
  MANAGED_MCP_AUTHENTICATION_MANUAL = 2;
  MANAGED_MCP_AUTHENTICATION_OAUTH = 3;
}
enum ManagedMcpAuthAction {
  MANAGED_MCP_AUTH_ACTION_UNSPECIFIED = 0;
  MANAGED_MCP_AUTH_ACTION_MANUAL = 1;
  MANAGED_MCP_AUTH_ACTION_OAUTH_BEGIN = 2;
  MANAGED_MCP_AUTH_ACTION_OAUTH_COMPLETE = 3;
  MANAGED_MCP_AUTH_ACTION_OAUTH_CANCEL = 4;
}
enum ManagedMcpOperationState {
  MANAGED_MCP_OPERATION_STATE_UNSPECIFIED = 0;
  MANAGED_MCP_OPERATION_STATE_STARTED = 1;
  MANAGED_MCP_OPERATION_STATE_COMPLETED = 2;
  MANAGED_MCP_OPERATION_STATE_AWAITING_AUTHORIZATION = 3;
  MANAGED_MCP_OPERATION_STATE_CANCELED = 4;
  MANAGED_MCP_OPERATION_STATE_RECOVERY_REQUIRED = 5;
  MANAGED_MCP_OPERATION_STATE_REJECTED = 6;
}
message ManagedMcpOAuthProfile {
  string client_id = 1;
  string authorization_url = 2;
  string token_url = 3;
  string redirect_uri = 4;
  string scope = 5;
}
message ManagedMcpAgentReference {
  string id = 1;
  string name = 2;
}
message ManagedMcpDefinition {
  string id = 1;
  uint64 revision = 2;
  string machine_id = 3;
  string worker_device_id = 4;
  string name = 5;
  ManagedMcpTransport transport = 6;
  string command = 7;
  repeated string arguments = 8;
  string cwd = 9;
  string endpoint = 10;
  bool enabled = 11;
  ManagedMcpAuthentication authentication = 12;
  ManagedMcpOAuthProfile oauth = 13;
  bool authenticated = 14;
  repeated string supported_harnesses = 15;
  repeated ManagedMcpAgentReference agents = 16;
}
message ManagedMcpOperation {
  string request_id = 1;
  string definition_id = 2;
  ManagedMcpOperationState state = 3;
  string authorization_url = 4;
  string expires_at = 5;
}
message ListManagedMcpRequest {
  string machine_id = 1;
}
message ListManagedMcpResponse {
  repeated ManagedMcpDefinition definitions = 1;
  repeated ManagedMcpOperation operations = 2;
}
message SaveManagedMcpRequest {
  string machine_id = 1;
  string request_id = 2;
  ManagedMcpDefinition definition = 3;
  uint64 expected_revision = 4;
}
message SaveManagedMcpResponse {
  ManagedMcpDefinition definition = 1;
  ManagedMcpOperation operation = 2;
  bool replayed = 3;
}
message DeleteManagedMcpRequest {
  string machine_id = 1;
  string request_id = 2;
  string definition_id = 3;
  uint64 expected_revision = 4;
  bool confirmed = 5;
}
message DeleteManagedMcpResponse {
  ManagedMcpOperation operation = 1;
  bool replayed = 2;
}
message AuthenticateManagedMcpRequest {
  string machine_id = 1;
  string request_id = 2;
  string definition_id = 3;
  uint64 expected_revision = 4;
  ManagedMcpAuthAction action = 5;
  // Write-only, forwarded in memory to the selected Worker's native vault.
  map<string, string> environment = 6;
  map<string, string> headers = 7;
  string attempt_id = 8;
  string callback_url = 9;
  bool confirmed = 10;
}
message AuthenticateManagedMcpResponse {
  ManagedMcpDefinition definition = 1;
  ManagedMcpOperation operation = 2;
  bool replayed = 3;
}
message GetManagedMcpOperationRequest {
  string machine_id = 1;
  string request_id = 2;
  string definition_id = 3;
}
message GetManagedMcpOperationResponse {
  ManagedMcpDefinition definition = 1;
  ManagedMcpOperation operation = 2;
}
