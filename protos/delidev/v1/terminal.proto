syntax = "proto3";
package delidev.v1;

import "delidev/v1/common.proto";

option go_package = "github.com/delinoio/oss/protos/gen/go/delidev/v1;delidevv1";

// Owner/client operations. Generic ResourceService provides terminal list/get.
service TerminalService {
  rpc CreateTerminal(CreateTerminalRequest) returns (CreateTerminalResponse);
  rpc ControlTerminal(ControlTerminalRequest) returns (ControlTerminalResponse);
  rpc WatchTerminalOutput(WatchTerminalOutputRequest) returns (stream WatchTerminalOutputResponse);
}
enum TerminalAction {
  TERMINAL_ACTION_UNSPECIFIED = 0;
  TERMINAL_ACTION_INPUT = 1;
  TERMINAL_ACTION_RESIZE = 2;
  TERMINAL_ACTION_CLOSE = 3;
}
enum TerminalCreationMode {
  TERMINAL_CREATION_MODE_UNSPECIFIED = 0;
  TERMINAL_CREATION_MODE_REUSE_OR_CREATE = 1;
}
message CreateTerminalRequest {
  // Mutation targets the session and its current revision.
  Mutation mutation = 1;
  string shell_override = 2;
  uint32 rows = 3;
  uint32 columns = 4;
  // Unspecified preserves explicit additional creation for existing clients.
  TerminalCreationMode creation_mode = 5;
  // Optional original session terminal preference; admission revalidates it.
  string preferred_terminal_id = 6;
}
message ControlTerminalRequest {
  // Mutation targets the original terminal and its current revision.
  Mutation mutation = 1;
  TerminalAction action = 2;
  bytes input = 3;
  uint32 rows = 4;
  uint32 columns = 5;
}
message CreateTerminalResponse {
  Resource terminal = 1;
  bool replayed = 2;
}
message ControlTerminalResponse {
  Resource terminal = 1;
  bool replayed = 2;
}
message WatchTerminalOutputRequest {
  string terminal_id = 1;
  string epoch = 2;
  uint64 after_sequence = 3;
}
message WatchTerminalOutputResponse {
  string epoch = 1;
  uint64 sequence = 2;
  bytes data = 3;
  bool gap = 4;
  bool heartbeat = 5;
  Resource terminal = 6;
}
message WatchTerminalsRequest {
  string machine_id = 1;
  string instance_id = 2;
}
message WatchTerminalsResponse {
  bytes assignment_json = 1;
  bool heartbeat = 2;
}
message ClaimTerminalRequest {
  string request_id = 5;
  string machine_id = 1;
  string instance_id = 2;
  string terminal_id = 3;
  string operation_id = 4;
}
message ClaimTerminalResponse {
  bytes assignment_json = 1;
}
message ReportTerminalRequest {
  string request_id = 1;
  string machine_id = 2;
  string instance_id = 3;
  string terminal_id = 4;
  string operation_id = 5;
  bytes result_json = 6;
}
message ReportTerminalResponse {
  Resource terminal = 1;
}
message PublishTerminalOutputRequest {
  string machine_id = 1;
  string instance_id = 2;
  string terminal_id = 3;
  string epoch = 4;
  uint64 sequence = 5;
  bytes data = 6;
}
message PublishTerminalOutputResponse {}
