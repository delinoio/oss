syntax = "proto3";
package delidev.v1;

import "delidev/v1/common.proto";

option go_package = "github.com/delinoio/oss/protos/gen/go/delidev/v1;delidevv1";

service ProviderService {
  rpc ListProviderPresets(ListProviderPresetsRequest) returns (ListProviderPresetsResponse);
  rpc ListProviderInventory(ListProviderInventoryRequest) returns (ListProviderInventoryResponse);
  rpc DiscoverModels(DiscoverModelsRequest) returns (DiscoverModelsResponse);
  rpc SearchModels(SearchModelsRequest) returns (SearchModelsResponse);
  rpc ResolveModel(ResolveModelRequest) returns (ResolveModelResponse);
}

enum ProviderPresetId {
  PROVIDER_PRESET_ID_UNSPECIFIED = 0;
  PROVIDER_PRESET_ID_VERCEL_AI_GATEWAY = 1;
  PROVIDER_PRESET_ID_OPENROUTER = 2;
  PROVIDER_PRESET_ID_OPENAI = 3;
  PROVIDER_PRESET_ID_ANTHROPIC = 4;
  PROVIDER_PRESET_ID_XAI = 5;
  PROVIDER_PRESET_ID_DEEPSEEK = 6;
  PROVIDER_PRESET_ID_OLLAMA = 7;
  PROVIDER_PRESET_ID_LM_STUDIO = 8;
  PROVIDER_PRESET_ID_VLLM = 9;
}

enum ProviderInventoryCapability {
  PROVIDER_INVENTORY_CAPABILITY_UNSPECIFIED = 0;
  PROVIDER_INVENTORY_CAPABILITY_PROVIDER_ACTIVATION = 1;
  PROVIDER_INVENTORY_CAPABILITY_ACTIVE_API_MODEL_FILTER = 2;
  PROVIDER_INVENTORY_CAPABILITY_ACCOUNT_PROVIDER_FILTER = 3;
  PROVIDER_INVENTORY_CAPABILITY_ACCOUNT_TYPE_FILTER = 4;
  PROVIDER_INVENTORY_CAPABILITY_OPENROUTER_OAUTH_PKCE_V1 = 5;
}

message ListProviderInventoryRequest {
  string query = 1;
  bool enabled_only = 2;
  uint32 page_size = 3;
  string page_token = 4;
}

message ProviderInventoryEntry {
  ProviderPresetId preset_id = 1;
  // Present only for an already-saved provider.
  string provider_id = 2;
  string display_name = 3;
  bool enabled = 4;
  uint64 total_accounts = 5;
  uint64 connected_accounts = 6;
  Resource provider = 7;
  bool account_counts_available = 8;
  ProviderConnectionMethod connection_method = 9;
}

message ListProviderInventoryResponse {
  repeated ProviderInventoryEntry entries = 1;
  string next_page_token = 2;
  repeated ProviderInventoryCapability capabilities = 3;
}

message ListProviderPresetsRequest {}

message ListProviderPresetsResponse {
  bytes presets_json = 1;
}

message DiscoverModelsRequest {
  // Explicit account identity/current revision; the provider is server-owned.
  Mutation mutation = 1;
}

message DiscoverModelsResponse {
  Resource account = 1;
  string request_id = 2;
  bool replayed = 3;
  bytes observation_json = 4;
}

message SearchModelsRequest {
  string query = 1;
  string provider_id = 2;
  bool include_hidden = 3;
  uint32 page_size = 4;
  string page_token = 5;
  // Filters before SQL pagination; false preserves the historical broad search.
  bool enabled_providers_only = 6;
}

message SearchModelsResponse {
  repeated Resource models = 1;
  repeated Resource providers = 2;
  string next_page_token = 3;
}

message ResolveModelRequest {
  string selector = 1;
  string provider_id = 2;
}

message ResolveModelResponse {
  Resource model = 1;
}

enum ProviderConnectionMethod {
 PROVIDER_CONNECTION_METHOD_UNSPECIFIED = 0;
 PROVIDER_CONNECTION_METHOD_API_KEY = 1;
 PROVIDER_CONNECTION_METHOD_OAUTH_PKCE = 2;
 PROVIDER_CONNECTION_METHOD_KEYLESS = 3;
}
