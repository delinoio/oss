syntax = "proto3";
package delidev.v1;

import "delidev/v1/common.proto";
import "delidev/v1/mcp_management.proto";

option go_package = "github.com/delinoio/oss/protos/gen/go/delidev/v1;delidevv1";

service ConfigurationService {
  rpc ListProjectPromptHistory(ListProjectPromptHistoryRequest) returns (ListProjectPromptHistoryResponse);
  rpc ClearProjectPromptHistory(ClearProjectPromptHistoryRequest) returns (ClearProjectPromptHistoryResponse);
  rpc ExportConfiguration(ExportConfigurationRequest) returns (ExportConfigurationResponse);
  rpc PreviewConfigurationImport(PreviewConfigurationImportRequest) returns (PreviewConfigurationImportResponse);
  rpc ApplyConfigurationImport(ApplyConfigurationImportRequest) returns (ApplyConfigurationImportResponse);
  // Both save paths use the existing revisioned acknowledgement envelope.
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc SaveAgentWorker(SaveAgentWorkerRequest) returns (SaveConfigurationResponse);
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc SaveConfiguration(SaveConfigurationRequest) returns (SaveConfigurationResponse);
  rpc DeleteConfiguration(DeleteConfigurationRequest) returns (DeleteConfigurationResponse);
  rpc PreviewRouting(PreviewRoutingRequest) returns (PreviewRoutingResponse);
}

// Saves a Worker and resolves its source-scoped model atomically.
message SaveAgentWorkerRequest {
  Mutation mutation = 1;
  bytes document_json = 2;
  AgentWorkerModelSelection model = 3;
  uint32 schema_version = 4;
  // Ordered selections corresponding exactly to schema-3 source routes.
  // Exclusive with model. Sources are derived from current accounts by Go.
  repeated AgentWorkerModelSelection route_models = 5;
 // Omission preserves old clients; an explicit empty list clears selections.
 McpSelectionList mcp_selections = 7;
}

message AgentWorkerModelSelection {
  oneof selection {
    string model_id = 1;
    string native_id = 2;
  }
  // Required for a canonical model selection; zero for direct native IDs.
  uint64 expected_model_revision = 3;
}

message SaveConfigurationRequest {
  Mutation mutation = 1;
  EntityKind kind = 2;
  uint32 schema_version = 3;
  bytes document_json = 4;
}

message SaveConfigurationResponse {
  Resource resource = 1;
  string request_id = 2;
  bool replayed = 3;
  // Accepted asynchronous configuration validation. Inspect this job until done.
  Resource job = 4;
}

message DeleteConfigurationRequest {
  Mutation mutation = 1;
  EntityKind kind = 2;
}

message DeleteConfigurationResponse {
  string id = 1;
  string request_id = 2;
  bool replayed = 3;
}

message PreviewRoutingRequest {
  string agent_id = 1;
  string project_id = 2;
}

message PreviewRoutingResponse {
  bytes route_json = 1;
}

message ExportConfigurationRequest {}

message ExportConfigurationResponse {
  bytes document_json = 1;
}

message PreviewConfigurationImportRequest {
  bytes selection_json = 1;
}

message PreviewConfigurationImportResponse {
  bytes preview_json = 1;
}

message ApplyConfigurationImportRequest {
  string request_id = 1;
  bytes preview_json = 2;
}

message ApplyConfigurationImportResponse {
  string request_id = 1;
  bool replayed = 2;
  bytes result_json = 3;
}

// Project-owned first-message text, independent of source-session lifetime.
message ProjectPromptHistoryEntry {
  string id = 1;
  string project_id = 2;
  string prompt = 3;
  string accepted_at = 4;
  uint64 acceptance_sequence = 5;
}
message ListProjectPromptHistoryRequest {
  string project_id = 1;
  uint32 page_size = 2;
  string page_token = 3;
}
message ListProjectPromptHistoryResponse {
  repeated ProjectPromptHistoryEntry entries = 1;
  string next_page_token = 2;
}
message ClearProjectPromptHistoryRequest {
  string project_id = 1;
  string request_id = 2;
  bool confirmed = 3;
}
message ClearProjectPromptHistoryResponse {
  string project_id = 1;
  string request_id = 2;
  bool replayed = 3;
  uint32 removed_count = 4;
}
