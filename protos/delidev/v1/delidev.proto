syntax = "proto3";
package delidev.v1;

option go_package = "github.com/delinoio/oss/protos/gen/go/delidev/v1;delidevv1";

// All operations, including loopback, require authenticated owner authorization.
service SystemService {
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  rpc StopServer(StopServerRequest) returns (StopServerResponse);
  rpc GetDoctor(GetDoctorRequest) returns (GetDoctorResponse);
  rpc CreateBackup(CreateBackupRequest) returns (CreateBackupResponse);
}
service ResourceService {
  rpc GetResource(GetResourceRequest) returns (GetResourceResponse);
  rpc ListResources(ListResourcesRequest) returns (ListResourcesResponse);
  rpc GetSnapshot(GetSnapshotRequest) returns (GetSnapshotResponse);
  rpc WatchEvents(WatchEventsRequest) returns (stream WatchEventsResponse);
}
service ConfigurationService {
  rpc SaveConfiguration(SaveConfigurationRequest) returns (SaveConfigurationResponse);
  rpc DeleteConfiguration(DeleteConfigurationRequest) returns (DeleteConfigurationResponse);
  rpc PreviewRouting(PreviewRoutingRequest) returns (PreviewRoutingResponse);
}

enum EntityKind {
  ENTITY_KIND_UNSPECIFIED = 0;
  ENTITY_KIND_PROJECT = 1;
  ENTITY_KIND_REPOSITORY = 2;
  ENTITY_KIND_AGENT = 3;
  ENTITY_KIND_ACCOUNT = 4;
  ENTITY_KIND_PROVIDER = 5;
  ENTITY_KIND_MODEL = 6;
  ENTITY_KIND_MACHINE = 7;
  ENTITY_KIND_SESSION = 8;
  ENTITY_KIND_TEMPLATE = 9;
  ENTITY_KIND_SETTINGS = 10;
  ENTITY_KIND_SCHEDULE = 11;
  ENTITY_KIND_OCCURRENCE = 12;
  ENTITY_KIND_MESSAGE = 13;
  ENTITY_KIND_QUEUE = 14;
  ENTITY_KIND_INTERACTION = 15;
  ENTITY_KIND_REVIEW = 16;
  ENTITY_KIND_SNAPSHOT = 17;
  ENTITY_KIND_DEVICE = 18;
  ENTITY_KIND_INTEGRATION = 19;
  ENTITY_KIND_PULL_REQUEST = 20;
  ENTITY_KIND_PROBLEM = 21;
  ENTITY_KIND_INBOX = 22;
  ENTITY_KIND_USAGE = 23;
  ENTITY_KIND_JOB = 24;
  ENTITY_KIND_PAIRING = 25;
}
// Resource documents are versioned, strictly validated UTF-8 JSON. Their closed
// schemas live in the Go domain types. Unknown fields and enum values fail.
// This envelope never permits arbitrary database writes: each mutation kind
// passes its product validator, relationship checks, and authorization rules.
message Resource {
  string id = 1;
  EntityKind kind = 2;
  uint64 revision = 3;
  string session_id = 4;
  string project_id = 5;
  uint32 schema_version = 6;
  bytes document_json = 7;
  string created_at = 8;
  string updated_at = 9;
}
message Mutation {
  string request_id = 1;
  string id = 2;
  uint64 expected_revision = 3;
}
message Filter {
  EntityKind kind = 1;
  string session_id = 2;
  string project_id = 3;
  uint32 page_size = 4;
  string page_token = 5;
}
message ErrorDetail {
  string code = 1;
  string guidance = 2;
  string cause = 3;
  string correlation_id = 4;
}
message GetStatusRequest {}
message GetStatusResponse {
  string version = 1;
  uint32 protocol_version = 2;
  uint32 schema_version = 3;
  string server_id = 4;
  string listener = 5;
  string started_at = 6;
  bool stopping = 7;
}
message StopServerRequest {
  string request_id = 1;
}
message StopServerResponse {
  string request_id = 1;
}
message GetDoctorRequest {}
message GetDoctorResponse {
  bytes report_json = 1;
}
message CreateBackupRequest {
  string request_id = 1;
}
message CreateBackupResponse {
  string id = 1;
  string request_id = 2;
  bool replayed = 3;
}
message GetResourceRequest {
  EntityKind kind = 1;
  string id = 2;
}
message GetResourceResponse {
  Resource resource = 1;
}
message ListResourcesRequest {
  Filter filter = 1;
}
message ListResourcesResponse {
  repeated Resource resources = 1;
  string next_page_token = 2;
}
message GetSnapshotRequest {
  Filter filter = 1;
}
message GetSnapshotResponse {
  repeated Resource resources = 1;
  string cursor = 2;
}
message WatchEventsRequest {
  string cursor = 1;
  string session_id = 2;
}
enum EventAction {
  EVENT_ACTION_UNSPECIFIED = 0;
  EVENT_ACTION_CREATED = 1;
  EVENT_ACTION_UPDATED = 2;
  EVENT_ACTION_DELETED = 3;
}
message WatchEventsResponse {
  string cursor = 1;
  string id = 2;
  string entity_id = 3;
  EntityKind kind = 4;
  string session_id = 5;
  uint64 revision = 6;
  EventAction action = 7;
  string time = 8;
}
message SaveConfigurationRequest {
  Mutation mutation = 1;
  EntityKind kind = 2;
  uint32 schema_version = 3;
  bytes document_json = 4;
}
message SaveConfigurationResponse {
  Resource resource = 1;
  string request_id = 2;
  bool replayed = 3;
  // Accepted asynchronous configuration validation. Inspect this job until done.
  Resource job = 4;
}
message DeleteConfigurationRequest {
  Mutation mutation = 1;
  EntityKind kind = 2;
}
message DeleteConfigurationResponse {
  string id = 1;
  string request_id = 2;
  bool replayed = 3;
}
message PreviewRoutingRequest {
  string agent_id = 1;
  string project_id = 2;
}
message PreviewRoutingResponse {
  bytes route_json = 1;
}

service DeviceService {
  rpc CreatePairing(CreatePairingRequest) returns (CreatePairingResponse);
  rpc PairDevice(PairDeviceRequest) returns (PairDeviceResponse);
  rpc RevokeDevice(RevokeDeviceRequest) returns (RevokeDeviceResponse);
}
service WorkerService {
  rpc AttachWorker(AttachWorkerRequest) returns (AttachWorkerResponse);
  rpc WatchWork(WatchWorkRequest) returns (stream WatchWorkResponse);
  rpc ReportWork(ReportWorkRequest) returns (ReportWorkResponse);
  rpc InspectRepository(InspectRepositoryRequest) returns (InspectRepositoryResponse);
  rpc DiscoverHarnesses(DiscoverHarnessesRequest) returns (DiscoverHarnessesResponse);
}
enum DeviceType {
  DEVICE_TYPE_UNSPECIFIED = 0;
  DEVICE_TYPE_CLIENT = 1;
  DEVICE_TYPE_WORKER = 2;
}
message CreatePairingRequest {
  string request_id = 1;
  string name = 2;
  DeviceType type = 3;
  // SHA-256 of a locally generated 256-bit one-time code. Never the code itself.
  bytes code_digest = 4;
}
message CreatePairingResponse {
  Resource pairing = 1;
  string request_id = 2;
  bool replayed = 3;
}
message PairDeviceRequest {
  string request_id = 1;
  string pairing_id = 2;
  string code = 3;
  string device_id = 4;
  bytes credential_digest = 5;
  string machine_id = 6;
  bytes machine_json = 7;
}
message PairDeviceResponse {
  Resource device = 1;
  Resource machine = 2;
  string server_id = 3;
  bool replayed = 4;
}
message RevokeDeviceRequest {
  Mutation mutation = 1;
}
message RevokeDeviceResponse {
  Resource device = 1;
  string request_id = 2;
  bool replayed = 3;
}
message AttachWorkerRequest {
  string request_id = 1;
  string machine_id = 2;
  string instance_id = 3;
  string version = 4;
}
message AttachWorkerResponse {
  Resource machine = 1;
  string server_id = 2;
}
message WatchWorkRequest {
  string machine_id = 1;
  string instance_id = 2;
}
message WatchWorkResponse {
  Resource job = 1;
  bool heartbeat = 2;
}
message ReportWorkRequest {
  Mutation mutation = 1;
  string machine_id = 2;
  string instance_id = 3;
  bytes output_json = 4;
  ErrorDetail problem = 5;
}
message ReportWorkResponse {
  Resource job = 1;
  bool replayed = 2;
}
message InspectRepositoryRequest {
  string request_id = 1;
  string machine_id = 2;
  string path = 3;
  string preferred_remote = 4;
}
message InspectRepositoryResponse {
  Resource job = 1;
  string request_id = 2;
  bool replayed = 3;
}
message DiscoverHarnessesRequest {
  // Machine identity and optimistic revision, plus durable request identity.
  Mutation mutation = 1;
  // Omit to refresh existing selections. Otherwise replace all selections with
  // the closed ExecutableSelections document; omitted harnesses use Worker PATH.
  bytes selections_json = 2;
  // Validate the installed native protocol without login, inference, or sessions.
  bool verify_protocol = 3;
}
message DiscoverHarnessesResponse {
  Resource machine = 1;
  Resource job = 2;
  string request_id = 3;
  bool replayed = 4;
}

// Write-only account credentials. Workers cannot invoke this owner/client API.
service AccountService {
  rpc ConnectAccount(ConnectAccountRequest) returns (ConnectAccountResponse);
  rpc DisconnectAccount(DisconnectAccountRequest) returns (DisconnectAccountResponse);
  rpc GetAccountStatus(GetAccountStatusRequest) returns (GetAccountStatusResponse);
  rpc ValidateAccount(ValidateAccountRequest) returns (ValidateAccountResponse);
}
message ConnectAccountRequest {
  Mutation mutation = 1;
  // Bounded credential bytes, never included in receipts or ordinary output.
  bytes api_key = 2;
  // Explicit selection for a provider configured with keyless local authentication.
  bool keyless = 3;
}
message ConnectAccountResponse {
  Resource account = 1;
  string request_id = 2;
  bool replayed = 3;
}
message DisconnectAccountRequest {
  Mutation mutation = 1;
}
message DisconnectAccountResponse {
  Resource account = 1;
  string request_id = 2;
  bool replayed = 3;
  // Accepted disconnection remains authoritative if native cleanup needs retry.
  // Closed domain.Error JSON; never raw OS/provider text or credential material.
  bytes cleanup_problem_json = 4;
}
message GetAccountStatusRequest {
  string id = 1;
}
message GetAccountStatusResponse {
  Resource account = 1;
}
message ValidateAccountRequest {
  Mutation mutation = 1;
}
message ValidateAccountResponse {
  Resource account = 1;
  string request_id = 2;
  bool replayed = 3;
  // Accepted, sanitized non-inference observation. Does not expose model payloads
  // or credentials and is not inference, quota recovery or harness capability.
  bytes validation_json = 4;
}

service ProviderService {
  rpc ListProviderPresets(ListProviderPresetsRequest) returns (ListProviderPresetsResponse);
  rpc DiscoverModels(DiscoverModelsRequest) returns (DiscoverModelsResponse);
  rpc SearchModels(SearchModelsRequest) returns (SearchModelsResponse);
  rpc ResolveModel(ResolveModelRequest) returns (ResolveModelResponse);
}
message ListProviderPresetsRequest {}
message ListProviderPresetsResponse {
  bytes presets_json = 1;
}
message DiscoverModelsRequest {
  // Explicit account identity/current revision; the provider is server-owned.
  Mutation mutation = 1;
}
message DiscoverModelsResponse {
  Resource account = 1;
  string request_id = 2;
  bool replayed = 3;
  bytes observation_json = 4;
}
message SearchModelsRequest {
  string query = 1;
  string provider_id = 2;
  bool include_hidden = 3;
  uint32 page_size = 4;
  string page_token = 5;
}
message SearchModelsResponse {
  repeated Resource models = 1;
  repeated Resource providers = 2;
  string next_page_token = 3;
}
message ResolveModelRequest {
  string selector = 1;
  string provider_id = 2;
}
message ResolveModelResponse {
  Resource model = 1;
}
