syntax = "proto3";
package delidev.v1;

option go_package = "github.com/delinoio/oss/protos/gen/go/delidev/v1;delidevv1";

// All operations, including loopback, require authenticated owner authorization.
service SystemService {
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  rpc GetOverview(GetOverviewRequest) returns (GetOverviewResponse);
  rpc StopServer(StopServerRequest) returns (StopServerResponse);
  rpc GetDoctor(GetDoctorRequest) returns (GetDoctorResponse);
  rpc CreateBackup(CreateBackupRequest) returns (CreateBackupResponse);
  rpc ListBackups(ListBackupsRequest) returns (ListBackupsResponse);
  rpc InspectBackup(InspectBackupRequest) returns (InspectBackupResponse);
  rpc DeleteBackup(DeleteBackupRequest) returns (DeleteBackupResponse);
  rpc GetBackupDeletion(GetBackupDeletionRequest) returns (GetBackupDeletionResponse);
  rpc ListBackupDeletions(ListBackupDeletionsRequest) returns (ListBackupDeletionsResponse);
  rpc RequestBackup(RequestBackupRequest) returns (RequestBackupResponse);
  rpc GetBackupCreation(GetBackupCreationRequest) returns (GetBackupCreationResponse);
  rpc ListBackupCreations(ListBackupCreationsRequest) returns (ListBackupCreationsResponse);
}
service ResourceService {
  rpc GetResource(GetResourceRequest) returns (GetResourceResponse);
  rpc ListResources(ListResourcesRequest) returns (ListResourcesResponse);
  rpc GetSnapshot(GetSnapshotRequest) returns (GetSnapshotResponse);
  rpc WatchEvents(WatchEventsRequest) returns (stream WatchEventsResponse);
}

service ConfigurationService {
  rpc ExportConfiguration(ExportConfigurationRequest) returns (ExportConfigurationResponse);
  rpc PreviewConfigurationImport(PreviewConfigurationImportRequest) returns (PreviewConfigurationImportResponse);
  rpc ApplyConfigurationImport(ApplyConfigurationImportRequest) returns (ApplyConfigurationImportResponse);
  rpc SaveConfiguration(SaveConfigurationRequest) returns (SaveConfigurationResponse);
  rpc DeleteConfiguration(DeleteConfigurationRequest) returns (DeleteConfigurationResponse);
  rpc PreviewRouting(PreviewRoutingRequest) returns (PreviewRoutingResponse);
}

// Owner and paired-client responses use their own durable acceptance boundary.
service InteractionService {
  rpc RespondQuestion(RespondQuestionRequest) returns (RespondQuestionResponse);
  rpc RespondApproval(RespondApprovalRequest) returns (RespondApprovalResponse);
}
message RespondQuestionRequest {
  // The request ID also identifies the accepted response; the entity ID and
  // revision refer to the original question interaction.
  Mutation mutation = 1;
  // Strict non-secret question-answer document, never an approval decision.
  bytes response_json = 2;
}
message RespondQuestionResponse {
  Resource interaction = 1;
  string request_id = 2;
  bool replayed = 3;
}

message RespondApprovalRequest {
  // The request ID also identifies the accepted response; the entity ID and
  // revision refer to the original approval interaction.
  Mutation mutation = 1;
  // Strict original approval decision or permission-grant document, never a question answer.
  bytes response_json = 2;
}
message RespondApprovalResponse {
  Resource interaction = 1;
  string request_id = 2;
  bool replayed = 3;
}

enum EntityKind {
  ENTITY_KIND_UNSPECIFIED = 0;
  ENTITY_KIND_PROJECT = 1;
  ENTITY_KIND_REPOSITORY = 2;
  ENTITY_KIND_AGENT = 3;
  ENTITY_KIND_ACCOUNT = 4;
  ENTITY_KIND_PROVIDER = 5;
  ENTITY_KIND_MODEL = 6;
  ENTITY_KIND_MACHINE = 7;
  ENTITY_KIND_SESSION = 8;
  ENTITY_KIND_TEMPLATE = 9;
  ENTITY_KIND_SETTINGS = 10;
  ENTITY_KIND_SCHEDULE = 11;
  ENTITY_KIND_OCCURRENCE = 12;
  ENTITY_KIND_MESSAGE = 13;
  ENTITY_KIND_QUEUE = 14;
  ENTITY_KIND_INTERACTION = 15;
  ENTITY_KIND_REVIEW = 16;
  ENTITY_KIND_SNAPSHOT = 17;
  ENTITY_KIND_DEVICE = 18;
  ENTITY_KIND_INTEGRATION = 19;
  ENTITY_KIND_PULL_REQUEST = 20;
  ENTITY_KIND_PROBLEM = 21;
  ENTITY_KIND_INBOX = 22;
  ENTITY_KIND_USAGE = 23;
  ENTITY_KIND_JOB = 24;
  ENTITY_KIND_PAIRING = 25;
  ENTITY_KIND_STEER = 26;
}

// Resource documents are versioned, strictly validated UTF-8 JSON. Their closed
// schemas live in the Go domain types. Unknown fields and enum values fail.
// This envelope never permits arbitrary database writes: each mutation kind
// passes its product validator, relationship checks, and authorization rules.
message Resource {
  string id = 1;
  EntityKind kind = 2;
  uint64 revision = 3;
  string session_id = 4;
  string project_id = 5;
  uint32 schema_version = 6;
  bytes document_json = 7;
  string created_at = 8;
  string updated_at = 9;
}
message Mutation {
  string request_id = 1;
  string id = 2;
  uint64 expected_revision = 3;
}
message Filter {
  EntityKind kind = 1;
  string session_id = 2;
  string project_id = 3;
  uint32 page_size = 4;
  string page_token = 5;
}
message ErrorDetail {
  string code = 1;
  string guidance = 2;
  string cause = 3;
  string correlation_id = 4;
}
message GetStatusRequest {}
message GetOverviewRequest {}
message GetOverviewResponse {
  string observed_at = 1;
  uint64 active_sessions = 2;
  uint64 pending_interactions = 3;
  uint64 registered_workers = 4;
  uint64 connected_workers = 5;
  int64 today_from_unix_ms = 6;
  int64 today_until_unix_ms = 7;
}
message GetStatusResponse {
  string version = 1;
  uint32 protocol_version = 2;
  uint32 schema_version = 3;
  string server_id = 4;
  string listener = 5;
  string started_at = 6;
  bool stopping = 7;
  repeated SystemCapability capabilities = 8;
}
enum SystemCapability {
  SYSTEM_CAPABILITY_UNSPECIFIED = 0;
  // Session creation can opt into server-owned, Worker-executed automatic titles.
  SYSTEM_CAPABILITY_AUTOMATIC_TITLES_V1 = 1;
  SYSTEM_CAPABILITY_REQUEST_DIAGNOSTICS_V1 = 2;
}
message StopServerRequest {
  string request_id = 1;
}
message StopServerResponse {
  string request_id = 1;
}
message GetDoctorRequest {}
message GetDoctorResponse {
  bytes report_json = 1;
}
message CreateBackupRequest {
  string request_id = 1;
}
message CreateBackupResponse {
  string id = 1;
  string request_id = 2;
  bool replayed = 3;
}
message GetResourceRequest {
  EntityKind kind = 1;
  string id = 2;
}
message GetResourceResponse {
  Resource resource = 1;
}
message ListResourcesRequest {
  Filter filter = 1;
  // Provider and account-type filters apply only to paginated resource lists.
  // Snapshots and event streams intentionally retain their existing scope.
  string provider_id = 2;
  AccountTypeFilter account_type = 3;
}

enum AccountTypeFilter {
  ACCOUNT_TYPE_FILTER_UNSPECIFIED = 0;
  ACCOUNT_TYPE_FILTER_API = 1;
  ACCOUNT_TYPE_FILTER_SUBSCRIPTION = 2;
}
message ListResourcesResponse {
  repeated Resource resources = 1;
  string next_page_token = 2;
}
message GetSnapshotRequest {
  Filter filter = 1;
}
message GetSnapshotResponse {
  repeated Resource resources = 1;
  string cursor = 2;
}
message WatchEventsRequest {
  string cursor = 1;
  string session_id = 2;
}
enum EventAction {
  EVENT_ACTION_UNSPECIFIED = 0;
  EVENT_ACTION_CREATED = 1;
  EVENT_ACTION_UPDATED = 2;
  EVENT_ACTION_DELETED = 3;
}
message WatchEventsResponse {
  string cursor = 1;
  string id = 2;
  string entity_id = 3;
  EntityKind kind = 4;
  string session_id = 5;
  uint64 revision = 6;
  EventAction action = 7;
  string time = 8;
}
message SaveConfigurationRequest {
  Mutation mutation = 1;
  EntityKind kind = 2;
  uint32 schema_version = 3;
  bytes document_json = 4;
}
message SaveConfigurationResponse {
  Resource resource = 1;
  string request_id = 2;
  bool replayed = 3;
  // Accepted asynchronous configuration validation. Inspect this job until done.
  Resource job = 4;
}
message DeleteConfigurationRequest {
  Mutation mutation = 1;
  EntityKind kind = 2;
}
message DeleteConfigurationResponse {
  string id = 1;
  string request_id = 2;
  bool replayed = 3;
}
message PreviewRoutingRequest {
  string agent_id = 1;
  string project_id = 2;
}
message PreviewRoutingResponse {
  bytes route_json = 1;
}

service DeviceService {
  rpc CreatePairing(CreatePairingRequest) returns (CreatePairingResponse);
  rpc PairDevice(PairDeviceRequest) returns (PairDeviceResponse);
  rpc RevokeDevice(RevokeDeviceRequest) returns (RevokeDeviceResponse);
}
service WorkerService {
  rpc WatchWorkspaceReads(WatchWorkspaceReadsRequest) returns (stream WatchWorkspaceReadsResponse);
  rpc ReportWorkspaceRead(ReportWorkspaceReadRequest) returns (ReportWorkspaceReadResponse);
  rpc AttachWorker(AttachWorkerRequest) returns (AttachWorkerResponse);
  rpc WatchWork(WatchWorkRequest) returns (stream WatchWorkResponse);
  // An independent lane. Older Workers remain primary-only.
  rpc WatchAuxiliaryWork(WatchAuxiliaryWorkRequest) returns (stream WatchAuxiliaryWorkResponse);
  rpc ReportWork(ReportWorkRequest) returns (ReportWorkResponse);
  rpc InspectRepository(InspectRepositoryRequest) returns (InspectRepositoryResponse);
  rpc DiscoverHarnesses(DiscoverHarnessesRequest) returns (DiscoverHarnessesResponse);
  rpc RegisterExecution(RegisterExecutionRequest) returns (RegisterExecutionResponse);
  rpc PublishExecution(PublishExecutionRequest) returns (PublishExecutionResponse);
  rpc ClaimQuestionResponse(ClaimQuestionResponseRequest) returns (ClaimQuestionResponseResponse);
  rpc ClaimApprovalResponse(ClaimApprovalResponseRequest) returns (ClaimApprovalResponseResponse);
  rpc ClaimSteerInput(ClaimSteerInputRequest) returns (ClaimSteerInputResponse);
}
message ClaimSteerInputRequest {
  Mutation mutation = 1;
  string machine_id = 2;
  string instance_id = 3;
  string job_id = 4;
}
message ClaimSteerInputResponse {
  Resource steer = 1;
  Resource input = 2;
  bool replayed = 3;
}
message ClaimQuestionResponseRequest {
  // Exact original interaction revision and durable Worker claim request ID.
  Mutation mutation = 1;
  string machine_id = 2;
  string instance_id = 3;
  string job_id = 4;
  string response_id = 5;
}
message ClaimQuestionResponseResponse {
  // Only the owning live Worker receives the retained non-secret response.
  Resource interaction = 1;
  bool replayed = 2;
}
message ClaimApprovalResponseRequest {
  // Exact original interaction revision and durable Worker claim request ID.
  Mutation mutation = 1;
  string machine_id = 2;
  string instance_id = 3;
  string job_id = 4;
  string response_id = 5;
}
message ClaimApprovalResponseResponse {
  // Only the owning live Worker receives the retained non-secret response.
  Resource interaction = 1;
  bool replayed = 2;
}
message PublishExecutionRequest {
  // Immutable claimed job/revision, with a durable event request identity.
  Mutation mutation = 1;
  string machine_id = 2;
  string instance_id = 3;
  // Closed normalized event, never a raw native extension or credential.
  bytes event_json = 4;
}
message PublishExecutionResponse {
  uint64 acknowledged_sequence = 1;
  bool replayed = 2;
}
message RegisterExecutionRequest {
  // Exact claimed execution job/revision and durable registration request ID.
  Mutation mutation = 1;
  string machine_id = 2;
  string instance_id = 3;
  // SHA-256 of the Worker-generated private execution token, never its value.
  bytes credential_digest = 4;
}
message RegisterExecutionResponse {
  // Fixed relative path on the already-paired authenticated server origin.
  string proxy_path = 1;
  bool replayed = 2;
}
enum DeviceType {
  DEVICE_TYPE_UNSPECIFIED = 0;
  DEVICE_TYPE_CLIENT = 1;
  DEVICE_TYPE_WORKER = 2;
}
message CreatePairingRequest {
  string request_id = 1;
  string name = 2;
  DeviceType type = 3;
  // SHA-256 of a locally generated 256-bit one-time code. Never the code itself.
  bytes code_digest = 4;
}
message CreatePairingResponse {
  Resource pairing = 1;
  string request_id = 2;
  bool replayed = 3;
}
message PairDeviceRequest {
  string request_id = 1;
  string pairing_id = 2;
  string code = 3;
  string device_id = 4;
  bytes credential_digest = 5;
  string machine_id = 6;
  bytes machine_json = 7;
}
message PairDeviceResponse {
  Resource device = 1;
  Resource machine = 2;
  string server_id = 3;
  bool replayed = 4;
}
message RevokeDeviceRequest {
  Mutation mutation = 1;
}
message RevokeDeviceResponse {
  Resource device = 1;
  string request_id = 2;
  bool replayed = 3;
}
message AttachWorkerRequest {
  string request_id = 1;
  string machine_id = 2;
  string instance_id = 3;
  string version = 4;
  repeated WorkerCapability capabilities = 5;
}
enum WorkerCapability {
  WORKER_CAPABILITY_UNSPECIFIED = 0;
  WORKER_CAPABILITY_AUTOMATIC_TITLES_CODEX_V1 = 1;
}
message AttachWorkerResponse {
  Resource machine = 1;
  string server_id = 2;
}
message WatchWorkRequest {
  string machine_id = 1;
  string instance_id = 2;
}
message WatchAuxiliaryWorkRequest {
  string machine_id = 1;
  string instance_id = 2;
}
message WatchAuxiliaryWorkResponse {
  Resource job = 1;
  bool heartbeat = 2;
  string cancel_job_id = 3;
  bool cancel_requested = 4;
}
message WatchWorkResponse {
  Resource job = 1;
  bool heartbeat = 2;
  // Bound to the included immutable assignment; no native operation may start.
  bool cancel_requested = 3;
  // A separate control for a previously delivered assignment on this stream.
  string cancel_job_id = 4;
  // Metadata-only control for the active assignment, independent of job order.
  QuestionResponseControl question_response = 5;
  SteerInputControl steer_input = 6;
  ApprovalResponseControl approval_response = 7;
}
message SteerInputControl {
  string job_id = 1;
  string steer_id = 2;
  uint64 revision = 3;
}
message QuestionResponseControl {
  string job_id = 1;
  string interaction_id = 2;
  string response_id = 3;
  uint64 revision = 4;
}
message ApprovalResponseControl {
  string job_id = 1;
  string interaction_id = 2;
  string response_id = 3;
  uint64 revision = 4;
}
message ReportWorkRequest {
  Mutation mutation = 1;
  string machine_id = 2;
  string instance_id = 3;
  bytes output_json = 4;
  ErrorDetail problem = 5;
}
message ReportWorkResponse {
  Resource job = 1;
  bool replayed = 2;
}
message InspectRepositoryRequest {
  string request_id = 1;
  string machine_id = 2;
  string path = 3;
  string preferred_remote = 4;
}
message InspectRepositoryResponse {
  Resource job = 1;
  string request_id = 2;
  bool replayed = 3;
}
message DiscoverHarnessesRequest {
  // Machine identity and optimistic revision, plus durable request identity.
  Mutation mutation = 1;
  // Omit to refresh existing selections. Otherwise replace all selections with
  // the closed ExecutableSelections document; omitted harnesses use Worker PATH.
  bytes selections_json = 2;
  // Validate the installed native protocol without login, inference, or sessions.
  bool verify_protocol = 3;
}
message DiscoverHarnessesResponse {
  Resource machine = 1;
  Resource job = 2;
  string request_id = 3;
  bool replayed = 4;
}

// Write-only account credentials. Workers cannot invoke this owner/client API.
service AccountService {
  rpc ConnectAccount(ConnectAccountRequest) returns (ConnectAccountResponse);
  rpc DisconnectAccount(DisconnectAccountRequest) returns (DisconnectAccountResponse);
  rpc GetAccountStatus(GetAccountStatusRequest) returns (GetAccountStatusResponse);
  rpc ValidateAccount(ValidateAccountRequest) returns (ValidateAccountResponse);
}
message ConnectAccountRequest {
  Mutation mutation = 1;
  // Bounded credential bytes, never included in receipts or ordinary output.
  bytes api_key = 2;
  // Explicit selection for a provider configured with keyless local authentication.
  bool keyless = 3;
}
message ConnectAccountResponse {
  Resource account = 1;
  string request_id = 2;
  bool replayed = 3;
}
message DisconnectAccountRequest {
  Mutation mutation = 1;
}
message DisconnectAccountResponse {
  Resource account = 1;
  string request_id = 2;
  bool replayed = 3;
  // Accepted disconnection remains authoritative if native cleanup needs retry.
  // Closed domain.Error JSON; never raw OS/provider text or credential material.
  bytes cleanup_problem_json = 4;
}
message GetAccountStatusRequest {
  string id = 1;
}
message GetAccountStatusResponse {
  Resource account = 1;
}
message ValidateAccountRequest {
  Mutation mutation = 1;
}
message ValidateAccountResponse {
  Resource account = 1;
  string request_id = 2;
  bool replayed = 3;
  // Accepted, sanitized non-inference observation. Does not expose model payloads
  // or credentials and is not inference, quota recovery or harness capability.
  bytes validation_json = 4;
}

// Server-owned read-only integration profiles are separate from AI Accounts.
service IntegrationService {
  rpc SaveIntegrationProfile(SaveIntegrationProfileRequest) returns (SaveIntegrationProfileResponse);
  rpc ReplaceIntegrationToken(ReplaceIntegrationTokenRequest) returns (ReplaceIntegrationTokenResponse);
  rpc ValidateIntegrationProfile(ValidateIntegrationProfileRequest) returns (ValidateIntegrationProfileResponse);
  rpc DeleteIntegrationProfile(DeleteIntegrationProfileRequest) returns (DeleteIntegrationProfileResponse);
  rpc InspectRepositoryIntegration(InspectRepositoryIntegrationRequest) returns (InspectRepositoryIntegrationResponse);
  rpc QueryRepositoryIntegration(QueryRepositoryIntegrationRequest) returns (QueryRepositoryIntegrationResponse);
  rpc GetGitHubTokenForm(GetGitHubTokenFormRequest) returns (GetGitHubTokenFormResponse);
  rpc RefreshPullRequestProblems(RefreshPullRequestProblemsRequest) returns (RefreshPullRequestProblemsResponse);
  rpc ListPullRequestProblems(ListPullRequestProblemsRequest) returns (ListPullRequestProblemsResponse);
  rpc DismissPullRequestProblem(DismissPullRequestProblemRequest) returns (DismissPullRequestProblemResponse);
  rpc ListPullRequestRemediationAttempts(ListPullRequestRemediationAttemptsRequest) returns (ListPullRequestRemediationAttemptsResponse);
  rpc ResumePullRequestRemediation(ResumePullRequestRemediationRequest) returns (ResumePullRequestRemediationResponse);
}
message RefreshPullRequestProblemsRequest {
  string request_id = 1;
  string repository_id = 2;
  string number = 3;
  // Unspecified preserves the original published-feedback collection.
  PullRequestProblemCollectionKind kind = 4;
}
enum PullRequestProblemCollectionKind {
  PULL_REQUEST_PROBLEM_COLLECTION_KIND_UNSPECIFIED = 0;
  PULL_REQUEST_PROBLEM_COLLECTION_KIND_FEEDBACK = 1;
  PULL_REQUEST_PROBLEM_COLLECTION_KIND_CI = 2;
  PULL_REQUEST_PROBLEM_COLLECTION_KIND_CONFLICT = 3;
}
message RefreshPullRequestProblemsResponse {
  Resource problem_set = 1;
  string request_id = 2;
  bool replayed = 3;
}
message ListPullRequestProblemsRequest {
  // Stable GitHub numeric identities, independent of local repository aliases.
  string remote_repository_id = 1;
  string pull_request_id = 2;
  uint32 page_size = 3;
  string page_token = 4;
}
message ListPullRequestProblemsResponse {
  // Absent when this remote PR has no retained inventory.
  Resource problem_set = 1;
  repeated Resource problems = 2;
  string next_page_token = 3;
}
message DismissPullRequestProblemRequest {
  Mutation mutation = 1;
  string content_version = 2;
}
message DismissPullRequestProblemResponse {
  Resource problem = 1;
  string request_id = 2;
  bool replayed = 3;
}
message ListPullRequestRemediationAttemptsRequest {
  string remote_repository_id = 1;
  string pull_request_id = 2;
  uint32 page_size = 3;
  string page_token = 4;
}
message ListPullRequestRemediationAttemptsResponse {
  Resource problem_set = 1;
  repeated Resource attempts = 2;
  string next_page_token = 3;
}
message ResumePullRequestRemediationRequest {
  // The original retained PR set, never a session or queued input.
  Mutation mutation = 1;
}
message ResumePullRequestRemediationResponse {
  Resource problem_set = 1;
  string request_id = 2;
  bool replayed = 3;
}
enum GitHubTokenAccess {
  GIT_HUB_TOKEN_ACCESS_UNSPECIFIED = 0;
  GIT_HUB_TOKEN_ACCESS_SELECTED_REPOSITORIES = 1;
  GIT_HUB_TOKEN_ACCESS_PUBLIC_REPOSITORIES = 2;
  GIT_HUB_TOKEN_ACCESS_PRIVATE_REPOSITORIES = 3;
}
message GetGitHubTokenFormRequest {
  string profile_id = 1;
  uint64 expected_revision = 2;
  GitHubTokenAccess access = 3;
}
message GetGitHubTokenFormResponse {
  uint32 schema_version = 1;
  // Non-secret official form configuration, never a token or access grant.
  bytes document_json = 2;
}
message SaveIntegrationProfileRequest {
  Mutation mutation = 1;
  uint32 schema_version = 2;
  // Closed editable definition only; no connection, identity or credential fields.
  bytes document_json = 3;
}
message SaveIntegrationProfileResponse {
  Resource profile = 1;
  string request_id = 2;
  bool replayed = 3;
}
message ReplaceIntegrationTokenRequest {
  Mutation mutation = 1;
  // Write-only bounded PAT bytes. Never retained in a receipt or response.
  bytes token = 2;
}
message ReplaceIntegrationTokenResponse {
  Resource profile = 1;
  string request_id = 2;
  bool replayed = 3;
  // A committed change can require native cleanup or validation retry.
  bytes problem_json = 4;
}
message ValidateIntegrationProfileRequest {
  Mutation mutation = 1;
}
message ValidateIntegrationProfileResponse {
  Resource profile = 1;
  string request_id = 2;
  bool replayed = 3;
  bytes problem_json = 4;
}
message DeleteIntegrationProfileRequest {
  Mutation mutation = 1;
}
message DeleteIntegrationProfileResponse {
  // Present only while native deletion remains pending.
  Resource profile = 1;
  string request_id = 2;
  bool replayed = 3;
  bool deleted = 4;
  bytes problem_json = 5;
}

message InspectRepositoryIntegrationRequest {
  // Selects the repository's explicitly configured profile, never a fallback.
  string repository_id = 1;
}
message InspectRepositoryIntegrationResponse {
  uint32 schema_version = 1;
  // Fresh scoped endpoint-access observations, not persistent authorization.
  bytes document_json = 2;
}

message QueryRepositoryIntegrationRequest {
  string repository_id = 1;
  uint32 schema_version = 2;
  // Strict read-only query; repository/profile authority comes from server state.
  bytes query_json = 3;
}
message QueryRepositoryIntegrationResponse {
  uint32 schema_version = 1;
  bytes document_json = 2;
}

service ProviderService {
  rpc ListProviderPresets(ListProviderPresetsRequest) returns (ListProviderPresetsResponse);
  rpc ListProviderInventory(ListProviderInventoryRequest) returns (ListProviderInventoryResponse);
  rpc DiscoverModels(DiscoverModelsRequest) returns (DiscoverModelsResponse);
  rpc SearchModels(SearchModelsRequest) returns (SearchModelsResponse);
  rpc ResolveModel(ResolveModelRequest) returns (ResolveModelResponse);
}
enum ProviderPresetId {
  PROVIDER_PRESET_ID_UNSPECIFIED = 0;
  PROVIDER_PRESET_ID_VERCEL_AI_GATEWAY = 1;
  PROVIDER_PRESET_ID_OPENROUTER = 2;
  PROVIDER_PRESET_ID_OPENAI = 3;
  PROVIDER_PRESET_ID_ANTHROPIC = 4;
  PROVIDER_PRESET_ID_XAI = 5;
  PROVIDER_PRESET_ID_DEEPSEEK = 6;
  PROVIDER_PRESET_ID_OLLAMA = 7;
  PROVIDER_PRESET_ID_LM_STUDIO = 8;
  PROVIDER_PRESET_ID_VLLM = 9;
}
enum ProviderInventoryCapability {
  PROVIDER_INVENTORY_CAPABILITY_UNSPECIFIED = 0;
  PROVIDER_INVENTORY_CAPABILITY_PROVIDER_ACTIVATION = 1;
  PROVIDER_INVENTORY_CAPABILITY_ACTIVE_API_MODEL_FILTER = 2;
  PROVIDER_INVENTORY_CAPABILITY_ACCOUNT_PROVIDER_FILTER = 3;
  PROVIDER_INVENTORY_CAPABILITY_ACCOUNT_TYPE_FILTER = 4;
}
message ListProviderInventoryRequest {
  string query = 1;
  bool enabled_only = 2;
  uint32 page_size = 3;
  string page_token = 4;
}
message ProviderInventoryEntry {
  ProviderPresetId preset_id = 1;
  // Present only for an already-saved provider.
  string provider_id = 2;
  string display_name = 3;
  bool enabled = 4;
  uint64 total_accounts = 5;
  uint64 connected_accounts = 6;
  Resource provider = 7;
  bool account_counts_available = 8;
}
message ListProviderInventoryResponse {
  repeated ProviderInventoryEntry entries = 1;
  string next_page_token = 2;
  repeated ProviderInventoryCapability capabilities = 3;
}
message ListProviderPresetsRequest {}
message ListProviderPresetsResponse {
  bytes presets_json = 1;
}
message DiscoverModelsRequest {
  // Explicit account identity/current revision; the provider is server-owned.
  Mutation mutation = 1;
}
message DiscoverModelsResponse {
  Resource account = 1;
  string request_id = 2;
  bool replayed = 3;
  bytes observation_json = 4;
}
message SearchModelsRequest {
  string query = 1;
  string provider_id = 2;
  bool include_hidden = 3;
  uint32 page_size = 4;
  string page_token = 5;
  // Filters before SQL pagination; false preserves the historical broad search.
  bool enabled_providers_only = 6;
}
message SearchModelsResponse {
  repeated Resource models = 1;
  repeated Resource providers = 2;
  string next_page_token = 3;
}
message ResolveModelRequest {
  string selector = 1;
  string provider_id = 2;
}
message ResolveModelResponse {
  Resource model = 1;
}

// Owner/client session acceptance and ordered input. Native execution and
// interactions are separately capability-checked; acceptance is not dispatch.
service SessionService {
  rpc ListRequestDiagnostics(ListRequestDiagnosticsRequest) returns (ListRequestDiagnosticsResponse);
  rpc LinkSessionPullRequest(LinkSessionPullRequestRequest) returns (LinkSessionPullRequestResponse);
  rpc UnlinkSessionPullRequest(UnlinkSessionPullRequestRequest) returns (UnlinkSessionPullRequestResponse);
  rpc ReadSessionReviewContext(ReadSessionReviewContextRequest) returns (ReadSessionReviewContextResponse);
  rpc ReadSessionWorkspace(ReadSessionWorkspaceRequest) returns (ReadSessionWorkspaceResponse);
  rpc GetSessionBudget(GetSessionBudgetRequest) returns (GetSessionBudgetResponse);
  rpc SetSessionBudget(SetSessionBudgetRequest) returns (SetSessionBudgetResponse);
  rpc SteerQueuedInput(SteerQueuedInputRequest) returns (SteerQueuedInputResponse);
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc EnqueueInput(EnqueueInputRequest) returns (EnqueueInputResponse);
  rpc EditQueuedInput(EditQueuedInputRequest) returns (EditQueuedInputResponse);
  rpc RemoveQueuedInput(RemoveQueuedInputRequest) returns (RemoveQueuedInputResponse);
  rpc ListQueue(ListQueueRequest) returns (ListQueueResponse);
  rpc ControlSession(ControlSessionRequest) returns (ControlSessionResponse);
  rpc RenameSession(RenameSessionRequest) returns (RenameSessionResponse);
  rpc PrepareSessionWorkspace(PrepareSessionWorkspaceRequest) returns (PrepareSessionWorkspaceResponse);
  rpc RecoverSessionExecution(RecoverSessionExecutionRequest) returns (RecoverSessionExecutionResponse);
  rpc RecoverSessionWorkspace(RecoverSessionWorkspaceRequest) returns (RecoverSessionWorkspaceResponse);
  rpc CreateLocalReviewComment(CreateLocalReviewCommentRequest) returns (CreateLocalReviewCommentResponse);
  rpc EditLocalReviewComment(EditLocalReviewCommentRequest) returns (EditLocalReviewCommentResponse);
  rpc DeleteLocalReviewComment(DeleteLocalReviewCommentRequest) returns (DeleteLocalReviewCommentResponse);
  rpc SubmitLocalReview(SubmitLocalReviewRequest) returns (SubmitLocalReviewResponse);
}
message LinkSessionPullRequestRequest {
  string request_id = 1;
  string session_id = 2;
  string repository_id = 3;
  // Canonical decimal PR number. Stable provider identities are server-observed.
  string number = 4;
}
message LinkSessionPullRequestResponse {
  Resource association = 1;
  string request_id = 2;
  bool replayed = 3;
}
message UnlinkSessionPullRequestRequest {
  Mutation mutation = 1;
  string session_id = 2;
}
message UnlinkSessionPullRequestResponse {
  string id = 1;
  string request_id = 2;
  bool replayed = 3;
}
message ReadSessionReviewContextRequest {
  string session_id = 1;
  // Closed git-diff workspace query; only the owning Worker supplies bytes.
  bytes query_json = 2;
}
message ReadSessionReviewContextResponse {
  // Exact diff observation and validated ordinary Git file/line coordinates.
  // Non-line changes expose file anchors only. No submission authority.
  bytes document_json = 1;
}
message SteerQueuedInputRequest {
  // Exact queue record revision; request_id also identifies the Steer attempt.
  Mutation mutation = 1;
  string session_id = 2;
  string expected_execution_id = 3;
  string expected_turn_id = 4;
}
message SteerQueuedInputResponse {
  Resource steer = 1;
  SessionChange change = 2;
  string request_id = 3;
  bool replayed = 4;
}
message SessionChange {
  Resource session = 1;
  Resource input = 2;
  string request_id = 3;
  bool replayed = 4;
  Resource workspace_job = 5;
  Resource recovery_job = 6;
  Resource execution_job = 7;
  Resource execution_recovery_job = 8;
}
message CreateSessionRequest {
  string request_id = 1;
  // Closed domain.CreateSession schema, including exactly one Agent Worker.
  bytes document_json = 2;
  // Additional paired Worker credential loaded locally for explicit Local creation.
  // Authentication input only: never retain in resources, jobs, receipts or logs.
  string local_worker_token = 3;
}
message CreateSessionResponse {
  SessionChange change = 1;
}
message ListSessionsRequest {
  string project_id = 1;
  bool include_archived = 2;
  uint32 page_size = 3;
  string page_token = 4;
}
message ListSessionsResponse {
  repeated Resource sessions = 1;
  string next_page_token = 2;
}
message EnqueueInputRequest {
  string request_id = 1;
  string session_id = 2;
  // Closed domain.SessionInput schema. Mode is immutable after acceptance.
  bytes document_json = 3;
}
message EnqueueInputResponse {
  SessionChange change = 1;
}
message EditQueuedInputRequest {
  Mutation mutation = 1;
  string session_id = 2;
  string prompt = 3;
}
message EditQueuedInputResponse {
  SessionChange change = 1;
}
message RemoveQueuedInputRequest {
  Mutation mutation = 1;
  string session_id = 2;
}
message RemoveQueuedInputResponse {
  SessionChange change = 1;
}
message ListQueueRequest {
  string session_id = 1;
  uint32 page_size = 2;
  string page_token = 3;
}
message ListQueueResponse {
  repeated Resource inputs = 1;
  string next_page_token = 2;
}
enum SessionAction {
  SESSION_ACTION_UNSPECIFIED = 0;
  SESSION_ACTION_STOP = 1;
  SESSION_ACTION_ARCHIVE = 2;
  SESSION_ACTION_RESTORE = 3;
  SESSION_ACTION_RESUME = 4;
}
message ControlSessionRequest {
  Mutation mutation = 1;
  SessionAction action = 2;
}
message ControlSessionResponse {
  SessionChange change = 1;
}
message RenameSessionRequest {
  Mutation mutation = 1;
  string name = 2;
}
message RenameSessionResponse {
  SessionChange change = 1;
}
message PrepareSessionWorkspaceRequest {
  Mutation mutation = 1;
}
message PrepareSessionWorkspaceResponse {
  SessionChange change = 1;
}

message RecoverSessionWorkspaceRequest {
  Mutation mutation = 1;
  // Explicitly permits rollback of an incomplete preparation, never a ready workspace.
  bool cleanup = 2;
}
message RecoverSessionWorkspaceResponse {
  SessionChange change = 1;
}

// Inbox read state belongs to the server owner and is shared by paired clients.
service InboxService {
  rpc GetInboxEntry(GetInboxEntryRequest) returns (GetInboxEntryResponse);
  rpc ListInbox(ListInboxRequest) returns (ListInboxResponse);
  rpc SetInboxReadState(SetInboxReadStateRequest) returns (SetInboxReadStateResponse);
  rpc GetNotificationPreferences(GetNotificationPreferencesRequest) returns (GetNotificationPreferencesResponse);
  rpc SetNotificationPreferences(SetNotificationPreferencesRequest) returns (SetNotificationPreferencesResponse);
  rpc ListNotificationCandidates(ListNotificationCandidatesRequest) returns (ListNotificationCandidatesResponse);
  rpc ClaimNotification(ClaimNotificationRequest) returns (ClaimNotificationResponse);
  rpc GetNotificationDelivery(GetNotificationDeliveryRequest) returns (GetNotificationDeliveryResponse);
  rpc ReportNotification(ReportNotificationRequest) returns (ReportNotificationResponse);
}
enum InboxReadState {
  INBOX_READ_STATE_UNSPECIFIED = 0;
  INBOX_READ_STATE_UNREAD = 1;
  INBOX_READ_STATE_READ = 2;
}
enum InboxSource {
  INBOX_SOURCE_UNSPECIFIED = 0;
  INBOX_SOURCE_INTERACTION = 1;
  INBOX_SOURCE_EXECUTION_TERMINAL = 2;
}
message InboxView {
  Resource entry = 1;
  Resource session = 2;
  // Present only for an interaction source; always its current original record.
  Resource interaction = 3;
}
message GetInboxEntryRequest {
  string id = 1;
}
message GetInboxEntryResponse {
  InboxView view = 1;
}
message ListInboxRequest {
  string session_id = 1;
  string project_id = 2;
  // Unspecified means all read states or all source kinds respectively.
  InboxReadState read_state = 3;
  InboxSource source = 4;
  uint32 page_size = 5;
  string page_token = 6;
}
message ListInboxResponse {
  repeated InboxView entries = 1;
  string next_page_token = 2;
}
message SetInboxReadStateRequest {
  // ID and expected revision refer only to the inbox entry.
  Mutation mutation = 1;
  InboxReadState read_state = 2;
}
message SetInboxReadStateResponse {
  InboxView view = 1;
  string request_id = 2;
  bool replayed = 3;
}

// Reconcile retained completion only; successful recovery leaves dispatch paused.
message RecoverSessionExecutionRequest {
  Mutation mutation = 1;
  string expected_execution_id = 2;
}
message RecoverSessionExecutionResponse {
  SessionChange change = 1;
}

// Owner and paired-client schedule lifecycle. Workers execute derived session
// assignments and cannot write timer state or invoke these product operations.
service ScheduleService {
  rpc SaveSchedule(SaveScheduleRequest) returns (SaveScheduleResponse);
  rpc GetSchedule(GetScheduleRequest) returns (GetScheduleResponse);
  rpc ListSchedules(ListSchedulesRequest) returns (ListSchedulesResponse);
  rpc DeleteSchedule(DeleteScheduleRequest) returns (DeleteScheduleResponse);
  rpc ControlSchedule(ControlScheduleRequest) returns (ControlScheduleResponse);
  rpc RunScheduleNow(RunScheduleNowRequest) returns (RunScheduleNowResponse);
  rpc ListScheduleOccurrences(ListScheduleOccurrencesRequest) returns (ListScheduleOccurrencesResponse);
  rpc GetScheduleOccurrence(GetScheduleOccurrenceRequest) returns (GetScheduleOccurrenceResponse);
}
enum ScheduleAction {
  SCHEDULE_ACTION_UNSPECIFIED = 0;
  SCHEDULE_ACTION_PAUSE = 1;
  SCHEDULE_ACTION_RESUME = 2;
}
message SaveScheduleRequest {
  // Expected revision zero creates a UUID-v7 identity; omit ID to allocate it.
  Mutation mutation = 1;
  // Strict ScheduleDefinition; no origin, occurrence or timer state.
  bytes definition_json = 2;
  uint32 schema_version = 3;
  // Write-only secondary authentication for new or relocated Local selection.
  // Omission on an unchanged Local machine retains its authenticated origin.
  string local_worker_token = 4;
}
message SaveScheduleResponse {
  Resource schedule = 1;
  string request_id = 2;
  bool replayed = 3;
}
message GetScheduleRequest {
  string id = 1;
}
message GetScheduleResponse {
  // Includes the authoritative enabled/next_run_at/configuration revision.
  Resource schedule = 1;
}
message ListSchedulesRequest {
  string project_id = 1;
  optional bool enabled = 2;
  uint32 page_size = 3;
  string page_token = 4;
}
message ListSchedulesResponse {
  repeated Resource schedules = 1;
  string next_page_token = 2;
}
message DeleteScheduleRequest {
  Mutation mutation = 1;
}
message DeleteScheduleResponse {
  string id = 1;
  string request_id = 2;
  bool replayed = 3;
}
message ControlScheduleRequest {
  Mutation mutation = 1;
  ScheduleAction action = 2;
}
message ControlScheduleResponse {
  Resource schedule = 1;
  string request_id = 2;
  bool replayed = 3;
}
message RunScheduleNowRequest {
  Mutation mutation = 1;
}
message RunScheduleNowResponse {
  Resource occurrence = 1;
  // Present only when this occurrence already owns a retained session.
  Resource session = 2;
  string request_id = 3;
  bool replayed = 4;
}
message ListScheduleOccurrencesRequest {
  // History is retained independently of the configuration's lifetime.
  string schedule_id = 1;
  uint32 page_size = 2;
  string page_token = 3;
}
message ListScheduleOccurrencesResponse {
  repeated Resource occurrences = 1;
  string next_page_token = 2;
}
message GetScheduleOccurrenceRequest {
  string schedule_id = 1;
  string id = 2;
}
message GetScheduleOccurrenceResponse {
  Resource occurrence = 1;
}

// Owner/paired-client reads of retained conversations, including Archive.
service SearchService {
  rpc SearchConversations(SearchConversationsRequest) returns (SearchConversationsResponse);
}
enum SearchExecutionOutcome {
  SEARCH_EXECUTION_OUTCOME_UNSPECIFIED = 0;
  SEARCH_EXECUTION_OUTCOME_NOT_STARTED = 1;
  SEARCH_EXECUTION_OUTCOME_RUNNING = 2;
  SEARCH_EXECUTION_OUTCOME_SUCCEEDED = 3;
  SEARCH_EXECUTION_OUTCOME_FAILED = 4;
  SEARCH_EXECUTION_OUTCOME_STOPPED = 5;
}
enum SearchArchiveState {
  SEARCH_ARCHIVE_STATE_UNSPECIFIED = 0;
  SEARCH_ARCHIVE_STATE_ACTIVE = 1;
  SEARCH_ARCHIVE_STATE_ARCHIVING = 2;
  SEARCH_ARCHIVE_STATE_ARCHIVED = 3;
}
message SearchConversationsRequest {
  // Literal Unicode text; no SQL, wildcard or FTS expression syntax.
  string query = 1;
  string session_id = 2;
  string project_id = 3;
  string agent_id = 4;
  // Original message execution account, not the Agent's current candidates.
  string account_id = 5;
  SearchExecutionOutcome outcome = 6;
  SearchArchiveState archive = 7;
  uint32 page_size = 8;
  string page_token = 9;
}
message ConversationSearchHit {
  Resource message = 1;
  string session_name = 2;
  string agent_id = 3;
  SearchExecutionOutcome outcome = 4;
  SearchArchiveState archive = 5;
}
message SearchConversationsResponse {
  repeated ConversationSearchHit hits = 1;
  string next_page_token = 2;
}

service ActivityService {
  rpc ListActivity(ListActivityRequest) returns (ListActivityResponse);
}
enum ActivityKind {
  ACTIVITY_KIND_UNSPECIFIED = 0;
  // Accepted dispatch is not proof that native input started.
  ACTIVITY_KIND_EXECUTION_ACCEPTED = 1;
  // Observed native outcomes do not assert process cleanup.
  ACTIVITY_KIND_EXECUTION_SUCCEEDED = 2;
  ACTIVITY_KIND_EXECUTION_FAILED = 3;
  ACTIVITY_KIND_EXECUTION_STOPPED = 4;
  ACTIVITY_KIND_SCHEDULE_CRON = 5;
  ACTIVITY_KIND_SCHEDULE_RUN_NOW = 6;
}
enum ActivityOccurrenceState {
  ACTIVITY_OCCURRENCE_STATE_UNSPECIFIED = 0;
  ACTIVITY_OCCURRENCE_STATE_WAITING = 1;
  ACTIVITY_OCCURRENCE_STATE_ACTIVE = 2;
  ACTIVITY_OCCURRENCE_STATE_SUCCEEDED = 3;
  ACTIVITY_OCCURRENCE_STATE_FAILED = 4;
  ACTIVITY_OCCURRENCE_STATE_STOPPED = 5;
  ACTIVITY_OCCURRENCE_STATE_SKIPPED = 6;
}
enum ActivityJobState {
  ACTIVITY_JOB_STATE_UNSPECIFIED = 0;
  ACTIVITY_JOB_STATE_QUEUED = 1;
  ACTIVITY_JOB_STATE_CLAIMED = 2;
  ACTIVITY_JOB_STATE_SUCCEEDED = 3;
  ACTIVITY_JOB_STATE_FAILED = 4;
  ACTIVITY_JOB_STATE_UNCERTAIN = 5;
  ACTIVITY_JOB_STATE_CANCELED = 6;
}
message ListActivityRequest {
  string session_id = 1;
  string project_id = 2;
  uint32 page_size = 3;
  string page_token = 4;
}
// Metadata only. Original source identity is also the stable activity identity.
message ActivityEntry {
  string id = 1;
  EntityKind source_kind = 2;
  uint64 source_revision = 3;
  int64 observed_at_unix_ms = 4;
  ActivityKind kind = 5;
  string session_id = 6;
  string project_id = 7;
  string execution_id = 8;
  string account_id = 9;
  string job_id = 10;
  string schedule_id = 11;
  string occurrence_id = 12;
  // Current occurrence state, distinct from its original acceptance time.
  ActivityOccurrenceState occurrence_state = 13;
  // Current dispatch/cleanup job state, including pre-native failure.
  ActivityJobState job_state = 14;
}
message ListActivityResponse {
  repeated ActivityEntry entries = 1;
  string next_page_token = 2;
}

service UsageService {
  rpc GetUsageSummary(GetUsageSummaryRequest) returns (GetUsageSummaryResponse);
  rpc GetModelPricing(GetModelPricingRequest) returns (GetModelPricingResponse);
  rpc GetPricingVersion(GetPricingVersionRequest) returns (GetPricingVersionResponse);
  rpc SetModelPricing(SetModelPricingRequest) returns (SetModelPricingResponse);
}
message GetUsageSummaryRequest {
  // Half-open server retention-time range. Zero defaults to the last 30 days.
  int64 from_unix_ms = 1;
  int64 until_unix_ms = 2;
  string session_id = 3;
  string project_id = 4;
  string account_id = 5;
  string provider_id = 6;
  string model_id = 7;
  bool general_chat = 8;
  UsageTimeGranularity granularity = 9;
  string time_zone = 10;
}
enum UsageTimeGranularity {
  USAGE_TIME_GRANULARITY_UNSPECIFIED = 0;
  USAGE_TIME_GRANULARITY_DAY = 1;
}
message UsageMeasure {
  // Empty is unavailable. "0" is measured zero. Decimal integer, never float.
  string known_total = 1;
  uint32 measured_responses = 2;
  uint32 unavailable_responses = 3;
}
message UsageTotals {
  uint32 responses = 1;
  UsageMeasure input = 2;
  UsageMeasure cached_input = 3;
  UsageMeasure cache_write_input = 4;
  UsageMeasure output = 5;
  UsageMeasure reasoning_output = 6;
  UsageMeasure total = 7;
}
message UsageAnalyticsDay {
  int64 from_unix_ms = 1;
  int64 until_unix_ms = 2;
  UsageTotals totals = 3;
}
message UsageAnalyticsModel {
  string provider_id = 1;
  string model_id = 2;
  string provider_name = 3;
  string model_name = 4;
  UsageTotals totals = 5;
}
message UsageOtherModels {
  uint32 model_count = 1;
  UsageTotals totals = 2;
}
message UsageAnalytics {
  UsageTimeGranularity granularity = 1;
  string time_zone = 2;
  repeated UsageAnalyticsDay days = 3;
  repeated UsageAnalyticsModel models = 4;
  UsageOtherModels other_models = 5;
}
message UsageGroup {
  string session_id = 1;
  // Empty means projectless General Chat; removed projects retain their UUID.
  string project_id = 2;
  string account_id = 3;
  string provider_id = 4;
  string model_id = 5;
  UsageTotals totals = 6;
  // Current display labels only; immutable IDs above remain authoritative.
  // Missing/deleted configuration leaves its label empty.
  string session_name = 7;
  string project_name = 8;
  string account_name = 9;
  string provider_name = 10;
  string model_name = 11;
  EstimateTotals estimates = 12;
}
enum UsageCoverage {
  USAGE_COVERAGE_UNSPECIFIED = 0;
  // Exact known subtotals only. Missing/legacy/child telemetry is not zero.
  USAGE_COVERAGE_OBSERVED_ROOT_RESPONSES = 1;
}
enum UsageCostState {
  USAGE_COST_STATE_UNSPECIFIED = 0;
  USAGE_COST_STATE_UNAVAILABLE = 1;
  USAGE_COST_STATE_KNOWN_SUBTOTAL = 2;
}
message GetUsageSummaryResponse {
  int64 from_unix_ms = 1;
  int64 until_unix_ms = 2;
  UsageTotals totals = 3;
  repeated UsageGroup groups = 4;
  UsageCoverage coverage = 5;
  UsageCostState actual_cost = 6;
  UsageCostState estimated_cost = 7;
  // Accepted in this time range with no exact response retained in the range.
  // This does not assert that those executions made no calls.
  uint32 accepted_executions_without_response = 8;
  EstimateTotals estimates = 9;
  repeated PricingUsage pricing = 10;
  UsageAnalytics analytics = 11;
}

// User-declared token prices only. No rate or result establishes actual spend.
enum InputPricingMode {
  INPUT_PRICING_MODE_UNSPECIFIED = 0;
  INPUT_PRICING_MODE_UNIFORM = 1;
  INPUT_PRICING_MODE_CACHED_DISCOUNT = 2;
}
message TokenPricing {
  string currency = 1;
  string source = 2;
  string as_of = 3;
  InputPricingMode input_mode = 4;
  // Decimal currency units per million tokens, at most nine fractional digits.
  // Omitted is unavailable; an explicit "0" is a zero rate.
  optional string input_per_million = 5;
  optional string cached_input_per_million = 6;
  optional string output_per_million = 7;
  repeated string exclusions = 8;
}
message PricingVersion {
  string id = 1;
  string model_id = 2;
  string provider_id = 3;
  uint64 revision = 4;
  int64 created_at_unix_ms = 5;
  TokenPricing basis = 6;
}
message GetModelPricingRequest {
  string model_id = 1;
}
message GetModelPricingResponse {
  uint64 model_revision = 2;
  // Absent means no basis has been configured for the existing model.
  PricingVersion pricing = 1;
}
message GetPricingVersionRequest {
  string id = 1;
}
message GetPricingVersionResponse {
  PricingVersion pricing = 1;
}
message SetModelPricingRequest {
  // The model ID and independent pricing revision; zero creates its first basis.
  Mutation mutation = 1;
  TokenPricing basis = 2;
  // Bind the model/provider selection read with GetModelPricing.
  uint64 expected_model_revision = 3;
}
message SetModelPricingResponse {
  // Immutable accepted basis, including on a retry after a later price change.
  PricingVersion pricing = 1;
  string request_id = 2;
  bool replayed = 3;
}

message CurrencyEstimate {
  string currency = 1;
  // Exact decimal currency units. Empty is unavailable, not zero.
  string known_amount = 2;
  uint32 complete_responses = 3;
  uint32 partial_responses = 4;
  uint32 unavailable_responses = 5;
}
message EstimateTotals {
  repeated CurrencyEstimate currencies = 1;
  uint32 unpriced_responses = 2;
}
message EstimateMeasure {
  string known_amount = 1;
  string known_tokens = 2;
  uint32 priced_responses = 3;
  uint32 missing_usage_responses = 4;
  uint32 missing_price_responses = 5;
  uint32 unsupported_breakdown_responses = 6;
  uint32 not_applicable_responses = 7;
}
message PricingUsage {
  PricingVersion pricing = 1;
  CurrencyEstimate totals = 2;
  EstimateMeasure input = 3;
  EstimateMeasure cached_input = 4;
  EstimateMeasure output = 5;
}

message EstimatedCostBudget {
  string currency = 1;
  // Exact nonnegative decimal currency amount; never a token-count budget.
  string threshold = 2;
}
enum BudgetState {
  BUDGET_STATE_UNSPECIFIED = 0;
  BUDGET_STATE_DISABLED = 1;
  // Known evidence is below the threshold or unavailable. Never verified spend.
  BUDGET_STATE_ALLOW_INCOMPLETE = 2;
  BUDGET_STATE_THRESHOLD_REACHED = 3;
}
message BudgetEvidence {
  string currency = 1;
  string known_amount = 2;
  uint64 complete_responses = 3;
  uint64 partial_responses = 4;
  uint64 unavailable_responses = 5;
}
message SessionBudgetView {
  Resource session = 1;
  EstimatedCostBudget budget = 2;
  BudgetState state = 3;
  // Entire retained session lifetime, independent of dashboard time filters.
  BudgetEvidence selected_currency = 4;
  uint64 unpriced_responses = 5;
  uint64 other_currency_responses = 6;
  UsageCoverage coverage = 7;
}
message GetSessionBudgetRequest {
  string session_id = 1;
}
message GetSessionBudgetResponse {
  SessionBudgetView view = 1;
}
message SetSessionBudgetRequest {
  Mutation mutation = 1;
  oneof change {
    EstimatedCostBudget budget = 2;
    // Must be true; omission cannot disable a budget.
    bool remove = 3;
  }
}
message SetSessionBudgetResponse {
  // Current authorized state on receipt replay; no execution is authorized.
  SessionBudgetView view = 1;
  string request_id = 2;
  bool replayed = 3;
}

// Client-local presentation preferences and deduplication are server-owned.
// These operations never mark inbox entries read or answer/execute a request.
enum NotificationKind {
  NOTIFICATION_KIND_UNSPECIFIED = 0;
  NOTIFICATION_KIND_REQUEST = 1;
  NOTIFICATION_KIND_SUCCEEDED = 2;
  NOTIFICATION_KIND_FAILED = 3;
  NOTIFICATION_KIND_STOPPED = 4;
}
enum NotificationState {
  NOTIFICATION_STATE_UNSPECIFIED = 0;
  NOTIFICATION_STATE_CLAIMED = 1;
  // Accepted by the OS interface; not proof that a person saw the notification.
  NOTIFICATION_STATE_SUBMITTED = 2;
  NOTIFICATION_STATE_DENIED = 3;
  NOTIFICATION_STATE_FAILED = 4;
  NOTIFICATION_STATE_UNCERTAIN = 5;
}
message NotificationPreferences {
  uint64 revision = 1;
  bool interactions = 2;
  bool terminals = 3;
}
message NotificationCandidate {
  string inbox_id = 1;
  string session_id = 2;
  NotificationKind kind = 3;
}
message NotificationDelivery {
  NotificationCandidate candidate = 1;
  string claim_id = 2;
  NotificationState state = 3;
}
message GetNotificationPreferencesRequest {}
message GetNotificationPreferencesResponse {
  NotificationPreferences preferences = 1;
}
message SetNotificationPreferencesRequest {
  string request_id = 1;
  // Revision belongs to the authenticated client's preferences only.
  NotificationPreferences preferences = 2;
}
message SetNotificationPreferencesResponse {
  NotificationPreferences preferences = 1;
  string request_id = 2;
  bool replayed = 3;
}
message ListNotificationCandidatesRequest {
  // Default 20; at most 50. Claimed entries leave the next batch.
  uint32 limit = 1;
}
message ListNotificationCandidatesResponse {
  repeated NotificationCandidate candidates = 1;
  bool more = 2;
}
message ClaimNotificationRequest {
  string inbox_id = 1;
  string request_id = 2;
}
message ClaimNotificationResponse {
  NotificationDelivery delivery = 1;
  // True exactly once, on fresh durable acceptance. Receipt replay never
  // grants another OS submission, including after an acknowledgment was lost.
  bool may_present = 2;
  string request_id = 3;
  bool replayed = 4;
}
message GetNotificationDeliveryRequest {
  string inbox_id = 1;
}
message GetNotificationDeliveryResponse {
  NotificationDelivery delivery = 1;
}
message ReportNotificationRequest {
  string inbox_id = 1;
  string claim_id = 2;
  string request_id = 3;
  NotificationState state = 4;
}
message ReportNotificationResponse {
  NotificationDelivery delivery = 1;
  string request_id = 2;
  bool replayed = 3;
}

// Read-only observations do not enter the durable Worker execution queue.
message ReadSessionWorkspaceRequest {
  string session_id = 1;
  bytes query_json = 2;
}
message ReadSessionWorkspaceResponse {
  bytes document_json = 1;
}
message WatchWorkspaceReadsRequest {
  string machine_id = 1;
  string instance_id = 2;
}
message WatchWorkspaceReadsResponse {
  bool heartbeat = 1;
  // Closed workspace.ReadRequest; one outstanding observation per machine.
  bytes request_json = 2;
}
message ReportWorkspaceReadRequest {
  string machine_id = 1;
  string instance_id = 2;
  string read_id = 3;
  bytes document_json = 4;
  // Code only. Worker diagnostic text never crosses this boundary.
  string problem_code = 5;
}
message ReportWorkspaceReadResponse {}

message ExportConfigurationRequest {}
message ExportConfigurationResponse {
  bytes document_json = 1;
}
message PreviewConfigurationImportRequest {
  bytes selection_json = 1;
}
message PreviewConfigurationImportResponse {
  bytes preview_json = 1;
}
message ApplyConfigurationImportRequest {
  string request_id = 1;
  bytes preview_json = 2;
}
message ApplyConfigurationImportResponse {
  string request_id = 1;
  bool replayed = 2;
  bytes result_json = 3;
}

message CreateLocalReviewCommentRequest {
  string request_id = 1;
  string session_id = 2;
  // Closed query, expected diff revision, selection and comment body.
  bytes document_json = 3;
}
message CreateLocalReviewCommentResponse {
  Resource comment = 1;
  string request_id = 2;
  bool replayed = 3;
}
message EditLocalReviewCommentRequest {
  Mutation mutation = 1;
  string session_id = 2;
  string body = 3;
}
message EditLocalReviewCommentResponse {
  Resource comment = 1;
  string request_id = 2;
  bool replayed = 3;
}
message DeleteLocalReviewCommentRequest {
  Mutation mutation = 1;
  string session_id = 2;
}
message DeleteLocalReviewCommentResponse {
  string id = 1;
  string request_id = 2;
  bool replayed = 3;
}
message SubmitLocalReviewRequest {
  string request_id = 1;
  string session_id = 2;
  // Selected exact comment revisions, mode and explicit stale selection.
  bytes document_json = 3;
}
message SubmitLocalReviewResponse {
  Resource submission = 1;
  SessionChange change = 2;
  string request_id = 3;
  bool replayed = 4;
}

// Metadata does not establish integrity or restoration eligibility.
message ManagedBackup {
  string id = 1;
  uint64 size_bytes = 2;
  string modified_at = 3;
  uint64 revision = 4;
}
message ListBackupsRequest {
  uint32 page_size = 1;
  string page_token = 2;
}
message ListBackupsResponse {
  repeated ManagedBackup backups = 1;
  string next_page_token = 2;
}
message InspectBackupRequest {
  string id = 1;
}
message InspectBackupResponse {
  ManagedBackup backup = 1;
  string sha256 = 2;
  uint32 schema_version = 3;
  string server_id = 4;
}

// Accepted deletions cannot be canceled or undone by restoring a database image.
enum BackupDeletionState {
  BACKUP_DELETION_STATE_UNSPECIFIED = 0;
  BACKUP_DELETION_STATE_PENDING = 1;
  BACKUP_DELETION_STATE_SUCCEEDED = 2;
}
message BackupDeletionJob {
  string id = 1;
  string backup_id = 2;
  uint64 revision = 3;
  BackupDeletionState state = 4;
  string accepted_at = 5;
  string finished_at = 6;
  string problem_code = 7;
  // Logical image bytes only, not reclaimed filesystem space.
  uint64 image_bytes = 8;
  // False after recovery if the original unlink could not be observed.
  bool removal_observed = 9;
}
message DeleteBackupRequest {
  string request_id = 1;
  ManagedBackup backup = 2;
  string sha256 = 3;
}
message DeleteBackupResponse {
  BackupDeletionJob job = 1;
  string request_id = 2;
  bool replayed = 3;
}
message ListBackupDeletionsRequest {
  uint32 page_size = 1;
  string page_token = 2;
}
message ListBackupDeletionsResponse {
  repeated BackupDeletionJob jobs = 1;
  string next_page_token = 2;
}

// A reserved backup identity is not proof that an image has been published.
enum BackupCreationState {
  BACKUP_CREATION_STATE_UNSPECIFIED = 0;
  BACKUP_CREATION_STATE_PENDING = 1;
  BACKUP_CREATION_STATE_SUCCEEDED = 2;
  BACKUP_CREATION_STATE_FAILED = 3;
}
message BackupCreationJob {
  string id = 1;
  string backup_id = 2;
  uint64 revision = 3;
  BackupCreationState state = 4;
  string accepted_at = 5;
  string finished_at = 6;
  string problem_code = 7;
}
message RequestBackupRequest {
  string request_id = 1;
}
message RequestBackupResponse {
  BackupCreationJob job = 1;
  string request_id = 2;
  bool replayed = 3;
}
message GetBackupCreationRequest {
  string id = 1;
}
message GetBackupCreationResponse {
  BackupCreationJob job = 1;
}
message ListBackupCreationsRequest {
  uint32 page_size = 1;
  string page_token = 2;
}
message ListBackupCreationsResponse {
  repeated BackupCreationJob jobs = 1;
  string next_page_token = 2;
}

message GetBackupDeletionRequest {
  string id = 1;
}
message GetBackupDeletionResponse {
  BackupDeletionJob job = 1;
}

// Metadata-only observations. Native inputs and proxy HTTP attempts are separate.
enum RequestDiagnosticSource {
  REQUEST_DIAGNOSTIC_SOURCE_UNSPECIFIED = 0;
  REQUEST_DIAGNOSTIC_SOURCE_NATIVE_INPUT = 1;
  REQUEST_DIAGNOSTIC_SOURCE_PROXY_HTTP = 2;
}
enum RequestDiagnosticState {
  REQUEST_DIAGNOSTIC_STATE_UNSPECIFIED = 0;
  REQUEST_DIAGNOSTIC_STATE_IN_PROGRESS = 1;
  REQUEST_DIAGNOSTIC_STATE_SUCCEEDED = 2;
  REQUEST_DIAGNOSTIC_STATE_FAILED = 3;
  REQUEST_DIAGNOSTIC_STATE_CANCELED = 4;
}
enum RequestDiagnosticOperation {
  REQUEST_DIAGNOSTIC_OPERATION_UNSPECIFIED = 0;
  REQUEST_DIAGNOSTIC_OPERATION_INPUT = 1;
  REQUEST_DIAGNOSTIC_OPERATION_CHAT = 2;
  REQUEST_DIAGNOSTIC_OPERATION_RESPONSE = 3;
  REQUEST_DIAGNOSTIC_OPERATION_COMPACT = 4;
  REQUEST_DIAGNOSTIC_OPERATION_MESSAGE = 5;
  REQUEST_DIAGNOSTIC_OPERATION_COUNT = 6;
}
message RequestDiagnostic {
  string id = 1;
  uint64 revision = 2;
  string session_id = 3;
  string execution_id = 4;
  string account_id = 5;
  string connection_id = 6;
  string provider_id = 7;
  string model_id = 8;
  RequestDiagnosticSource source = 9;
  RequestDiagnosticOperation operation = 10;
  RequestDiagnosticState state = 11;
  string purpose = 12;
  string harness = 13;
  string input_id = 14;
  string publication_request_id = 15;
  string correlation_id = 16;
  string native_request_id = 17;
  string native_response_id = 18;
  string native_thread_id = 19;
  string native_turn_id = 20;
  optional string requested_effort = 21;
  optional string requested_service_tier = 22;
  optional string effective_effort = 23;
  optional string effective_service_tier = 24;
  string observed_at = 25;
  optional string finished_at = 26;
  optional uint64 duration_ms = 27;
  optional bool http_attempted = 28;
  optional uint32 http_status = 29;
  // Closed DeliDev error code; never original diagnostic text.
  string error_code = 30;
  string provider_request_id = 31;
}
message ListRequestDiagnosticsRequest {
  string session_id = 1;
  string execution_id = 2;
  uint32 page_size = 3;
  string page_token = 4;
}
message ListRequestDiagnosticsResponse {
  repeated RequestDiagnostic records = 1;
  string next_page_token = 2;
}
