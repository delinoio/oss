syntax = "proto3";
package delidev.v1;

import "delidev/v1/common.proto";

option go_package = "github.com/delinoio/oss/protos/gen/go/delidev/v1;delidevv1";

// Inbox read state belongs to the server owner and is shared by paired clients.
service InboxService {
  rpc GetInboxEntry(GetInboxEntryRequest) returns (GetInboxEntryResponse);
  rpc ListInbox(ListInboxRequest) returns (ListInboxResponse);
  rpc SetInboxReadState(SetInboxReadStateRequest) returns (SetInboxReadStateResponse);
  rpc GetNotificationPreferences(GetNotificationPreferencesRequest) returns (GetNotificationPreferencesResponse);
  rpc SetNotificationPreferences(SetNotificationPreferencesRequest) returns (SetNotificationPreferencesResponse);
  rpc ListNotificationCandidates(ListNotificationCandidatesRequest) returns (ListNotificationCandidatesResponse);
  rpc ClaimNotification(ClaimNotificationRequest) returns (ClaimNotificationResponse);
  rpc GetNotificationDelivery(GetNotificationDeliveryRequest) returns (GetNotificationDeliveryResponse);
  rpc ReportNotification(ReportNotificationRequest) returns (ReportNotificationResponse);
}

enum InboxReadState {
  INBOX_READ_STATE_UNSPECIFIED = 0;
  INBOX_READ_STATE_UNREAD = 1;
  INBOX_READ_STATE_READ = 2;
}

enum InboxSource {
  INBOX_SOURCE_UNSPECIFIED = 0;
  INBOX_SOURCE_INTERACTION = 1;
  INBOX_SOURCE_EXECUTION_TERMINAL = 2;
  INBOX_SOURCE_SUBSCRIPTION_RECOVERY = 3;
  INBOX_SOURCE_OPERATIONAL = 4;
}

message InboxView {
  Resource entry = 1;
  Resource session = 2;
  // Present only for an interaction source; always its current original record.
  Resource interaction = 3;
  Resource account = 4;
  Resource machine = 5;
  Resource occurrence = 6;
}

message GetInboxEntryRequest {
  string id = 1;
}

message GetInboxEntryResponse {
  InboxView view = 1;
}

message ListInboxRequest {
  string session_id = 1;
  string project_id = 2;
  // Unspecified means all read states or all source kinds respectively.
  InboxReadState read_state = 3;
  InboxSource source = 4;
  uint32 page_size = 5;
  string page_token = 6;
}

message ListInboxResponse {
  repeated InboxView entries = 1;
  string next_page_token = 2;
}

message SetInboxReadStateRequest {
  // ID and expected revision refer only to the inbox entry.
  Mutation mutation = 1;
  InboxReadState read_state = 2;
}

message SetInboxReadStateResponse {
  InboxView view = 1;
  string request_id = 2;
  bool replayed = 3;
}

// Client-local presentation preferences and deduplication are server-owned.
// These operations never mark inbox entries read or answer/execute a request.
enum NotificationKind {
  NOTIFICATION_KIND_UNSPECIFIED = 0;
  NOTIFICATION_KIND_REQUEST = 1;
  NOTIFICATION_KIND_SUCCEEDED = 2;
  NOTIFICATION_KIND_FAILED = 3;
  NOTIFICATION_KIND_STOPPED = 4;
  NOTIFICATION_KIND_SUBSCRIPTION_RECOVERY = 5;
  NOTIFICATION_KIND_QUESTION = 6;
  NOTIFICATION_KIND_APPROVAL = 7;
  NOTIFICATION_KIND_WORKER_UNAVAILABLE = 8;
  NOTIFICATION_KIND_WORKER_AVAILABLE = 9;
  NOTIFICATION_KIND_QUOTA_EXHAUSTED = 10;
  NOTIFICATION_KIND_SCHEDULE_START_FAILED = 11;
  NOTIFICATION_KIND_SCHEDULE_SERVER_OFFLINE = 12;
  NOTIFICATION_KIND_SCHEDULE_WORKER_OFFLINE = 13;
}

enum NotificationState {
  NOTIFICATION_STATE_UNSPECIFIED = 0;
  NOTIFICATION_STATE_CLAIMED = 1;
  // Accepted by the OS interface; not proof that a person saw the notification.
  NOTIFICATION_STATE_SUBMITTED = 2;
  NOTIFICATION_STATE_DENIED = 3;
  NOTIFICATION_STATE_FAILED = 4;
  NOTIFICATION_STATE_UNCERTAIN = 5;
}

message NotificationPreferences {
  uint64 revision = 1;
  bool interactions = 2;
  bool terminals = 3;
  SituationNotificationPreferences situations = 4;
}

// A complete acknowledged generation; omission denotes the legacy write shape.
message SituationNotificationPreferences {
  bool questions = 1;
  bool approvals = 2;
  bool succeeded = 3;
  bool failed = 4;
  bool stopped = 5;
  bool server_lost = 6;
  bool server_restored = 7;
  bool worker_unavailable = 8;
  bool worker_available = 9;
  bool quota_exhausted = 10;
  bool schedule_start_failed = 11;
  bool schedule_offline = 12;
}

message NotificationCandidate {
  string inbox_id = 1;
  string session_id = 2;
  NotificationKind kind = 3;
  string account_id = 4;
  string machine_id = 5;
  string occurrence_id = 6;
}

message NotificationDelivery {
  NotificationCandidate candidate = 1;
  string claim_id = 2;
  NotificationState state = 3;
}

message GetNotificationPreferencesRequest {
  // Opt in to capability-58 initialization with future-only checkpoints.
  bool situations = 1;
}

message GetNotificationPreferencesResponse {
  NotificationPreferences preferences = 1;
}

message SetNotificationPreferencesRequest {
  string request_id = 1;
  // Revision belongs to the authenticated client's preferences only.
  NotificationPreferences preferences = 2;
}

message SetNotificationPreferencesResponse {
  NotificationPreferences preferences = 1;
  string request_id = 2;
  bool replayed = 3;
}

message ListNotificationCandidatesRequest {
  // Default 20; at most 50. Claimed entries leave the next batch.
  uint32 limit = 1;
}

message ListNotificationCandidatesResponse {
  repeated NotificationCandidate candidates = 1;
  bool more = 2;
}

message ClaimNotificationRequest {
  string inbox_id = 1;
  string request_id = 2;
}

message ClaimNotificationResponse {
  NotificationDelivery delivery = 1;
  // True exactly once, on fresh durable acceptance. Receipt replay never
  // grants another OS submission, including after an acknowledgment was lost.
  bool may_present = 2;
  string request_id = 3;
  bool replayed = 4;
}

message GetNotificationDeliveryRequest {
  string inbox_id = 1;
}

message GetNotificationDeliveryResponse {
  NotificationDelivery delivery = 1;
}

message ReportNotificationRequest {
  string inbox_id = 1;
  string claim_id = 2;
  string request_id = 3;
  NotificationState state = 4;
}

message ReportNotificationResponse {
  NotificationDelivery delivery = 1;
  string request_id = 2;
  bool replayed = 3;
}
