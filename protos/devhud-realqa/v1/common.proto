syntax = "proto3";

package devhud.realqa.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/delinoio/oss/protos/devhud-realqa/gen/go/devhud-realqa/v1;realqav1";

// UuidV7 carries the canonical lowercase string form of a UUID version 7.
message UuidV7 {
  string value = 1;
}

// PageRequest requests an opaque-cursor page. page_size is a server-bounded hint.
message PageRequest {
  int32 page_size = 1;
  string cursor = 2;
}

// PageResponse returns an opaque cursor, empty when there is no later page.
message PageResponse {
  string next_cursor = 1;
}

// Revision identifies a synchronized resource version and its HTTP-compatible ETag.
message Revision {
  int64 value = 1;
  string etag = 2;
}

// IdempotencyKey is a client-generated UUID v7 scoped to the authenticated caller
// and concrete operation. It must never contain credential or user content.
message IdempotencyKey {
  UuidV7 value = 1;
}

message IdempotencyResult {
  bool replayed = 1;
  IdempotentOperation operation = 2;
  google.protobuf.Timestamp originally_completed_at = 3;
}

enum IdempotentOperation {
  IDEMPOTENT_OPERATION_UNSPECIFIED = 0;
  IDEMPOTENT_OPERATION_CREATE_PRESET = 1;
  IDEMPOTENT_OPERATION_DELETE_FEATURE_DATA = 2;
  IDEMPOTENT_OPERATION_DISCONNECT_GITHUB_CONNECTION = 3;
  IDEMPOTENT_OPERATION_CREATE_SUBMISSION = 4;
  IDEMPOTENT_OPERATION_CREATE_IMAGE_UPLOAD = 5;
  IDEMPOTENT_OPERATION_FINALIZE_IMAGE_UPLOAD = 6;
  IDEMPOTENT_OPERATION_SUBMIT_ISSUE = 7;
  IDEMPOTENT_OPERATION_REBIND_SUBMISSION_STORAGE_AUTHORIZATION = 8;
  IDEMPOTENT_OPERATION_DELETE_IMAGE = 9;
  IDEMPOTENT_OPERATION_DELETE_SUBMISSION_ASSETS = 10;
}

// RealQALimit encodes the v1 hard boundaries. There is intentionally no
// screenshot-count limit: image cardinality is bounded only by byte/body limits.
enum RealQALimit {
  REAL_QA_LIMIT_UNSPECIFIED = 0;
  REAL_QA_LIMIT_PERSONAL_PRESETS = 50;
  REAL_QA_LIMIT_ORGANIZATION_PRESETS = 250;
  REAL_QA_LIMIT_DEVICE_SHORTCUTS = 20;
  REAL_QA_LIMIT_MAX_IMAGE_ENCODED_BYTES = 26214400;
  REAL_QA_LIMIT_MAX_SESSION_ENCODED_BYTES = 262144000;
  REAL_QA_LIMIT_MAX_DECODED_IMAGE_PIXELS = 100000000;
  REAL_QA_LIMIT_MAX_FINAL_BODY_UTF8_BYTES = 60000;
}

// All enums in devhud.realqa.v1 are closed application enums: servers reject
// unrecognized numeric values instead of treating them as extensibility points.
enum OwnerScopeKind {
  OWNER_SCOPE_KIND_UNSPECIFIED = 0;
  OWNER_SCOPE_KIND_PERSONAL = 1;
  OWNER_SCOPE_KIND_ORGANIZATION = 2;
}

message OwnerScope {
  OwnerScopeKind kind = 1;
  oneof owner {
    UuidV7 personal_account_id = 2;
    UuidV7 organization_id = 3;
  }
}

message BillingScope {
  UuidV7 organization_id = 1;
  UuidV7 team_id = 2;
}

enum CaptureMode {
  CAPTURE_MODE_UNSPECIFIED = 0;
  CAPTURE_MODE_REGION = 1;
  CAPTURE_MODE_WINDOW = 2;
  CAPTURE_MODE_FULL_DISPLAY = 3;
  CAPTURE_MODE_MULTI_MONITOR = 4;
  CAPTURE_MODE_CHROME_VISIBLE_VIEWPORT = 5;
}

enum SelectorMode {
  SELECTOR_MODE_UNSPECIFIED = 0;
  SELECTOR_MODE_NORMAL = 1;
  SELECTOR_MODE_DOM = 2;
}

// TrackerKind is closed to GitHub.com in v1. GHES, custom hosts, and external
// tracker/plugin registrations are not represented.
enum TrackerKind {
  TRACKER_KIND_UNSPECIFIED = 0;
  TRACKER_KIND_GITHUB_COM = 1;
}

enum SubmissionState {
  SUBMISSION_STATE_UNSPECIFIED = 0;
  SUBMISSION_STATE_DRAFT = 1;
  SUBMISSION_STATE_UPLOADING = 2;
  SUBMISSION_STATE_READY = 3;
  SUBMISSION_STATE_SUBMITTING = 4;
  SUBMISSION_STATE_RECONCILING = 5;
  SUBMISSION_STATE_SUBMITTED = 6;
  SUBMISSION_STATE_FAILED = 7;
  SUBMISSION_STATE_STORAGE_BILLING_GRACE = 8;
  SUBMISSION_STATE_ASSETS_DELETED = 9;
  SUBMISSION_STATE_DELETED = 10;
}

// StorageAuthorizationState is the submission-bound delibase grant state last
// validated by RealQA. It never makes a client-supplied state authoritative.
enum StorageAuthorizationState {
  STORAGE_AUTHORIZATION_STATE_UNSPECIFIED = 0;
  STORAGE_AUTHORIZATION_STATE_ACTIVE = 1;
  STORAGE_AUTHORIZATION_STATE_REVOKED = 2;
  STORAGE_AUTHORIZATION_STATE_ACCESS_LOST = 3;
  STORAGE_AUTHORIZATION_STATE_RESOURCE_DELETED = 4;
  STORAGE_AUTHORIZATION_STATE_OWNER_DELETED = 5;
}

// StorageRecoveryReason is the typed reason new submissions are blocked for
// the affected owner and payer while retained screenshots remain in grace.
enum StorageRecoveryReason {
  STORAGE_RECOVERY_REASON_UNSPECIFIED = 0;
  STORAGE_RECOVERY_REASON_AUTHORIZATION_REVOKED = 1;
  STORAGE_RECOVERY_REASON_AUTHORIZATION_ACCESS_LOST = 2;
  STORAGE_RECOVERY_REASON_PAYMENT_REQUIRED = 3;
  STORAGE_RECOVERY_REASON_OVERAGE_REQUIRED = 4;
  STORAGE_RECOVERY_REASON_BILLING_UNAVAILABLE = 5;
  STORAGE_RECOVERY_REASON_GITHUB_DISCONNECTED = 6;
  STORAGE_RECOVERY_REASON_SECURITY_CONFLICT = 7;
}

// StorageRecoveryAction is a closed list of recovery operations that the
// current caller may present. Payment changes happen on delibase's hosted
// billing surface; authorization replacement happens through RealQA's rebind
// RPC; revocation remains authorization-bound.
enum StorageRecoveryAction {
  STORAGE_RECOVERY_ACTION_UNSPECIFIED = 0;
  STORAGE_RECOVERY_ACTION_REBIND = 1;
  STORAGE_RECOVERY_ACTION_PAYMENT = 2;
  STORAGE_RECOVERY_ACTION_REVOKE = 3;
}

enum StorageNotificationState {
  STORAGE_NOTIFICATION_STATE_UNSPECIFIED = 0;
  STORAGE_NOTIFICATION_STATE_PENDING = 1;
  STORAGE_NOTIFICATION_STATE_NOTIFIED = 2;
}

message StorageBillingRecovery {
  StorageAuthorizationState authorization_state = 1;
  StorageRecoveryReason reason = 2;
  repeated StorageRecoveryAction actions = 3;
  StorageNotificationState notification_state = 4;
  google.protobuf.Timestamp grace_started_at = 5;
  google.protobuf.Timestamp grace_expires_at = 6;
}

enum UploadState {
  UPLOAD_STATE_UNSPECIFIED = 0;
  UPLOAD_STATE_DECLARED = 1;
  UPLOAD_STATE_PUT_AUTHORIZED = 2;
  UPLOAD_STATE_UPLOADED = 3;
  UPLOAD_STATE_VERIFYING = 4;
  UPLOAD_STATE_VERIFIED = 5;
  UPLOAD_STATE_REJECTED = 6;
  UPLOAD_STATE_EXPIRED = 7;
  UPLOAD_STATE_DELETED = 8;
}

enum FailureClass {
  FAILURE_CLASS_UNSPECIFIED = 0;
  FAILURE_CLASS_RETRYABLE = 1;
  FAILURE_CLASS_REAUTHENTICATION_REQUIRED = 2;
  FAILURE_CLASS_USER_ACTION_REQUIRED = 3;
  FAILURE_CLASS_CONFLICT = 4;
  FAILURE_CLASS_PERMANENT = 5;
}

enum AssetState {
  ASSET_STATE_UNSPECIFIED = 0;
  ASSET_STATE_PRIVATE_STAGING = 1;
  ASSET_STATE_VERIFIED_UNLINKED = 2;
  ASSET_STATE_PUBLIC_RETAINED = 3;
  ASSET_STATE_REMOVED_PLACEHOLDER = 4;
  ASSET_STATE_EXPIRED = 5;
  ASSET_STATE_DELETED = 6;
}

enum ImageMediaType {
  IMAGE_MEDIA_TYPE_UNSPECIFIED = 0;
  IMAGE_MEDIA_TYPE_PNG = 1;
  IMAGE_MEDIA_TYPE_WEBP = 2;
}

enum ErrorReason {
  ERROR_REASON_UNSPECIFIED = 0;
  ERROR_REASON_AUTHENTICATION_REQUIRED = 1;
  ERROR_REASON_REAUTHENTICATION_REQUIRED = 2;
  ERROR_REASON_PERMISSION_DENIED = 3;
  ERROR_REASON_OWNER_SCOPE_NOT_FOUND = 4;
  ERROR_REASON_STALE_REVISION = 5;
  ERROR_REASON_STALE_STORAGE_AUTHORIZATION_MAPPING = 6;
  ERROR_REASON_IDEMPOTENCY_CONFLICT = 7;
  ERROR_REASON_PRESET_LIMIT_EXCEEDED = 8;
  ERROR_REASON_DEVICE_SHORTCUT_LIMIT_EXCEEDED = 9;
  ERROR_REASON_GITHUB_DISCONNECTED = 10;
  ERROR_REASON_UNSUPPORTED_TRACKER_HOST = 11;
  ERROR_REASON_PROVIDER_PERMISSION_DENIED = 12;
  ERROR_REASON_PROVIDER_SCHEMA_INVALID = 13;
  ERROR_REASON_PROVIDER_VALIDATION_FAILED = 14;
  ERROR_REASON_FINAL_BODY_TOO_LARGE = 15;
  ERROR_REASON_IMAGE_TOO_LARGE = 16;
  ERROR_REASON_SESSION_TOO_LARGE = 17;
  ERROR_REASON_DECODED_IMAGE_TOO_LARGE = 18;
  ERROR_REASON_MALFORMED_IMAGE = 19;
  ERROR_REASON_UNSUPPORTED_IMAGE_MEDIA_TYPE = 20;
  ERROR_REASON_DECOMPRESSION_BOMB = 21;
  ERROR_REASON_UPLOAD_DEADLINE_EXCEEDED = 22;
  ERROR_REASON_UPLOAD_EXPIRED = 23;
  ERROR_REASON_UPLOAD_VERIFICATION_FAILED = 24;
  ERROR_REASON_AMBIGUOUS_PROVIDER_RESULT = 25;
  ERROR_REASON_RATE_LIMITED = 26;
  ERROR_REASON_UPLOAD_CONCURRENCY_LIMITED = 27;
  ERROR_REASON_TRANSFER_RESERVATION_FAILED = 28;
  ERROR_REASON_STORAGE_AUTHORIZATION_FAILED = 29;
  ERROR_REASON_STORAGE_AUTHORIZATION_SUBSTITUTION = 30;
  ERROR_REASON_STORAGE_AUTHORIZATION_STATUS_INVALID = 31;
  ERROR_REASON_STORAGE_REBIND_REQUIRED = 32;
  ERROR_REASON_STORAGE_BILLING_GRACE = 33;
  ERROR_REASON_ASSET_REMOVED = 34;
  ERROR_REASON_RETENTION_STATE_CONFLICT = 35;
  ERROR_REASON_PUBLIC_IMAGE_CONFIRMATION_REQUIRED = 36;
  ERROR_REASON_SUBMISSION_STATE_CONFLICT = 37;
  ERROR_REASON_DELETION_IN_PROGRESS = 38;
  ERROR_REASON_URL_INVALID = 39;
  ERROR_REASON_URL_CREDENTIALS_FORBIDDEN = 40;
  ERROR_REASON_RULE_INVALID = 41;
}

// ErrorDetail is carried as a typed Connect error detail. message is stable,
// non-sensitive user guidance and never contains credentials or provider bodies.
message ErrorDetail {
  ErrorReason reason = 1;
  FailureClass failure_class = 2;
  string message = 3;
  Revision current_revision = 4;
  google.protobuf.Timestamp retry_after = 5;
}

message GitHubRepositoryRef {
  string repository_id = 1;
  string owner = 2;
  string name = 3;
}

message TrackerDestination {
  TrackerKind tracker = 1;
  UuidV7 installation_id = 2;
  GitHubRepositoryRef repository = 3;
}

message GitHubProviderExtension {
  int64 milestone_number = 1;
  repeated string project_node_ids = 2;
}

// ProviderExtension is intentionally a source-controlled typed union rather
// than a public tracker/plugin payload.
message ProviderExtension {
  oneof provider {
    GitHubProviderExtension github = 1;
  }
}
