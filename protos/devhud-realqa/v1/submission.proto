syntax = "proto3";

package devhud.realqa.v1;

import "devhud-realqa/v1/common.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/delinoio/oss/protos/devhud-realqa/gen/go/devhud-realqa/v1;realqav1";

message ImageDeclaration {
  UuidV7 client_image_id = 1;
  ImageMediaType media_type = 2;
  int64 encoded_bytes = 3;
  int32 pixel_width = 4;
  int32 pixel_height = 5;
  string sha256 = 6;
}

message ImageAsset {
  UuidV7 asset_id = 1;
  UuidV7 client_image_id = 2;
  ImageMediaType media_type = 3;
  int64 encoded_bytes = 4;
  int32 pixel_width = 5;
  int32 pixel_height = 6;
  string sha256 = 7;
  UploadState upload_state = 8;
  AssetState asset_state = 9;
  Revision revision = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp verified_at = 12;
  google.protobuf.Timestamp removed_at = 13;
}

message ProviderIssueReference {
  TrackerKind tracker = 1;
  string issue_id = 2;
  string issue_url = 3;
}

message Submission {
  UuidV7 submission_id = 1;
  OwnerScope owner = 2;
  BillingScope billing = 3;
  UuidV7 preset_id = 4;
  Revision preset_revision = 5;
  TrackerDestination destination = 6;
  SubmissionState state = 7;
  repeated ImageAsset assets = 8;
  ProviderIssueReference provider_issue = 9;
  FailureClass failure_class = 10;
  ErrorReason failure_reason = 11;
  UuidV7 storage_authorization_id = 12;
  Revision storage_authorization_mapping_revision = 13;
  Revision revision = 14;
  google.protobuf.Timestamp upload_deadline = 15;
  google.protobuf.Timestamp transfer_reservation_expires_at = 16;
  google.protobuf.Timestamp created_at = 17;
  google.protobuf.Timestamp updated_at = 18;
  google.protobuf.Timestamp submitted_at = 19;
}

message AssetSummary {
  UuidV7 asset_id = 1;
  UploadState upload_state = 2;
  AssetState asset_state = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp removed_at = 5;
}

message SubmissionSummary {
  UuidV7 submission_id = 1;
  SubmissionState state = 2;
  repeated AssetSummary assets = 3;
  ProviderIssueReference provider_issue = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  google.protobuf.Timestamp submitted_at = 7;
}

message ListSubmissionsRequest {
  OwnerScope owner = 1;
  PageRequest page = 2;
}

message ListSubmissionsResponse {
  repeated SubmissionSummary submissions = 1;
  PageResponse page = 2;
}

message CreateSubmissionRequest {
  OwnerScope owner = 1;
  BillingScope billing = 2;
  UuidV7 preset_id = 3;
  Revision preset_revision = 4;
  TrackerDestination destination = 5;
  // Image cardinality is deliberately unbounded. The server applies the per-image,
  // aggregate encoded-byte, decoded-pixel, and final-body limits from RealQALimit.
  repeated ImageDeclaration images = 6;
  IdempotencyKey idempotency = 7;
}

message CreateSubmissionResponse {
  Submission submission = 1;
  IdempotencyResult idempotency = 2;
  google.protobuf.Timestamp transfer_reservation_expires_at = 3;
  google.protobuf.Timestamp upload_deadline = 4;
}

message CreateImageUploadRequest {
  UuidV7 submission_id = 1;
  UuidV7 asset_id = 2;
  Revision expected_asset_revision = 3;
  IdempotencyKey idempotency = 4;
}

message CreateImageUploadResponse {
  ImageAsset asset = 1;
  // signed_put_url is always an unredirected https://assets.realqa.deli.dev URL.
  // It never contains an R2 S3 endpoint and must not outlive upload_deadline.
  string signed_put_url = 2;
  string required_content_type = 3;
  string required_sha256 = 4;
  google.protobuf.Timestamp expires_at = 5;
  google.protobuf.Timestamp upload_deadline = 6;
  IdempotencyResult idempotency = 7;
}

message FinalizeImageUploadRequest {
  UuidV7 submission_id = 1;
  UuidV7 asset_id = 2;
  Revision expected_asset_revision = 3;
  IdempotencyKey idempotency = 4;
}

message FinalizeImageUploadResponse {
  ImageAsset asset = 1;
  IdempotencyResult idempotency = 2;
}

message IssueFormAnswer {
  string field_id = 1;
  repeated string values = 2;
}

message RepositoryIssueResponse {
  RepositoryIssueDefinitionRef definition = 1;
  string markdown_body = 2;
  repeated IssueFormAnswer form_answers = 3;
}

message EnvironmentField {
  string key = 1;
  string value = 2;
}

message DomSelectionMetadata {
  string css_selector = 1;
  string tag = 2;
  string role = 3;
  string accessible_name = 4;
  int32 viewport_width = 5;
  int32 viewport_height = 6;
}

message CaptureMetadata {
  repeated EnvironmentField environment = 1;
  string sanitized_url = 2;
  DomSelectionMetadata dom_selection = 3;
}

message IssueSubmission {
  string title = 1;
  RepositoryIssueResponse repository_response = 2;
  CaptureMetadata capture = 3;
  repeated UuidV7 ordered_asset_ids = 4;
  repeated string labels = 5;
  repeated string assignees = 6;
  ProviderExtension provider_extension = 7;
  // This confirmation is required for every attempt because promoted images are
  // publicly readable by anyone possessing the issue or opaque image URL.
  bool public_image_confirmation = 8;
}

message SubmitIssueRequest {
  UuidV7 submission_id = 1;
  IssueSubmission issue = 2;
  Revision expected_submission_revision = 3;
  IdempotencyKey idempotency = 4;
}

message SubmitIssueResponse {
  Submission submission = 1;
  IdempotencyResult idempotency = 2;
}

message GetSubmissionRequest {
  UuidV7 submission_id = 1;
}

message GetSubmissionResponse {
  // After provider reconciliation, submission excludes submitted title, body,
  // URL, DOM metadata, raw originals, object keys, and provider credentials.
  Submission submission = 1;
}

message RebindSubmissionStorageAuthorizationRequest {
  UuidV7 submission_id = 1;
  UuidV7 expected_authorization_id = 2;
  Revision expected_mapping_revision = 3;
  BillingScope replacement_billing = 4;
  IdempotencyKey idempotency = 5;
}

message RebindSubmissionStorageAuthorizationResponse {
  UuidV7 submission_id = 1;
  UuidV7 authorization_id = 2;
  Revision mapping_revision = 3;
  IdempotencyResult idempotency = 4;
}

message DeleteImageRequest {
  UuidV7 submission_id = 1;
  UuidV7 asset_id = 2;
  Revision expected_submission_revision = 3;
  Revision expected_asset_revision = 4;
  IdempotencyKey idempotency = 5;
}

message DeleteImageResponse {
  Submission submission = 1;
  IdempotencyResult idempotency = 2;
}

message DeleteSubmissionAssetsRequest {
  UuidV7 submission_id = 1;
  Revision expected_submission_revision = 2;
  IdempotencyKey idempotency = 3;
}

message DeleteSubmissionAssetsResponse {
  Submission submission = 1;
  IdempotencyResult idempotency = 2;
}

service RealQASubmissionService {
  rpc ListSubmissions(ListSubmissionsRequest) returns (ListSubmissionsResponse);
  rpc CreateSubmission(CreateSubmissionRequest) returns (CreateSubmissionResponse);
  rpc CreateImageUpload(CreateImageUploadRequest) returns (CreateImageUploadResponse);
  rpc FinalizeImageUpload(FinalizeImageUploadRequest) returns (FinalizeImageUploadResponse);
  rpc SubmitIssue(SubmitIssueRequest) returns (SubmitIssueResponse);
  rpc GetSubmission(GetSubmissionRequest) returns (GetSubmissionResponse);
  rpc RebindSubmissionStorageAuthorization(RebindSubmissionStorageAuthorizationRequest) returns (RebindSubmissionStorageAuthorizationResponse);
  rpc DeleteImage(DeleteImageRequest) returns (DeleteImageResponse);
  rpc DeleteSubmissionAssets(DeleteSubmissionAssetsRequest) returns (DeleteSubmissionAssetsResponse);
}
