version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
  ignore_only:
    # Component ownership uses repository paths while the wire packages follow
    # independently versioned devhud domain namespaces. Keep every other
    # STANDARD rule and scope these exceptions to the component roots.
    PACKAGE_DIRECTORY_MATCH:
      - devhud-deck/v1
      - devhud-realqa/v1
breaking:
  use:
    - FILE
  ignore_only:
    # These two symbols moved intact from preset.proto to common.proto so
    # tracker-only generated clients do not load preset service descriptors.
    # Go retains its package-level symbols, and the TypeScript package preserves
    # its prior preset subpath exports through a checked facade.
    ENUM_NO_DELETE:
      - devhud-realqa/v1/preset.proto
    MESSAGE_NO_DELETE:
      - devhud-realqa/v1/preset.proto
