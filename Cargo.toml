[workspace]
resolver = "2"
members = [
    "crates/forge-tree-doc",
    "crates/forge-pptx",
    "crates/forge-package",
    "crates/forge-document",
    "crates/forge-docx",
    "crates/forge-xlsx",
  "crates/forge-pdf",
    "crates/react-forge-node",
    "crates/delino-forge",
    "apps/devhud/src-tauri",
    "crates/devhud-native-messaging-host",
    "crates/binpm",
    "crates/cargo-mono",
    "crates/clibox",
    "crates/clibox-config",
    "crates/clibox-system",
    "crates/clibox-transform",
    "crates/clibox-wait",
    "crates/nodeup",
    "crates/pnport",
    "crates/pnport-core",
    "crates/pnport-preload",
    "crates/with-watch",
    "crates/fspy",
    "crates/fspy_shared",
    "crates/fspy_shared_unix",
    "crates/fspy_preload_unix",
    "crates/fspy_preload_windows",
    "crates/fspy_detours_sys",
    "crates/fspy_seccomp_unotify",
    "crates/fspy_client_unix",
    "crates/fspy_shm",
    "crates/fspy_nostd",
    "crates/fspy_nostd_alloc",
    "crates/fspy_ipc_str",
    "crates/materialized_artifact",
    "crates/materialized_artifact_macros",
    "crates/vt_path",
    "crates/vt_str",
    "crates/serde-feather",
    "crates/serde-feather-macros",
    "crates/rustia",
    "crates/rustia-llm",
    "crates/rustia-macros",
]

# Official Tauri plugins publish against crates.io Tauri. Redirect only their
# shared public Tauri crates to the immutable CEF-enabled revision used by
# DevHUD so one runtime type graph is compiled.
[patch.crates-io]
tauri = { git = "https://github.com/tauri-apps/tauri", rev = "4af26a3f7f8b692d62cca549bbacd93f5ce90b41" }
tauri-plugin = { git = "https://github.com/tauri-apps/tauri", rev = "4af26a3f7f8b692d62cca549bbacd93f5ce90b41" }
tauri-utils = { git = "https://github.com/tauri-apps/tauri", rev = "4af26a3f7f8b692d62cca549bbacd93f5ce90b41" }

[workspace.metadata.cargo-mono.publish.tag]
packages = ["binpm", "nodeup", "with-watch", "cargo-mono", "rustia-rs", "rustia-macros", "rustia-llm"]

# Release profile optimizations
[profile.release]
# Enable Link-Time Optimization for smaller binaries
lto = true
# Use single codegen unit for better optimization
codegen-units = 1
# Strip symbols from the binary
strip = true
# Optimize for size with good performance
opt-level = "z"

# Profile for generating debug symbols (used for Sentry upload before stripping)
[profile.release-with-debug]
inherits = "release"
# Keep debug info for symbol upload
strip = false
debug = true

[workspace.package]
authors = ["Vite+ Authors"]
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.89.0"

[workspace.lints.rust]
absolute_paths_not_starting_with_crate = "warn"
non_ascii_idents = "warn"
unit_bindings = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)', 'cfg(coverage_nightly)'] }
tail_expr_drop_order = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_unsafe = "warn"
long_running_const_eval = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# restriction
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"
# The task scheduling workflow is a single-threaded async task, so Send bounds are unnecessary.
future_not_send = "allow"

