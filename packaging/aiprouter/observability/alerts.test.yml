{
  "rule_files": ["alerts.yml"],
  "evaluation_interval": "15s",
  "tests":
    [
      {
        "interval": "15s",
        "input_series":
          [
            { "series": 'up{job="aiprouter"}', "values": "0+0x8" },
            {
              "series": 'aiprouter_database_up{job="aiprouter"}',
              "values": "0+0x8",
            },
          ],
        "alert_rule_test":
          [
            {
              "eval_time": "45s",
              "alertname": "AIPRouterHealthCheckFailed",
              "exp_alerts": [],
            },
            {
              "eval_time": "1m",
              "alertname": "AIPRouterHealthCheckFailed",
              "exp_alerts":
                [
                  {
                    "exp_labels":
                      { "job": "aiprouter", "severity": "critical" },
                    "exp_annotations":
                      {
                        "summary": "Service health check failed for one minute",
                      },
                  },
                ],
            },
            {
              "eval_time": "45s",
              "alertname": "AIPRouterDatabaseCheckFailed",
              "exp_alerts": [],
            },
            {
              "eval_time": "1m",
              "alertname": "AIPRouterDatabaseCheckFailed",
              "exp_alerts":
                [
                  {
                    "exp_labels":
                      { "job": "aiprouter", "severity": "critical" },
                    "exp_annotations":
                      {
                        "summary": "Database connectivity check failed for one minute",
                      },
                  },
                ],
            },
          ],
      },
      {
        "interval": "1m",
        "input_series":
          [
            {
              "series": 'aiprouter_cleanup_consecutive_failures{job="aiprouter"}',
              "values": "0 1 2 3 0",
            },
            {
              "series": 'aiprouter_cleanup_last_success_timestamp_seconds{job="aiprouter"}',
              "values": "0+0x16",
            },
          ],
        "alert_rule_test":
          [
            {
              "eval_time": "2m",
              "alertname": "AIPRouterCleanupFailed",
              "exp_alerts": [],
            },
            {
              "eval_time": "3m",
              "alertname": "AIPRouterCleanupFailed",
              "exp_alerts":
                [
                  {
                    "exp_labels": { "job": "aiprouter", "severity": "warning" },
                    "exp_annotations":
                      {
                        "summary": "Cleanup failed three consecutive times or has not succeeded for fifteen minutes",
                      },
                  },
                ],
            },
            {
              "eval_time": "4m",
              "alertname": "AIPRouterCleanupFailed",
              "exp_alerts": [],
            },
            {
              "eval_time": "14m",
              "alertname": "AIPRouterCleanupFailed",
              "exp_alerts": [],
            },
            {
              "eval_time": "15m",
              "alertname": "AIPRouterCleanupFailed",
              "exp_alerts":
                [
                  {
                    "exp_labels": { "job": "aiprouter", "severity": "warning" },
                    "exp_annotations":
                      {
                        "summary": "Cleanup failed three consecutive times or has not succeeded for fifteen minutes",
                      },
                  },
                ],
            },
          ],
      },
    ],
}
