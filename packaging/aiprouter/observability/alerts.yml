groups:
  - name: aiprouter
    rules:
      - alert: AIPRouterHealthCheckFailed
        expr: up{job="aiprouter"} == 0 or aiprouter_health{job="aiprouter"} == 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: Service health check failed for one minute }
      - alert: AIPRouterDatabaseCheckFailed
        expr: aiprouter_database_up{job="aiprouter"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          { summary: Database connectivity check failed for one minute }
      - alert: AIPRouterCleanupFailed
        expr: aiprouter_cleanup_consecutive_failures{job="aiprouter"} >= 3 or (time() - aiprouter_cleanup_last_success_timestamp_seconds{job="aiprouter"}) >= 900
        labels: { severity: warning }
        annotations:
          {
            summary: Cleanup failed three consecutive times or has not succeeded for fifteen minutes,
          }
