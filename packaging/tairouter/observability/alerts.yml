groups:
  - name: tairouter
    rules:
      - alert: TaiRouterHealthCheckFailed
        expr: up{job="tairouter"} == 0 or tairouter_health{job="tairouter"} == 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: Service health check failed for one minute }
      - alert: TaiRouterDatabaseCheckFailed
        expr: tairouter_database_up{job="tairouter"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          { summary: Database connectivity check failed for one minute }
      - alert: TaiRouterCleanupFailed
        expr: tairouter_cleanup_consecutive_failures{job="tairouter"} >= 3 or (time() - tairouter_cleanup_last_success_timestamp_seconds{job="tairouter"}) >= 900
        labels: { severity: warning }
        annotations:
          {
            summary: Cleanup failed three consecutive times or has not succeeded for fifteen minutes,
          }
