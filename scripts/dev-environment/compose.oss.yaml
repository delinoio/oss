services:
  postgres:
    image: postgres:15-bookworm@sha256:5d1d70e254e3c5d7d76847a9deebb18478cd518df37abf6b278d4bdb1fe5d96c
    environment:
      POSTGRES_DB: devhud
      POSTGRES_PASSWORD: devhud
      POSTGRES_USER: devhud
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - devhud-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "devhud", "-d", "devhud"]
      interval: 2s
      timeout: 2s
      retries: 30

  logto-database-init:
    image: postgres:15-bookworm@sha256:5d1d70e254e3c5d7d76847a9deebb18478cd518df37abf6b278d4bdb1fe5d96c
    command:
      - psql
      - --host=postgres
      - --username=devhud
      - --dbname=devhud
      - --set=ON_ERROR_STOP=1
      - --file=/scripts/postgres-init.sql
    environment:
      PGPASSWORD: devhud
    volumes:
      - ./postgres-init.sql:/scripts/postgres-init.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  logto-init:
    image: svhd/logto:1.41.0@sha256:7f79547e3d1fe569a3ecae757968a7cfc579687aa8164eec35113c0adc983c5b
    command: ["npm", "run", "cli", "db", "seed", "--", "--swe"]
    environment:
      DB_URL: postgres://devhud:devhud@postgres:5432/logto
    depends_on:
      logto-database-init:
        condition: service_completed_successfully
    restart: "no"

  logto:
    image: svhd/logto:1.41.0@sha256:7f79547e3d1fe569a3ecae757968a7cfc579687aa8164eec35113c0adc983c5b
    command: ["npm", "start"]
    environment:
      ADMIN_ENDPOINT: http://localhost:3002
      DB_URL: postgres://devhud:devhud@postgres:5432/logto
      ENDPOINT: http://localhost:3001
    ports:
      - "127.0.0.1:3001:3001"
      - "127.0.0.1:3002:3002"
    depends_on:
      logto-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - Promise.all([fetch('http://127.0.0.1:3001/oidc/.well-known/openid-configuration'),fetch('http://127.0.0.1:3002')]).then(r=>process.exit(r.every(x=>x.ok)?0:1)).catch(()=>process.exit(1))
      interval: 3s
      timeout: 2s
      retries: 40

volumes:
  devhud-postgres:
