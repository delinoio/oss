[package]
name = "delidev-mobile"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
links = "delidev-mobile"

[lib]
name = "delidev_mobile"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { git = "https://github.com/tauri-apps/tauri", rev = "c8c75b1f7f43e7cb1e7d773ed2f6f96fad2fe975", features = [] }
tauri-plugin = { git = "https://github.com/tauri-apps/tauri", rev = "c8c75b1f7f43e7cb1e7d773ed2f6f96fad2fe975", features = ["build"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5.8"
uuid = { version = "=1.23.0", features = ["serde", "v7"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri = { git = "https://github.com/tauri-apps/tauri", rev = "c8c75b1f7f43e7cb1e7d773ed2f6f96fad2fe975", default-features = false, features = ["tracing"] }
tauri-runtime-wry = { git = "https://github.com/tauri-apps/tauri", rev = "c8c75b1f7f43e7cb1e7d773ed2f6f96fad2fe975" }
tracing = "0.1"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
