<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DevHUD</title><link rel="stylesheet" href="popup.css"></head>
<body><main><h1>DevHUD</h1><p data-i18n="summary"></p>
<label for="pairing-nonce" data-i18n="pairingCode"></label><input id="pairing-nonce" autocomplete="off" spellcheck="false"><button id="pair" type="button" data-i18n="pair"></button>
<section aria-labelledby="origins-title"><h2 id="origins-title" data-i18n="configuredOrigins"></h2><ul id="origins"></ul></section>
<div class="actions"><button id="capture" type="button" data-i18n="capture"></button><button id="select" type="button" data-i18n="selectElement"></button></div>
<output id="status" aria-live="polite"></output></main><script type="module" src="popup.js"></script></body></html>
