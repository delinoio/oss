[[permission]]
identifier = "saved-manage"
description = "The registered local product document can manage saved private client pairings and open independently pinned server windows."
commands.allow = ["connection_context", "saved_connections", "removed_connections", "remove_connection", "retained_worker_control", "pair_connection", "retry_connection", "rename_connection", "open_connection", "show_connection_manager"]

[[permission]]
identifier = "saved-use"
description = "A trusted saved-server window can load its pinned client authority, manage only its profile's Worker on this computer, read that Worker's proof and show a local product window."
commands.allow = ["connection_context", "connect_saved", "saved_worker_proof", "saved_worker_control", "show_connection_manager"]
