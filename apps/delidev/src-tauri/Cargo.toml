[package]
name = "delidev-desktop"
version = "0.1.0"
description = "DeliDev desktop shell"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/delinoio/oss"
publish = false
default-run = "delidev-desktop"

[features]
default = []
desktop-host = ["dep:tauri-runtime-cef", "dep:cef", "dep:tauri", "dep:tauri-build", "dep:tracing", "dep:tracing-subscriber"]
custom-protocol = ["tauri?/custom-protocol"]

[dependencies]
tauri-runtime-cef = { git = "https://github.com/tauri-apps/tauri", rev = "c8c75b1f7f43e7cb1e7d773ed2f6f96fad2fe975", optional = true }
cef = { version = "=151.8.1", optional = true }
tauri = { git = "https://github.com/tauri-apps/tauri", rev = "c8c75b1f7f43e7cb1e7d773ed2f6f96fad2fe975", default-features = false, features = ["compression"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["fmt"], optional = true }

[build-dependencies]
tauri-build = { git = "https://github.com/tauri-apps/tauri", rev = "c8c75b1f7f43e7cb1e7d773ed2f6f96fad2fe975", optional = true, features = [] }

[[bin]]
name = "delidev-desktop"
path = "src/main.rs"
required-features = ["desktop-host"]
