[package]
name = "delidev-desktop"
version = "0.1.0"
description = "DeliDev native desktop infrastructure"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/delinoio/oss"
publish = false

[features]
default = []
desktop-host = ["dep:tauri", "dep:tauri-build", "dep:tracing-subscriber"]
custom-protocol = ["tauri?/custom-protocol"]

[dependencies]
base64 = "0.22.1"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
uuid = { version = "=1.23.0", features = ["serde", "v7"] }
zeroize = "=1.8.2"
tauri = { git = "https://github.com/tauri-apps/tauri", rev = "4af26a3f7f8b692d62cca549bbacd93f5ce90b41", default-features = false, features = ["wry", "compression", "x11", "common-controls-v6"], optional = true }
tracing-subscriber = { version = "0.3", features = ["fmt", "json"], optional = true }

[build-dependencies]
tauri-build = { git = "https://github.com/tauri-apps/tauri", rev = "4af26a3f7f8b692d62cca549bbacd93f5ce90b41", optional = true }

[dev-dependencies]
tempfile = "=3.25.0"

[[bin]]
name = "delidev-desktop"
path = "src/main.rs"
required-features = ["desktop-host"]
