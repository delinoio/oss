[package]
name = "delidev-desktop"
version = "0.1.0"
description = "DeliDev native desktop infrastructure"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/delinoio/oss"
publish = false
default-run = "delidev-desktop"

[features]
default = []
cli = ["dep:tauri-cli"]
desktop-host = ["dep:cef", "dep:tauri", "tauri/cef", "dep:tauri-build", "dep:tracing-subscriber", "native-notifications"]
native-notifications = ["dep:tokio", "dep:mac-usernotifications", "dep:windows", "dep:zbus", "dep:futures-lite"]
custom-protocol = ["tauri?/custom-protocol"]

[dependencies]
cef = { version = "=150.0.0", optional = true }
base64 = "0.22.1"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
uuid = { version = "=1.23.0", features = ["serde", "v7"] }
zeroize = "=1.8.2"
url = "=2.5.8"
tauri = { git = "https://github.com/tauri-apps/tauri", rev = "4af26a3f7f8b692d62cca549bbacd93f5ce90b41", default-features = false, features = ["cef", "compression", "tray-icon", "unstable"], optional = true }
tauri-cli = { git = "https://github.com/tauri-apps/tauri", rev = "4af26a3f7f8b692d62cca549bbacd93f5ce90b41", optional = true }
tracing-subscriber = { version = "0.3", features = ["fmt", "json"], optional = true }
tokio = { version = "=1.49.0", features = ["sync", "time", "rt", "macros"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
mac-usernotifications = { version = "=0.3.1", default-features = false, optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Data_Xml_Dom", "UI_Notifications", "Foundation"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"], optional = true }
futures-lite = { version = "=2.6.1", optional = true }

[build-dependencies]
tauri-build = { git = "https://github.com/tauri-apps/tauri", rev = "4af26a3f7f8b692d62cca549bbacd93f5ce90b41", optional = true }

[dev-dependencies]
tempfile = "=3.25.0"

[[bin]]
name = "delidev-desktop"
path = "src/main.rs"
required-features = ["desktop-host"]

[[bin]]
name = "delidev-tauri-cli"
path = "src/bin/delidev-tauri-cli.rs"
required-features = ["cli"]
