[package]
name = "delitools-shell"
version = "0.1.0"
description = "DeliTools desktop and mobile shell"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/delinoio/oss"
publish = false
default-run = "delitools-shell"

[features]
default = []
desktop-host = ["dep:tauri-runtime-cef", "dep:cef", "dep:tauri", "dep:tauri-build", "dep:tracing", "dep:tracing-subscriber"]
mobile-host = ["dep:tauri", "dep:tauri-build", "dep:tauri-runtime-wry", "dep:tracing", "dep:tracing-subscriber"]
custom-protocol = ["tauri?/custom-protocol"]

[dependencies]
tauri = { git = "https://github.com/tauri-apps/tauri", rev = "c8c75b1f7f43e7cb1e7d773ed2f6f96fad2fe975", default-features = false, features = ["compression"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["fmt"], optional = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-runtime-cef = { git = "https://github.com/tauri-apps/tauri", rev = "c8c75b1f7f43e7cb1e7d773ed2f6f96fad2fe975", optional = true }
cef = { version = "=151.8.1", optional = true }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-runtime-wry = { git = "https://github.com/tauri-apps/tauri", rev = "c8c75b1f7f43e7cb1e7d773ed2f6f96fad2fe975", optional = true }

[build-dependencies]
tauri-build = { git = "https://github.com/tauri-apps/tauri", rev = "c8c75b1f7f43e7cb1e7d773ed2f6f96fad2fe975", optional = true, features = [] }

[[bin]]
name = "delitools-shell"
path = "src/main.rs"
required-features = ["desktop-host"]

[lib]
name = "delitools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
