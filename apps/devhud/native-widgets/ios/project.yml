name: DevHudWidgetBuildOnly
options:
  bundleIdPrefix: dev.deli.devhud.widget
  deploymentTarget:
    iOS: 17.0
configs:
  debug: debug
  release: release
settings:
  base:
    CODE_SIGNING_ALLOWED: false
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: 0.1.0
    SKIP_INSTALL: true
targets:
  DevHudWidgetCore:
    type: framework
    platform: iOS
    sources:
      - path: ../../src-tauri/widget-bridge/ios/Sources/DevHudWidgetCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.deli.devhud.widget.core.build-only
  DevHudWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Extension
    dependencies:
      - target: DevHudWidgetCore
    info:
      path: Support/DevHudWidgetExtension-Info.plist
      properties:
        CFBundleDisplayName: DevHud Widget Foundation
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Support/DevHudWidgetExtension.entitlements
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: true
        PRODUCT_BUNDLE_IDENTIFIER: dev.deli.devhud.widget
  DevHudWidgetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: ../fixtures/widget-configuration.v1.json
        buildPhase: resources
    dependencies:
      - target: DevHudWidgetCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.deli.devhud.widget.tests.build-only
schemes:
  DevHudWidgetBuildOnly:
    build:
      targets:
        DevHudWidgetExtension: all
        DevHudWidgetTests: [test]
    test:
      targets:
        - DevHudWidgetTests
