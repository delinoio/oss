name: devhud
options:
  bundleIdPrefix: dev.deli.devhud
  deploymentTarget:
    iOS: 17.0
fileGroups: []
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: DevHud
      PRODUCT_BUNDLE_IDENTIFIER: dev.deli.devhud
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  DevHudWidgetCore:
    type: framework
    platform: iOS
    sources:
      - path: ../../widget-bridge/ios/Sources/DevHudWidgetCore
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: true
        PRODUCT_BUNDLE_IDENTIFIER: dev.deli.devhud.widget.core
        SKIP_INSTALL: true
  DevHudWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ../../../native-widgets/ios/Sources/Extension
    dependencies:
      - target: DevHudWidgetCore
    info:
      path: ../../../native-widgets/ios/Support/DevHudWidgetExtension-Info.plist
      properties:
        CFBundleDisplayName: Deck
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ../../../native-widgets/ios/Support/DevHudWidgetExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.deli.devhud
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: true
        PRODUCT_BUNDLE_IDENTIFIER: dev.deli.devhud.widget
        SKIP_INSTALL: true
  devhud_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Externals
      - path: devhud_iOS
      - path: ../../../dist
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: devhud_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "1"
    entitlements:
      path: devhud_iOS/devhud_iOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.deli.devhud
        com.apple.developer.associated-domains:
          - applinks:deli.dev
        aps-environment: $(DEVHUD_APS_ENVIRONMENT)
    settings:
      base:
        ENABLE_BITCODE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ARCHS: [arm64, x86_64]
        ARCHS[sdk=iphonesimulator*]: $(NATIVE_ARCH)
        VALID_ARCHS: arm64 x86_64
        LIBRARY_SEARCH_PATHS: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - target: DevHudWidgetExtension
        embed: true
        codeSign: true
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: node ../../../node_modules/@tauri-apps/cli-mobile/tauri.js ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
