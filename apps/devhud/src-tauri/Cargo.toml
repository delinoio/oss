[package]
name = "devhud"
version = "0.1.0"
description = "DevHUD desktop and mobile hosts"
authors = ["Delino"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/delinoio/oss"
publish = false
rust-version = "1.90"
default-run = "devhud"
links = "devhud"

[build-dependencies]
plist = "1.10.0"
tauri-build = { git = "https://github.com/tauri-apps/tauri", rev = "4af26a3f7f8b692d62cca549bbacd93f5ce90b41", features = [] }
tauri-plugin = { git = "https://github.com/tauri-apps/tauri", rev = "4af26a3f7f8b692d62cca549bbacd93f5ce90b41", features = ["build"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { git = "https://github.com/tauri-apps/tauri", rev = "4af26a3f7f8b692d62cca549bbacd93f5ce90b41", default-features = false, features = ["tracing"] }
tauri-cli = { git = "https://github.com/tauri-apps/tauri", rev = "4af26a3f7f8b692d62cca549bbacd93f5ce90b41", optional = true }
url = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
aes-gcm = "=0.10.3"
dirs = "6"
fontdue = "=0.9.3"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
keyring = "=4.1.6"
png = "=0.17.16"
rand = "=0.9.4"
sha2 = "=0.10.9"
tauri = { git = "https://github.com/tauri-apps/tauri", rev = "4af26a3f7f8b692d62cca549bbacd93f5ce90b41", default-features = false, features = ["cef", "tray-icon", "unstable"] }
tracing = "0.1"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "=1.23.0", features = ["serde", "v7"] }
wait-timeout = "0.2"
rdev = "0.5.3"
tauri-plugin-deep-link = "=2.4.9"
tauri-plugin-single-instance = { version = "=2.4.3", features = ["deep-link"] }
xcap = { version = "=0.8.2", default-features = false }
zeroize = { version = "=1.8.2", features = ["derive"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri = { git = "https://github.com/tauri-apps/tauri", rev = "4af26a3f7f8b692d62cca549bbacd93f5ce90b41", default-features = false, features = ["wry"] }
tracing = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
xcb = { version = "=1.6.0", features = ["randr"] }

[features]
default = []
cli = ["dep:tauri-cli"]
custom-protocol = ["tauri/custom-protocol"]
desktop-cef = ["tauri/cef"]

[lib]
name = "devhud_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "devhud"
path = "src/main.rs"

[[bin]]
name = "devhud-tauri-cli"
path = "src/bin/devhud-tauri-cli.rs"
required-features = ["cli"]
