[package]
name = "devhud"
version = "0.1.0"
description = "DevHUD desktop host"
authors = ["Delino"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/delinoio/oss"
publish = false
rust-version = "1.90"
default-run = "devhud"

[build-dependencies]
tauri-build = { git = "https://github.com/tauri-apps/tauri", rev = "4af26a3f7f8b692d62cca549bbacd93f5ce90b41", features = [] }

[dependencies]
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { git = "https://github.com/tauri-apps/tauri", rev = "4af26a3f7f8b692d62cca549bbacd93f5ce90b41", default-features = false, features = ["cef", "tracing"] }
tauri-cli = { git = "https://github.com/tauri-apps/tauri", rev = "4af26a3f7f8b692d62cca549bbacd93f5ce90b41", optional = true }
tracing = "0.1"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[features]
default = []
cli = ["dep:tauri-cli"]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "devhud"
path = "src/main.rs"

[[bin]]
name = "devhud-tauri-cli"
path = "src/bin/devhud-tauri-cli.rs"
required-features = ["cli"]
