[package]
name = "devhud"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false
description = "Tauri CEF application foundation for DevHud"

[lib]
name = "devhud"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "devhud"
path = "src/main.rs"
required-features = ["desktop-cef"]

[build-dependencies]
tauri-build = { git = "https://github.com/tauri-apps/tauri", rev = "f49ebda2fdba5755456b0f049e32593ca0ea331a", features = ["codegen"] }

[dependencies]
base64 = "0.22"
getrandom = "0.3"
hmac = "0.12"
http = "1"
jsonwebtoken = "9.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["serde", "v7"] }
zeroize = { version = "1", features = ["derive"] }
tauri = { git = "https://github.com/tauri-apps/tauri", rev = "f49ebda2fdba5755456b0f049e32593ca0ea331a", default-features = false, optional = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
auto-launch = "=0.6.0"
dirs = "6"
fs2 = "=0.4.3"
global-hotkey = { version = "=0.8.0", features = ["tracing"] }
image = { version = "0.25.8", default-features = false, features = ["png", "webp"] }
rfd = { version = "=0.17.2", default-features = false, features = ["gtk3"], optional = true }
tauri = { git = "https://github.com/tauri-apps/tauri", rev = "f49ebda2fdba5755456b0f049e32593ca0ea331a", default-features = false, features = ["cef", "tray-icon", "image-png"], optional = true }
tauri-runtime-cef = { git = "https://github.com/tauri-apps/tauri", rev = "f49ebda2fdba5755456b0f049e32593ca0ea331a", default-features = false, features = ["devtools", "sandbox"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
windows = { version = "=0.62.2", features = ["Graphics_Capture", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
windows-capture = "=2.0.0"
windows-version = "=0.1.7"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-runtime-wry = { git = "https://github.com/tauri-apps/tauri", rev = "f49ebda2fdba5755456b0f049e32593ca0ea331a", default-features = false, optional = true }
tauri-plugin-devhud-auth = { path = "auth-bridge" }
tauri-plugin-devhud-diagnostics = { path = "diagnostics-bridge" }
tauri-plugin-devhud-widget = { path = "widget-bridge" }

[target.'cfg(target_os = "ios")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSError", "NSString", "NSURL", "NSValue", "std"] }

[features]
default = []
custom-protocol = ["tauri?/custom-protocol"]
desktop-cef = ["dep:rfd", "dep:tauri", "dep:tauri-runtime-cef", "tauri/devtools"]
mobile-system-webview = ["dep:tauri", "dep:tauri-runtime-wry"]
