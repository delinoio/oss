[package]
name = "clibox-fspy"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Internal file-access workflows for clibox"
repository = "https://github.com/delinoio/oss"

[dependencies]
base64 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0.149"
uuid = { workspace = true, features = ["serde", "v7"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
