[package]
name = "clibox-fspy"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
file-id = "0.2.3"
globset = "0.4.18"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tracing = "0.1.44"
uuid = { version = "1.18.1", features = ["serde", "v7"] }
walkdir = "2.5.0"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.182"

[dev-dependencies]
tempfile = "3.25.0"
