[package]
name = "clibox-wait"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Internal wait commands for clibox"
repository = "https://github.com/delinoio/oss"

[dependencies]
clap = { version = "4.5.32", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tracing = "0.1.44"
futures-util = "0.3.31"
hyper = { version = "1", features = ["client"] }
hickory-resolver = { version = "0.25.2", default-features = false, features = ["system-config", "tokio"] }
reqwest = { version = "0.12.28", default-features = false, features = ["http2", "rustls-tls-no-provider"] }
rustls = { version = "0.23.36", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.4"
tokio = { version = "1", features = ["rt", "macros", "net", "fs", "signal", "time"] }

[dev-dependencies]
h2 = "0.4"
http = "1"
rcgen = "0.14"
tempfile = "3.25.0"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio = { version = "1", features = ["test-util", "io-util"] }
