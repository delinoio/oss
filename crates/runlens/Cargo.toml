[workspace]
resolver = "3"
members = [".", "vendor/*"]
default-members = ["."]

[package]
name = "runlens"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
fspy = { path = "vendor/fspy" }
clap = { version = "4.5.53", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
toml = "1.0.0"
thiserror = "2"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "signal", "time", "process", "io-util"] }
tokio-util = "0.7.17"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
uuid = { version = "1.18.1", features = ["v7", "serde"] }
sha2 = "0.11.0"
hex = "0.4.3"
rusqlite = { version = "0.39.0", features = ["bundled"] }
globset = "0.4.18"
tempfile = "3.14.0"
regex = "1.11.3"
same-file = "1.0.6"
walkdir = "2.5.0"
which = "8.0.0"
libc = "0.2.185"
schemars = { version = "1", features = ["uuid1"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Console", "Win32_Security"] }

[workspace.package]
authors = ["Vite+ Authors"]
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.89.0"

[workspace.lints.rust]
absolute_paths_not_starting_with_crate = "warn"
non_ascii_idents = "warn"
unit_bindings = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)', 'cfg(coverage_nightly)'] }
tail_expr_drop_order = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_unsafe = "warn"
long_running_const_eval = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# restriction
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"
# The task scheduling workflow is a single-threaded async task, so Send bounds are unnecessary.
future_not_send = "allow"

[workspace.dependencies]
allocator-api2 = { version = "0.2", default-features = false }
anyhow = "1.0.103"
base64 = "0.22.1"
wincode = "0.6.0"
bitflags = "2.10.0"
bstr = { version = "1.12.0", default-features = false }
bump-scope = { version = "2", default-features = false }
bumpalo = "3.17.0"
bytemuck = "1.23.0"
cc = "1.2.39"
compact_str = "0.9.0"
constcat = "0.6.1"
ctor = "1.0"
derive_more = "2.0.1"
diff-struct = "0.5.3"
elf = { version = "0.8.0", default-features = false }
materialized_artifact = { path = "vendor/materialized_artifact" }
materialized_artifact_macros = { path = "vendor/materialized_artifact_macros" }
fspy_client_unix = { path = "vendor/fspy_client_unix" }
fspy_detours_sys = { path = "vendor/fspy_detours_sys" }
fspy_preload_unix = { path = "vendor/fspy_preload_unix", artifact = "cdylib" }
fspy_preload_windows = { path = "vendor/fspy_preload_windows", artifact = "cdylib" }
fspy_seccomp_unotify = { path = "vendor/fspy_seccomp_unotify" }
fspy_shm = { path = "vendor/fspy_shm" }
fspy_shared = { path = "vendor/fspy_shared" }
fspy_shared_unix = { path = "vendor/fspy_shared_unix" }
futures-util = "0.3.31"
itoa = "1.0.17"
libc = "0.2.185"
linux-raw-sys = { version = "0.12", default-features = false }
memmap2 = "0.9.11"
fspy_ipc_str = { path = "vendor/fspy_ipc_str" }
nix = "0.31.2"
ntapi = "0.4.1"
omnipath = "0.1.6"
os_str_bytes = "7.1.1"
ouroboros = "0.18.5"
passfd = { git = "https://github.com/polachok/passfd", rev = "d55881752c16aced1a49a75f9c428d38d3767213", default-features = false }
path-clean = "1.0.1"
phf = "0.13.0"
proc-macro2 = "1"
quote = "1"
ref-cast = "1.0.24"
rustc-hash = "2.1.1"
seccompiler = { git = "https://github.com/rust-vmm/seccompiler", rev = "08587106340b8e3cb361c7561411510039436857" }
serde = "1.0.219"
fspy_nostd = { path = "vendor/fspy_nostd" }
fspy_nostd_alloc = { path = "vendor/fspy_nostd_alloc" }
smallvec = "2.0.0-alpha.12"
static_cell = "2"
stackalloc = "1.2.1"
syn = "2"
syscalls = { version = "0.8.0", default-features = false }
tempfile = "3.14.0"
thiserror = "2"
tokio = "1.48.0"
tokio-util = "0.7.17"
tracing = "0.1.43"
ts-rs = { version = "12.0.0" }
uuid = "1.18.1"
vt_path = { path = "vendor/vt_path" }
vt_str = { path = "vendor/vt_str" }
which = "8.0.0"
widestring = "1.2.0"
winapi = "0.3.9"
windows-sys = "0.61"
winsafe = { version = "0.0.27" }
xxhash-rust = "0.8.15"

[workspace.metadata.cargo-shear]
ignored = [
  # These are artifact dependencies. They are not directly `use`d in Rust code.
  "fspy_preload_unix",
  "fspy_preload_windows",
]

[features]
test-support = []

[[bin]]
name = "runlens"
path = "src/main.rs"

[[bin]]
name = "runlens-test-command"
path = "tests/fixtures/command.rs"
required-features = ["test-support"]
