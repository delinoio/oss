[package]
name = "pnport-preload"
version = "0.1.3"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
pnport-core = { path = "../pnport-core" }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2.182"

[target.'cfg(windows)'.dependencies]
fspy_detours_sys = { workspace = true }
fspy_nostd = { workspace = true }
ntapi = { workspace = true }
winsafe = { workspace = true, features = ["kernel"] }
winapi = { workspace = true, features = ["fileapi", "libloaderapi", "processenv", "processthreadsapi", "stringapiset", "winnls", "synchapi", "winerror", "memoryapi", "errhandlingapi", "winbase"] }
uuid = { version = "1", features = ["v7"] }
tempfile = "3.25"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
