[package]
name = "pnport"
version = "0.1.3"
edition = "2021"
license = "Apache-2.0"
authors = ["Delino"]
description = "A native Yarn Plug'n'Play subprocess filesystem"
repository = "https://github.com/delinoio/oss"
publish = false

[dependencies]
pnport-core = { path = "../pnport-core" }
clap = { version = "4.5.32", features = ["derive"] }
dirs = "6"
fs2 = "0.4.3"
pnp = "=0.12.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3.25"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
uuid = { version = "1", features = ["v7"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

shell-words = "1.1"

[target.'cfg(target_os = "macos")'.dependencies]
fspy_shared_unix = { path = "../fspy_shared_unix" }
core-foundation = "0.10.1"
security-framework = "=3.7.0"
plist = "1"

[dev-dependencies]

[target.'cfg(unix)'.dependencies]
libc = "0.2.182"

[target.'cfg(windows)'.dependencies]
fspy_detours_sys = { workspace = true }
ntapi = { workspace = true }
winapi = { workspace = true, features = ["fileapi", "stringapiset", "winnls", "processthreadsapi", "winbase"] }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Console", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_System_IO"] }

[target.'cfg(windows)'.dev-dependencies]
cc = { workspace = true }
windows-sys = { workspace = true, features = ["Win32_System_Diagnostics_Debug", "Win32_System_Kernel"] }
