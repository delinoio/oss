[package]
name = "pnport"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Delino"]
description = "A native Yarn Plug'n'Play subprocess filesystem"
repository = "https://github.com/delinoio/oss"
publish = false

[dependencies]
pnport-core = { path = "../pnport-core" }
clap = { version = "4.5.32", features = ["derive"] }
dirs = "6"
fs2 = "0.4.3"
libc = "0.2.182"
pnp = "=0.12.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3.25"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
uuid = { version = "1", features = ["v7"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

shell-words = "1.1"

[target.'cfg(target_os = "macos")'.dependencies]
fspy_shared_unix = { path = "../fspy_shared_unix" }
core-foundation = "0.10.1"
security-framework = "=3.7.0"
plist = "1"

[dev-dependencies]
