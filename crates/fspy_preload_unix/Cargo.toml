[package]
name = "fspy_preload_unix"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
pnport = ["dep:pnport-core", "dep:serde_json", "dep:tempfile"]

[target.'cfg(unix)'.dependencies]
ctor = { workspace = true }
fspy_client_unix = { workspace = true }
fspy_shared = { workspace = true }
fspy_shared_unix = { workspace = true }
libc = { workspace = true }
nix = { workspace = true, features = ["signal", "fs", "socket", "mman", "time"] }
fspy_nostd = { workspace = true }
allocator-api2 = { workspace = true }
fspy_nostd_alloc = { workspace = true }
static_cell = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
pnport-core = { path = "../pnport-core", optional = true }
serde_json = { version = "1", optional = true }
tempfile = { version = "3.25", optional = true }

[lints]
workspace = true
