[package]
name = "fixkey-core"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Keyboard-layout reconstruction and correction engine for FixKey"

[dependencies]
mecab-ko-core = { version = "=0.7.2", default-features = false }
mecab-ko-dict = { version = "=0.7.2", default-features = false }
spellbook = "=0.4.2"
thiserror.workspace = true
tracing.workspace = true

[features]
default = []
native = ["dep:uiautomation", "dep:uiautomation_derive", "dep:zbus", "dep:x11rb", "dep:windows", "dep:windows-sys"]

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "=5.19.0", optional = true }
x11rb = { version = "=0.14.0", features = ["xinput"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
# Keep the derive release compatible with the workspace quote pin. Remove this
# constraint when the workspace can accept the newer derive dependency floor.
uiautomation_derive = { version = "=0.7.4", optional = true }
# The upstream core module imports MouseButton unconditionally; enable its
# input module for compilation only. FixKey never calls synthetic input APIs.
uiautomation = { version = "=0.24.1", default-features = false, features = ["pattern", "input"], optional = true }
windows = { version = "=0.62.2", features = ["Win32_System_Com", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"], optional = true }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_Storage_Packaging_Appx"], optional = true }

[dev-dependencies]
tempfile.workspace = true
serde_json = "=1.0.149"
sha2.workspace = true

[lints]
workspace = true
