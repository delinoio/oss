[package]
name = "delino-forge"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
forge-tree-doc = { path = "../forge-tree-doc" }
forge-pptx = { path = "../forge-pptx" }
clap = { version = "4.5.60", features = ["derive"] }
rmcp = { version = "=3.4.0", default-features = false, features = ["server", "client", "macros", "schemars", "transport-io", "transport-child-process"] }
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "io-std", "io-util", "process", "signal", "time"] }
tokio-util = "0.7.18"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
schemars = { version = "1.2.1", features = ["uuid1"] }
uuid = { version = "1.23.0", features = ["v7", "serde"] }
sha2 = "0.10.9"
fs2 = "0.4.3"
tempfile = "3.25.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }

process-wrap = { version = "10.0.1", features = ["tokio1"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
