[package]
name = "clibox"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A native CLI distributed through Cargo and npm"
readme = "README.md"
repository = "https://github.com/delinoio/oss"
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
base64 = "0.22.1"
blake3 = { version = "=1.8.4", features = ["pure"] }
chrono = { version = "0.4.44", default-features = false, features = ["std", "now"] }
chrono-tz = "=0.10.4"
ctrlc = { version = "3.4", features = ["termination"] }
sha2 = "0.10"
tempfile = "3.25.0"
futures-util = "0.3.31"
hyper = { version = "1", features = ["client"] }
hickory-resolver = { version = "0.25.2", default-features = false, features = ["system-config", "tokio"] }
reqwest = { version = "0.12.28", default-features = false, features = ["http2", "rustls-tls-no-provider"] }
rustls = { version = "0.23.36", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.4"
tokio = { version = "1", features = ["rt", "macros", "net", "fs", "signal", "time"] }
clap = { version = "4.5.32", features = ["derive"] }
yaml-rust2 = { version = "0.13", default-features = false }
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.182"
signal-hook = "0.3.18"

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14.11"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSString"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Threading", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_Storage_FileSystem", "Win32_Security_Authorization"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13.2", default-features = false }

[dev-dependencies]
h2 = "0.4"
http = "1"
rcgen = "0.14"
socket2 = "0.6.2"
tokio = { version = "1", features = ["test-util", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
