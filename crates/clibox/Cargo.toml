[package]
name = "clibox"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A native CLI distributed through Cargo and npm"
readme = "README.md"
repository = "https://github.com/delinoio/oss"
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
clap = { version = "4.5.32", features = ["derive"] }
base64 = "0.22.1"
blake3 = { version = "=1.8.4", features = ["pure"] }
chrono = { version = "0.4.44", default-features = false, features = ["std", "now"] }
chrono-tz = "=0.10.4"
ctrlc = { version = "3.4", features = ["termination"] }
regex = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_System_Threading"] }
