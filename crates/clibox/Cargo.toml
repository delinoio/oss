[package]
name = "clibox"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A native CLI distributed through Cargo and npm"
readme = "README.md"
repository = "https://github.com/delinoio/oss"
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
clap = { version = "4.5.32", features = ["derive"] }
futures-util = "0.3.31"
hyper = { version = "1", features = ["client"] }
hickory-resolver = { version = "0.25.2", default-features = false, features = ["system-config", "tokio"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-no-provider"] }
rustls = { version = "0.23.36", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "fs", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
rcgen = "0.14"
tempfile = "3"
tokio = { version = "1", features = ["test-util", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_System_Threading"] }
