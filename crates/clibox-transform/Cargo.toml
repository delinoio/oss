[package]
name = "clibox-transform"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Internal transform commands for clibox"
repository = "https://github.com/delinoio/oss"

[dependencies]
clap = { version = "4.5.32", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tracing = "0.1.44"
base64 = "0.22.1"
blake3 = { version = "=1.8.4", features = ["pure"] }
chrono = { version = "0.4.44", default-features = false, features = ["std", "now"] }
chrono-tz = "=0.10.4"
sha2 = "0.10"
tempfile = "3.25.0"
regex = "1.12.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2.182"
signal-hook = "0.3.18"

[target.'cfg(windows)'.dependencies]
ctrlc = { version = "3.4", features = ["termination"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization"] }
