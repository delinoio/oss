[package]
name = "clairic-client"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Standalone async Rust client for Cloudflare Workers AI Clairic"
repository = "https://github.com/delinoio/oss"
documentation = "https://docs.rs/clairic-client"
readme = "README.md"
keywords = ["cloudflare", "clairic", "ai", "extraction", "client"]
categories = ["api-bindings", "web-programming::http-client"]
include = ["src/**", "tests/**", "examples/**", "README.md", "LICENSE", "NOTICE", "Cargo.toml"]

[dependencies]
base64 = "0.22.1"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
