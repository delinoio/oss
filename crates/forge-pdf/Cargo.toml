[package]
name = "forge-pdf"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
forge-tree-doc = { path = "../forge-tree-doc" }
forge-document = { path = "../forge-document" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
uuid = { version = "1.23.0", features = ["v7", "serde"] }
krilla = { version = "=0.7.0", default-features = false, features = ["raster-images"] }
parley = "=0.6.0"
ttf-parser = "=0.25.1"

[dev-dependencies]
lopdf = "0.38.0"
