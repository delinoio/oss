[package]
name = "bundlewhy"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Explain why a bundler could not apply an optimization"
build = "build.rs"

[dependencies]
brotli = "8"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
getrandom = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
regex = "1"
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
sha2.workspace = true
sourcemap = "9"
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "process", "signal", "sync", "time", "io-util", "fs"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
uuid = { workspace = true, features = ["v7", "serde"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
