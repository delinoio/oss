[package]
name = "forge-tree-doc"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
schemars = { version = "1.2.1", features = ["uuid1"] }
uuid = { version = "1.23.0", features = ["v7", "serde"] }
cosmic-text = { version = "=0.19.0", default-features = false, features = ["std", "fontconfig"] }

[dev-dependencies]
sha2 = "0.10.9"
