[package]
name = "clibox-config"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Internal dotenv and YAML commands for clibox"
repository = "https://github.com/delinoio/oss"

[dependencies]
clap = { version = "4.5.32", features = ["derive"] }
im-rc = "15.1.0"
regex = "1.12.3"
tempfile = "3.25.0"
tracing = "0.1.44"
yaml-rust2 = { version = "0.13", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2.182"
signal-hook = "0.3.18"

[target.'cfg(windows)'.dependencies]
ctrlc = { version = "3.4", features = ["termination"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization"] }
