[package]
name = "pnport-core"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Delino"]
description = "Private pnport graph, cache, and virtual filesystem core"
repository = "https://github.com/delinoio/oss"
publish = false

[dependencies]
dirs = "6"
fs2 = "0.4.3"
libc = "0.2.182"
pnp = "=0.12.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shell-words = "1.1"
tempfile = "3.25"
tracing = "0.1.44"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
security-framework = "=3.7.0"
plist = "1"
