[package]
name = "pnport-core"
version = "0.1.3"
edition = "2021"
license = "Apache-2.0"
authors = ["Delino"]
description = "Private pnport graph, cache, and virtual filesystem core"
repository = "https://github.com/delinoio/oss"
publish = false

[dependencies]
dirs = "6"
fs2 = "0.4.3"
pnp = "=0.12.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shell-words = "1.1"
tempfile = "3.25"
tracing = "0.1.44"
url = "=2.5.8"
zip = { version = "9.0.0", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
ed25519-dalek = "=2.2.0"
core-foundation = "0.10.1"
security-framework = "=3.7.0"
plist = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2.182"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Memory"] }
