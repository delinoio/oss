[package]
name = "typeopt"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Experimental conservative TypeScript property optimizer"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
brotli = { version = "8", default-features = false, features = ["std"] }
flate2.workspace = true
libc.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
sha2.workspace = true
sourcemap = "9"
tempfile.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["fmt"] }
tsrs_core = { git = "https://github.com/maschwenk/tsrs", rev = "00f16261082fbb2465f0603c667b450d5aa6694b" }
tsrs_ast = { git = "https://github.com/maschwenk/tsrs", rev = "00f16261082fbb2465f0603c667b450d5aa6694b" }
tsrs_checker = { git = "https://github.com/maschwenk/tsrs", rev = "00f16261082fbb2465f0603c667b450d5aa6694b" }
tsrs_compiler = { git = "https://github.com/maschwenk/tsrs", rev = "00f16261082fbb2465f0603c667b450d5aa6694b" }
tsrs_tsoptions = { git = "https://github.com/maschwenk/tsrs", rev = "00f16261082fbb2465f0603c667b450d5aa6694b" }
tsrs_vfs = { git = "https://github.com/maschwenk/tsrs", rev = "00f16261082fbb2465f0603c667b450d5aa6694b" }
tsrs_api = { git = "https://github.com/maschwenk/tsrs", rev = "00f16261082fbb2465f0603c667b450d5aa6694b" }
tsrs_scanner = { git = "https://github.com/maschwenk/tsrs", rev = "00f16261082fbb2465f0603c667b450d5aa6694b" }
tsrs_diagnostics = { git = "https://github.com/maschwenk/tsrs", rev = "00f16261082fbb2465f0603c667b450d5aa6694b" }
url = "2"
