[package]
name = "typeopt"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Experimental conservative TypeScript property optimizer"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
libc.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
sourcemap = "9"
tempfile.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["fmt"] }
ts_goport = { git = "https://github.com/kdy1/ts-rust", rev = "398b09f45dcf06cd67f8e9e18c8c22f95f81430f", default-features = false }
