[package]
name = "typeopt"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Experimental conservative TypeScript property optimizer"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
brotli = { version = "8", default-features = false, features = ["std"] }
flate2.workspace = true
libc.workspace = true
rustc-hash.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
sha2.workspace = true
sourcemap = "9"
swc_core = { version = "82.1.0", default-features = false, features = ["ecma_minifier", "ecma_parser", "ecma_codegen", "ecma_transforms", "common", "common_sourcemap", "ecma_ast", "ecma_visit"] }
tempfile.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["fmt"] }
tsrs_core = { git = "https://github.com/kdy1/tsrs", rev = "abddaae32e5d4c17806095bd3874233fa29b26bf" }
tsrs_ast = { git = "https://github.com/kdy1/tsrs", rev = "abddaae32e5d4c17806095bd3874233fa29b26bf" }
tsrs_checker = { git = "https://github.com/kdy1/tsrs", rev = "abddaae32e5d4c17806095bd3874233fa29b26bf" }
tsrs_compiler = { git = "https://github.com/kdy1/tsrs", rev = "abddaae32e5d4c17806095bd3874233fa29b26bf" }
tsrs_tsoptions = { git = "https://github.com/kdy1/tsrs", rev = "abddaae32e5d4c17806095bd3874233fa29b26bf" }
tsrs_vfs = { git = "https://github.com/kdy1/tsrs", rev = "abddaae32e5d4c17806095bd3874233fa29b26bf" }
tsrs_api = { git = "https://github.com/kdy1/tsrs", rev = "abddaae32e5d4c17806095bd3874233fa29b26bf" }
tsrs_scanner = { git = "https://github.com/kdy1/tsrs", rev = "abddaae32e5d4c17806095bd3874233fa29b26bf" }
tsrs_diagnostics = { git = "https://github.com/kdy1/tsrs", rev = "abddaae32e5d4c17806095bd3874233fa29b26bf" }
url = "2"
