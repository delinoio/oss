[package]
name = "forge-pptx"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
forge-package = { path = "../forge-package" }
forge-tree-doc = { path = "../forge-tree-doc" }
pptx = "=0.1.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
roxmltree = "0.21.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
uuid = { version = "1.23.0", features = ["v7", "serde"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
tempfile = "3.25.0"
