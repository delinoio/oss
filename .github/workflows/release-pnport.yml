name: Release pnport

on:
  push:
    tags: ["pnport@v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Exact source version without v prefix
        required: true
      dry_run:
        description: Build and validate without publication
        type: choice
        options: ["true", "false"]
        default: "true"
        required: true

permissions:
  contents: read

concurrency:
  group: release-pnport
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.source.outputs.version }}
      dry_run: ${{ steps.source.outputs.dry_run }}
      revision: ${{ steps.source.outputs.revision }}
      tree: ${{ steps.source.outputs.tree }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Verify exact source and publication identity
        id: source
        env:
          RELEASE_PROJECT: pnport
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { sourceMetadata, Project } from './scripts/release/project.mjs';
          const source = sourceMetadata({ project: Project.Pnport, event: process.env.GITHUB_EVENT_NAME, ref: process.env.GITHUB_REF, requestedVersion: process.env.REQUESTED_VERSION, requestedDryRun: process.env.REQUESTED_DRY_RUN }, file => readFileSync(file, 'utf8'));
          const revision = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const tree = execFileSync('git', ['rev-parse', 'HEAD^{tree}'], { encoding: 'utf8' }).trim();
          if (revision !== process.env.GITHUB_SHA) throw new Error('Checkout revision mismatch');
          if (source.dry_run !== 'true' && (process.env.GITHUB_REPOSITORY !== 'delinoio/oss' || process.env.GITHUB_REF !== `refs/tags/${source.tag}`)) throw new Error('Publication requires exact first-party tag');
          appendFileSync(process.env.GITHUB_OUTPUT, Object.entries({ ...source, revision, tree }).map(([key, value]) => `${key}=${value}\n`).join(''));
          JS

  build:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15-intel, target: x86_64-apple-darwin, suffix: darwin-x64 }
          - { runner: macos-14, target: aarch64-apple-darwin, suffix: darwin-arm64 }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, suffix: win32-x64-msvc }
          - { runner: windows-11-arm, target: aarch64-pc-windows-msvc, suffix: win32-arm64-msvc }
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu, suffix: linux-x64-gnu }
          - { runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, suffix: linux-arm64-gnu }
    env:
      PNPORT_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          architecture: ${{ startsWith(matrix.target, 'aarch64-') && 'arm64' || 'x64' }}
      - uses: pnpm/action-setup@v5
        with:
          version: 10.26.2
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-01-01
          targets: ${{ matrix.target }}
      - name: Install locked tooling without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build and test the native CLI and injection library
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PNPORT_TARGET" == *apple* ]]; then
            cargo build --locked --release -p pnport -p fspy_preload_unix --features fspy_preload_unix/pnport --target "$PNPORT_TARGET"
            cargo build --locked -p fspy_preload_unix --features fspy_preload_unix/pnport --target "$PNPORT_TARGET"
          else
            cargo build --locked --release -p pnport -p pnport-preload --target "$PNPORT_TARGET"
          fi
          cargo test --locked -p pnport --target "$PNPORT_TARGET"
      - name: Verify installed consumers and native TypeScript
        shell: bash
        env:
          PNPORT_REVISION: ${{ needs.prepare.outputs.revision }}
          PNPORT_TREE: ${{ needs.prepare.outputs.tree }}
        run: |
          set -euo pipefail
          binary="target/$PNPORT_TARGET/release/pnport"
          preload="target/$PNPORT_TARGET/release/libpnport_preload.so"
          if [[ "$PNPORT_TARGET" == *windows* ]]; then binary="$binary.exe"; preload="target/$PNPORT_TARGET/release/pnport_preload.dll"; fi
          if [[ "$PNPORT_TARGET" == *apple* ]]; then preload="target/$PNPORT_TARGET/release/libfspy_preload_unix.dylib"; fi
          pnpm --filter @delino/pnport test:package --target "$PNPORT_TARGET" --binary "$binary" --preload "$preload"
          fixture="$RUNNER_TEMP/pnport-typescript"
          pnpm --filter @delino/pnport test:typescript:prepare "$fixture"
          pnpm --filter @delino/pnport test:typescript "$fixture" "$binary"
          node packages/pnport/scripts/package.mjs binary --target "$PNPORT_TARGET" --binary "$binary" --preload "$preload"
          node packages/pnport/scripts/install-smoke.mjs --target "$PNPORT_TARGET"
          node packages/pnport/scripts/evidence.mjs record --target "$PNPORT_TARGET" --base "$PNPORT_REVISION" --tree "$PNPORT_TREE" --revision "$PNPORT_REVISION"
      - uses: actions/upload-artifact@v7
        with:
          name: pnport-native-${{ matrix.suffix }}
          path: packages/pnport/dist/
          if-no-files-found: error
          retention-days: 30

  package:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v5
        with:
          version: 10.26.2
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          pattern: pnport-native-*
          path: packages/pnport/dist/native
      - name: Validate the seven packages, six archives, and signed-release inputs
        env:
          PNPORT_REVISION: ${{ needs.prepare.outputs.revision }}
          PNPORT_TREE: ${{ needs.prepare.outputs.tree }}
        run: |
          node packages/pnport/scripts/evidence.mjs assemble --input packages/pnport/dist/native --base "$PNPORT_REVISION" --tree "$PNPORT_TREE" --revision "$PNPORT_REVISION"
          node packages/pnport/scripts/publish.mjs
          node packages/pnport/scripts/github-release.mjs
          node packages/pnport/scripts/homebrew.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: pnport-complete-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.revision }}
          path: packages/pnport/dist/
          if-no-files-found: error
          retention-days: 30

  publish-npm:
    needs: [prepare, package]
    if: needs.prepare.outputs.dry_run == 'false' && github.repository == 'delinoio/oss' && startsWith(github.ref, 'refs/tags/pnport@v')
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm install --global npm@11.6.2 --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v8
        with:
          name: pnport-complete-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.revision }}
          path: packages/pnport/dist
      - name: Publish and confirm native packages before the launcher
        run: node packages/pnport/scripts/publish.mjs --publish

  publish-release:
    needs: [prepare, package, publish-npm]
    if: needs.prepare.outputs.dry_run == 'false' && github.repository == 'delinoio/oss' && startsWith(github.ref, 'refs/tags/pnport@v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v8
        with:
          name: pnport-complete-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.revision }}
          path: packages/pnport/dist
      - uses: sigstore/cosign-installer@v4.1.1
      - name: Sign, verify, and publish the immutable complete GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node packages/pnport/scripts/github-release.mjs --publish

  homebrew:
    needs: [prepare, package, publish-release]
    if: needs.prepare.outputs.dry_run == 'false' && github.repository == 'delinoio/oss' && startsWith(github.ref, 'refs/tags/pnport@v')
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v5
        with:
          version: 10.26.2
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: pnport-complete-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.revision }}
          path: packages/pnport/dist
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: tap-bot
        with:
          client-id: ${{ vars.DELINO_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DELINO_RELEASE_BOT_PRIVATE_KEY }}
          owner: delinoio
          repositories: homebrew-tap
          permission-contents: write
      - name: Resolve bot identity
        id: identity
        env:
          GH_TOKEN: ${{ steps.tap-bot.outputs.token }}
        run: node scripts/release/project.mjs bot-identity
      - name: Publish prebuilt-only formula
        env:
          HOMEBREW_TAP_GH_TOKEN: ${{ steps.tap-bot.outputs.token }}
          RELEASE_BOT_NAME: ${{ steps.identity.outputs.name }}
          RELEASE_BOT_EMAIL: ${{ steps.identity.outputs.email }}
        run: node packages/pnport/scripts/homebrew.mjs --publish

  summary:
    if: always()
    needs: [prepare, build, package, publish-npm, publish-release, homebrew]
    runs-on: ubuntu-22.04
    steps:
      - name: Report exact release readiness and publication phases
        env:
          RESULTS: ${{ toJSON(needs) }}
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const jobs = JSON.parse(process.env.RESULTS);
          const lines = ['## pnport release', '', `Version: ${jobs.prepare.outputs.version || 'unresolved'}`, `Commit: ${jobs.prepare.outputs.revision || 'unresolved'}`, '', '| Phase | Result |', '| --- | --- |', ...Object.entries(jobs).map(([name, value]) => `| ${name} | ${value.result} |`), ''];
          if (process.env.DRY_RUN === 'true') lines.push('Dry run: no publication was attempted.');
          if (jobs.build.result !== 'success' || jobs.package.result !== 'success') lines.push('Six-target execution or complete-set validation failed; publication is blocked.');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          JS
