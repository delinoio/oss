name: Runmoor contracts and local Docker

on:
  pull_request:
    paths:
      - cmds/runmoor/**
      - scripts/release/runmoor*
      - .github/workflows/runmoor.yml
      - .github/workflows/release-runmoor.yml
      - go.mod
      - go.sum
      - .github/actions/setup-ci-go/**
  push:
    branches: [main]
    paths:
      - cmds/runmoor/**
      - scripts/release/runmoor*
      - .github/workflows/runmoor.yml
      - .github/workflows/release-runmoor.yml
      - go.mod
      - go.sum
      - .github/actions/setup-ci-go/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runmoor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-ci-go
        id: ci-go
      - name: Unit, lifecycle and mocked API tests
        run: go test -race ./cmds/runmoor/...
      - name: Local Docker integration without GitHub job assignment
        env:
          RUNMOOR_DOCKER_TEST: "1"
        run: go test -run TestDockerIntegration -v -timeout 10m ./cmds/runmoor/internal/runmoor
      - name: Save Go cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-go.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.ci-go.outputs.cache-path }}
          key: ${{ steps.ci-go.outputs.cache-key }}
