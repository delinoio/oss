name: Release Runmoor

on:
  push:
    tags: ["runmoor@v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Exact source MAJOR.MINOR.PATCH version
        required: true
        type: string
      dry_run:
        description: Build and verify only; no credentials, signing or publication
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-runmoor
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      mode: ${{ steps.plan.outputs.mode }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Validate release identity
        id: plan
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          import { main } from './scripts/release/runmoor.mjs';
          const version = process.env.GITHUB_EVENT_NAME === 'push' ? process.env.GITHUB_REF_NAME.replace(/^runmoor@v/u, '') : process.env.REQUESTED_VERSION;
          const mode = process.env.GITHUB_EVENT_NAME === 'workflow_dispatch' && process.env.DRY_RUN === 'true' ? 'dry-run' : 'publish';
          const plan = main(['plan', '--version', version, '--revision', process.env.GITHUB_SHA, '--ref', process.env.GITHUB_REF, '--mode', mode, '--output', 'runmoor-release-plan.json']);
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${plan.version}\nmode=${plan.mode}\ntag=${plan.tag}\n`);
          JS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runmoor-release-plan
          path: runmoor-release-plan.json

  build:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [darwin-arm64, linux-amd64, linux-arm64]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Test command contracts
        run: go test ./cmds/runmoor/...
      - name: Build archive
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_MODE: ${{ needs.plan.outputs.mode }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: node scripts/release/runmoor.mjs build --version "$RELEASE_VERSION" --revision "$GITHUB_SHA" --ref "$GITHUB_REF" --mode "$RELEASE_MODE" --platform "$RELEASE_PLATFORM" --output dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runmoor-archive-${{ matrix.platform }}
          path: dist/*.tar.gz

  package:
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: runmoor-archive-*
          merge-multiple: true
          path: dist
      - name: Generate and verify unsigned checksums
        run: |
          node scripts/release/runmoor.mjs checksums --output dist
          node scripts/release/runmoor.mjs verify --output dist
      - name: Validate Homebrew Formula rendering
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          node scripts/release/runmoor-homebrew.mjs render \
            --version "$RELEASE_VERSION" --revision "$GITHUB_SHA" \
            --archives dist --output "$RUNNER_TEMP/runmoor.rb"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runmoor-unsigned-archives
          path: dist/*

  publish:
    if: needs.plan.outputs.mode == 'publish'
    needs: [plan, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: runmoor-unsigned-archives
          path: dist
      - uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
      - name: Inspect and reuse existing stable draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, copyFileSync, mkdtempSync, readFileSync, rmSync, writeFileSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import path from 'node:path';
          import { archiveNames, assetManifest, checkPublication, githubRequest, releasePlan, verify } from './scripts/release/runmoor.mjs';
          const identity = `https://github.com/${process.env.GITHUB_WORKFLOW_REF}`;
          const request = githubRequest(process.env.GH_TOKEN);
          const plan = releasePlan({version: process.env.RELEASE_VERSION, revision: process.env.GITHUB_SHA, ref: process.env.GITHUB_REF, mode: 'publish'});
          const release = await checkPublication(plan, request);
          if (!release) {
            appendFileSync(process.env.GITHUB_ENV, 'RUNMOOR_REUSE_DRAFT=false\n');
          } else {
            appendFileSync(process.env.GITHUB_ENV, `RUNMOOR_RELEASE_ID=${release.id}\n`);
            const unsignedNames = [...archiveNames, 'SHA256SUMS'];
            const expectedNames = [...unsignedNames, ...unsignedNames.map((name) => `${name}.sigstore.json`)];
            const releaseAssets = release.assets ?? [];
            const draftDirectory = mkdtempSync(path.join(tmpdir(), 'runmoor-draft-'));
            try {
              for (const asset of releaseAssets) {
                if (!expectedNames.includes(asset.name) || !asset.url) throw new Error('Existing release draft contains an unexpected asset');
                const response = await fetch(asset.url, {headers: {Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/octet-stream'}, redirect: 'follow', signal: AbortSignal.timeout(30000)});
                if (!response.ok) throw new Error(`Cannot download existing release asset ${asset.name}`);
                writeFileSync(path.join(draftDirectory, asset.name), Buffer.from(await response.arrayBuffer()));
              }
              const releaseNames = releaseAssets.map((asset) => asset.name);
              const complete = releaseAssets.length === expectedNames.length && new Set(releaseNames).size === expectedNames.length && expectedNames.every((name) => releaseNames.includes(name));
              for (const name of unsignedNames) {
                if (releaseNames.includes(name) && !readFileSync(path.join(draftDirectory, name)).equals(readFileSync(path.join('dist', name)))) throw new Error(`Existing release asset ${name} does not match the current source revision`);
              }
              if (!complete) {
                appendFileSync(process.env.GITHUB_ENV, 'RUNMOOR_REUSE_DRAFT=false\n');
              } else {
                const downloaded = assetManifest(draftDirectory, true);
                await checkPublication(plan, request, downloaded, release.id);
                const local = assetManifest('dist');
                const downloadedByName = new Map(downloaded.map((asset) => [asset.name, asset]));
                for (const asset of local) {
                  const candidate = downloadedByName.get(asset.name);
                  if (!candidate || candidate.size !== asset.size || candidate.digest !== asset.digest) throw new Error(`Existing release asset ${asset.name} does not match the current source revision`);
                }
                verify(draftDirectory, true, {identity});
                for (const name of unsignedNames) copyFileSync(path.join(draftDirectory, `${name}.sigstore.json`), path.join('dist', `${name}.sigstore.json`));
                verify('dist', true, {identity});
                appendFileSync(process.env.GITHUB_ENV, 'RUNMOOR_REUSE_DRAFT=true\n');
              }
            } finally { rmSync(draftDirectory, {recursive: true, force: true}); }
          }
          JS
      - name: Sign exact artifacts with Sigstore
        if: env.RUNMOOR_REUSE_DRAFT != 'true'
        run: |
          node scripts/release/runmoor.mjs verify --output dist
          for artifact in dist/*.tar.gz dist/SHA256SUMS; do
            cosign sign-blob --yes --bundle "${artifact}.sigstore.json" "$artifact"
          done
          node scripts/release/runmoor.mjs verify --output dist --signed true --identity "https://github.com/${GITHUB_WORKFLOW_REF}"
      - name: Revalidate release identity before draft upload
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          node --input-type=module <<'JS'
          import { checkPublication, githubRequest, releasePlan } from './scripts/release/runmoor.mjs';
          const plan = releasePlan({version: process.env.RELEASE_VERSION, revision: process.env.GITHUB_SHA, ref: process.env.GITHUB_REF, mode: 'publish'});
          const release = await checkPublication(plan, githubRequest(process.env.GH_TOKEN));
          if ((release?.id ?? '') !== (process.env.RUNMOOR_RELEASE_ID ? Number(process.env.RUNMOOR_RELEASE_ID) : '')) throw new Error('Release draft identity changed before upload');
          JS
      - name: Create stable release draft
        id: release-draft
        if: env.RUNMOOR_REUSE_DRAFT != 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: false
          overwrite_files: false
          fail_on_unmatched_files: true
          files: dist/*
          body_path: scripts/release/runmoor-release-notes.md
      - name: Pin stable release draft
        env:
          CREATED_RELEASE_ID: ${{ steps.release-draft.outputs.id }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          import { checkPublication, githubRequest, releasePlan } from './scripts/release/runmoor.mjs';
          const existingId = process.env.RUNMOOR_RELEASE_ID;
          const createdId = process.env.CREATED_RELEASE_ID;
          if (existingId && createdId && existingId !== createdId) throw new Error('Draft upload changed the pinned release ID');
          const releaseId = Number(existingId || createdId);
          const plan = releasePlan({version: process.env.RELEASE_VERSION, revision: process.env.GITHUB_SHA, ref: process.env.GITHUB_REF, mode: 'publish'});
          await checkPublication(plan, githubRequest(process.env.GH_TOKEN), undefined, releaseId);
          appendFileSync(process.env.GITHUB_ENV, `RUNMOOR_RELEASE_ID=${releaseId}\n`);
          JS
      - name: Download and verify complete stable release draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          node --input-type=module <<'JS'
          import { mkdtempSync, rmSync, writeFileSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import path from 'node:path';
          import { archiveNames, assetManifest, checkPublication, githubRequest, releasePlan, verify } from './scripts/release/runmoor.mjs';
          const identity = `https://github.com/${process.env.GITHUB_WORKFLOW_REF}`;
          const request = githubRequest(process.env.GH_TOKEN);
          const plan = releasePlan({version: process.env.RELEASE_VERSION, revision: process.env.GITHUB_SHA, ref: process.env.GITHUB_REF, mode: 'publish'});
          const releaseId = Number(process.env.RUNMOOR_RELEASE_ID);
          const release = await checkPublication(plan, request, undefined, releaseId);
          const expectedNames = [...archiveNames, 'SHA256SUMS', ...archiveNames.map((name) => `${name}.sigstore.json`), 'SHA256SUMS.sigstore.json'];
          const draftDirectory = mkdtempSync(path.join(tmpdir(), 'runmoor-final-draft-'));
          try {
            for (const asset of release.assets ?? []) {
              if (!expectedNames.includes(asset.name) || !asset.url) throw new Error('Final release draft contains an unexpected asset');
              const response = await fetch(asset.url, {headers: {Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/octet-stream'}, redirect: 'follow', signal: AbortSignal.timeout(30000)});
              if (!response.ok) throw new Error(`Cannot download final release asset ${asset.name}`);
              writeFileSync(path.join(draftDirectory, asset.name), Buffer.from(await response.arrayBuffer()));
            }
            const downloaded = assetManifest(draftDirectory, true);
            await checkPublication(plan, request, downloaded, releaseId);
            const local = assetManifest('dist', true).filter((asset) => !asset.name.endsWith('.sigstore.json'));
            const downloadedByName = new Map(downloaded.map((asset) => [asset.name, asset]));
            for (const asset of local) {
              const candidate = downloadedByName.get(asset.name);
              if (!candidate || candidate.size !== asset.size || candidate.digest !== asset.digest) throw new Error(`Final release asset ${asset.name} does not match the current source revision`);
            }
            verify(draftDirectory, true, {identity});
            writeFileSync(path.join(process.env.RUNNER_TEMP, 'runmoor-verified-assets.json'), JSON.stringify(downloaded));
          } finally { rmSync(draftDirectory, {recursive: true, force: true}); }
          JS
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RUNMOOR_RELEASE_NOTES: scripts/release/runmoor-release-notes.md
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import path from 'node:path';
          import { githubRequest, publishDraft, releasePlan } from './scripts/release/runmoor.mjs';
          const plan = releasePlan({version: process.env.RELEASE_VERSION, revision: process.env.GITHUB_SHA, ref: process.env.GITHUB_REF, mode: 'publish'});
          await publishDraft(plan, githubRequest(process.env.GH_TOKEN), {
            releaseId: Number(process.env.RUNMOOR_RELEASE_ID),
            expectedAssets: JSON.parse(readFileSync(path.join(process.env.RUNNER_TEMP, 'runmoor-verified-assets.json'), 'utf8')),
            notes: readFileSync(process.env.RUNMOOR_RELEASE_NOTES, 'utf8'),
          });
          JS

  homebrew:
    name: Publish Homebrew Formula
    needs: [plan, publish]
    if: needs.plan.outputs.mode == 'publish'
    permissions:
      contents: read
    uses: ./.github/workflows/release-runmoor-homebrew.yml
    secrets:
      DELINO_RELEASE_BOT_PRIVATE_KEY: ${{ secrets.DELINO_RELEASE_BOT_PRIVATE_KEY }}
    with:
      version: ${{ needs.plan.outputs.version }}
      revision: ${{ github.sha }}
      dry_run: false

  linux-packages:
    name: Publish native Linux packages
    needs: [plan, publish]
    if: needs.plan.outputs.mode == 'publish'
    permissions:
      contents: read
    uses: ./.github/workflows/release-linux-packages.yml
    # Required for the called job to resolve its protected environment secrets.
    # Remove only when actions/runner#4453 is fixed and environment access is verified.
    secrets: inherit
    with:
      project: runmoor
      version: ${{ needs.plan.outputs.version }}
      revision: ${{ github.sha }}
      mode: publish
