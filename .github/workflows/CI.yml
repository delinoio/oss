      - name: Skip (no Rust-related changes)
        if: ${{ steps.gate.outputs.run != 'true' }}
        run: |
          echo "Skipping Rust clippy: no relevant changes"

      - name: Install Rust toolchain
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-01-01
          components: clippy

      - name: Setup pnpm
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: pnpm/action-setup@v5
        with:
          version: 10.26.2

      - name: Setup Node.js
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Build DevHUD frontend
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: pnpm --filter devhud build:frontend

      - name: Install DevHUD Linux prerequisites
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libayatana-appindicator3-dev libgbm-dev libgtk-3-dev libx11-dev libxtst-dev ninja-build

      - name: Cache Rust dependencies
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

