name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-pnport-probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-09-28
      - name: Build owned Linux injection prerequisites
        run: cargo build --locked -p pnport -p pnport-preload
      - name: Validate admitted scratch ownership
        run: cargo test --locked -p pnport --bin pnport linux_scratch -- --nocapture
      - name: Validate complete Linux process lifecycle
        run: cargo test --locked -p pnport --test process_lifecycle -- --test-threads=4
      - name: Repeat libc and raw fork ownership controls
        run: |
          for attempt in 1 2 3; do
            cargo test --locked -p pnport --test process_lifecycle concurrent_fork_and_child_callbacks_preserve_the_virtual_view -- --exact --nocapture
            if [ "$(uname -m)" = x86_64 ]; then
              cargo test --locked -p pnport --test process_lifecycle raw_fork_child_retains_the_virtual_view_and_owned_scratch -- --exact --nocapture
            fi
          done
