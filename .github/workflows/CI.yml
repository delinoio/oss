name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Plan affected CI jobs
    runs-on: ubuntu-24.04
    outputs:
      jobs: ${{ steps.rust.outputs.jobs || steps.plan.outputs.jobs }}
      rust_packages: ${{ steps.rust.outputs.rust_packages || '[]' }}
      forced: ${{ steps.plan.outputs.forced }}
      event: ${{ steps.plan.outputs.event }}
      mode: ${{ steps.plan.outputs.mode }}
      main_sha: ${{ steps.plan.outputs.main_sha }}
      clibox_matrix: ${{ steps.plan.outputs.clibox_matrix }}
      go_test_matrix: ${{ steps.plan.outputs.go_test_matrix }}
      pnport_matrix: ${{ steps.plan.outputs.pnport_matrix }}
      base: ${{ steps.plan.outputs.base }}
      head: ${{ steps.plan.outputs.head }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Compare commits and select jobs
        id: plan
        run: node scripts/ci/plan.mjs

      - name: Install Rust for package metadata
        if: ${{ fromJSON(steps.plan.outputs.jobs)['rust-test'] || fromJSON(steps.plan.outputs.jobs)['rust-clippy'] }}
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-09-28
          components: clippy
      - name: Prepare verified prebuilt cargo-mono
        if: ${{ fromJSON(steps.plan.outputs.jobs)['rust-test'] || fromJSON(steps.plan.outputs.jobs)['rust-clippy'] }}
        id: cargo-mono
        run: node scripts/ci/cargo-mono-prebuilt.mjs
      - name: Setup Node.js for Turbo planning fixtures
        if: ${{ fromJSON(steps.plan.outputs.jobs)['rust-test'] || fromJSON(steps.plan.outputs.jobs)['rust-clippy'] }}
        id: ci-node
        uses: ./.github/actions/setup-ci-node
      - name: Install planning fixture dependencies
        if: ${{ fromJSON(steps.plan.outputs.jobs)['rust-test'] || fromJSON(steps.plan.outputs.jobs)['rust-clippy'] }}
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify published cargo-mono selection behavior
        if: ${{ fromJSON(steps.plan.outputs.jobs)['rust-test'] || fromJSON(steps.plan.outputs.jobs)['rust-clippy'] }}
        env:
          CARGO_MONO_TEST_BINARY: ${{ steps.cargo-mono.outputs.binary }}
          FORCE_RUN: "true"
        run: node scripts/ci/run-affected.mjs @delinoio/ci ci:rust:selection-fixture
      - name: Select final Rust packages and jobs
        if: ${{ fromJSON(steps.plan.outputs.jobs)['rust-test'] || fromJSON(steps.plan.outputs.jobs)['rust-clippy'] }}
        id: rust
        env:
          CI_BASE: ${{ steps.plan.outputs.base }}
          CI_HEAD: ${{ steps.plan.outputs.head }}
          CI_JOBS: ${{ steps.plan.outputs.jobs }}
          CI_FORCED: ${{ steps.plan.outputs.forced }}
          CI_MODE: ${{ steps.plan.outputs.mode }}
          CI_MAIN_SHA: ${{ steps.plan.outputs.main_sha }}
          CARGO_MONO_BINARY: ${{ steps.cargo-mono.outputs.binary }}
        run: node scripts/ci/rust-affected.mjs plan

      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-node.outcome == 'success' && steps.ci-node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.ci-node.outputs.cache-path }}
          key: ${{ steps.ci-node.outputs.cache-key }}
      - name: Preserve Turbo run summaries
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: turbo-changes-${{ github.run_attempt }}
          path: .turbo/runs/*.json
          if-no-files-found: ignore

  ci-contracts:
    name: CI contracts and workflow syntax
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        id: ci-node
        uses: ./.github/actions/setup-ci-node

      - name: Setup Turbo remote cache
        uses: ./.github/actions/setup-turbo-cache
        with:
          team: ${{ vars.TURBO_TEAM }}
          policy: ${{ vars.TURBO_OIDC_POLICY }}

      - name: Setup Go
        if: ${{ runner.os == 'Linux' }}
        id: ci-go
        uses: ./.github/actions/setup-ci-go
        with:
          cache-scope: ci-contracts

      - name: Install clean locked workspace
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate workflow syntax
        if: ${{ runner.os == 'Linux' }}
        run: node scripts/ci/run-affected.mjs @delinoio/ci ci:workflows
        env:
          FORCE_RUN: "true"

      - name: Validate CI contracts and affected behavior
        if: ${{ runner.os == 'Linux' }}
        run: node scripts/ci/run-affected.mjs @delinoio/ci ci:contracts
        env:
          FORCE_RUN: "true"

      - name: Validate protocol launcher on native host
        if: ${{ runner.os != 'Linux' }}
        run: node scripts/ci/run-affected.mjs @delinoio/ci ci:proto:launcher
        env:
          FORCE_RUN: "true"

      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.ci-node.outputs.cache-path }}
          key: ${{ steps.ci-node.outputs.cache-key }}

      - name: Save Go cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-go.outcome == 'success' && steps.ci-go.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.ci-go.outputs.cache-path }}
          key: ${{ steps.ci-go.outputs.cache-key }}

      - name: Preserve Turbo run summaries
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: turbo-ci-contracts-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: .turbo/runs/*.json
          if-no-files-found: ignore

  go-quality:
    needs: changes
    if: ${{ needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['go-quality'] }}
    name: Go Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup Go
        id: ci-go
        uses: ./.github/actions/setup-ci-go
        with:
          cache-scope: go-quality

      - name: Setup Node.js
        id: ci-node
        uses: ./.github/actions/setup-ci-node

      - name: Setup Turbo remote cache
        uses: ./.github/actions/setup-turbo-cache
        with:
          team: ${{ vars.TURBO_TEAM }}
          policy: ${{ vars.TURBO_OIDC_POLICY }}

      - name: Generate and verify embedded administrator assets
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check Go formatting and vet
        env:
          FORCE_RUN: "true"
          CI_GO_MODE: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && needs.changes.outputs.mode == 'affected')) && !fromJSON(needs.changes.outputs.forced)['go-quality'] && 'affected' || 'full' }}
          CI_GO_BASE: ${{ needs.changes.outputs.base }}
          CI_GO_HEAD: ${{ needs.changes.outputs.head }}
        run: node scripts/ci/run-affected.mjs @delinoio/ci ci:go:quality

      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.ci-node.outputs.cache-path }}
          key: ${{ steps.ci-node.outputs.cache-key }}

      - name: Save Go cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-go.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.ci-go.outputs.cache-path }}
          key: ${{ steps.ci-go.outputs.cache-key }}

      - name: Preserve Turbo run summaries
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: turbo-go-quality-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: .turbo/runs/*.json
          if-no-files-found: ignore

  go-test:
    needs: changes
    if: ${{ needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['go-test'] }}
    name: Go Test (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.go_test_matrix) }}
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup Go
        id: ci-go
        uses: ./.github/actions/setup-ci-go
        with:
          cache-scope: ${{ matrix.os == 'ubuntu-latest' && 'go-test-all' || format('go-test-{0}', matrix.shard) }}
          cache-fallback-scope: ${{ matrix.os == 'windows-latest' && matrix.shard == 'workspace' && 'go-test-worker' || '' }}

      - name: Setup Node.js
        id: ci-node
        uses: ./.github/actions/setup-ci-node

      - name: Setup Turbo remote cache
        uses: ./.github/actions/setup-turbo-cache
        with:
          team: ${{ vars.TURBO_TEAM }}
          policy: ${{ vars.TURBO_OIDC_POLICY }}

      - name: Generate and verify embedded administrator assets
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify native affected Go discovery
        run: node scripts/ci/run-affected.mjs @delinoio/ci ci:go:discovery
        env:
          FORCE_RUN: "true"

      - name: Run go test
        # The central runner uses -count=1 for execution and reuses compiled objects.
        run: node scripts/ci/run-affected.mjs @delinoio/ci ci:go:test
        env:
          CI_GO_TEST_SHARD: ${{ matrix.shard }}
          FORCE_RUN: "true"
          CI_GO_MODE: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && needs.changes.outputs.mode == 'affected') || (github.event_name == 'push' && matrix.os != 'ubuntu-latest')) && !fromJSON(needs.changes.outputs.forced)['go-test'] && 'affected' || 'full' }}
          CI_GO_BASE: ${{ needs.changes.outputs.base }}
          CI_GO_HEAD: ${{ needs.changes.outputs.head }}

      - name: Summarize Go test timings
        if: ${{ always() && hashFiles('.turbo/go-test/*.json') != '' }}
        run: node scripts/ci/go-test-report.mjs --summary ".turbo/go-test/${{ matrix.shard }}.json"

      - name: Preserve Go test timings
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: go-test-timings-${{ runner.os }}-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_attempt }}
          path: .turbo/go-test/*.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.ci-node.outputs.cache-path }}
          key: ${{ steps.ci-node.outputs.cache-key }}

      - name: Save Go cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-go.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.ci-go.outputs.cache-path }}
          key: ${{ steps.ci-go.outputs.cache-key }}

      - name: Preserve Turbo run summaries
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: turbo-go-test-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: .turbo/runs/*.json
          if-no-files-found: ignore

  source-format:
    needs: changes
    if: ${{ needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['source-format'] }}
    name: Rstack formatting
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        id: ci-node
        uses: ./.github/actions/setup-ci-node
      - name: Setup Turbo remote cache
        uses: ./.github/actions/setup-turbo-cache
        with:
          team: ${{ vars.TURBO_TEAM }}
          policy: ${{ vars.TURBO_OIDC_POLICY }}

      - name: Install locked workspace tools
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check changed files with Rstack
        run: node scripts/ci/run-affected.mjs @delinoio/ci ci:format
        env:
          FORCE_RUN: "true"
          TURBO_SCM_BASE: ${{ needs.changes.outputs.base }}
          TURBO_SCM_HEAD: ${{ needs.changes.outputs.head }}

      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.ci-node.outputs.cache-path }}
          key: ${{ steps.ci-node.outputs.cache-key }}

      - name: Preserve Turbo run summaries
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: turbo-source-format-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: .turbo/runs/*.json
          if-no-files-found: ignore

  rust-fmt:
    needs: changes
    if: ${{ needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['rust-fmt'] }}
    name: Rust fmt
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-09-28
          components: rustfmt

      - name: Setup Node.js
        id: ci-node
        uses: ./.github/actions/setup-ci-node
      - name: Setup Turbo remote cache
        uses: ./.github/actions/setup-turbo-cache
        with:
          team: ${{ vars.TURBO_TEAM }}
          policy: ${{ vars.TURBO_OIDC_POLICY }}

      - name: Install locked workspace tools
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run rustfmt
        run: node scripts/ci/run-affected.mjs @delinoio/ci ci:rust:fmt ci:rust:fmt-fixture
        env:
          FORCE_RUN: "true"

      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.ci-node.outputs.cache-path }}
          key: ${{ steps.ci-node.outputs.cache-key }}

      - name: Preserve Turbo run summaries
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: turbo-rust-fmt-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: .turbo/runs/*.json
          if-no-files-found: ignore

  rust-clippy:
    needs: changes
    if: ${{ needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['rust-clippy'] }}
    name: Rust clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: true
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-09-28
          components: clippy

      - name: Setup Node.js
        id: ci-node
        uses: ./.github/actions/setup-ci-node

      - name: Setup Turbo remote cache
        uses: ./.github/actions/setup-turbo-cache
        with:
          team: ${{ vars.TURBO_TEAM }}
          policy: ${{ vars.TURBO_OIDC_POLICY }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: false

      - name: Run clippy
        run: node scripts/ci/run-rust.mjs clippy
        env:
          RUST_PACKAGES: ${{ needs.changes.outputs.rust_packages }}
          FORCE_RUN: "true"

      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.ci-node.outputs.cache-path }}
          key: ${{ steps.ci-node.outputs.cache-key }}

      - name: Preserve Turbo run summaries
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: turbo-rust-clippy-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: .turbo/runs/*.json
          if-no-files-found: ignore

  rust-test:
    needs: changes
    if: ${{ needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['rust-test'] }}
    name: Rust test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: true
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-09-28

      - name: Setup Go for Rust test prerequisites
        if: ${{ contains(fromJSON(needs.changes.outputs.rust_packages), 'pnport') }}
        id: ci-go
        uses: ./.github/actions/setup-ci-go

      - name: Setup Node.js
        id: ci-node
        uses: ./.github/actions/setup-ci-node

      - name: Setup Turbo remote cache
        uses: ./.github/actions/setup-turbo-cache
        with:
          team: ${{ vars.TURBO_TEAM }}
          policy: ${{ vars.TURBO_OIDC_POLICY }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install XZ development library
        if: ${{ contains(fromJSON(needs.changes.outputs.rust_packages), 'binpm') || contains(fromJSON(needs.changes.outputs.rust_packages), 'nodeup') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y liblzma-dev

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: false

      - name: Run cargo test
        run: node scripts/ci/run-rust.mjs test
        env:
          RUST_PACKAGES: ${{ needs.changes.outputs.rust_packages }}
          FORCE_RUN: "true"

      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.ci-node.outputs.cache-path }}
          key: ${{ steps.ci-node.outputs.cache-key }}

      - name: Save Go cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-go.outcome == 'success' && steps.ci-go.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.ci-go.outputs.cache-path }}
          key: ${{ steps.ci-go.outputs.cache-key }}

      - name: Preserve Turbo run summaries
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: turbo-rust-test-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: .turbo/runs/*.json
          if-no-files-found: ignore

  linux-packages:
    needs: changes
    if: ${{ needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['linux-packages'] }}
    name: Linux package repository (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Build pinned package tools
        run: docker build -f packaging/linux/Tools.Dockerfile -t delino-linux-package-tools .
      - name: Verify Rust compatibility builds
        env:
          TEST_ARCH: ${{ matrix.arch }}
        run: |
          image=$(node -p 'JSON.parse(require("fs").readFileSync("packaging/linux/pins.json")).rust_image')
          target=x86_64-unknown-linux-gnu
          if [ "$TEST_ARCH" = arm64 ]; then target=aarch64-unknown-linux-gnu; fi
          docker run --rm -v "$PWD:/workspace" -w /workspace -e BUILD_TARGET="$target" "$image" bash -c 'for project in binpm cargo-mono nodeup with-watch clibox; do bash scripts/release/linux-packages/build-rust.sh "$project" "$BUILD_TARGET"; done'
          sudo chown -R "$(id -u):$(id -g)" target
          TEST_TARGET="$target" node --input-type=module <<'JS'
          import { readElf } from './scripts/release/linux-packages/release-input.mjs';
          for (const project of ['binpm', 'cargo-mono', 'nodeup', 'with-watch', 'clibox']) {
            readElf(`target/${process.env.TEST_TARGET}/release/${project}`, process.env.TEST_ARCH);
          }
          JS
      - name: Verify publisher recovery and security contracts
        run: node --test scripts/release/linux-packages.test.mjs
      - name: Generate disposable signed package repositories
        run: |
          mkdir -p "$RUNNER_TEMP/package-fixture"
          docker run --rm -v "$PWD:/workspace:ro" -v "$RUNNER_TEMP/package-fixture:/output" delino-linux-package-tools node scripts/release/linux-packages/fixture.mjs /output
          docker run --rm -v "$PWD:/workspace:ro" delino-linux-package-tools node scripts/release/linux-packages/rotation-test.mjs
      - name: Verify native package lifecycle on supported distributions
        env:
          TEST_ARCH: ${{ matrix.arch }}
        run: |
          for image in ubuntu:22.04 ubuntu:24.04 ubuntu:26.04 debian:12 debian:13 fedora:43 fedora:44 registry.access.redhat.com/ubi9/ubi:latest registry.access.redhat.com/ubi10/ubi:latest rockylinux:9 rockylinux/rockylinux:10 almalinux:9 almalinux:10; do
            node scripts/release/linux-packages/smoke.mjs --fixture "$RUNNER_TEMP/package-fixture" --image "$image" --architecture "$TEST_ARCH"
          done

  node-public-docs-test:
    needs: changes
    if: ${{ needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['node-public-docs-test'] }}
    name: Node public-docs test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        id: ci-node
        uses: ./.github/actions/setup-ci-node

      - name: Setup Turbo remote cache
        uses: ./.github/actions/setup-turbo-cache
        with:
          team: ${{ vars.TURBO_TEAM }}
          policy: ${{ vars.TURBO_OIDC_POLICY }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run public-docs tests
        run: node scripts/ci/run-affected.mjs public-docs ci:check
        env:
          FORCE_RUN: ${{ fromJSON(needs.changes.outputs.forced)['node-public-docs-test'] }}
          TURBO_SCM_BASE: ${{ needs.changes.outputs.base }}
          TURBO_SCM_HEAD: ${{ needs.changes.outputs.head }}

      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.ci-node.outputs.cache-path }}
          key: ${{ steps.ci-node.outputs.cache-key }}

      - name: Preserve Turbo run summaries
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: turbo-node-public-docs-test-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: .turbo/runs/*.json
          if-no-files-found: ignore

  release-contracts:
    needs: changes
    if: ${{ needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['release-contracts'] }}
    name: Release contracts
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        id: ci-node
        uses: ./.github/actions/setup-ci-node

      - name: Setup Turbo remote cache
        uses: ./.github/actions/setup-turbo-cache
        with:
          team: ${{ vars.TURBO_TEAM }}
          policy: ${{ vars.TURBO_OIDC_POLICY }}

      - name: Install locked repository tools
        run: pnpm install --frozen-lockfile --ignore-scripts --filter delinoio-oss-workspace
      - uses: ./.github/actions/setup-clibox
        with:
          install: "false"

      - name: Validate deterministic release contracts
        run: node scripts/ci/run-affected.mjs @delinoio/ci ci:release-fixtures
        env:
          FORCE_RUN: "true"

      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.ci-node.outputs.cache-path }}
          key: ${{ steps.ci-node.outputs.cache-key }}

      - name: Preserve Turbo run summaries
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: turbo-release-contracts-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: .turbo/runs/*.json
          if-no-files-found: ignore

  async-commit-hook:
    needs: changes
    if: ${{ needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['async-commit-hook'] }}
    name: Async commit hook contracts and integration
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Go
        id: ci-go
        uses: ./.github/actions/setup-ci-go
        with:
          cache-scope: async-commit-hook
      - name: Setup Node.js
        id: ci-node
        uses: ./.github/actions/setup-ci-node
      - name: Setup Turbo remote cache
        uses: ./.github/actions/setup-turbo-cache
        with:
          team: ${{ vars.TURBO_TEAM }}
          policy: ${{ vars.TURBO_OIDC_POLICY }}

      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate package tasks
        run: node scripts/ci/run-affected.mjs @delinoio/ci ci:ach:check
        env:
          PROTO_BASELINE: ${{ github.event_name == 'push' && github.event.before || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && 'HEAD^') || 'origin/main' }}
          FORCE_RUN: "true"

      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.ci-node.outputs.cache-path }}
          key: ${{ steps.ci-node.outputs.cache-key }}

      - name: Save Go cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-go.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.ci-go.outputs.cache-path }}
          key: ${{ steps.ci-go.outputs.cache-key }}

      - name: Preserve Turbo run summaries
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: turbo-async-commit-hook-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: .turbo/runs/*.json
          if-no-files-found: ignore

  node-clibox-test:
    needs: changes
    if: ${{ needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['node-clibox-test'] }}
    name: clibox npm consumers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.clibox_matrix) }}
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-node
        id: ci-node
      - name: Setup Turbo remote cache
        uses: ./.github/actions/setup-turbo-cache
        with:
          team: ${{ vars.TURBO_TEAM }}
          policy: ${{ vars.TURBO_OIDC_POLICY }}

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-09-28
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: false
      - name: Install clean locked workspace
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: ./.github/actions/setup-clibox
        with:
          install: "false"
      - name: Test pinned repository utilities
        run: node scripts/ci/run-affected.mjs @delinoio/ci ci:tools
        env:
          FORCE_RUN: "true"

      - name: Verify affected workspace runner
        run: node scripts/ci/run-affected.mjs @delinoio/ci ci:runner
        env:
          FORCE_RUN: "true"

      - name: Test Rust utilities, readiness, configuration processing, and OS adapters
        run: node scripts/ci/run-affected.mjs @delinoio/ci ci:clibox:native
        env:
          FORCE_RUN: "true"

      - name: Test launcher and native npm consumers
        env:
          FORCE_RUN: ${{ fromJSON(needs.changes.outputs.forced)['node-clibox-test'] }}
          TURBO_SCM_BASE: ${{ needs.changes.outputs.base }}
          TURBO_SCM_HEAD: ${{ needs.changes.outputs.head }}
        run: node scripts/ci/run-affected.mjs @delino/clibox test test:package
      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.ci-node.outputs.cache-path }}
          key: ${{ steps.ci-node.outputs.cache-key }}

      - name: Preserve Turbo run summaries
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: turbo-node-clibox-test-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: .turbo/runs/*.json
          if-no-files-found: ignore

  node-pnport-test:
    needs: changes
    if: ${{ needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['node-pnport-test'] }}
    name: pnport package and release contracts
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-node
        id: ci-node
      - name: Setup Turbo remote cache
        uses: ./.github/actions/setup-turbo-cache
        with:
          team: ${{ vars.TURBO_TEAM }}
          policy: ${{ vars.TURBO_OIDC_POLICY }}

      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify source version, package metadata, and fail-closed publication
        run: node scripts/ci/run-affected.mjs @delino/pnport test ci:release ci:package
        env:
          FORCE_RUN: "true"

      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.ci-node.outputs.cache-path }}
          key: ${{ steps.ci-node.outputs.cache-key }}

      - name: Preserve Turbo run summaries
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: turbo-node-pnport-test-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: .turbo/runs/*.json
          if-no-files-found: ignore

  pnport-native:
    needs: changes
    if: ${{ needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['pnport-native'] }}
    name: pnport native execution (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.pnport_matrix) }}
    env:
      PNPORT_TARGET: ${{ matrix.target }}
      PNPORT_SUFFIX: ${{ matrix.suffix }}
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-node
        id: ci-node
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-09-28
          targets: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify native runtime and installed package on this host
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PNPORT_TARGET" == *apple* ]]; then
            cargo build --locked --release -p pnport -p fspy_preload_unix --features fspy_preload_unix/pnport --target "$PNPORT_TARGET"
            cargo build --locked -p fspy_preload_unix --features fspy_preload_unix/pnport --target "$PNPORT_TARGET"
            cargo test --locked -p fspy_preload_unix --features fspy_preload_unix/pnport --target "$PNPORT_TARGET"
          else
            cargo build --locked --release -p pnport -p pnport-preload --target "$PNPORT_TARGET"
            cargo build --locked -p pnport-preload --target "$PNPORT_TARGET"
          fi
          cargo test --locked -p pnport -p pnport-core -p pnport-preload --target "$PNPORT_TARGET"
          binary="target/$PNPORT_TARGET/release/pnport"
          preload="target/$PNPORT_TARGET/release/libpnport_preload.so"
          if [[ "$PNPORT_TARGET" == *apple* ]]; then preload="target/$PNPORT_TARGET/release/libfspy_preload_unix.dylib"; fi
          pnpm --filter @delino/pnport test:package --target "$PNPORT_TARGET" --binary "$binary" --preload "$preload"
          fixture="$RUNNER_TEMP/pnport-typescript"
          pnpm --filter @delino/pnport test:typescript:prepare "$fixture"
          pnpm --filter @delino/pnport test:typescript "$fixture" "$binary"
          node packages/pnport/scripts/package.mjs binary --target "$PNPORT_TARGET" --binary "$binary" --preload "$preload"
          node packages/pnport/scripts/install-smoke.mjs --target "$PNPORT_TARGET"
          PNPORT_TEST_BINARY="$PWD/packages/pnport/dist/$PNPORT_SUFFIX/bin/pnport" cargo test --locked -p pnport --test process_lifecycle --target "$PNPORT_TARGET"
          PNPORT_TEST_BINARY="$PWD/packages/pnport/dist/$PNPORT_SUFFIX/bin/pnport" cargo test --locked -p pnport --test native_conformance --target "$PNPORT_TARGET"
          PNPORT_TEST_BINARY="$PWD/packages/pnport/dist/$PNPORT_SUFFIX/bin/pnport" cargo test --locked -p pnport --test core native_tool_caches_coexist_with_dependencies_and_directory_lifetimes --target "$PNPORT_TARGET"
          cache_fixture="$RUNNER_TEMP/pnport-tool-cache"
          pnpm --filter @delino/pnport test:cache:prepare "$cache_fixture"
          pnpm --filter @delino/pnport test:cache "$cache_fixture" "$PWD/packages/pnport/dist/$PNPORT_SUFFIX/bin/pnport"
      - name: Measure identical cold and warm workloads on this native host
        if: runner.os != 'Windows'
        shell: bash
        run: |
          node packages/pnport/scripts/benchmark.mjs "$RUNNER_TEMP/pnport-typescript" "$RUNNER_TEMP/pnport-benchmark" "packages/pnport/dist/$PNPORT_SUFFIX/bin/pnport" "$GITHUB_SHA"
      - name: Save revision-bound numeric benchmark results
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: pnport-benchmark-${{ matrix.suffix }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pnport-benchmark/benchmark.json
          if-no-files-found: error
          retention-days: 30
      - name: Verify Windows source and installed development archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/pnport-windows.ps1 -Target "$env:PNPORT_TARGET" -Suffix "$env:PNPORT_SUFFIX"
      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.ci-node.outputs.cache-path }}
          key: ${{ steps.ci-node.outputs.cache-key }}

  ci-result:
    name: CI Result
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - ci-contracts
      - release-contracts
      - async-commit-hook
      - go-quality
      - go-test
      - rust-fmt
      - source-format
      - rust-clippy
      - rust-test
      - node-public-docs-test
      - node-clibox-test
      - node-pnport-test
      - pnport-native
      - linux-packages
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # Reject failure, cancellation, and unexpected skips against the exact plan.
      - name: Validate every planned result
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/result.mjs
