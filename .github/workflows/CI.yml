        uses: pnpm/action-setup@v5
        with:
          version: 10.26.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Determine whether to run
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CI_WORKFLOW_CHANGED: ${{ steps.filter.outputs.ci_workflow }}
          PUBLIC_DOCS_CHANGED: ${{ steps.filter.outputs.public_docs }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
          WORKSPACE: public-docs
        run: |
          set -euo pipefail

          run=false
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] || [ "${CI_WORKFLOW_CHANGED}" = "true" ] || [ "${PUBLIC_DOCS_CHANGED}" = "true" ]; then
            run=true
          else
            if [ "${EVENT_NAME}" = "push" ]; then
              export TURBO_SCM_BASE="${PUSH_BASE}"
              export TURBO_SCM_HEAD="${PUSH_HEAD}"
            fi
            pnpm install --frozen-lockfile --ignore-scripts
            affected_json="$(pnpm exec turbo run test --affected --filter "${WORKSPACE}" --dry=json)"
            printf '%s\n' "${affected_json}"
            run="$(printf '%s' "${affected_json}" | jq -r '.tasks | any(.package == env.WORKSPACE)')"
          fi

          echo "run=${run}" >> "${GITHUB_OUTPUT}"

      - name: Skip (public-docs unaffected)
        if: ${{ steps.gate.outputs.run != 'true' }}
        run: |
          echo "Skipping Node public-docs test: workspace unaffected"

      - name: Install dependencies
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Run public-docs tests
        if: ${{ steps.gate.outputs.run == 'true' }}
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.ci_workflow == 'true' || steps.filter.outputs.public_docs == 'true' }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          args=(run test --filter public-docs)
          if [ "$FORCE_RUN" != true ]; then
            args+=(--affected)
            if [ "$EVENT_NAME" = push ]; then
              export TURBO_SCM_BASE="$PUSH_BASE"
              export TURBO_SCM_HEAD="$PUSH_HEAD"
            fi
          fi
          pnpm exec turbo "${args[@]}"

  devhud-frontend:
    name: DevHud frontend contracts
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Filter changed paths
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: dorny/paths-filter@v4
        with:
          filters: |
            ci_workflow:
              - .github/workflows/CI.yml
            node_runtime:
              - .nvmrc
            devhud_frontend:
              - .nvmrc
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - turbo.json
              - apps/devhud/**
              - packages/**
              - protos/**

      - name: Determine whether to run
        id: gate
        shell: bash
        env:
          CHANGED: ${{ steps.filter.outputs.devhud_frontend }}
          CI_WORKFLOW_CHANGED: ${{ steps.filter.outputs.ci_workflow }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          run=false
          if [ "$EVENT_NAME" = workflow_dispatch ] || [ "$CI_WORKFLOW_CHANGED" = true ] || [ "$CHANGED" = true ]; then run=true; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Skip (DevHud frontend unaffected)
        if: ${{ steps.gate.outputs.run != 'true' }}
        run: 'echo "Skipping DevHud frontend contracts: paths unaffected"'

      - name: Setup pnpm
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: pnpm/action-setup@v5
        with:
          version: 10.26.2

      - name: Setup Node.js
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install clean locked workspace
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run affected frontend contracts
        if: ${{ steps.gate.outputs.run == 'true' }}
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.ci_workflow == 'true' || steps.filter.outputs.node_runtime == 'true' }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          args=(run typecheck lint test:unit test:components test:accessibility build:frontend --filter devhud)
          if [ "$FORCE_RUN" != true ]; then
            args+=(--affected)
            if [ "$EVENT_NAME" = push ]; then
              export TURBO_SCM_BASE="$PUSH_BASE"
              export TURBO_SCM_HEAD="$PUSH_HEAD"
            fi
          fi
          pnpm exec turbo "${args[@]}"

