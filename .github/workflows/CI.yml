  devhud-api:
    name: DevHud API Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: dorny/paths-filter@v4
        with:
          filters: |
            devhud_api:
              - .github/workflows/CI.yml
              - go.mod
              - go.sum
              - pnpm-workspace.yaml
              - protos/**
              - servers/**
              - scripts/ci/check-go-format.mjs

      - name: Determine whether to run
        id: gate
        shell: bash
        env:
          API_CHANGED: ${{ steps.filter.outputs.devhud_api }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          run=false
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] || [ "${API_CHANGED}" = "true" ]; then
            run=true
          fi

          echo "run=${run}" >> "${GITHUB_OUTPUT}"

      - name: Skip (DevHud API unaffected)
        if: ${{ steps.gate.outputs.run != 'true' }}
        run: 'echo "Skipping DevHud API integration checks: paths unaffected"'

      - name: Setup Go
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Setup pnpm
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: pnpm/action-setup@v5
        with:
          version: 10.26.2

      - name: Check API formatting, vet, builds, and unit tests
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          pnpm --filter @delinoio/devhud-api --fail-if-no-match ci:format
          pnpm --filter @delinoio/devhud-api --fail-if-no-match ci:vet
          pnpm --filter @delinoio/devhud-api --fail-if-no-match ci:build
          pnpm --filter @delinoio/devhud-api --fail-if-no-match ci:unit
          pnpm --filter @delinoio/devhud-api --fail-if-no-match ci:migrations
          pnpm --filter @delinoio/devhud-api --fail-if-no-match ci:api
          pnpm --filter @delinoio/devhud-api --fail-if-no-match ci:sweeper

      - name: Start PostgreSQL
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          set -euo pipefail
          docker run --detach \
            --name devhud-postgres \
            --env POSTGRES_DB=devhud_api_test \
            --env POSTGRES_PASSWORD=devhud \
            --env POSTGRES_USER=devhud \
            --publish 5432:5432 \
            --health-cmd "pg_isready -U devhud -d devhud_api_test" \
            --health-interval 5s \
            --health-timeout 5s \
            --health-retries 10 \
            postgres:15-bookworm >/dev/null
          for _ in {1..60}; do
            status=$(docker inspect --format '{{.State.Health.Status}}' devhud-postgres)
            if [ "$status" = healthy ]; then
              exit 0
            fi
            if [ "$status" = unhealthy ]; then
              break
            fi
            sleep 1
          done
          docker logs devhud-postgres
          echo "DevHud API PostgreSQL did not become healthy" >&2
          exit 1

      - name: Run PostgreSQL migration and integration tests
        if: ${{ steps.gate.outputs.run == 'true' }}
        env:
          DEVHUD_TEST_DATABASE_URL: postgres://devhud:devhud@127.0.0.1:5432/devhud_api_test?sslmode=disable
        run: pnpm --filter @delinoio/devhud-api --fail-if-no-match ci:integration

      - name: Stop PostgreSQL
        if: ${{ always() && steps.gate.outputs.run == 'true' }}
        run: docker rm --force devhud-postgres >/dev/null 2>&1 || true

  devhud-oci:
    name: DevHud ${{ matrix.target }} non-root OCI
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: [api, sweeper]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Filter changed paths
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: dorny/paths-filter@v4
        with:
          filters: |
            oci:
              - .github/workflows/CI.yml
              - go.mod
              - go.sum
              - protos/**
              - servers/**
              - apps/devhud-admin/**
              - packages/**
              - packaging/devhud/**
              - scripts/release/**

      - name: Determine whether to run
        id: gate
        shell: bash
        env:
          CHANGED: ${{ steps.filter.outputs.oci }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          run=false
          if [ "$EVENT_NAME" = workflow_dispatch ] || [ "$CHANGED" = true ]; then run=true; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Skip (OCI inputs unaffected)
        if: ${{ steps.gate.outputs.run != 'true' }}
        run: 'echo "Skipping DevHud ${{ matrix.target }} OCI checks: paths unaffected"'

      - name: Setup Docker Buildx
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: docker/setup-buildx-action@v4

      - name: Setup Go
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download Syft
        id: syft
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: anchore/sbom-action/download-syft@v0.21.0

      - name: Install OCI inspection tools
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo

      - name: Start PostgreSQL
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          set -euo pipefail
          docker run --detach \
            --name devhud-postgres \
            --env POSTGRES_DB=devhud_api_test \
            --env POSTGRES_PASSWORD=devhud \
            --env POSTGRES_USER=devhud \
            --publish 5432:5432 \
            --health-cmd "pg_isready -U devhud -d devhud_api_test" \
            --health-interval 5s \
            --health-timeout 5s \
            --health-retries 10 \
            postgres:15-bookworm >/dev/null
          for _ in {1..60}; do
            status=$(docker inspect --format '{{.State.Health.Status}}' devhud-postgres)
            if [ "$status" = healthy ]; then
              exit 0
            fi
            if [ "$status" = unhealthy ]; then
              break
            fi
            sleep 1
          done
          docker logs devhud-postgres
          echo "DevHud OCI PostgreSQL did not become healthy" >&2
          exit 1

      - name: Build and inspect amd64/arm64 OCI layout
        if: ${{ steps.gate.outputs.run == 'true' }}
        env:
          DEVHUD_TEST_DATABASE_URL: postgres://devhud:devhud@127.0.0.1:5432/devhud_api_test?sslmode=disable
          OCI_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/devhud-$OCI_TARGET.oci.tar"
          image="devhud-$OCI_TARGET:ci"
          version=$(node -p "require('./packaging/devhud/release-metadata.json').version")
          docker buildx build --platform linux/amd64,linux/arm64 --target "$OCI_TARGET" --build-arg VERSION="$version" --build-arg REVISION="$GITHUB_SHA" --output "type=oci,dest=$artifact" -f servers/devhud-api/Dockerfile .
          tar -tf "$artifact" | grep -Fx index.json
          for arch in amd64 arm64; do
            skopeo inspect --override-arch "$arch" --config "oci-archive:$artifact" | jq -e '.config.User == "65532" and .config.Labels["io.delino.devhud.migrations"] == "embedded" and .config.Labels["io.delino.devhud.administrator-assets"] == "embedded"'
          done
          docker buildx build --platform linux/amd64 --target "$OCI_TARGET" --build-arg VERSION="$version" --build-arg REVISION="$GITHUB_SHA" --load --tag "$image" -f servers/devhud-api/Dockerfile .
          container_database_url="postgres://devhud:devhud@host.docker.internal:5432/devhud_api_test?sslmode=disable"
          docker_args=(--rm --user 65532:65532 --add-host host.docker.internal:host-gateway -e "DEVHUD_DATABASE_URL=$container_database_url")
          if [ "$OCI_TARGET" = api ]; then
            docker run "${docker_args[@]}" "$image" migrate
          else
            DEVHUD_DATABASE_URL="$DEVHUD_TEST_DATABASE_URL" go run ./servers/devhud-api/cmd/devhud-api migrate
            docker run "${docker_args[@]}" \
              -e DEVHUD_ENVIRONMENT=development \
              -e DEVHUD_R2_ENDPOINT=http://127.0.0.1:9000 \
              -e DEVHUD_R2_ACCESS_KEY_ID=ci-access-key \
              -e DEVHUD_R2_SECRET_ACCESS_KEY=01234567890123456789012345678901 \
              -e DEVHUD_R2_STAGING_BUCKET=devhud-staging \
              -e DEVHUD_R2_PUBLIC_BUCKET=devhud-public \
              -e DEVHUD_PUBLIC_ASSET_BASE_URL=http://127.0.0.1:9000 \
              -e DEVHUD_CLOUDFLARE_API_TOKEN=ci-token \
              -e DEVHUD_CLOUDFLARE_ZONE_ID=ci-zone \
              "$image" --once
          fi
          "${{ steps.syft.outputs.cmd }}" scan "docker:$image" --output "spdx-json=$RUNNER_TEMP/devhud-$OCI_TARGET.spdx.json"
          jq -e '.spdxVersion == "SPDX-2.3" and (.packages | length > 0)' "$RUNNER_TEMP/devhud-$OCI_TARGET.spdx.json"

      - name: Verify embedded migrations against PostgreSQL
        if: ${{ steps.gate.outputs.run == 'true' }}
        env:
          DEVHUD_TEST_DATABASE_URL: postgres://devhud:devhud@127.0.0.1:5432/devhud_api_test?sslmode=disable
        run: go test -tags=integration ./servers/devhud-api/internal/postgres

      - name: Stop PostgreSQL
        if: ${{ always() && steps.gate.outputs.run == 'true' }}
        run: docker rm --force devhud-postgres >/dev/null 2>&1 || true

  devhud-supply-chain:
    name: DevHud installers, SBOM, provenance, and signature fixtures
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Filter changed paths
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: dorny/paths-filter@v4
        with:
          filters: |
            supply_chain:
              - .github/workflows/CI.yml
              - .nvmrc
              - .github/workflows/package-devhud-private.yml
              - .github/workflows/release-devhud.yml
              - .github/workflows/devhud-cef-security-review.yml
              - apps/devhud/**
              - apps/devhud-chrome-extension/**
              - crates/devhud-native-messaging-host/**
              - packaging/devhud/**
              - scripts/release/**

      - name: Determine whether to run
        id: gate
        shell: bash
        env:
          CHANGED: ${{ steps.filter.outputs.supply_chain }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          run=false
          if [ "$EVENT_NAME" = workflow_dispatch ] || [ "$CHANGED" = true ]; then run=true; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Skip (supply-chain inputs unaffected)
        if: ${{ steps.gate.outputs.run != 'true' }}
        run: 'echo "Skipping DevHud supply-chain fixtures: paths unaffected"'

      - name: Setup Node.js
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Validate installer, SPDX, provenance, updater, and key-rotation fixtures
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          node --test scripts/release/finalize-devhud-deb.test.mjs
          node --test scripts/release/generate-devhud-supply-chain.test.mjs
          node --test scripts/release/generate-devhud-updater.test.mjs
          node --test scripts/release/generate-checksums.test.mjs
          node --test scripts/release/validate-devhud-private-build.test.mjs
          node --test scripts/release/devhud-private-workflow.test.mjs


  devhud-release-contracts:
    name: DevHud Release Contracts
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Filter changed paths
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: dorny/paths-filter@v4
        with:
          filters: |
            release:
              - .github/workflows/CI.yml
              - .nvmrc
              - .github/workflows/package-devhud-private.yml
              - .github/workflows/release-devhud.yml
              - .github/workflows/devhud-cef-security-review.yml
              - packaging/devhud/**
              - scripts/release/**
              - apps/devhud/**
              - apps/devhud-admin/**
              - apps/devhud-chrome-extension/**
              - crates/devhud-native-messaging-host/**
              - protos/**
              - packages/**
              - servers/**
              - apps/public-docs/**
              - AGENTS.md
              - docs/README.md
              - docs/project-devhud.md
              - docs/apps-devhud-updater-contract.md
              - docs/servers-devhud-api-contract.md
              - docs/servers-devhud-release-controller-contract.md
              - docs/apps-devhud-operations-contract.md
              - docs/apps-devhud-support-contract.md
              - docs/repository-workflow-contract.md
              - scripts/release/devhud-operations.test.mjs
              - servers/devhud-api/internal/rpc/diagnostics.go

      - name: Determine whether to run
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_CHANGED: ${{ steps.filter.outputs.release }}
        run: |
          set -euo pipefail
          run=false
          if [ "$EVENT_NAME" = workflow_dispatch ] || [ "$RELEASE_CHANGED" = true ]; then run=true; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Skip (release contracts unaffected)
        if: ${{ steps.gate.outputs.run != 'true' }}
        run: 'echo "Skipping DevHud release contracts: paths unaffected"'

      - name: Setup Node.js
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Validate deterministic release contracts
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: node --test scripts/release/*.test.mjs

  ci-result:
    name: CI Result
    runs-on: ubuntu-latest
    if: always()
    needs:
      - ci-contracts
      - go-quality
      - go-test
      - repository-environment
      - rust-fmt
      - rust-clippy
      - rust-test
      - node-mpapp-test
      - node-mpapp-lint
      - node-binpm-docs-test
      - node-nodeup-docs-test
      - node-public-docs-test
      - devhud-frontend
      - devhud-extension
      - devhud-rust-conformance
      - devhud-security
      - devhud-desktop
      - devhud-mobile-contracts
      - devhud-ios-simulator
      - devhud-android-emulator
      - devhud-protocol
      - devhud-admin
      - devhud-api
      - devhud-oci
      - devhud-supply-chain
      - devhud-release-contracts
    steps:
      - run: exit 1
        if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
