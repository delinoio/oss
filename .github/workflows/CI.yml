  realqa-proto:
    name: RealQA devhud.realqa.v1 contract
    runs-on: ubuntu-latest
    needs: realqa-changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.realqa-changes.outputs.proto == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve immutable RealQA compatibility baseline
        shell: bash
        env:
          BASELINE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          set -euo pipefail
          descriptor=protos/devhud-realqa/devhud.realqa.v1.binpb
          if [ -n "$BASELINE_COMMIT" ] && ! [[ "$BASELINE_COMMIT" =~ ^0+$ ]]; then
            git cat-file -e "${BASELINE_COMMIT}^{commit}"
            if git cat-file -e "${BASELINE_COMMIT}:${descriptor}"; then
              baseline="${RUNNER_TEMP}/devhud.realqa.v1.binpb"
              git show "${BASELINE_COMMIT}:${descriptor}" > "$baseline"
              echo "DEVHUD_REALQA_PROTO_BASELINE=${baseline}" >> "$GITHUB_ENV"
            fi
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.26.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check compatibility, two-pass generation, Go, and TypeScript
        run: pnpm ci:realqa:proto

  realqa-go-quality:
    name: RealQA Go formatting, vet, and unit
    runs-on: ubuntu-latest
    needs: realqa-changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.realqa-changes.outputs.server == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.26.2

      - name: Check RealQA formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l servers/devhud-realqa protos/devhud-realqa)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Vet RealQA server
        run: go vet ./servers/devhud-realqa/...

      - name: Run RealQA unit suite
        run: pnpm ci:realqa:go:unit

  realqa-postgres:
    name: RealQA PostgreSQL, migrations, and sqlc
    runs-on: ubuntu-latest
    needs: realqa-changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.realqa-changes.outputs.server == 'true' }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: realqa
          POSTGRES_PASSWORD: realqa_test
          POSTGRES_DB: realqa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U realqa -d realqa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0

      - name: Check generated sqlc output
        run: servers/devhud-realqa/scripts/check-sqlc.sh

      - name: Run PostgreSQL migration and service integration fixtures
        env:
          REALQA_TEST_DATABASE_URL: postgres://realqa:realqa_test@127.0.0.1:5432/realqa?sslmode=disable
        run: go test -p 1 -count=1 ./servers/devhud-realqa/db/migrations ./servers/devhud-realqa/internal/service

