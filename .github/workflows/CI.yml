name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-link-probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-09-28
      - name: Inspect native relative-link parent semantics
        shell: pwsh
        run: |
          rustc --edition=2021 scripts/ci/windows-parent-link-diagnostic.rs -o "$env:RUNNER_TEMP/windows-parent-link-diagnostic.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/windows-parent-link-diagnostic.exe"
          exit $LASTEXITCODE
