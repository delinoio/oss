  node-mpapp-test:
    name: Node mpapp test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: dorny/paths-filter@v4
        with:
          filters: |
            ci_workflow:
              - .github/workflows/CI.yml

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.26.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Determine whether to run
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CI_WORKFLOW_CHANGED: ${{ steps.filter.outputs.ci_workflow }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
          WORKSPACE: mpapp
        run: |
          set -euo pipefail

          run=false
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] || [ "${CI_WORKFLOW_CHANGED}" = "true" ]; then
            run=true
          else
            if [ "${EVENT_NAME}" = "push" ]; then
              export TURBO_SCM_BASE="${PUSH_BASE}"
              export TURBO_SCM_HEAD="${PUSH_HEAD}"
            fi
            pnpm install --frozen-lockfile --ignore-scripts
            affected_json="$(pnpm exec turbo run test --affected --filter "${WORKSPACE}" --dry=json)"
            printf '%s\n' "${affected_json}"
            run="$(printf '%s' "${affected_json}" | jq -r '.tasks | any(.package == env.WORKSPACE)')"
          fi

          echo "run=${run}" >> "${GITHUB_OUTPUT}"

      - name: Skip (mpapp unaffected)
        if: ${{ steps.gate.outputs.run != 'true' }}
        run: |
          echo "Skipping Node mpapp test: workspace unaffected"

      - name: Install dependencies
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Run mpapp tests
        if: ${{ steps.gate.outputs.run == 'true' }}
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.ci_workflow == 'true' }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          args=(run test --filter mpapp)
          if [ "$FORCE_RUN" != true ]; then
            args+=(--affected)
            if [ "$EVENT_NAME" = push ]; then
              export TURBO_SCM_BASE="$PUSH_BASE"
              export TURBO_SCM_HEAD="$PUSH_HEAD"
            fi
          fi
          pnpm exec turbo "${args[@]}"

