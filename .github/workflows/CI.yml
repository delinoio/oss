name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-link-probe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-09-28
      - name: Inspect native relative-link parent semantics
        shell: pwsh
        run: |
          rustc --edition=2021 scripts/ci/windows-parent-link-diagnostic.rs -o "$env:RUNNER_TEMP/windows-parent-link-diagnostic.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/windows-parent-link-diagnostic.exe"
          exit $LASTEXITCODE
      - name: Validate revised Windows reproduction fixtures
        shell: pwsh
        run: cargo test --locked -p clibox-fspy --lib -- --test-threads=4
  native-watch-probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-09-28
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Validate Linux terminal fixtures
        if: runner.os == 'Linux'
        run: |
          cargo test --locked -p clibox --test run -- --test-threads=4
          for attempt in 1 2 3 4 5; do
            cargo test --locked -p clibox --test run interactive_workload_keeps_foreground_terminal_access -- --exact --nocapture
          done
      - name: Validate complete native fspy library
        run: cargo test --locked -p clibox-fspy --lib -- --test-threads=4
      - name: Validate watch fixture lifecycle and event boundary
        run: cargo test --locked -p clibox --test fspy_watch -- --test-threads=4
