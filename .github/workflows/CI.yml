name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Plan affected CI jobs
    runs-on: ubuntu-24.04
    outputs:
      jobs: ${{ steps.rust.outputs.jobs || steps.plan.outputs.jobs }}
      rust_packages: ${{ steps.rust.outputs.rust_packages || '[]' }}
      forced: ${{ steps.plan.outputs.forced }}
      event: ${{ steps.plan.outputs.event }}
      desktop_matrix: ${{ steps.plan.outputs.desktop_matrix }}
      react_forge_matrix: ${{ steps.plan.outputs.react_forge_matrix }}
      pnport_matrix: ${{ steps.plan.outputs.pnport_matrix }}
      delidev_frontend_matrix: ${{ steps.plan.outputs.delidev_frontend_matrix }}
      base: ${{ steps.plan.outputs.base }}
      head: ${{ steps.plan.outputs.head }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Compare commits and select jobs
        id: plan
        run: node scripts/ci/plan.mjs

      - name: Install Rust for package metadata
        if: ${{ fromJSON(steps.plan.outputs.jobs)['rust-test'] || fromJSON(steps.plan.outputs.jobs)['rust-clippy'] }}
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-09-28
          components: clippy
      - name: Prepare verified prebuilt cargo-mono
        if: ${{ fromJSON(steps.plan.outputs.jobs)['rust-test'] || fromJSON(steps.plan.outputs.jobs)['rust-clippy'] }}
        id: cargo-mono
        run: node scripts/ci/cargo-mono-prebuilt.mjs
      - name: Setup Node.js for Turbo planning fixtures
        if: ${{ fromJSON(steps.plan.outputs.jobs)['rust-test'] || fromJSON(steps.plan.outputs.jobs)['rust-clippy'] }}
        id: ci-node
        uses: ./.github/actions/setup-ci-node
      - name: Install planning fixture dependencies
        if: ${{ fromJSON(steps.plan.outputs.jobs)['rust-test'] || fromJSON(steps.plan.outputs.jobs)['rust-clippy'] }}
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify published cargo-mono selection behavior
        if: ${{ fromJSON(steps.plan.outputs.jobs)['rust-test'] || fromJSON(steps.plan.outputs.jobs)['rust-clippy'] }}
        env:
          CARGO_MONO_TEST_BINARY: ${{ steps.cargo-mono.outputs.binary }}
          FORCE_RUN: 'true'
        run: node scripts/ci/run-affected.mjs @delinoio/ci ci:rust:selection-fixture
      - name: Select final Rust packages and jobs
        if: ${{ fromJSON(steps.plan.outputs.jobs)['rust-test'] || fromJSON(steps.plan.outputs.jobs)['rust-clippy'] }}
        id: rust
        env:
          CI_BASE: ${{ steps.plan.outputs.base }}
          CI_HEAD: ${{ steps.plan.outputs.head }}
          CI_JOBS: ${{ steps.plan.outputs.jobs }}
          CI_FORCED: ${{ steps.plan.outputs.forced }}
          CARGO_MONO_BINARY: ${{ steps.cargo-mono.outputs.binary }}
        run: node scripts/ci/rust-affected.mjs plan

      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-node.outcome == 'success' && steps.ci-node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ci-node.outputs.cache-path }}
          key: ${{ steps.ci-node.outputs.cache-key }}
      - name: Preserve Turbo run summaries
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: turbo-changes-${{ github.run_attempt }}
          path: .turbo/runs/*.json
          if-no-files-found: ignore

  ci-contracts:
    name: CI contracts and workflow syntax
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        id: ci-node
        uses: ./.github/actions/setup-ci-node

      - name: Setup Turbo remote cache
        uses: ./.github/actions/setup-turbo-cache
        with:
          team: ${{ vars.TURBO_TEAM }}
          policy: ${{ vars.TURBO_OIDC_POLICY }}

      - name: Setup Go
        if: ${{ runner.os == 'Linux' }}
        id: ci-go
        uses: ./.github/actions/setup-ci-go
        with:
          cache-scope: ci-contracts

      - name: Install clean locked workspace
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate workflow syntax
        if: ${{ runner.os == 'Linux' }}
        run: node scripts/ci/run-affected.mjs @delinoio/ci ci:workflows
        env:
          FORCE_RUN: 'true'

      - name: Validate CI contracts and affected behavior
        if: ${{ runner.os == 'Linux' }}
        run: node scripts/ci/run-affected.mjs @delinoio/ci ci:contracts
        env:
          FORCE_RUN: 'true'

      - name: Validate protocol launcher on native host
        if: ${{ runner.os != 'Linux' }}
        run: node scripts/ci/run-affected.mjs @delinoio/ci ci:proto:launcher
        env:
          FORCE_RUN: 'true'

      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ci-node.outputs.cache-path }}
          key: ${{ steps.ci-node.outputs.cache-key }}

      - name: Save Go cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-go.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ci-go.outputs.cache-path }}
          key: ${{ steps.ci-go.outputs.cache-key }}

      - name: Preserve Turbo run summaries
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: turbo-ci-contracts-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: .turbo/runs/*.json
          if-no-files-found: ignore

  go-quality:
    needs: changes
    if: ${{ needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['go-quality'] }}
    name: Go Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup Go
        id: ci-go
        uses: ./.github/actions/setup-ci-go
        with:
          cache-scope: go-quality

      - name: Setup Node.js
        id: ci-node
        uses: ./.github/actions/setup-ci-node

      - name: Setup Turbo remote cache
        uses: ./.github/actions/setup-turbo-cache
        with:
          team: ${{ vars.TURBO_TEAM }}
          policy: ${{ vars.TURBO_OIDC_POLICY }}

      - name: Generate and verify embedded administrator assets
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check Go formatting and vet
        env:
          FORCE_RUN: 'true'
          CI_GO_MODE: ${{ github.event_name == 'pull_request' && !fromJSON(needs.changes.outputs.forced)['go-quality'] && 'affected' || 'full' }}
          CI_GO_BASE: ${{ needs.changes.outputs.base }}
          CI_GO_HEAD: ${{ needs.changes.outputs.head }}
        run: node scripts/ci/run-affected.mjs @delinoio/ci ci:go:quality


      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ci-node.outputs.cache-path }}
          key: ${{ steps.ci-node.outputs.cache-key }}

      - name: Save Go cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-go.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ci-go.outputs.cache-path }}
          key: ${{ steps.ci-go.outputs.cache-key }}

      - name: Preserve Turbo run summaries
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: turbo-go-quality-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: .turbo/runs/*.json
          if-no-files-found: ignore

  go-test:
    needs: changes
    if: ${{ needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['go-test'] }}
    name: Go Test (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, shard: all, label: ubuntu-latest }
          - { os: macos-latest, shard: all, label: macos-latest }
          - { os: windows-latest, shard: core, label: "windows-latest, core" }
          - { os: windows-latest, shard: server, label: "windows-latest, server" }
          - { os: windows-latest, shard: harness, label: "windows-latest, harness" }
          - { os: windows-latest, shard: worker, label: "windows-latest, worker" }
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup Go
        id: ci-go
        uses: ./.github/actions/setup-ci-go
        with:
          cache-scope: ${{ format('go-test-{0}', matrix.shard) }}

      - name: Setup Node.js
        id: ci-node
        uses: ./.github/actions/setup-ci-node

      - name: Setup Turbo remote cache
        uses: ./.github/actions/setup-turbo-cache
        with:
          team: ${{ vars.TURBO_TEAM }}
          policy: ${{ vars.TURBO_OIDC_POLICY }}

      - name: Generate and verify embedded administrator assets
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify native affected Go discovery
        run: node scripts/ci/run-affected.mjs @delinoio/ci ci:go:discovery
        env:
          FORCE_RUN: 'true'

      - name: Run go test
        run: node scripts/ci/run-affected.mjs @delinoio/ci ci:go:test
        env:
          CI_GO_TEST_SHARD: ${{ matrix.shard }}
          FORCE_RUN: 'true'
          CI_GO_MODE: ${{ github.event_name == 'pull_request' && !fromJSON(needs.changes.outputs.forced)['go-test'] && 'affected' || 'full' }}
          CI_GO_BASE: ${{ needs.changes.outputs.base }}
          CI_GO_HEAD: ${{ needs.changes.outputs.head }}

      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ci-node.outputs.cache-path }}
          key: ${{ steps.ci-node.outputs.cache-key }}

      - name: Save Go cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-go.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ci-go.outputs.cache-path }}
          key: ${{ steps.ci-go.outputs.cache-key }}

      - name: Preserve Turbo run summaries
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: turbo-go-test-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: .turbo/runs/*.json
          if-no-files-found: ignore

  repository-environment:
    needs: changes
    if: ${{ needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['repository-environment'] }}
    name: Repository environment (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        id: ci-node
        uses: ./.github/actions/setup-ci-node

      - name: Setup Turbo remote cache
        uses: ./.github/actions/setup-turbo-cache
        with:
          team: ${{ vars.TURBO_TEAM }}
          policy: ${{ vars.TURBO_OIDC_POLICY }}

      - name: Install workspace
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Test repository environment contract
        run: node scripts/ci/run-affected.mjs @delinoio/ci ci:environment ci:environment:turbo
        env:
          FORCE_RUN: 'true'

      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ci-node.outputs.cache-path }}
          key: ${{ steps.ci-node.outputs.cache-key }}

      - name: Preserve Turbo run summaries
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: turbo-repository-environment-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: .turbo/runs/*.json
          if-no-files-found: ignore

  rust-fmt:
    needs: changes
    if: ${{ needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['rust-fmt'] }}
    name: Rust fmt
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-09-28
          components: rustfmt

      - name: Setup Node.js
        id: ci-node
        uses: ./.github/actions/setup-ci-node
      - name: Setup Turbo remote cache
        uses: ./.github/actions/setup-turbo-cache
        with:
          team: ${{ vars.TURBO_TEAM }}
          policy: ${{ vars.TURBO_OIDC_POLICY }}

      - name: Install locked workspace tools
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run rustfmt
        run: node scripts/ci/run-affected.mjs @delinoio/ci ci:rust:fmt
        env:
          FORCE_RUN: 'true'

      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ci-node.outputs.cache-path }}
          key: ${{ steps.ci-node.outputs.cache-key }}

      - name: Preserve Turbo run summaries
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: turbo-rust-fmt-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: .turbo/runs/*.json
          if-no-files-found: ignore

  rust-clippy:
    needs: changes
    if: ${{ needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['rust-clippy'] }}
    name: Rust clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-09-28
          components: clippy

      - name: Setup Go for DeliDev sidecar
        if: ${{ contains(fromJSON(needs.changes.outputs.rust_packages), 'delidev-desktop') }}
        id: ci-go
        uses: ./.github/actions/setup-ci-go

      - name: Setup Node.js
        id: ci-node
        uses: ./.github/actions/setup-ci-node

      - name: Setup Turbo remote cache
        uses: ./.github/actions/setup-turbo-cache
        with:
          team: ${{ vars.TURBO_TEAM }}
          policy: ${{ vars.TURBO_OIDC_POLICY }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install DevHUD Linux prerequisites
        if: ${{ contains(fromJSON(needs.changes.outputs.rust_packages), 'devhud') || contains(fromJSON(needs.changes.outputs.rust_packages), 'delidev-desktop') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libayatana-appindicator3-dev libgbm-dev libgtk-3-dev libgtk-4-dev xdg-desktop-portal xdg-desktop-portal-gtk zenity libwebkit2gtk-4.1-dev libx11-dev libxtst-dev ninja-build

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: false

      - name: Run clippy
        run: node scripts/ci/run-rust.mjs clippy
        env:
          RUST_PACKAGES: ${{ needs.changes.outputs.rust_packages }}
          FORCE_RUN: 'true'

      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ci-node.outputs.cache-path }}
          key: ${{ steps.ci-node.outputs.cache-key }}

      - name: Save Go cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-go.outcome == 'success' && steps.ci-go.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ci-go.outputs.cache-path }}
          key: ${{ steps.ci-go.outputs.cache-key }}

      - name: Preserve Turbo run summaries
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: turbo-rust-clippy-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: .turbo/runs/*.json
          if-no-files-found: ignore

  rust-test:
    needs: changes
    if: ${{ needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['rust-test'] }}
    name: Rust test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-09-28

      - name: Setup Go for Rust test prerequisites
        if: ${{ contains(fromJSON(needs.changes.outputs.rust_packages), 'delidev-desktop') || contains(fromJSON(needs.changes.outputs.rust_packages), 'pnport') }}
        id: ci-go
        uses: ./.github/actions/setup-ci-go

      - name: Setup Node.js
        id: ci-node
        uses: ./.github/actions/setup-ci-node

      - name: Setup Turbo remote cache
        uses: ./.github/actions/setup-turbo-cache
        with:
          team: ${{ vars.TURBO_TEAM }}
          policy: ${{ vars.TURBO_OIDC_POLICY }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install DevHUD Linux prerequisites
        if: ${{ contains(fromJSON(needs.changes.outputs.rust_packages), 'devhud') || contains(fromJSON(needs.changes.outputs.rust_packages), 'delidev-desktop') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libayatana-appindicator3-dev libgbm-dev libgtk-3-dev libgtk-4-dev xdg-desktop-portal xdg-desktop-portal-gtk zenity libwebkit2gtk-4.1-dev libx11-dev libxtst-dev ninja-build

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: false

      - name: Run cargo test
        run: node scripts/ci/run-rust.mjs test
        env:
          RUST_PACKAGES: ${{ needs.changes.outputs.rust_packages }}
          FORCE_RUN: 'true'

      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ci-node.outputs.cache-path }}
          key: ${{ steps.ci-node.outputs.cache-key }}

      - name: Save Go cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-go.outcome == 'success' && steps.ci-go.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ci-go.outputs.cache-path }}
          key: ${{ steps.ci-go.outputs.cache-key }}

      - name: Preserve Turbo run summaries
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: turbo-rust-test-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: .turbo/runs/*.json
          if-no-files-found: ignore

  forge-test:
    needs: changes
    if: ${{ needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['forge-test'] }}
    name: Forge PPTX (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-09-28
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: false
      - name: Setup Node.js
        id: ci-node
        uses: ./.github/actions/setup-ci-node
      - name: Setup Turbo remote cache
        uses: ./.github/actions/setup-turbo-cache
        with:
          team: ${{ vars.TURBO_TEAM }}
          policy: ${{ vars.TURBO_OIDC_POLICY }}

      - name: Install locked workspace tools
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Test DSL, native PPTX preservation, revisions and official MCP client
        run: node scripts/ci/run-affected.mjs @delinoio/ci ci:forge:test
        env:
          FORCE_RUN: 'true'

      - name: Check Forge formatting and Clippy
        run: node scripts/ci/run-affected.mjs @delinoio/ci ci:rust:fmt ci:forge:clippy
        env:
          FORCE_RUN: 'true'

      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ci-node.outputs.cache-path }}
          key: ${{ steps.ci-node.outputs.cache-key }}

      - name: Preserve Turbo run summaries
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: turbo-forge-test-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: .turbo/runs/*.json
          if-no-files-found: ignore

  forge-render:
    needs: changes
    if: ${{ needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['forge-render'] }}
    name: Forge Linux rendering
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-09-28
      - name: Install optional renderers
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-impress poppler-utils
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: false
      - name: Setup Node.js
        id: ci-node
        uses: ./.github/actions/setup-ci-node
      - name: Setup Turbo remote cache
        uses: ./.github/actions/setup-turbo-cache
        with:
          team: ${{ vars.TURBO_TEAM }}
          policy: ${{ vars.TURBO_OIDC_POLICY }}

      - name: Install locked workspace tools
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Render generated and edited external decks
        run: node scripts/ci/run-affected.mjs @delinoio/ci ci:forge:render
        env:
          FORGE_RENDER_ARTIFACTS: ${{ runner.temp }}/forge-render
          FORCE_RUN: 'true'

