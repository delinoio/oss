  realqa-server-images:
    name: RealQA non-root image fixture (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: realqa-changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.realqa-changes.outputs.packaging == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build local architecture fixture
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker buildx build \
            --platform "$PLATFORM" \
            --output type=docker \
            --build-arg VERSION=ci-fixture \
            --build-arg "REVISION=${GITHUB_SHA}" \
            --build-arg SOURCE=https://github.com/delinoio/oss \
            --file servers/devhud-realqa/Dockerfile \
            --tag "devhud-realqa:ci-${ARCH}" \
            .

      - name: Validate non-root image contents and metadata
        env:
          REALQA_TEST_IMAGE: devhud-realqa:ci-${{ matrix.arch }}
          REALQA_TEST_BUILD_IMAGE: "false"
          REALQA_TEST_EXPECTED_VERSION: ci-fixture
          REALQA_TEST_EXPECTED_REVISION: ${{ github.sha }}
        run: servers/devhud-realqa/scripts/test-image.sh

      - name: Generate platform SPDX SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: devhud-realqa:ci-${{ matrix.arch }}
          format: spdx-json
          output-file: realqa-${{ matrix.arch }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.1

      - name: Validate local SBOM, signature, and provenance statement
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          COSIGN_PASSWORD: realqa-ci-fixture-only
        run: |
          set -euo pipefail
          sbom="realqa-${ARCH}.spdx.json"
          jq -e '.spdxVersion | startswith("SPDX-")' "$sbom" >/dev/null
          image_id="$(docker image inspect --format '{{.Id}}' "devhud-realqa:ci-${ARCH}")"
          image_digest="${image_id#sha256:}"
          jq -n \
            --arg digest "$image_digest" \
            --arg arch "$ARCH" \
            '{
              _type: "https://in-toto.io/Statement/v1",
              subject: [{name: "devhud-realqa-ci-fixture", digest: {sha256: $digest}}],
              predicateType: "https://slsa.dev/provenance/v1",
              predicate: {buildDefinition: {buildType: "https://deli.dev/realqa/ci-fixture/v1", externalParameters: {platform: ("linux/" + $arch)}}, runDetails: {builder: {id: "github-actions-ci-fixture"}}}
            }' > "realqa-${ARCH}.provenance.json"
          prefix="${RUNNER_TEMP}/realqa-${ARCH}-fixture"
          cosign generate-key-pair --output-key-prefix "$prefix"
          cosign sign-blob --yes --key "${prefix}.key" --bundle "realqa-${ARCH}.sbom.sigstore.json" "$sbom"
          cosign verify-blob --key "${prefix}.pub" --bundle "realqa-${ARCH}.sbom.sigstore.json" "$sbom"
          cosign sign-blob --yes --key "${prefix}.key" --bundle "realqa-${ARCH}.provenance.sigstore.json" "realqa-${ARCH}.provenance.json"
          cosign verify-blob --key "${prefix}.pub" --bundle "realqa-${ARCH}.provenance.sigstore.json" "realqa-${ARCH}.provenance.json"
          cp "${prefix}.pub" "realqa-${ARCH}.fixture.pub"
          go test -count=1 -run TestSupplyChainDefinitionIsFixtureOnlyAndFailClosed ./servers/devhud-realqa/artifacts

      - name: Upload image validation fixtures
        uses: actions/upload-artifact@v7
        with:
          name: realqa-image-${{ matrix.arch }}-fixtures
          path: |
            realqa-${{ matrix.arch }}.spdx.json
            realqa-${{ matrix.arch }}.sbom.sigstore.json
            realqa-${{ matrix.arch }}.provenance.json
            realqa-${{ matrix.arch }}.provenance.sigstore.json
            realqa-${{ matrix.arch }}.fixture.pub
          if-no-files-found: error
          overwrite: true

  realqa-fixture-artifacts:
    name: RealQA signed-host-ready fixture artifacts
    runs-on: ubuntu-latest
    needs: realqa-changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.realqa-changes.outputs.packaging == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-01-01

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.26.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop Native Messaging host and MV3 fixture artifacts
        env:
          DEVHUD_REALQA_FIXTURE_TARGET: linux-amd64
        run: pnpm ci:realqa:fixture-artifacts

      - name: Prove release identity injection fails closed
        shell: bash
        run: |
          set -euo pipefail
          if pnpm --filter devhud check:realqa:package > release-check.txt 2>&1; then
            echo "release package check unexpectedly accepted fixture-only inputs" >&2
            exit 1
          fi
          grep -q "release packaging requires DEVHUD_CHROME_EXTENSION_ID" release-check.txt

      - name: Generate fixture artifact SPDX SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          path: apps/devhud/build/realqa-fixtures
          format: spdx-json
          output-file: apps/devhud/build/realqa-fixtures.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.1

      - name: Sign and verify fixture artifact definitions locally
        shell: bash
        env:
          COSIGN_PASSWORD: realqa-ci-fixture-only
        run: |
          set -euo pipefail
          manifest=apps/devhud/build/realqa-fixtures/artifact-manifest.json
          sbom=apps/devhud/build/realqa-fixtures.spdx.json
          jq -e '.fixtureOnly and (.publishable | not) and .signedHostReady and (.productionIdentityInjected | not)' "$manifest" >/dev/null
          jq -e '.spdxVersion | startswith("SPDX-")' "$sbom" >/dev/null
          prefix="${RUNNER_TEMP}/realqa-desktop-extension-fixture"
          cosign generate-key-pair --output-key-prefix "$prefix"
          cosign sign-blob --yes --key "${prefix}.key" --bundle apps/devhud/build/realqa-fixtures.sigstore.json "$manifest"
          cosign verify-blob --key "${prefix}.pub" --bundle apps/devhud/build/realqa-fixtures.sigstore.json "$manifest"
          cosign sign-blob --yes --key "${prefix}.key" --bundle apps/devhud/build/realqa-fixtures.sbom.sigstore.json "$sbom"
          cosign verify-blob --key "${prefix}.pub" --bundle apps/devhud/build/realqa-fixtures.sbom.sigstore.json "$sbom"
          cp "${prefix}.pub" apps/devhud/build/realqa-fixtures.fixture.pub

      - name: Upload fixture-only desktop and extension artifacts
        uses: actions/upload-artifact@v7
        with:
          name: realqa-linux-amd64-desktop-extension-fixtures
          path: |
            apps/devhud/build/realqa-fixtures/**
            apps/devhud/build/realqa-fixtures.spdx.json
            apps/devhud/build/realqa-fixtures.sigstore.json
            apps/devhud/build/realqa-fixtures.sbom.sigstore.json
            apps/devhud/build/realqa-fixtures.fixture.pub
          if-no-files-found: error
          overwrite: true

  realqa-safety:
    name: RealQA inactive-production safety boundary
    runs-on: ubuntu-latest
    needs: realqa-changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.realqa-changes.outputs.safety == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.26.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Validate read-only fixture and inactive-production policy
        run: |
          pnpm ci:realqa:safety
          pnpm --filter devhud check:mobile
          go test -count=1 ./servers/devhud-realqa/artifacts ./servers/devhud-realqa/internal/config
          go test -count=1 -run 'TestManifestHasOnlyConfiguredMinimumPermissions' ./servers/devhud-realqa/internal/github

  ci-result:
    name: CI Result
    runs-on: ubuntu-latest
    if: always()
    needs:
      - go-quality
      - go-test
      - delibase-server
      - devhud-deck-server
      - devhud-realqa-server
      - proto-contracts
      - rust-fmt
      - rust-clippy
      - rust-test
      - devhud-realqa-macos
      - node-mpapp-test
      - node-mpapp-lint
      - node-devhud
      - devhud-windows-capture
      - devhud-widget-android
      - devhud-widget-ios
      - node-binpm-docs-test
      - node-nodeup-docs-test
      - node-public-docs-test
      - node-delidev-app
      - realqa-changes
      - realqa-proto
      - realqa-go-quality
      - realqa-postgres
      - realqa-integrations
      - realqa-billing-races
      - realqa-frontend
      - realqa-rust
      - realqa-linux-capture
      - realqa-extension-native-messaging
      - realqa-delidev-settings
      - realqa-server-images
      - realqa-fixture-artifacts
      - realqa-safety
    steps:
      - run: exit 1
        if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
