            ${{ runner.temp }}/react-forge-benchmark.json
            ${{ runner.temp }}/react-forge-travel-ir.pptx
          if-no-files-found: error
          retention-days: 7
      - name: Remove generated package output
        if: always()
        run: rm -rf packages/react-forge/dist
      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
