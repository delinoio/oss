name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-quality:
    name: Go Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: dorny/paths-filter@v4
        with:
          filters: |
            go:
              - .github/workflows/CI.yml
              - go.mod
              - go.sum
              - cmds/**

      - name: Determine whether to run
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GO_CHANGED: ${{ steps.filter.outputs.go }}
        run: |
          set -euo pipefail

          run=false
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] || [ "${GO_CHANGED}" = "true" ]; then
            run=true
          fi

          echo "run=${run}" >> "${GITHUB_OUTPUT}"

      - name: Skip (no Go-related changes)
        if: ${{ steps.gate.outputs.run != 'true' }}
        run: |
          echo "Skipping Go Quality: no relevant changes"

      - name: Setup Go
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check go fmt
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          set -euo pipefail

          formatted_output="$(go fmt ./...)"
          if [ -n "$formatted_output" ]; then
            echo "::error::go fmt reformatted files. Run 'go fmt ./...' locally and commit the result."
            printf '%s\n' "$formatted_output"
            exit 1
          fi

      - name: Run go vet
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: go vet ./...

  go-test:
    name: Go Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: dorny/paths-filter@v4
        with:
          filters: |
            go:
              - .github/workflows/CI.yml
              - go.mod
              - go.sum
              - cmds/**

      - name: Determine whether to run
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GO_CHANGED: ${{ steps.filter.outputs.go }}
        run: |
          set -euo pipefail

          run=false
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] || [ "${GO_CHANGED}" = "true" ]; then
            run=true
          fi

          echo "run=${run}" >> "${GITHUB_OUTPUT}"

      - name: Skip (no Go-related changes)
        if: ${{ steps.gate.outputs.run != 'true' }}
        run: |
          echo "Skipping Go Test on ${{ matrix.os }}: no relevant changes"

      - name: Setup Go
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run go test
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: go test ./...


  rust-fmt:
    name: Rust fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: dorny/paths-filter@v4
        with:
          filters: |
            rust:
              - .github/workflows/CI.yml
              - Cargo.toml
              - Cargo.lock
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - rust-toolchain
              - rust-toolchain.toml
              - '**/rust-toolchain'
              - '**/rust-toolchain.toml'
              - '**/*.rs'
              - crates/**

      - name: Determine whether to run
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUST_CHANGED: ${{ steps.filter.outputs.rust }}
        run: |
          set -euo pipefail

          run=false
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] || [ "${RUST_CHANGED}" = "true" ]; then
            run=true
          fi

          echo "run=${run}" >> "${GITHUB_OUTPUT}"

      - name: Skip (no Rust-related changes)
        if: ${{ steps.gate.outputs.run != 'true' }}
        run: |
          echo "Skipping Rust fmt: no relevant changes"

      - name: Install Rust toolchain
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-01-01
          components: rustfmt

      - name: Cache Rust dependencies
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: Swatinem/rust-cache@v2

      - name: Run rustfmt
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: cargo fmt --all --check

  rust-clippy:
    name: Rust clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: dorny/paths-filter@v4
        with:
          filters: |
            rust:
              - .github/workflows/CI.yml
              - Cargo.toml
              - Cargo.lock
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - rust-toolchain
              - rust-toolchain.toml
              - '**/rust-toolchain'
              - '**/rust-toolchain.toml'
              - '**/*.rs'
              - crates/**

      - name: Determine whether to run
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUST_CHANGED: ${{ steps.filter.outputs.rust }}
        run: |
          set -euo pipefail

          run=false
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] || [ "${RUST_CHANGED}" = "true" ]; then
            run=true
          fi

          echo "run=${run}" >> "${GITHUB_OUTPUT}"

      - name: Skip (no Rust-related changes)
        if: ${{ steps.gate.outputs.run != 'true' }}
        run: |
          echo "Skipping Rust clippy: no relevant changes"

      - name: Install Rust toolchain
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-01-01
          components: clippy

      - name: Setup pnpm
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: pnpm/action-setup@v5
        with:
          version: 10.26.2

      - name: Setup Node.js
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Build DevHUD frontend
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: pnpm --filter devhud build:frontend

      - name: Install DevHUD Linux prerequisites
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev libx11-dev ninja-build

      - name: Cache Rust dependencies
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

