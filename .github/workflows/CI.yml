      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Linux font dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig1-dev fonts-noto-core fonts-noto-cjk fonts-noto-color-emoji
      - name: Register Windows system test font
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packages/react-forge/scripts/install-ci-fonts.ps1
      - name: Install test-only macOS renderers
        if: runner.os == 'macOS'
        run: |
          brew install --cask libreoffice
          brew install poppler
          python3 -m venv "$RUNNER_TEMP/react-forge-python"
          "$RUNNER_TEMP/react-forge-python/bin/pip" install -r packages/react-forge/scripts/render-requirements.txt
      - name: Install test-only Linux renderers
        if: runner.os == 'Linux'
