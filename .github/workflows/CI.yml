  devhud-desktop:
    name: ${{ matrix.id }} host and smoke
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-x64
            runner: macos-15-intel
            os: macos
            bundle: app
          - id: macos-arm64
            runner: macos-15
            os: macos
            bundle: app
          - id: windows-x64
            runner: windows-2022
            os: windows
            bundle: nsis
          - id: windows-arm64
            runner: windows-11-arm
            os: windows
            bundle: nsis
          - id: ubuntu-x64
            runner: ubuntu-22.04
            os: linux
            bundle: deb
          - id: ubuntu-arm64
            runner: ubuntu-22.04-arm
            os: linux
            bundle: deb

    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: dorny/paths-filter@v4
        with:
          filters: |
            devhud:
              - .github/workflows/CI.yml
              - apps/devhud/**
              - scripts/run-rsbuild-dev.mjs
              - scripts/spawn-dev-server.mjs
              - .nvmrc
              - Cargo.toml
              - Cargo.lock
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - rust-toolchain

      - name: Determine whether to run
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEVHUD_CHANGED: ${{ steps.filter.outputs.devhud }}
        run: |
          set -euo pipefail

          run=false
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] || [ "${DEVHUD_CHANGED}" = "true" ]; then
            run=true
          fi

          echo "run=${run}" >> "${GITHUB_OUTPUT}"

      - name: Skip (DevHUD desktop unaffected)
        if: ${{ steps.gate.outputs.run != 'true' }}
        run: |
          echo "Skipping DevHUD desktop host and smoke: no relevant changes"

      - name: Setup pnpm
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: pnpm/action-setup@v5
        with:
          version: 10.26.2

      - name: Setup Node.js
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Linux desktop prerequisites
        if: ${{ steps.gate.outputs.run == 'true' && matrix.os == 'linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake dbus-x11 libfuse2 libgtk-3-dev libx11-dev ninja-build patchelf xauth xvfb

      - name: Install dependencies
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Verify frontend and immutable pins
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          pnpm --filter devhud test
          pnpm --filter devhud verify:pins

      - name: Build native production package
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: pnpm --filter devhud build -- --bundles ${{ matrix.bundle }}

      - name: Prepare Windows installed layout
        if: ${{ steps.gate.outputs.run == 'true' && matrix.os == 'windows' }}
        shell: pwsh
        run: |
          $installer = Get-Item target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP "devhud-smoke"
          $process = Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$installDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "DevHUD installer exited $($process.ExitCode)" }
          "DEVHUD_SMOKE_ARTIFACT=$installDir\devhud.exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Prepare Ubuntu installed layout
        if: ${{ steps.gate.outputs.run == 'true' && matrix.os == 'linux' }}
        run: |
          mkdir -p target/devhud-smoke-root
          dpkg-deb -x target/release/bundle/deb/*.deb target/devhud-smoke-root
          sudo chown root:root target/devhud-smoke-root/usr/share/DevHUD/chrome-sandbox
          sudo chmod 4755 target/devhud-smoke-root/usr/share/DevHUD/chrome-sandbox

      - name: Run macOS platform smoke
        if: ${{ steps.gate.outputs.run == 'true' && matrix.os == 'macos' }}
        run: pnpm --filter devhud smoke:platform

      - name: Run Windows platform smoke
        if: ${{ steps.gate.outputs.run == 'true' && matrix.os == 'windows' }}
        shell: pwsh
        run: pnpm --filter devhud smoke:platform -- --artifact "$env:DEVHUD_SMOKE_ARTIFACT"

      - name: Run Ubuntu X11 platform smoke
        if: ${{ steps.gate.outputs.run == 'true' && matrix.os == 'linux' }}
        env:
          XDG_SESSION_TYPE: x11
          WAYLAND_DISPLAY: ""
        run: xvfb-run -a pnpm --filter devhud smoke:platform -- --artifact target/devhud-smoke-root/usr/bin/devhud


  ci-result:
    name: CI Result
    runs-on: ubuntu-latest
    if: always()
    needs:
      - go-quality
      - go-test
      - rust-fmt
      - rust-clippy
      - rust-test
      - node-mpapp-test
      - node-mpapp-lint
      - node-binpm-docs-test
      - node-nodeup-docs-test
      - node-public-docs-test
      - devhud-desktop
    steps:
      - run: exit 1
        if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
