    name: React Forge ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      # Native tests and the package build share compiled dependencies while
      # every test, CLI consumer and rendering check still executes uncached.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/react-forge
      REACT_FORGE_NATIVE_PROFILE: release
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.react_forge_matrix) }}
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: ./.github/actions/setup-ci-node
        id: ci-node
      - name: Setup Turbo remote cache
        uses: ./.github/actions/setup-turbo-cache
        with:
          team: ${{ vars.TURBO_TEAM }}
          policy: ${{ vars.TURBO_OIDC_POLICY }}

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-09-28
          components: clippy, rustfmt
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: false
