  devhud-desktop:
    name: ${{ matrix.id }} host and smoke
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-x64
            runner: macos-15-intel
            os: macos
            bundle: app
          - id: macos-arm64
            runner: macos-15
            os: macos
            bundle: app
          - id: windows-x64
            runner: windows-2022
            os: windows
            bundle: nsis
          - id: windows-arm64
            runner: windows-11-arm
            os: windows
            bundle: nsis
          - id: ubuntu-x64
            runner: ubuntu-22.04
            os: linux
            bundle: deb
          - id: ubuntu-arm64
            runner: ubuntu-22.04-arm
            os: linux
            bundle: deb

    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: dorny/paths-filter@v4
        with:
          filters: |
            devhud:
              - .github/workflows/CI.yml
              - apps/devhud/**
              - scripts/run-rsbuild-dev.mjs
              - scripts/spawn-dev-server.mjs
              - .nvmrc
              - Cargo.toml
              - Cargo.lock
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - rust-toolchain

      - name: Determine whether to run
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEVHUD_CHANGED: ${{ steps.filter.outputs.devhud }}
        run: |
          set -euo pipefail

          run=false
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] || [ "${DEVHUD_CHANGED}" = "true" ]; then
            run=true
          fi

          echo "run=${run}" >> "${GITHUB_OUTPUT}"

      - name: Skip (DevHUD desktop unaffected)
        if: ${{ steps.gate.outputs.run != 'true' }}
        run: |
          echo "Skipping DevHUD desktop host and smoke: no relevant changes"

      - name: Setup pnpm
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: pnpm/action-setup@v5
        with:
          version: 10.26.2

      - name: Setup Node.js
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install macOS Rust targets
        if: ${{ steps.gate.outputs.run == 'true' && matrix.os == 'macos' }}
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux desktop prerequisites
        if: ${{ steps.gate.outputs.run == 'true' && matrix.os == 'linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake dbus-x11 libayatana-appindicator3-dev libfuse2 libgtk-3-dev libx11-dev libxkbcommon-x11-0 ninja-build patchelf xauth xvfb

      - name: Install dependencies
        if: ${{ steps.gate.outputs.run == 'true' }}
        # CI runs the app checks explicitly; skip developer-only root prepare hooks,
        # which pnpm otherwise invokes through cmd.exe on Windows.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify frontend and immutable pins
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          pnpm --filter devhud test
          pnpm --filter devhud verify:pins

      - name: Build native production package
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: pnpm --filter devhud build -- --bundles ${{ matrix.bundle }}

      - name: Prepare Windows installed layout
        if: ${{ steps.gate.outputs.run == 'true' && matrix.os == 'windows' }}
        shell: pwsh
        run: |
          $installer = Get-Item target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP "devhud-smoke"
          $process = Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$installDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "DevHUD installer exited $($process.ExitCode)" }
          "DEVHUD_SMOKE_ARTIFACT=$installDir\devhud.exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Prepare Ubuntu installed layout
        if: ${{ steps.gate.outputs.run == 'true' && matrix.os == 'linux' }}
        run: |
          set -o pipefail
          shopt -s nullglob
          deb_packages=(target/release/bundle/deb/*.deb)
          if [ "${#deb_packages[@]}" -ne 1 ]; then
            echo "Expected exactly one DevHUD Debian package, found ${#deb_packages[@]}" >&2
            exit 1
          fi

          sandbox_metadata="$(dpkg-deb --fsys-tarfile "${deb_packages[0]}" | tar --numeric-owner -tvf - | awk '$6 == "usr/share/DevHUD/chrome-sandbox" || $6 == "./usr/share/DevHUD/chrome-sandbox" { print $1, $2 }')"
          if [ "${sandbox_metadata}" != "-rwsr-xr-x 0/0" ]; then
            echo "DevHUD Debian chrome-sandbox must record UID/GID 0/0 and mode 4755; found: ${sandbox_metadata:-missing}" >&2
            exit 1
          fi

          mkdir -p target/devhud-smoke-root
          dpkg-deb -x "${deb_packages[0]}" target/devhud-smoke-root
          sudo chown root:root target/devhud-smoke-root/usr/share/DevHUD/chrome-sandbox
          sudo chmod 4755 target/devhud-smoke-root/usr/share/DevHUD/chrome-sandbox

      - name: Run macOS platform smoke
        if: ${{ steps.gate.outputs.run == 'true' && matrix.os == 'macos' }}
        run: pnpm --filter devhud smoke:platform

      - name: Run Windows platform smoke
        if: ${{ steps.gate.outputs.run == 'true' && matrix.os == 'windows' }}
        shell: pwsh
        run: pnpm --filter devhud smoke:platform -- --artifact "$env:DEVHUD_SMOKE_ARTIFACT"

      - name: Run Ubuntu X11 platform smoke
        if: ${{ steps.gate.outputs.run == 'true' && matrix.os == 'linux' }}
        env:
          XDG_SESSION_TYPE: x11
          WAYLAND_DISPLAY: ""
        run: xvfb-run -a pnpm --filter devhud smoke:platform -- --artifact "${{ github.workspace }}/target/devhud-smoke-root/usr/bin/devhud"

  devhud-mobile-contracts:
    name: DevHUD mobile contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.26.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify shared frontend and mobile contracts
        run: |
          pnpm --filter devhud build:frontend
          pnpm --filter devhud mobile:check
          pnpm --filter devhud test:components

  devhud-ios-simulator:
    name: DevHUD iOS simulator (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-sim
            runner: macos-15
          - target: x86_64
            runner: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.26.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # The pinned Tauri bundler embeds a universal macOS CEF helper even when
      # its host CLI is invoked only to generate or build an iOS project.
      - name: Install macOS Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate pinned iOS project
        run: pnpm --filter devhud mobile:generate -- --platform ios

      - name: Build iOS simulator host
        working-directory: apps/devhud
        run: node scripts/run-mobile.mjs ios build --target ${{ matrix.target }} --ci

  devhud-android-emulator:
    name: DevHUD Android (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64
            abi: arm64-v8a
          - target: armv7
            abi: armeabi-v7a
          - target: x86_64
            abi: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.26.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libayatana-appindicator3-dev libgtk-3-dev libx11-dev ninja-build

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate pinned Android project
        run: pnpm --filter devhud mobile:generate -- --platform android

      - name: Build Android APK
        working-directory: apps/devhud
        run: node scripts/run-mobile.mjs android build --target ${{ matrix.target }} --apk --ci

      - name: Verify Android APK contracts
        working-directory: apps/devhud
        run: node scripts/verify-mobile.mjs --android-artifact src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk --android-abi ${{ matrix.abi }}

  devhud-protocol:
    name: DevHud Protocol and Client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: dorny/paths-filter@v4
        with:
          filters: |
            devhud_protocol:
              - .github/workflows/CI.yml
              - buf.yaml
              - buf.gen.yaml
              - go.mod
              - go.sum
              - .nvmrc
              - package.json
              - pnpm-workspace.yaml
              - pnpm-lock.yaml
              - protos/**
              - packages/devhud-api-client/**
              - scripts/check-proto-breaking.sh

      - name: Determine whether to run
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PROTOCOL_CHANGED: ${{ steps.filter.outputs.devhud_protocol }}
        run: |
          set -euo pipefail

          run=false
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] || [ "${PROTOCOL_CHANGED}" = "true" ]; then
            run=true
          fi

          echo "run=${run}" >> "${GITHUB_OUTPUT}"

      - name: Skip (DevHud protocol unaffected)
        if: ${{ steps.gate.outputs.run != 'true' }}
        run: |
          echo "Skipping DevHud protocol and client checks: paths unaffected"

      - name: Setup pnpm
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: pnpm/action-setup@v5
        with:
          version: 10.26.2

      - name: Setup Node.js
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Go
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install dependencies
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Check schemas and generated freshness
        if: ${{ steps.gate.outputs.run == 'true' }}
        env:
          DEVHUD_PROTO_BASELINE: ${{ github.event_name == 'push' && github.event.before || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && 'HEAD^') || 'origin/main' }}
        run: pnpm proto:check

      - name: Test Go bindings
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: go test ./protos/...

      - name: Check TypeScript client
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          pnpm --filter @delinoio/devhud-api-client lint
          pnpm --filter @delinoio/devhud-api-client test
          pnpm --filter @delinoio/devhud-api-client build


  ci-result:
    name: CI Result
    runs-on: ubuntu-latest
    if: always()
    needs:
      - go-quality
      - go-test
      - rust-fmt
      - rust-clippy
      - rust-test
      - node-mpapp-test
      - node-mpapp-lint
      - node-binpm-docs-test
      - node-nodeup-docs-test
      - node-public-docs-test
      - devhud-desktop
      - devhud-mobile-contracts
      - devhud-ios-simulator
      - devhud-android-emulator
      - devhud-protocol
    steps:
      - run: exit 1
        if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
