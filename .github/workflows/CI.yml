              - apps/devhud/src-tauri/src/realqa_capture/**

      - name: Determine whether to run
        id: gate
        shell: bash
        env:
          CAPTURE_CHANGED: ${{ steps.filter.outputs.capture }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          run=false
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] || [ "${CAPTURE_CHANGED}" = "true" ]; then
            run=true
