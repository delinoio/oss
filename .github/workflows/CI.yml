name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-quality:
    name: Go Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: dorny/paths-filter@v4
        with:
          filters: |
            go:
              - .github/workflows/CI.yml
              - go.mod
              - go.sum
              - scripts/lib/go-proto-tools.sh
              - cmds/**
              - servers/**

      - name: Determine whether to run
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GO_CHANGED: ${{ steps.filter.outputs.go }}
        run: |
          set -euo pipefail

          run=false
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] || [ "${GO_CHANGED}" = "true" ]; then
            run=true
          fi

          echo "run=${run}" >> "${GITHUB_OUTPUT}"

      - name: Skip (no Go-related changes)
        if: ${{ steps.gate.outputs.run != 'true' }}
        run: |
          echo "Skipping Go Quality: no relevant changes"

      - name: Setup Go
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check go fmt
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          set -euo pipefail

          formatted_output="$(go fmt ./...)"
          if [ -n "$formatted_output" ]; then
            echo "::error::go fmt reformatted files. Run 'go fmt ./...' locally and commit the result."
            printf '%s\n' "$formatted_output"
            exit 1
          fi

      - name: Run go vet
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: go vet ./...

  go-test:
    name: Go Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: dorny/paths-filter@v4
        with:
          filters: |
            go:
              - .github/workflows/CI.yml
              - go.mod
              - go.sum
              - scripts/lib/go-proto-tools.sh
              - cmds/**
              - servers/**

      - name: Determine whether to run
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GO_CHANGED: ${{ steps.filter.outputs.go }}
        run: |
          set -euo pipefail

          run=false
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] || [ "${GO_CHANGED}" = "true" ]; then
            run=true
          fi

          echo "run=${run}" >> "${GITHUB_OUTPUT}"

      - name: Skip (no Go-related changes)
        if: ${{ steps.gate.outputs.run != 'true' }}
        run: |
          echo "Skipping Go Test on ${{ matrix.os }}: no relevant changes"

      - name: Setup Go
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run go test
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: go test ./...

  delibase-server:
    name: Delibase Server
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: delibase
          POSTGRES_PASSWORD: delibase_test
          POSTGRES_DB: delibase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U delibase -d delibase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: dorny/paths-filter@v4
        with:
          filters: |
            delibase:
              - .github/workflows/CI.yml
              - .github/workflows/release-delibase.yml
              - go.mod
              - go.sum
              - protos/delibase/gen/go/**
              - servers/delibase/**
              - servers/internal/**

      - name: Determine whether to run
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DELIBASE_CHANGED: ${{ steps.filter.outputs.delibase }}
        run: |
          set -euo pipefail

          run=false
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] || [ "${DELIBASE_CHANGED}" = "true" ]; then
            run=true
          fi

          echo "run=${run}" >> "${GITHUB_OUTPUT}"

      - name: Skip (no delibase server changes)
        if: ${{ steps.gate.outputs.run != 'true' }}
        run: |
          echo "Skipping delibase server checks: no relevant changes"

      - name: Setup Go
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Validate delibase release tags
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: servers/delibase/scripts/test-release-tag.sh

      - name: Install sqlc
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0

      - name: Check sqlc generated output
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          set -euo pipefail

          servers/delibase/scripts/generate-sqlc.sh
          git diff --exit-code -- servers/delibase/internal/database/dbgen

      - name: Run delibase PostgreSQL tests
        if: ${{ steps.gate.outputs.run == 'true' }}
        env:
          DELIBASE_TEST_DATABASE_URL: postgres://delibase:delibase_test@127.0.0.1:5432/delibase?sslmode=disable
        # Integration packages share this database, and catalog tests replace
        # global catalog rows. Keep packages serial while preserving each
        # package's own concurrency coverage.
        run: go test -p 1 -count=1 ./servers/delibase/...

      - name: Validate delibase image
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: servers/delibase/scripts/test-image.sh

  devhud-deck-server:
    name: DevHud Deck Server
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: deck
          POSTGRES_PASSWORD: deck_test
          POSTGRES_DB: deck
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deck -d deck"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: dorny/paths-filter@v4
        with:
          filters: |
            deck:
              - .github/workflows/CI.yml
              - go.mod
              - go.sum
              - protos/delibase/gen/go/**
              - protos/devhud-deck/gen/go/**
              - servers/devhud-deck/**
              - servers/internal/**

      - name: Determine whether to run
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DECK_CHANGED: ${{ steps.filter.outputs.deck }}
        run: |
          set -euo pipefail

          run=false
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] || [ "${DECK_CHANGED}" = "true" ]; then
            run=true
          fi

          echo "run=${run}" >> "${GITHUB_OUTPUT}"

      - name: Skip (no Deck server changes)
        if: ${{ steps.gate.outputs.run != 'true' }}
        run: echo "Skipping Deck server checks"

      - name: Setup Go
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install sqlc
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0

      - name: Check Deck sqlc generated output
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          set -euo pipefail

          servers/devhud-deck/scripts/generate-sqlc.sh
          git diff --exit-code -- servers/devhud-deck/internal/database/dbgen

      - name: Run Deck PostgreSQL tests
        if: ${{ steps.gate.outputs.run == 'true' }}
        env:
          DECK_TEST_DATABASE_URL: postgres://deck:deck_test@127.0.0.1:5432/deck?sslmode=disable
        run: go test -count=1 ./servers/devhud-deck/...

      - name: Vet Deck
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: go vet ./servers/devhud-deck/...

  devhud-realqa-server:
    name: DevHud RealQA Server
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: realqa
          POSTGRES_PASSWORD: realqa_test
          POSTGRES_DB: realqa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U realqa -d realqa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Filter changed paths
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: dorny/paths-filter@v4
        with:
          filters: |
            realqa:
              - .github/workflows/CI.yml
              - go.mod
              - go.sum
              - protos/devhud-realqa/gen/go/**
              - servers/devhud-realqa/**
              - servers/internal/**

      - name: Determine whether to run
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REALQA_CHANGED: ${{ steps.filter.outputs.realqa }}
        run: |
          set -euo pipefail
          run=false
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] || [ "${REALQA_CHANGED}" = "true" ]; then
            run=true
          fi
          echo "run=${run}" >> "${GITHUB_OUTPUT}"

      - name: Skip (no RealQA server changes)
        if: ${{ steps.gate.outputs.run != 'true' }}
        run: echo "Skipping RealQA server checks"

      - name: Setup Go
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install sqlc
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0

      - name: Check RealQA sqlc output
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: servers/devhud-realqa/scripts/check-sqlc.sh

      - name: Run RealQA PostgreSQL and Go tests
        if: ${{ steps.gate.outputs.run == 'true' }}
        env:
          REALQA_TEST_DATABASE_URL: postgres://realqa:realqa_test@127.0.0.1:5432/realqa?sslmode=disable
        run: |
          go test -count=1 ./servers/devhud-realqa/...
          go vet ./servers/devhud-realqa/...

  proto-contracts:
    name: Protobuf contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: dorny/paths-filter@v4
        with:
          filters: |
            proto:
              - .github/workflows/CI.yml
              - go.mod
              - go.sum
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - protos/buf.yaml
              - protos/delibase/**
              - protos/devhud-deck/**
              - protos/devhud-realqa/**
              - scripts/check-proto-component.sh
              - scripts/check-proto.sh
              - scripts/generate-proto-component.sh
              - scripts/generate-proto.sh
              - scripts/lib/go-proto-tools.sh

      - name: Determine whether to run
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PROTO_CHANGED: ${{ steps.filter.outputs.proto }}
        run: |
          set -euo pipefail

          run=false
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] || [ "${PROTO_CHANGED}" = "true" ]; then
            run=true
          fi

          echo "run=${run}" >> "${GITHUB_OUTPUT}"

      - name: Skip (no shared Protobuf changes)
        if: ${{ steps.gate.outputs.run != 'true' }}
        run: |
          echo "Skipping shared Protobuf checks: no relevant changes"

      - name: Resolve Protobuf compatibility baselines
        if: ${{ steps.gate.outputs.run == 'true' }}
        shell: bash
        env:
          BASELINE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          set -euo pipefail

          if [ -z "${BASELINE_COMMIT}" ] || [[ "${BASELINE_COMMIT}" =~ ^0+$ ]]; then
            echo "No prior event commit is available; using checked-in baselines"
          elif ! git cat-file -e "${BASELINE_COMMIT}^{commit}"; then
            echo "The prior event commit is not available: ${BASELINE_COMMIT}" >&2
            exit 1
          else
            contracts=(
              "delibase:delibase.v1.binpb:DELIBASE_PROTO_BASELINE"
              "devhud-deck:devhud.deck.v1.binpb:DEVHUD_DECK_PROTO_BASELINE"
              "devhud-realqa:devhud.realqa.v1.binpb:DEVHUD_REALQA_PROTO_BASELINE"
            )
            for contract in "${contracts[@]}"; do
              IFS=: read -r component descriptor baseline_variable <<< "${contract}"
              baseline_path="protos/${component}/${descriptor}"
              if git cat-file -e "${BASELINE_COMMIT}:${baseline_path}"; then
                immutable_baseline="${RUNNER_TEMP}/${component}.v1.binpb"
                git show "${BASELINE_COMMIT}:${baseline_path}" > "${immutable_baseline}"
                echo "${baseline_variable}=${immutable_baseline}" >> "${GITHUB_ENV}"
                echo "Using the ${component} v1 baseline from ${BASELINE_COMMIT}"
              else
                echo "The prior event commit has no ${component} v1 baseline; using the checked-in initial baseline"
              fi
            done
          fi

      - name: Setup pnpm
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: pnpm/action-setup@v5
        with:
          version: 10.26.2

      - name: Setup Node.js
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Go
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install dependencies
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Check Protobuf compatibility and generated output
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: pnpm check:proto

      - name: Run Protobuf contract tests
        if: ${{ steps.gate.outputs.run == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          for component in delibase devhud-deck devhud-realqa; do
            component_root="protos/${component}"
            if [ ! -d "${component_root}" ] || \
              [ -z "$(find "${component_root}" -type f -name '*.go' -print -quit)" ]; then
              continue
            fi
            go test "./${component_root}/..."
          done

      - name: Run Protobuf contract vet
        if: ${{ steps.gate.outputs.run == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          for component in delibase devhud-deck devhud-realqa; do
            component_root="protos/${component}"
            if [ ! -d "${component_root}" ] || \
              [ -z "$(find "${component_root}" -type f -name '*.go' -print -quit)" ]; then
              continue
            fi
            go vet "./${component_root}/..."
          done

      - name: Typecheck Protobuf TypeScript artifacts
        if: ${{ steps.gate.outputs.run == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          for component in delibase devhud-deck devhud-realqa; do
            component_root="protos/${component}"
            if [ ! -f "${component_root}/package.json" ]; then
              continue
            fi
            pnpm --dir "${component_root}" run typecheck
          done

  rust-fmt:
    name: Rust fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: dorny/paths-filter@v4
        with:
          filters: |
            rust:
              - .github/workflows/CI.yml
              - Cargo.toml
              - Cargo.lock
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - rust-toolchain
              - rust-toolchain.toml
              - '**/rust-toolchain'
              - '**/rust-toolchain.toml'
              - '**/*.rs'
              - apps/devhud/src-tauri/capabilities/**
              - apps/devhud/src-tauri/tauri.conf.json
              - crates/**

      - name: Determine whether to run
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUST_CHANGED: ${{ steps.filter.outputs.rust }}
        run: |
          set -euo pipefail

          run=false
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] || [ "${RUST_CHANGED}" = "true" ]; then
            run=true
          fi

          echo "run=${run}" >> "${GITHUB_OUTPUT}"

      - name: Skip (no Rust-related changes)
        if: ${{ steps.gate.outputs.run != 'true' }}
        run: |
          echo "Skipping Rust fmt: no relevant changes"

      - name: Install Rust toolchain
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-01-01
          components: rustfmt

      - name: Cache Rust dependencies
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: Swatinem/rust-cache@v2

      - name: Run rustfmt
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: cargo fmt --all --check

  rust-clippy:
    name: Rust clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: dorny/paths-filter@v4
        with:
          filters: |
            rust:
              - .github/workflows/CI.yml
              - Cargo.toml
              - Cargo.lock
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - rust-toolchain
              - rust-toolchain.toml
              - '**/rust-toolchain'
              - '**/rust-toolchain.toml'
              - '**/*.rs'
              - apps/devhud/src-tauri/capabilities/**
              - apps/devhud/src-tauri/tauri.conf.json
              - crates/**

      - name: Determine whether to run
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUST_CHANGED: ${{ steps.filter.outputs.rust }}
        run: |
          set -euo pipefail

          run=false
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] || [ "${RUST_CHANGED}" = "true" ]; then
            run=true
          fi

          echo "run=${run}" >> "${GITHUB_OUTPUT}"

      - name: Skip (no Rust-related changes)
        if: ${{ steps.gate.outputs.run != 'true' }}
        run: |
          echo "Skipping Rust clippy: no relevant changes"

      - name: Install Rust toolchain
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-01-01
          components: clippy

      - name: Cache Rust dependencies
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: Swatinem/rust-cache@v2

      - name: Setup pnpm
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: pnpm/action-setup@v5
        with:
          version: 10.26.2

      - name: Setup Node.js
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Build DevHud frontend
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: pnpm --filter devhud build

      - name: Install DevHud Linux dependencies
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev

      - name: Run clippy
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          cargo clippy --workspace --all-targets --all-features --exclude devhud -- -D warnings
          cargo clippy -p devhud --all-targets --features desktop-cef --locked -- -D warnings

  rust-test:
    name: Rust test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: dorny/paths-filter@v4
        with:
          filters: |
            rust:
              - .github/workflows/CI.yml
              - Cargo.toml
              - Cargo.lock
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - rust-toolchain
              - rust-toolchain.toml
              - '**/rust-toolchain'
              - '**/rust-toolchain.toml'
              - '**/*.rs'
              - apps/devhud/src-tauri/capabilities/**
              - apps/devhud/src-tauri/tauri.conf.json
              - crates/**

      - name: Determine whether to run
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUST_CHANGED: ${{ steps.filter.outputs.rust }}
        run: |
          set -euo pipefail

          run=false
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] || [ "${RUST_CHANGED}" = "true" ]; then
            run=true
          fi

          echo "run=${run}" >> "${GITHUB_OUTPUT}"

      - name: Skip (no Rust-related changes)
        if: ${{ steps.gate.outputs.run != 'true' }}
        run: |
          echo "Skipping Rust test: no relevant changes"

      - name: Install Rust toolchain
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-01-01
          targets: aarch64-unknown-linux-gnu

      - name: Cache Rust dependencies
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: Swatinem/rust-cache@v2

      - name: Install AArch64 cross compiler
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-aarch64-linux-gnu

      - name: Run cargo test
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          cargo test --workspace --all-targets
          cargo test -p devhud --lib --features linux-capture-backend realqa_capture
          cargo check -p devhud --lib --features linux-capture-backend --target aarch64-unknown-linux-gnu

  devhud-realqa-macos:
    name: DevHud RealQA macOS capture
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
