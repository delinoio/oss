name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Plan affected CI jobs
    runs-on: ubuntu-22.04
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
      forced: ${{ steps.plan.outputs.forced }}
      base: ${{ steps.plan.outputs.base }}
      head: ${{ steps.plan.outputs.head }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Compare commits and select jobs
        id: plan
        run: node scripts/ci/plan.mjs

  ci-contracts:
    name: CI contracts and workflow syntax
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        id: ci-node
        uses: ./.github/actions/setup-ci-node

      - name: Setup Go
        id: ci-go
        uses: ./.github/actions/setup-ci-go

      - name: Install clean locked workspace
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate workflow syntax
        run: pnpm ci:workflows

      - name: Validate CI contracts and affected behavior
        run: pnpm ci:contracts

      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ci-node.outputs.cache-path }}
          key: ${{ steps.ci-node.outputs.cache-key }}

      - name: Save Go cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-go.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ci-go.outputs.cache-path }}
          key: ${{ steps.ci-go.outputs.cache-key }}

  go-quality:
    needs: changes
    if: ${{ needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['go-quality'] }}
    name: Go Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        id: ci-go
        uses: ./.github/actions/setup-ci-go

      - name: Setup Node.js
        id: ci-node
        uses: ./.github/actions/setup-ci-node

      - name: Generate and verify embedded administrator assets
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter devhud-admin build:embedded

      - name: Check go fmt
        run: |
          set -euo pipefail

          formatted_output="$(go fmt ./...)"
          if [ -n "$formatted_output" ]; then
            echo "::error::go fmt reformatted files. Run 'go fmt ./...' locally and commit the result."
            printf '%s\n' "$formatted_output"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ci-node.outputs.cache-path }}
          key: ${{ steps.ci-node.outputs.cache-key }}

      - name: Save Go cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-go.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ci-go.outputs.cache-path }}
          key: ${{ steps.ci-go.outputs.cache-key }}

  go-test:
    needs: changes
    if: ${{ needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['go-test'] }}
    name: Go Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        id: ci-go
        uses: ./.github/actions/setup-ci-go

      - name: Setup Node.js
        id: ci-node
        uses: ./.github/actions/setup-ci-node

      - name: Generate and verify embedded administrator assets
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter devhud-admin build:embedded

      - name: Run go test
        run: go test ./...

      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ci-node.outputs.cache-path }}
          key: ${{ steps.ci-node.outputs.cache-key }}

      - name: Save Go cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-go.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ci-go.outputs.cache-path }}
          key: ${{ steps.ci-go.outputs.cache-key }}

  repository-environment:
    needs: changes
    if: ${{ needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['repository-environment'] }}
    name: Repository environment (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        id: ci-node
        uses: ./.github/actions/setup-ci-node

      - name: Install workspace
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Test repository environment contract
        run: pnpm test:dev-environment


      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ci-node.outputs.cache-path }}
          key: ${{ steps.ci-node.outputs.cache-key }}

  rust-fmt:
    needs: changes
    if: ${{ needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['rust-fmt'] }}
    name: Rust fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-01-01
          components: rustfmt

      - name: Run rustfmt
        run: cargo fmt --all --check

  rust-clippy:
    needs: changes
    if: ${{ needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['rust-clippy'] }}
    name: Rust clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-01-01
          components: clippy

      - name: Setup Node.js
        id: ci-node
        uses: ./.github/actions/setup-ci-node

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build DevHUD frontend
        run: pnpm --filter devhud build:frontend

      - name: Install DevHUD Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libayatana-appindicator3-dev libgbm-dev libgtk-3-dev libx11-dev libxtst-dev ninja-build

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: false

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ci-node.outputs.cache-path }}
          key: ${{ steps.ci-node.outputs.cache-key }}

  rust-test:
    needs: changes
    if: ${{ needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['rust-test'] }}
    name: Rust test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-01-01

      - name: Setup Node.js
        id: ci-node
        uses: ./.github/actions/setup-ci-node

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build DevHUD frontend
        run: pnpm --filter devhud build:frontend

      - name: Install DevHUD Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libayatana-appindicator3-dev libgbm-dev libgtk-3-dev libx11-dev libxtst-dev ninja-build

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: false

      - name: Run cargo test
        run: cargo test --workspace --all-targets


      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ci-node.outputs.cache-path }}
          key: ${{ steps.ci-node.outputs.cache-key }}

  linux-packages:
    needs: changes
    if: ${{ needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['linux-packages'] }}
    name: Linux package repository (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-latest, arch: amd64}
          - {runner: ubuntu-24.04-arm, arch: arm64}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Build pinned package tools
        run: docker build -f packaging/linux/Tools.Dockerfile -t delino-linux-package-tools .
      - name: Verify Rust compatibility builds
        env:
          TEST_ARCH: ${{ matrix.arch }}
        run: |
          image=$(node -p 'JSON.parse(require("fs").readFileSync("packaging/linux/pins.json")).rust_image')
          target=x86_64-unknown-linux-gnu
          if [ "$TEST_ARCH" = arm64 ]; then target=aarch64-unknown-linux-gnu; fi
          docker run --rm -v "$PWD:/workspace" -w /workspace -e BUILD_TARGET="$target" "$image" bash -c 'for project in binpm cargo-mono nodeup with-watch; do bash scripts/release/linux-packages/build-rust.sh "$project" "$BUILD_TARGET"; done'
          sudo chown -R "$(id -u):$(id -g)" target
          TEST_TARGET="$target" node --input-type=module <<'JS'
          import { readElf } from './scripts/release/linux-packages/release-input.mjs';
          for (const project of ['binpm', 'cargo-mono', 'nodeup', 'with-watch']) {
            readElf(`target/${process.env.TEST_TARGET}/release/${project}`, process.env.TEST_ARCH);
          }
          JS
      - name: Verify publisher recovery and security contracts
        run: node --test scripts/release/linux-packages.test.mjs
      - name: Generate disposable signed package repositories
        run: |
          mkdir -p "$RUNNER_TEMP/package-fixture"
          docker run --rm -v "$PWD:/workspace:ro" -v "$RUNNER_TEMP/package-fixture:/output" delino-linux-package-tools node scripts/release/linux-packages/fixture.mjs /output
          docker run --rm -v "$PWD:/workspace:ro" delino-linux-package-tools node scripts/release/linux-packages/rotation-test.mjs
      - name: Verify native package lifecycle on supported distributions
        env:
          TEST_ARCH: ${{ matrix.arch }}
        run: |
          for image in ubuntu:22.04 ubuntu:24.04 ubuntu:26.04 debian:12 debian:13 fedora:43 fedora:44 registry.access.redhat.com/ubi9/ubi:latest registry.access.redhat.com/ubi10/ubi:latest rockylinux:9 rockylinux/rockylinux:10 almalinux:9 almalinux:10; do
            node scripts/release/linux-packages/smoke.mjs --fixture "$RUNNER_TEMP/package-fixture" --image "$image" --architecture "$TEST_ARCH"
          done

  node-mpapp-test:
    needs: changes
    if: ${{ needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['node-mpapp-test'] }}
    name: Node mpapp test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        id: ci-node
        uses: ./.github/actions/setup-ci-node

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run mpapp tests
        env:
          FORCE_RUN: ${{ fromJSON(needs.changes.outputs.forced)['node-mpapp-test'] }}
          TURBO_SCM_BASE: ${{ needs.changes.outputs.base }}
          TURBO_SCM_HEAD: ${{ needs.changes.outputs.head }}
        run: node scripts/ci/run-affected.mjs mpapp test

      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ci-node.outputs.cache-path }}
          key: ${{ steps.ci-node.outputs.cache-key }}

  node-mpapp-lint:
    needs: changes
    if: ${{ needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['node-mpapp-lint'] }}
    name: Node mpapp lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        id: ci-node
        uses: ./.github/actions/setup-ci-node

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run mpapp lint
        env:
          FORCE_RUN: ${{ fromJSON(needs.changes.outputs.forced)['node-mpapp-lint'] }}
          TURBO_SCM_BASE: ${{ needs.changes.outputs.base }}
          TURBO_SCM_HEAD: ${{ needs.changes.outputs.head }}
        run: node scripts/ci/run-affected.mjs mpapp lint

      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ci-node.outputs.cache-path }}
          key: ${{ steps.ci-node.outputs.cache-key }}

  node-binpm-docs-test:
    needs: changes
    if: ${{ needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['node-binpm-docs-test'] }}
    name: Node binpm-docs test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        id: ci-node
        uses: ./.github/actions/setup-ci-node

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run binpm-docs tests
        env:
          FORCE_RUN: ${{ fromJSON(needs.changes.outputs.forced)['node-binpm-docs-test'] }}
          TURBO_SCM_BASE: ${{ needs.changes.outputs.base }}
          TURBO_SCM_HEAD: ${{ needs.changes.outputs.head }}
        run: node scripts/ci/run-affected.mjs binpm-docs test

      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ci-node.outputs.cache-path }}
          key: ${{ steps.ci-node.outputs.cache-key }}

  node-runmoor-docs-test:
    needs: changes
    if: ${{ needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['node-runmoor-docs-test'] }}
    name: Node runmoor-docs test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        id: ci-node
        uses: ./.github/actions/setup-ci-node

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run runmoor-docs tests
        env:
          FORCE_RUN: ${{ fromJSON(needs.changes.outputs.forced)['node-runmoor-docs-test'] }}
          TURBO_SCM_BASE: ${{ needs.changes.outputs.base }}
          TURBO_SCM_HEAD: ${{ needs.changes.outputs.head }}
        run: node scripts/ci/run-affected.mjs runmoor-docs test

      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ci-node.outputs.cache-path }}
          key: ${{ steps.ci-node.outputs.cache-key }}

  node-nodeup-docs-test:
    needs: changes
    if: ${{ needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['node-nodeup-docs-test'] }}
    name: Node nodeup-docs test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        id: ci-node
        uses: ./.github/actions/setup-ci-node

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run nodeup-docs tests
        env:
          FORCE_RUN: ${{ fromJSON(needs.changes.outputs.forced)['node-nodeup-docs-test'] }}
          TURBO_SCM_BASE: ${{ needs.changes.outputs.base }}
          TURBO_SCM_HEAD: ${{ needs.changes.outputs.head }}
        run: node scripts/ci/run-affected.mjs nodeup-docs test

      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ci-node.outputs.cache-path }}
          key: ${{ steps.ci-node.outputs.cache-key }}

  node-public-docs-test:
    needs: changes
    if: ${{ needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['node-public-docs-test'] }}
    name: Node public-docs test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        id: ci-node
        uses: ./.github/actions/setup-ci-node

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run public-docs tests
        env:
          FORCE_RUN: ${{ fromJSON(needs.changes.outputs.forced)['node-public-docs-test'] }}
          TURBO_SCM_BASE: ${{ needs.changes.outputs.base }}
          TURBO_SCM_HEAD: ${{ needs.changes.outputs.head }}
        run: node scripts/ci/run-affected.mjs public-docs test

      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ci-node.outputs.cache-path }}
          key: ${{ steps.ci-node.outputs.cache-key }}

  devhud-frontend:
    needs: changes
    if: ${{ needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['devhud-frontend'] }}
    name: DevHud frontend contracts
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        id: ci-node
        uses: ./.github/actions/setup-ci-node

      - name: Install clean locked workspace
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run affected frontend contracts
        env:
          FORCE_RUN: ${{ fromJSON(needs.changes.outputs.forced)['devhud-frontend'] }}
          TURBO_SCM_BASE: ${{ needs.changes.outputs.base }}
          TURBO_SCM_HEAD: ${{ needs.changes.outputs.head }}
        run: node scripts/ci/run-affected.mjs devhud test

      - name: Verify immutable desktop and mobile pins
        run: pnpm --filter devhud verify:pins

      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ci-node.outputs.cache-path }}
          key: ${{ steps.ci-node.outputs.cache-key }}

  devhud-extension:
    needs: changes
    if: ${{ needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['devhud-extension'] }}
    name: DevHud Chrome extension
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        id: ci-node
        uses: ./.github/actions/setup-ci-node

      - name: Install clean locked workspace
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck, test accessibility, and build deterministic ZIPs
        run: |
          pnpm --filter devhud-chrome-extension lint
          pnpm --filter devhud-chrome-extension test:unit
          pnpm --filter devhud-chrome-extension test:components
          pnpm --filter devhud-chrome-extension test:accessibility
          pnpm --filter devhud-chrome-extension test:package
          pnpm --filter devhud-chrome-extension build:test
          cmp apps/devhud-chrome-extension/artifacts/devhud-chrome-web-store.zip apps/devhud-chrome-extension/artifacts/devhud-chrome-github-validation.zip

      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ci-node.outputs.cache-path }}
          key: ${{ steps.ci-node.outputs.cache-key }}

  devhud-rust-conformance:
    needs: changes
    if: ${{ needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['devhud-rust-conformance'] }}
    name: DevHud Rust capture, shortcut, and IPC conformance
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        id: ci-node
        uses: ./.github/actions/setup-ci-node

      - name: Install Linux native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libayatana-appindicator3-dev libgbm-dev libgtk-3-dev libx11-dev libxtst-dev ninja-build

      - name: Install clean locked workspace and build frontend
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter devhud build:frontend

      - name: Run capture, shortcut, IPC, and updater suites
        run: |
          pnpm --filter devhud test:native:capture
          pnpm --filter devhud test:native:shortcuts
          pnpm --filter devhud test:native:ipc
          pnpm --filter devhud test:native:updater

      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ci-node.outputs.cache-path }}
          key: ${{ steps.ci-node.outputs.cache-key }}

  devhud-security:
    needs: changes
    if: ${{ needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['devhud-security'] }}
    name: DevHud security and direct-adapter fixtures
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        id: ci-node
        uses: ./.github/actions/setup-ci-node

      - name: Install clean locked workspace
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run credential, lifecycle, redaction, GitHub, R2, and agent fixtures
        run: |
          pnpm exec turbo run test:security test:adapters --filter devhud
          node --test apps/devhud/scripts/diagnostics-policy.test.mjs apps/devhud/scripts/native-bridge.test.mjs apps/devhud/scripts/mobile-policy.test.mjs

      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ci-node.outputs.cache-path }}
          key: ${{ steps.ci-node.outputs.cache-key }}

  devhud-desktop:
    needs: changes
    if: ${{ needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['devhud-desktop'] }}
    name: ${{ matrix.id }} host and smoke
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-x64
            runner: macos-15-intel
            os: macos
            bundle: dmg
            package: macos-app
          - id: macos-arm64
            runner: macos-15
            os: macos
            bundle: dmg
            package: macos-app
          - id: windows-x64-nsis
            runner: windows-2022
            os: windows
            bundle: nsis
            package: windows-nsis
          - id: windows-x64-msi
            runner: windows-2022
            os: windows
            bundle: msi
            package: windows-msi
          - id: windows-arm64-nsis
            runner: windows-11-arm
            os: windows
            bundle: nsis
            package: windows-nsis
          - id: windows-arm64-msi
            runner: windows-11-arm
            os: windows
            bundle: msi
            package: windows-msi
          - id: ubuntu-x64-deb
            runner: ubuntu-22.04
            os: linux
            bundle: deb
            package: linux-deb
          - id: ubuntu-x64-appimage
            runner: ubuntu-22.04
            os: linux
            bundle: appimage
            package: linux-appimage
          - id: ubuntu-arm64-deb
            runner: ubuntu-22.04-arm
            os: linux
            bundle: deb
            package: linux-deb
          - id: ubuntu-arm64-appimage
            runner: ubuntu-22.04-arm
            os: linux
            bundle: appimage
            package: linux-appimage

    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      DEVHUD_EXTENSION_TEST_BUILD: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        id: ci-node
        uses: ./.github/actions/setup-ci-node

      - name: Install macOS Rust targets
        if: ${{ matrix.os == 'macos' }}
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux desktop prerequisites
        if: ${{ matrix.os == 'linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake dbus-x11 desktop-file-utils gnome-keyring libayatana-appindicator3-dev libfuse2 libgbm-dev libgtk-3-dev libx11-dev libxkbcommon-x11-0 libxtst-dev ninja-build patchelf xauth xdg-utils xvfb

      - name: Install dependencies
        # CI runs the app checks explicitly; skip developer-only root prepare hooks,
        # which pnpm otherwise invokes through cmd.exe on Windows.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify frontend and immutable pins
        shell: bash
        run: |
          pnpm --filter devhud-chrome-extension test
          pnpm --filter devhud test
          pnpm --filter devhud verify:pins

      - name: Build native production package
        env:
          DEVHUD_PACKAGE_KIND: ${{ matrix.package }}
        run: pnpm --filter devhud build -- --bundles ${{ matrix.bundle }}

      - name: Prepare Windows installed layout
        if: ${{ matrix.os == 'windows' }}
        shell: pwsh
        env:
          DEVHUD_BUNDLE: ${{ matrix.bundle }}
        run: |
          if ($env:DEVHUD_BUNDLE -eq "msi") {
            $installer = Get-Item target/release/bundle/msi/*.msi | Select-Object -First 1
          } else {
            $installer = Get-Item target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          }
          $installDir = Join-Path $env:RUNNER_TEMP "devhud-smoke"
          if ($env:DEVHUD_BUNDLE -eq "msi") {
            $process = Start-Process msiexec.exe -ArgumentList "/i", $installer.FullName, "/qn", "INSTALLDIR=$installDir" -Wait -PassThru
          } else {
            $process = Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$installDir" -Wait -PassThru
          }
          if ($process.ExitCode -notin @(0, 3010)) { throw "DevHUD installer exited $($process.ExitCode)" }
          "DEVHUD_SMOKE_ARTIFACT=$installDir\devhud.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          "DEVHUD_SMOKE_INSTALLER=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Prepare macOS installed layout
        if: ${{ matrix.os == 'macos' }}
        run: |
          set -euo pipefail
          dmg=$(find target/release/bundle/dmg -name '*.dmg' -type f -print -quit)
          test -n "$dmg"
          mount="$RUNNER_TEMP/devhud-dmg"
          installed="$RUNNER_TEMP/devhud-installed/DevHUD.app"
          mkdir -p "$mount" "$(dirname "$installed")"
          hdiutil attach "$dmg" -nobrowse -mountpoint "$mount"
          ditto "$mount/DevHUD.app" "$installed"
          hdiutil detach "$mount"
          host=$(find "$installed" -type f -name devhud-native-messaging-host -print -quit)
          test -x "$host"
          {
            echo "DEVHUD_SMOKE_ARTIFACT=$installed/Contents/MacOS/devhud"
            echo "DEVHUD_SMOKE_NATIVE_HOST=$host"
          } >> "$GITHUB_ENV"

      - name: Prepare Ubuntu installed layout
        if: ${{ matrix.os == 'linux' }}
        env:
          DEVHUD_BUNDLE: ${{ matrix.bundle }}
        run: |
          set -euo pipefail
          set -o pipefail
          shopt -s nullglob
          if [ "$DEVHUD_BUNDLE" = deb ]; then
            deb_packages=(target/release/bundle/deb/*.deb)
            if [ "${#deb_packages[@]}" -ne 1 ]; then
              echo "Expected exactly one DevHUD Debian package, found ${#deb_packages[@]}" >&2
              exit 1
            fi
            finalized="$RUNNER_TEMP/devhud-final.deb"
            SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD) bash scripts/release/finalize-devhud-deb.sh "${deb_packages[0]}" "$finalized"
            sandbox_metadata="$(dpkg-deb --fsys-tarfile "$finalized" | tar --numeric-owner -tvf - | awk '$6 == "usr/share/DevHUD/chrome-sandbox" || $6 == "./usr/share/DevHUD/chrome-sandbox" { print $1, $2 }')"
            if [ "${sandbox_metadata}" != "-rwsr-xr-x 0/0" ]; then
              echo "DevHUD Debian chrome-sandbox must record UID/GID 0/0 and mode 4755; found: ${sandbox_metadata:-missing}" >&2
              exit 1
            fi
            package=$(dpkg-deb -f "$finalized" Package)
            sudo dpkg -i "$finalized"
            artifact=/usr/bin/devhud
            host=$(find /usr -type f -name devhud-native-messaging-host -print -quit)
            {
              echo "DEVHUD_SMOKE_DEBIAN_PACKAGE=$package"
              echo "DEVHUD_SMOKE_NATIVE_HOST=$host"
              echo "DEVHUD_SMOKE_USER_MANIFEST=$HOME/.config/google-chrome/NativeMessagingHosts/io.delino.devhud.native_messaging.json"
            } >> "$GITHUB_ENV"
          else
            appimages=(target/release/bundle/appimage/*.AppImage)
            if [ "${#appimages[@]}" -ne 1 ]; then
              echo "Expected exactly one DevHUD AppImage, found ${#appimages[@]}" >&2
              exit 1
            fi
            chmod +x "${appimages[0]}"
            "${appimages[0]}" --appimage-extract >/dev/null
            appdir=$(realpath squashfs-root)
            sandbox=$(realpath "$appdir/shared/bin/chrome-sandbox")
            test -f "$sandbox"
            sudo chown root:root "$sandbox"
            sudo chmod 4755 "$sandbox"
            artifact="$appdir/bin/devhud"
            host="$appdir/bin/devhud-native-messaging-host"
            {
              echo "DEVHUD_SMOKE_APPIMAGE=${{ github.workspace }}/${appimages[0]}"
              echo "DEVHUD_SMOKE_APPDIR=$appdir"
              echo "DEVHUD_SMOKE_NATIVE_HOST=$host"
            } >> "$GITHUB_ENV"
          fi
          test -x "$artifact" && test -x "$host"
          echo "DEVHUD_SMOKE_ARTIFACT=$artifact" >> "$GITHUB_ENV"

      - name: Run macOS platform smoke
        if: ${{ matrix.os == 'macos' }}
        run: pnpm --filter devhud smoke:platform -- --artifact "$DEVHUD_SMOKE_ARTIFACT"

      - name: Verify macOS Native Messaging register and unregister lifecycle
        if: ${{ matrix.os == 'macos' }}
        run: |
          set -euo pipefail
          native_home="$RUNNER_TEMP/devhud-native-home"
          user_manifest="$native_home/Library/Application Support/Google/Chrome/NativeMessagingHosts/io.delino.devhud.native_messaging.json"
          "$DEVHUD_SMOKE_NATIVE_HOST" register "$DEVHUD_SMOKE_NATIVE_HOST" "$user_manifest"
          test -e "$user_manifest"
          jq -e --arg expected "$DEVHUD_SMOKE_NATIVE_HOST" '.path == $expected' "$user_manifest" >/dev/null
          "$DEVHUD_SMOKE_NATIVE_HOST" unregister "$user_manifest"
          test ! -e "$user_manifest"

      - name: Run Windows platform smoke
        if: ${{ matrix.os == 'windows' }}
        shell: pwsh
        run: pnpm --filter devhud smoke:platform -- --artifact "$env:DEVHUD_SMOKE_ARTIFACT"

      - name: Run Ubuntu X11 platform smoke
        if: ${{ matrix.os == 'linux' }}
        env:
          XDG_SESSION_TYPE: x11
          WAYLAND_DISPLAY: ""
        run: APPIMAGE="$DEVHUD_SMOKE_APPIMAGE" APPDIR="$DEVHUD_SMOKE_APPDIR" dbus-run-session -- xvfb-run -a pnpm --filter devhud smoke:platform -- --artifact "$DEVHUD_SMOKE_ARTIFACT"

      - name: Verify Ubuntu AppImage Native Messaging register and unregister lifecycle
        if: ${{ matrix.os == 'linux' && matrix.bundle == 'appimage' }}
        run: |
          set -euo pipefail
          native_home="$RUNNER_TEMP/devhud-native-home"
          user_manifest="$native_home/.config/google-chrome/NativeMessagingHosts/io.delino.devhud.native_messaging.json"
          # The nested shell expands positional parameters and session variables.
          # shellcheck disable=SC2016
          dbus-run-session -- bash -euo pipefail -c '
            export HOME="$1"
            host="$2"
            user_manifest="$3"
            unset GNOME_KEYRING_CONTROL
            control_directory="$HOME/.cache/keyring"
            mkdir -p "$control_directory"
            chmod 700 "$control_directory"
            gnome-keyring-daemon --foreground --components=secrets --control-directory="$control_directory" >/dev/null &
            keyring_pid=$!
            stop_keyring() {
              kill "$keyring_pid" 2>/dev/null || true
              wait "$keyring_pid" 2>/dev/null || true
            }
            trap stop_keyring EXIT
            gdbus wait --session --timeout=5 org.freedesktop.secrets >/dev/null
            "$host" register "$host"
            test -e "$user_manifest"
            jq -e --arg expected "$host" ".path == \$expected" "$user_manifest" >/dev/null
            "$host" unregister
            test ! -e "$user_manifest"
          ' native-messaging-lifecycle "$native_home" "$DEVHUD_SMOKE_NATIVE_HOST" "$user_manifest"

      - name: Verify Ubuntu Debian Native Messaging install and uninstall lifecycle
        if: ${{ matrix.os == 'linux' && matrix.bundle == 'deb' }}
        run: |
          set -euo pipefail
          test -x "$DEVHUD_SMOKE_NATIVE_HOST"
          test -e /etc/opt/chrome/native-messaging-hosts/io.delino.devhud.native_messaging.json
          # The nested shell expands positional parameters and session variables.
          # shellcheck disable=SC2016
          dbus-run-session -- bash -euo pipefail -c '
            export HOME="$1"
            package="$2"
            user_manifest="$3"
            host="$4"
            runtime="/run/user/$(id -u)"
            export XDG_RUNTIME_DIR="$runtime"
            session_socket="${DBUS_SESSION_BUS_ADDRESS#unix:path=}"
            session_socket="${session_socket%%,*}"
            unset GNOME_KEYRING_CONTROL
            control_directory="$RUNNER_TEMP/devhud-keyring"
            mkdir -p "$control_directory"
            chmod 700 "$control_directory"
            sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" "$runtime"
            created_bus=false
            if [ -S "$runtime/bus" ]; then
              export DBUS_SESSION_BUS_ADDRESS="unix:path=$runtime/bus"
            elif [ -e "$runtime/bus" ] || [ -L "$runtime/bus" ]; then
              echo "DevHUD Debian lifecycle found an invalid per-user D-Bus socket path" >&2
              exit 1
            else
              sudo ln -s "$session_socket" "$runtime/bus"
              created_bus=true
            fi
            keyring_pid=
            cleanup_lifecycle() {
              if [ "$created_bus" = true ]; then
                sudo rm -f "$runtime/bus"
              fi
              if [ -n "$keyring_pid" ]; then
                kill "$keyring_pid" 2>/dev/null || true
                wait "$keyring_pid" 2>/dev/null || true
              fi
            }
            trap cleanup_lifecycle EXIT
            gnome-keyring-daemon --foreground --components=secrets --control-directory="$control_directory" >/dev/null &
            keyring_pid=$!
            gdbus wait --session --timeout=5 org.freedesktop.secrets >/dev/null
            "$host" register "$host" "$user_manifest"
            test -e "$user_manifest"
            sudo dpkg -r "$package"
            test ! -e "$user_manifest"
          ' native-messaging-lifecycle "$HOME" "$DEVHUD_SMOKE_DEBIAN_PACKAGE" "$DEVHUD_SMOKE_USER_MANIFEST" "$DEVHUD_SMOKE_NATIVE_HOST"
          test ! -e /usr/bin/devhud
          test ! -e /etc/opt/chrome/native-messaging-hosts/io.delino.devhud.native_messaging.json

      - name: Verify Windows Native Messaging install and uninstall lifecycle
        if: ${{ matrix.os == 'windows' }}
        shell: pwsh
        env:
          DEVHUD_BUNDLE: ${{ matrix.bundle }}
        run: |
          $registration = Get-ItemProperty "HKCU:\Software\Google\Chrome\NativeMessagingHosts\io.delino.devhud.native_messaging" -ErrorAction Stop
          $manifestPath = $registration.'(default)'
          if (-not (Test-Path -LiteralPath $manifestPath)) { throw "Native Messaging manifest missing" }
          if ($env:DEVHUD_BUNDLE -eq "msi") {
            $product = Get-CimInstance Win32_Product | Where-Object Name -eq "DevHUD" | Select-Object -First 1
            if (-not $product) { throw "installed MSI product missing" }
            $process = Start-Process msiexec.exe -ArgumentList "/x", $product.IdentifyingNumber, "/qn" -Wait -PassThru
          } else {
            $process = Start-Process (Join-Path (Split-Path $env:DEVHUD_SMOKE_ARTIFACT) "uninstall.exe") -ArgumentList "/S" -Wait -PassThru
          }
          if ($process.ExitCode -notin @(0, 3010)) { throw "uninstall failed: $($process.ExitCode)" }
          if (Test-Path "HKCU:\Software\Google\Chrome\NativeMessagingHosts\io.delino.devhud.native_messaging") { throw "Native Messaging registration survived uninstall" }
          if (Test-Path -LiteralPath $manifestPath) { throw "Native Messaging manifest survived uninstall" }
          if (Test-Path -LiteralPath $env:DEVHUD_SMOKE_ARTIFACT) { throw "DevHUD executable survived uninstall" }

      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ci-node.outputs.cache-path }}
          key: ${{ steps.ci-node.outputs.cache-key }}

  devhud-mobile-contracts:
    needs: changes
    if: ${{ needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['devhud-mobile-contracts'] }}
    name: DevHUD mobile contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        id: ci-node
        uses: ./.github/actions/setup-ci-node

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify shared frontend and mobile contracts
        run: |
          pnpm --filter devhud build:frontend
          pnpm --filter devhud mobile:check
          pnpm --filter devhud test:components

      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ci-node.outputs.cache-path }}
          key: ${{ steps.ci-node.outputs.cache-key }}

  devhud-ios-simulator:
    needs: changes
    if: ${{ needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['devhud-ios-simulator'] }}
    name: DevHUD iOS simulator (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64
            runner: macos-15
          - target: aarch64-sim
            runner: macos-15
          - target: x86_64
            runner: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        id: ci-node
        uses: ./.github/actions/setup-ci-node

      # The pinned Tauri bundler embeds a universal macOS CEF helper even when
      # its host CLI is invoked only to generate or build an iOS project.
      - name: Install macOS Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate pinned iOS project
        run: pnpm --filter devhud mobile:generate -- --platform ios

      # cargo-mobile2 selects a named simulator on Intel. Initialize
      # CoreSimulator first so Xcode exposes devices instead of placeholders.
      - name: Initialize Intel iOS simulators
        if: ${{ matrix.target == 'x86_64' }}
        run: xcrun simctl list > /dev/null

      - name: Build iOS host
        working-directory: apps/devhud
        run: node scripts/run-mobile.mjs ios build --target ${{ matrix.target }} --ci --no-sign

      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ci-node.outputs.cache-path }}
          key: ${{ steps.ci-node.outputs.cache-key }}

  devhud-android-emulator:
    needs: changes
    if: ${{ needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['devhud-android-emulator'] }}
    name: DevHUD Android (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64
            artifacts: --apk --aab
            abi: arm64-v8a
            production: true
            combined: false
          - target: armv7
            artifacts: --apk --aab
            abi: armeabi-v7a
            production: true
            combined: false
          - target: x86_64
            artifacts: --apk
            abi: x86_64
            production: false
            combined: false
          - target: aarch64-armv7
            artifacts: --aab
            production: true
            combined: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        id: ci-node
        uses: ./.github/actions/setup-ci-node

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download checksum-pinned bundletool
        id: bundletool
        if: ${{ matrix.production }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./apps/devhud/mobile-platforms.json').androidArtifactInspector.version")
          url=$(node -p "require('./apps/devhud/mobile-platforms.json').androidArtifactInspector.url")
          expected=$(node -p "require('./apps/devhud/mobile-platforms.json').androidArtifactInspector.sha256")
          jar="$RUNNER_TEMP/bundletool-all-$version.jar"
          curl --fail --location --silent --show-error --output "$jar" "$url"
          printf '%s  %s\n' "$expected" "$jar" | sha256sum --check
          echo "jar=$jar" >> "$GITHUB_OUTPUT"

      - name: Install Linux host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libayatana-appindicator3-dev libgbm-dev libgtk-3-dev libx11-dev libxtst-dev ninja-build

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate pinned Android project
        run: pnpm --filter devhud mobile:generate -- --platform android

      - name: Build Android artifacts
        if: ${{ matrix.combined == false }}
        working-directory: apps/devhud
        run: node scripts/run-mobile.mjs android build --target ${{ matrix.target }} ${{ matrix.artifacts }} --ci

      - name: Build combined production Android App Bundle
        if: ${{ matrix.combined }}
        working-directory: apps/devhud
        run: node scripts/run-mobile.mjs android build --target aarch64 --target armv7 --aab

      - name: Verify Android APK contracts
        if: ${{ matrix.combined == false }}
        working-directory: apps/devhud
        run: node scripts/verify-mobile.mjs --android-artifact src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk --android-abi ${{ matrix.abi }}

      - name: Verify Android App Bundle contracts
        if: ${{ matrix.production && matrix.combined == false }}
        shell: bash
        working-directory: apps/devhud
        run: |
          set -euo pipefail
          shopt -s nullglob
          aab_artifacts=(../../target/devhud-mobile/android/${{ matrix.target }}/*.aab)
          if [ "${#aab_artifacts[@]}" -ne 1 ]; then
            echo "Expected exactly one preserved Android App Bundle, found ${#aab_artifacts[@]}" >&2
            exit 1
          fi
          node scripts/verify-mobile.mjs --android-artifact "${aab_artifacts[0]}" --android-abi ${{ matrix.abi }} --bundletool-jar "${{ steps.bundletool.outputs.jar }}"

      - name: Verify combined production Android App Bundle contracts
        if: ${{ matrix.combined }}
        shell: bash
        working-directory: apps/devhud
        run: |
          set -euo pipefail
          shopt -s nullglob
          aab_artifacts=(../../target/devhud-mobile/android/armv7/*.aab)
          if [ "${#aab_artifacts[@]}" -ne 1 ]; then
            echo "Expected exactly one preserved combined Android App Bundle, found ${#aab_artifacts[@]}" >&2
            exit 1
          fi
          node scripts/verify-mobile.mjs --android-artifact "${aab_artifacts[0]}" --android-abi arm64-v8a --android-abi armeabi-v7a --bundletool-jar "${{ steps.bundletool.outputs.jar }}"

      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ci-node.outputs.cache-path }}
          key: ${{ steps.ci-node.outputs.cache-key }}

  devhud-protocol:
    needs: changes
    if: ${{ needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['devhud-protocol'] }}
    name: DevHud Protocol and Client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        id: ci-node
        uses: ./.github/actions/setup-ci-node

      - name: Setup Go
        id: ci-go
        uses: ./.github/actions/setup-ci-go

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check schemas and generated freshness
        env:
          DEVHUD_PROTO_BASELINE: ${{ github.event_name == 'push' && github.event.before || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && 'HEAD^') || 'origin/main' }}
        run: pnpm proto:check

      - name: Test Go bindings
        run: go test ./protos/...

      - name: Check TypeScript client
        run: |
          pnpm --filter @delinoio/devhud-api-client lint
          pnpm --filter @delinoio/devhud-api-client test
          pnpm --filter @delinoio/devhud-api-client build

      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ci-node.outputs.cache-path }}
          key: ${{ steps.ci-node.outputs.cache-key }}

      - name: Save Go cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-go.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ci-go.outputs.cache-path }}
          key: ${{ steps.ci-go.outputs.cache-key }}

  devhud-admin:
    needs: changes
    if: ${{ needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['devhud-admin'] }}
    name: DevHud Admin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        id: ci-node
        uses: ./.github/actions/setup-ci-node

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Test administrator SPA and verify generated embedded assets
        run: pnpm --filter devhud-admin --fail-if-no-match test

      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ci-node.outputs.cache-path }}
          key: ${{ steps.ci-node.outputs.cache-key }}

  devhud-api:
    needs: changes
    if: ${{ needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['devhud-api'] }}
    name: DevHud API Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        id: ci-go
        uses: ./.github/actions/setup-ci-go

      - name: Setup Node.js
        id: ci-node
        uses: ./.github/actions/setup-ci-node

      - name: Generate and verify embedded administrator assets
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter devhud-admin build:embedded

      - name: Check API formatting, vet, builds, and unit tests
        run: |
          pnpm --filter @delinoio/devhud-api --fail-if-no-match ci:format
          pnpm --filter @delinoio/devhud-api --fail-if-no-match ci:vet
          pnpm --filter @delinoio/devhud-api --fail-if-no-match ci:build
          pnpm --filter @delinoio/devhud-api --fail-if-no-match ci:unit
          pnpm --filter @delinoio/devhud-api --fail-if-no-match ci:migrations
          pnpm --filter @delinoio/devhud-api --fail-if-no-match ci:api
          pnpm --filter @delinoio/devhud-api --fail-if-no-match ci:sweeper

      - name: Start PostgreSQL
        run: |
          set -euo pipefail
          docker run --detach \
            --name devhud-postgres \
            --env POSTGRES_DB=devhud_api_test \
            --env POSTGRES_PASSWORD=devhud \
            --env POSTGRES_USER=devhud \
            --publish 5432:5432 \
            --health-cmd "pg_isready -U devhud -d devhud_api_test" \
            --health-interval 5s \
            --health-timeout 5s \
            --health-retries 10 \
            postgres:15-bookworm >/dev/null
          for _ in {1..60}; do
            status=$(docker inspect --format '{{.State.Health.Status}}' devhud-postgres)
            if [ "$status" = healthy ]; then
              exit 0
            fi
            if [ "$status" = unhealthy ]; then
              break
            fi
            sleep 1
          done
          docker logs devhud-postgres
          echo "DevHud API PostgreSQL did not become healthy" >&2
          exit 1

      - name: Run PostgreSQL migration and integration tests
        env:
          DEVHUD_TEST_DATABASE_URL: postgres://devhud:devhud@127.0.0.1:5432/devhud_api_test?sslmode=disable
        run: pnpm --filter @delinoio/devhud-api --fail-if-no-match ci:integration

      - name: Stop PostgreSQL
        if: ${{ always() }}
        run: docker rm --force devhud-postgres >/dev/null 2>&1 || true

      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ci-node.outputs.cache-path }}
          key: ${{ steps.ci-node.outputs.cache-key }}

      - name: Save Go cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-go.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ci-go.outputs.cache-path }}
          key: ${{ steps.ci-go.outputs.cache-key }}

  devhud-oci:
    needs: changes
    if: ${{ needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['devhud-oci'] }}
    name: DevHud ${{ matrix.target }} non-root OCI
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: [api, sweeper]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Setup Go
        id: ci-go
        uses: ./.github/actions/setup-ci-go

      - name: Setup Node.js
        id: ci-node
        if: ${{ matrix.target == 'sweeper' }}
        uses: ./.github/actions/setup-ci-node

      - name: Generate and verify embedded administrator assets
        if: ${{ matrix.target == 'sweeper' }}
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter devhud-admin build:embedded

      - name: Download Syft
        id: syft
        uses: anchore/sbom-action/download-syft@v0.21.0

      - name: Install OCI inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo

      - name: Start PostgreSQL
        run: |
          set -euo pipefail
          docker run --detach \
            --name devhud-postgres \
            --env POSTGRES_DB=devhud_api_test \
            --env POSTGRES_PASSWORD=devhud \
            --env POSTGRES_USER=devhud \
            --publish 5432:5432 \
            --health-cmd "pg_isready -U devhud -d devhud_api_test" \
            --health-interval 5s \
            --health-timeout 5s \
            --health-retries 10 \
            postgres:15-bookworm >/dev/null
          for _ in {1..60}; do
            status=$(docker inspect --format '{{.State.Health.Status}}' devhud-postgres)
            if [ "$status" = healthy ]; then
              exit 0
            fi
            if [ "$status" = unhealthy ]; then
              break
            fi
            sleep 1
          done
          docker logs devhud-postgres
          echo "DevHud OCI PostgreSQL did not become healthy" >&2
          exit 1

      - name: Build and inspect amd64/arm64 OCI layout
        env:
          DEVHUD_TEST_DATABASE_URL: postgres://devhud:devhud@127.0.0.1:5432/devhud_api_test?sslmode=disable
          OCI_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/devhud-$OCI_TARGET.oci.tar"
          image="devhud-$OCI_TARGET:ci"
          version=$(node -p "require('./packaging/devhud/release-metadata.json').version")
          docker buildx build --platform linux/amd64,linux/arm64 --target "$OCI_TARGET" --build-arg VERSION="$version" --build-arg REVISION="$GITHUB_SHA" --output "type=oci,dest=$artifact" -f servers/devhud-api/Dockerfile .
          tar -tf "$artifact" | grep -Fx index.json
          for arch in amd64 arm64; do
            skopeo inspect --override-arch "$arch" --config "oci-archive:$artifact" | jq -e '.config.User == "65532" and .config.Labels["io.delino.devhud.migrations"] == "embedded" and .config.Labels["io.delino.devhud.administrator-assets"] == "embedded"'
          done
          docker buildx build --platform linux/amd64 --target "$OCI_TARGET" --build-arg VERSION="$version" --build-arg REVISION="$GITHUB_SHA" --load --tag "$image" -f servers/devhud-api/Dockerfile .
          container_database_url="postgres://devhud:devhud@host.docker.internal:5432/devhud_api_test?sslmode=disable"
          docker_args=(--rm --user 65532:65532 --add-host host.docker.internal:host-gateway -e "DEVHUD_DATABASE_URL=$container_database_url")
          if [ "$OCI_TARGET" = api ]; then
            docker run "${docker_args[@]}" "$image" migrate
          else
            DEVHUD_DATABASE_URL="$DEVHUD_TEST_DATABASE_URL" go run ./servers/devhud-api/cmd/devhud-api migrate
            docker run "${docker_args[@]}" \
              -e DEVHUD_ENVIRONMENT=development \
              -e DEVHUD_R2_ENDPOINT=http://127.0.0.1:9000 \
              -e DEVHUD_R2_ACCESS_KEY_ID=ci-access-key \
              -e DEVHUD_R2_SECRET_ACCESS_KEY=01234567890123456789012345678901 \
              -e DEVHUD_R2_STAGING_BUCKET=devhud-staging \
              -e DEVHUD_R2_PUBLIC_BUCKET=devhud-public \
              -e DEVHUD_PUBLIC_ASSET_BASE_URL=http://127.0.0.1:9000 \
              -e DEVHUD_CLOUDFLARE_API_TOKEN=ci-token \
              -e DEVHUD_CLOUDFLARE_ZONE_ID=ci-zone \
              "$image" --once
          fi
          "${{ steps.syft.outputs.cmd }}" scan "docker:$image" --output "spdx-json=$RUNNER_TEMP/devhud-$OCI_TARGET.spdx.json"
          jq -e '.spdxVersion == "SPDX-2.3" and (.packages | length > 0)' "$RUNNER_TEMP/devhud-$OCI_TARGET.spdx.json"

      - name: Verify embedded migrations against PostgreSQL
        env:
          DEVHUD_TEST_DATABASE_URL: postgres://devhud:devhud@127.0.0.1:5432/devhud_api_test?sslmode=disable
        run: go test -tags=integration ./servers/devhud-api/internal/postgres

      - name: Stop PostgreSQL
        if: ${{ always() }}
        run: docker rm --force devhud-postgres >/dev/null 2>&1 || true

      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && matrix.target == 'sweeper' && steps.ci-node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ci-node.outputs.cache-path }}
          key: ${{ steps.ci-node.outputs.cache-key }}

      - name: Save Go cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-go.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ci-go.outputs.cache-path }}
          key: ${{ steps.ci-go.outputs.cache-key }}

  devhud-supply-chain:
    needs: changes
    if: ${{ needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['devhud-supply-chain'] }}
    name: DevHud installers, SBOM, provenance, and signature fixtures
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
