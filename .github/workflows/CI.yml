  devhud-api:
    needs: changes
    if: ${{ needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['devhud-api'] }}
    name: DevHud API Integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup Go
        id: ci-go
        uses: ./.github/actions/setup-ci-go
        with:
          cache-scope: devhud-api

      - name: Setup Node.js
        id: ci-node
        uses: ./.github/actions/setup-ci-node

      - name: Setup Turbo remote cache
        uses: ./.github/actions/setup-turbo-cache
        with:
          team: ${{ vars.TURBO_TEAM }}
          policy: ${{ vars.TURBO_OIDC_POLICY }}

      - name: Generate and verify embedded administrator assets
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check API formatting, vet, builds, and unit tests
        run: node scripts/ci/run-affected.mjs @delinoio/devhud-api ci:format ci:vet ci:build ci:unit ci:migrations ci:api ci:sweeper
        env:
          FORCE_RUN: 'true'

      - name: Start PostgreSQL
        run: |
          set -euo pipefail
          docker run --detach \
            --name devhud-postgres \
            --env POSTGRES_DB=devhud_api_test \
            --env POSTGRES_PASSWORD=devhud \
            --env POSTGRES_USER=devhud \
            --publish 5432:5432 \
            --health-cmd "pg_isready -U devhud -d devhud_api_test" \
            --health-interval 5s \
            --health-timeout 5s \
            --health-retries 10 \
            postgres:15-bookworm >/dev/null
          for _ in {1..60}; do
            status=$(docker inspect --format '{{.State.Health.Status}}' devhud-postgres)
            if [ "$status" = healthy ]; then
              exit 0
            fi
            if [ "$status" = unhealthy ]; then
              break
            fi
            sleep 1
          done
          docker logs devhud-postgres
          echo "DevHud API PostgreSQL did not become healthy" >&2
          exit 1

      - name: Run PostgreSQL migration and integration tests
        run: node scripts/ci/run-affected.mjs @delinoio/devhud-api ci:integration
        env:
          DEVHUD_TEST_DATABASE_URL: postgres://devhud:devhud@127.0.0.1:5432/devhud_api_test?sslmode=disable
          FORCE_RUN: 'true'

      - name: Stop PostgreSQL
        if: ${{ always() }}
        run: docker rm --force devhud-postgres >/dev/null 2>&1 || true

      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ci-node.outputs.cache-path }}
          key: ${{ steps.ci-node.outputs.cache-key }}

      - name: Save Go cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-go.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ci-go.outputs.cache-path }}
          key: ${{ steps.ci-go.outputs.cache-key }}

      - name: Preserve Turbo run summaries
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: turbo-devhud-api-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: .turbo/runs/*.json
          if-no-files-found: ignore

