          node --test scripts/release/generate-devhud-supply-chain.test.mjs
          node --test scripts/release/generate-devhud-updater.test.mjs
          node --test scripts/release/generate-checksums.test.mjs
          node --test scripts/release/validate-devhud-private-build.test.mjs
          node --test scripts/release/devhud-private-workflow.test.mjs


      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ci-node.outputs.cache-path }}
          key: ${{ steps.ci-node.outputs.cache-key }}

  devhud-release-contracts:
    needs: changes
    if: ${{ needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['devhud-release-contracts'] }}
    name: DevHud Release Contracts
    runs-on: ubuntu-22.04
    steps:
