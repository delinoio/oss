  devhud-ios-simulator:
    needs: changes
    if: ${{ needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['devhud-ios-simulator'] }}
    name: DevHUD iOS simulator (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64
            runner: macos-15
          - target: aarch64-sim
            runner: macos-15
          - target: x86_64
            runner: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        id: ci-node
        uses: ./.github/actions/setup-ci-node

      # The pinned Tauri bundler embeds a universal macOS CEF helper even when
      # its host CLI is invoked only to generate or build an iOS project.
      - name: Prepare immutable host Tauri CLI
        id: prebuilt
        uses: ./.github/actions/setup-prebuilt


      - name: Install macOS Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate pinned iOS project
        run: pnpm --filter devhud mobile:generate -- --platform ios

      # cargo-mobile2 selects a named simulator on Intel. Initialize
      # CoreSimulator first so Xcode exposes devices instead of placeholders.
      - name: Initialize Intel iOS simulators
        if: ${{ matrix.target == 'x86_64' }}
        run: xcrun simctl list > /dev/null

      - name: Build iOS host
        working-directory: apps/devhud
        run: node scripts/run-mobile.mjs ios build --target ${{ matrix.target }} --ci --no-sign

      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ci-node.outputs.cache-path }}
          key: ${{ steps.ci-node.outputs.cache-key }}

      - name: Save verified CLI after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.prebuilt.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.prebuilt.outputs.cache-path }}
          key: ${{ steps.prebuilt.outputs.cache-key }}


  devhud-android-emulator:
    needs: changes
    if: ${{ needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['devhud-android-emulator'] }}
    name: DevHUD Android (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64
            artifacts: --apk --aab
            abi: arm64-v8a
            production: true
            combined: false
          - target: armv7
            artifacts: --apk --aab
            abi: armeabi-v7a
            production: true
            combined: false
          - target: x86_64
            artifacts: --apk
            abi: x86_64
            production: false
            combined: false
          - target: aarch64-armv7
            artifacts: --aab
            production: true
            combined: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        id: ci-node
        uses: ./.github/actions/setup-ci-node

      - name: Prepare immutable host Tauri CLI
        id: prebuilt
        uses: ./.github/actions/setup-prebuilt


      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: ./.github/actions/setup-clibox
        with:
          install: 'false'

      - name: Download checksum-pinned bundletool
        id: bundletool
        if: ${{ matrix.production }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./apps/devhud/mobile-platforms.json').androidArtifactInspector.version")
          url=$(node -p "require('./apps/devhud/mobile-platforms.json').androidArtifactInspector.url")
          expected=$(node -p "require('./apps/devhud/mobile-platforms.json').androidArtifactInspector.sha256")
          jar="$RUNNER_TEMP/bundletool-all-$version.jar"
          curl --fail --location --silent --show-error --output "$jar" "$url"
          pnpm exec clibox hash verify "$expected" --input="$jar" --quiet
          echo "jar=$jar" >> "$GITHUB_OUTPUT"

      - name: Install Linux host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libayatana-appindicator3-dev libgbm-dev libgtk-3-dev libgtk-4-dev xdg-desktop-portal xdg-desktop-portal-gtk zenity libx11-dev libxtst-dev ninja-build

      - name: Generate pinned Android project
        run: pnpm --filter devhud mobile:generate -- --platform android

      - name: Build Android artifacts
        if: ${{ matrix.combined == false }}
        working-directory: apps/devhud
        run: node scripts/run-mobile.mjs android build --target ${{ matrix.target }} ${{ matrix.artifacts }} --ci

      - name: Build combined production Android App Bundle
        if: ${{ matrix.combined }}
        working-directory: apps/devhud
        run: node scripts/run-mobile.mjs android build --target aarch64 --target armv7 --aab

      - name: Verify Android APK contracts
        if: ${{ matrix.combined == false }}
        working-directory: apps/devhud
        run: node scripts/verify-mobile.mjs --android-artifact src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk --android-abi ${{ matrix.abi }}

      - name: Verify Android App Bundle contracts
        if: ${{ matrix.production && matrix.combined == false }}
        shell: bash
        working-directory: apps/devhud
        run: |
          set -euo pipefail
          shopt -s nullglob
          aab_artifacts=(../../target/devhud-mobile/android/${{ matrix.target }}/*.aab)
          if [ "${#aab_artifacts[@]}" -ne 1 ]; then
            echo "Expected exactly one preserved Android App Bundle, found ${#aab_artifacts[@]}" >&2
            exit 1
          fi
          node scripts/verify-mobile.mjs --android-artifact "${aab_artifacts[0]}" --android-abi ${{ matrix.abi }} --bundletool-jar "${{ steps.bundletool.outputs.jar }}"

      - name: Verify combined production Android App Bundle contracts
        if: ${{ matrix.combined }}
        shell: bash
        working-directory: apps/devhud
        run: |
          set -euo pipefail
          shopt -s nullglob
          aab_artifacts=(../../target/devhud-mobile/android/armv7/*.aab)
          if [ "${#aab_artifacts[@]}" -ne 1 ]; then
            echo "Expected exactly one preserved combined Android App Bundle, found ${#aab_artifacts[@]}" >&2
            exit 1
          fi
          node scripts/verify-mobile.mjs --android-artifact "${aab_artifacts[0]}" --android-abi arm64-v8a --android-abi armeabi-v7a --bundletool-jar "${{ steps.bundletool.outputs.jar }}"

      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ci-node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ci-node.outputs.cache-path }}
          key: ${{ steps.ci-node.outputs.cache-key }}

      - name: Save verified CLI after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.prebuilt.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.prebuilt.outputs.cache-path }}
          key: ${{ steps.prebuilt.outputs.cache-key }}


