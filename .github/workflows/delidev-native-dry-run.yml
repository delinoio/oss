name: DeliDev native package dry run

on:
  workflow_dispatch:
    inputs:
      workspace_fixture_only:
        description: Run only the Windows workspace removal regressions
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: delidev-native-dry-run-${{ github.ref }}-${{ inputs.workspace_fixture_only && 'workspace-fixtures' || 'package' }}
  cancel-in-progress: false

jobs:
  plan:
    if: ${{ !inputs.workspace_fixture_only }}
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version-file: .nvmrc, package-manager-cache: false }
      - id: targets
        run: echo "matrix=$(node apps/delidev/scripts/bundle-native-dry-run.mjs --plan)" >> "$GITHUB_OUTPUT"

  package:
    if: ${{ !inputs.workspace_fixture_only }}
    name: ${{ matrix.target }} keyless package
    needs: plan
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with: { lfs: true, persist-credentials: false }
      - uses: pnpm/action-setup@v5
        with: { version: 10.26.2 }
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          architecture: ${{ matrix.arch }}
          package-manager-cache: false
      - uses: actions/setup-go@v6
        with: { go-version-file: go.mod, cache: false }
      - uses: dtolnay/rust-toolchain@v1
        with: { toolchain: nightly-2026-09-28 }
      - name: Select the native Rust host
        run: rustup set default-host ${{ matrix.target }}
      - name: Install both pinned macOS CEF helper targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Install Linux build and package inspection tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libayatana-appindicator3-dev libgtk-3-dev libgtk-4-dev xdg-desktop-portal xdg-desktop-portal-gtk zenity libgbm-dev libx11-dev libxkbcommon-x11-0 libxtst-dev libssl-dev pkg-config patchelf
      - name: Prepare immutable host Tauri CLI
        id: prebuilt
        uses: ./.github/actions/setup-prebuilt

      - name: Install locked build dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify package tooling
        run: pnpm --dir apps/delidev test:bundle-dry-run
      - name: Build and inspect the native package without release credentials
        run: pnpm --dir apps/delidev bundle:dry-run --target ${{ matrix.target }}
      - name: Build and inspect original desktop and Worker updater inputs
        run: pnpm --dir apps/delidev bundle:updater-dry-run --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: delidev-dry-run-${{ matrix.target }}-${{ github.sha }}
          path: target/delidev-dry-run/${{ matrix.target }}/${{ github.sha }}/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: delidev-updater-input-${{ matrix.target }}-${{ github.sha }}
          path: target/delidev-updater-input/${{ matrix.target }}/${{ github.sha }}/
          if-no-files-found: error
          retention-days: 7


      - name: Save verified CLI after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.prebuilt.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.prebuilt.outputs.cache-path }}
          key: ${{ steps.prebuilt.outputs.cache-key }}


  workspace-fixtures:
    if: ${{ inputs.workspace_fixture_only }}
    name: Windows workspace removal fixtures
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with: { lfs: true, persist-credentials: false }
      - uses: actions/setup-go@v6
        with: { go-version-file: go.mod, cache: false }
      - name: Verify native namespace claims and inventory bounds
        shell: pwsh
        run: go test ./cmds/delidev-cli/internal/workspace -run '^(TestClaimedRemovalPreservesUncapturedWritesDuringUnlink|TestSnapshotCreatePublicationFailureRetainsOriginalRecovery|TestRemovalJournalCapacityCompactionRetainsActiveProofAcrossRestart|TestSnapshotObservationSharesBudgetBeforeHashing|TestSnapshotObservationStopsAtAggregateGitInventory|TestSnapshotAdmissionReservesPrivatePathHeadroom)$' -count=1 -timeout=45m -v
