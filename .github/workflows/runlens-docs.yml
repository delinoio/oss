name: Runlens documentation deployment

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate without deploying to Cloudflare Pages'
        type: boolean
        default: true

permissions:
  contents: read

# Serialize the entire production workflow so an older, slower build cannot
# enter deployment after a newer build. Dry runs never own this publication lock.
concurrency:
  group: runlens-docs-${{ !inputs.dry_run && github.ref == 'refs/heads/main' && 'production' || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-node
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter runlens-docs test
      - uses: actions/upload-artifact@v7
        with:
          name: runlens-docs
          path: apps/runlens-docs/doc_build
          retention-days: 7
          if-no-files-found: error
  deploy:
    needs: build
    if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
    environment: runlens-docs-production
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: runlens-docs
          path: site
      - uses: cloudflare/wrangler-action@v3
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Wrangler runs preCommands after installing its tools, immediately
          # before deployment. Keep this one shell command: each line is executed separately.
          preCommands: test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA" || { echo 'Documentation publication requires the current main revision.' >&2; exit 1; }
          command: pages deploy site --project-name runlens-docs --branch main
