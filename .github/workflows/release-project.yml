name: Release Project
run-name: Release ${{ inputs.project }} (${{ inputs.bump }})

on:
  workflow_dispatch:
    inputs:
      project:
        description: Project to release
        required: true
        type: choice
        options: [binpm, cargo-mono, nodeup, with-watch, derun, runmoor, clibox, pnport, async-commit-hook]
      bump:
        description: SemVer increment
        required: true
        type: choice
        default: patch
        options: [patch, minor, major]

permissions:
  contents: read

# Serialize version commits and tap updates across all selectable projects.
concurrency:
  group: release-project
  cancel-in-progress: false

env:
  RELEASE_PROJECT: ${{ inputs.project }}
  RELEASE_BUMP: ${{ inputs.bump }}

jobs:
  pnport-source:
    if: inputs.project == 'pnport' && github.repository == 'delinoio/oss' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    outputs:
      mode: ${{ steps.candidate.outputs.mode }}
      base: ${{ steps.candidate.outputs.base }}
      tree: ${{ steps.candidate.outputs.tree }}
      version: ${{ steps.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Resolve and stage the exact temporary version candidate
        id: candidate
        run: node scripts/release/pnport-candidate.mjs source

  pnport-native:
    if: inputs.project == 'pnport'
    needs: pnport-source
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15-intel, target: x86_64-apple-darwin, suffix: darwin-x64 }
          - { runner: macos-14, target: aarch64-apple-darwin, suffix: darwin-arm64 }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, suffix: win32-x64-msvc }
          - { runner: windows-11-arm, target: aarch64-pc-windows-msvc, suffix: win32-arm64-msvc }
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu, suffix: linux-x64-gnu }
          - { runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, suffix: linux-arm64-gnu }
    env:
      RELEASE_CANDIDATE_MODE: ${{ needs.pnport-source.outputs.mode }}
      RELEASE_CANDIDATE_BASE: ${{ needs.pnport-source.outputs.base }}
      RELEASE_CANDIDATE_TREE: ${{ needs.pnport-source.outputs.tree }}
      PNPORT_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.pnport-source.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          architecture: ${{ startsWith(matrix.target, 'aarch64-') && 'arm64' || 'x64' }}
      - uses: pnpm/action-setup@v5
        with:
          version: 10.26.2
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-01-01
          targets: ${{ matrix.target }}
      - name: Materialize and verify the tested candidate tree
        run: node scripts/release/pnport-candidate.mjs "$RELEASE_CANDIDATE_MODE"
        shell: bash
      - name: Install locked workspace without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build both native components and run native tests
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release -p pnport -p pnport-preload --target "$PNPORT_TARGET"
          cargo test --locked -p pnport --target "$PNPORT_TARGET"
      - name: Verify installed npm/Yarn packages and native TypeScript execution
        shell: bash
        run: |
          set -euo pipefail
          binary="target/$PNPORT_TARGET/release/pnport"
          preload="target/$PNPORT_TARGET/release/libpnport_preload.so"
          if [[ "$PNPORT_TARGET" == *windows* ]]; then binary="$binary.exe"; preload="target/$PNPORT_TARGET/release/pnport_preload.dll"; fi
          if [[ "$PNPORT_TARGET" == *apple* ]]; then preload="target/$PNPORT_TARGET/release/libpnport_preload.dylib"; fi
          pnpm --filter @delino/pnport test:package --target "$PNPORT_TARGET" --binary "$binary" --preload "$preload"
          fixture="$RUNNER_TEMP/pnport-typescript"
          pnpm --filter @delino/pnport test:typescript:prepare "$fixture"
          pnpm --filter @delino/pnport test:typescript "$fixture" "$binary"
          node packages/pnport/scripts/package.mjs binary --target "$PNPORT_TARGET" --binary "$binary" --preload "$preload"
          node packages/pnport/scripts/install-smoke.mjs --target "$PNPORT_TARGET"
          node packages/pnport/scripts/evidence.mjs record --target "$PNPORT_TARGET" --base "$RELEASE_CANDIDATE_BASE" --tree "$RELEASE_CANDIDATE_TREE" --revision "$RELEASE_CANDIDATE_BASE"
      - uses: actions/upload-artifact@v7
        with:
          name: pnport-native-${{ matrix.suffix }}
          path: packages/pnport/dist/
          if-no-files-found: error
          retention-days: 30

  pnport-complete:
    if: always() && (inputs.project != 'pnport' || (needs.pnport-source.result == 'success' && needs.pnport-native.result == 'success'))
    needs: [pnport-source, pnport-native]
    runs-on: ubuntu-22.04
    outputs:
      base: ${{ steps.gate.outputs.base }}
      tree: ${{ steps.gate.outputs.tree }}
    steps:
      - uses: actions/checkout@v6
        if: inputs.project == 'pnport'
        with:
          ref: ${{ needs.pnport-source.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        if: inputs.project == 'pnport'
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v5
        if: inputs.project == 'pnport'
        with:
          version: 10.26.2
      - name: Install locked tooling for complete candidate inspection
        if: inputs.project == 'pnport'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Materialize the same candidate for complete-set inspection
        if: inputs.project == 'pnport'
        env:
          RELEASE_CANDIDATE_BASE: ${{ needs.pnport-source.outputs.base }}
          RELEASE_CANDIDATE_TREE: ${{ needs.pnport-source.outputs.tree }}
        run: node scripts/release/pnport-candidate.mjs '${{ needs.pnport-source.outputs.mode }}'
      - uses: actions/download-artifact@v8
        if: inputs.project == 'pnport'
        with:
          pattern: pnport-native-*
          path: packages/pnport/dist/native
      - name: Validate all six source-bound packages before any release write
        if: inputs.project == 'pnport'
        env:
          PNPORT_BASE: ${{ needs.pnport-source.outputs.base }}
          PNPORT_TREE: ${{ needs.pnport-source.outputs.tree }}
        run: |
          node packages/pnport/scripts/evidence.mjs assemble --input packages/pnport/dist/native --base "$PNPORT_BASE" --tree "$PNPORT_TREE" --revision "$PNPORT_BASE"
          node packages/pnport/scripts/publish.mjs
          node packages/pnport/scripts/github-release.mjs
          node packages/pnport/scripts/homebrew.mjs
      - name: Pass the verified candidate identity to version preparation
        id: gate
        env:
          PNPORT_BASE: ${{ needs.pnport-source.outputs.base }}
          PNPORT_TREE: ${{ needs.pnport-source.outputs.tree }}
        run: |
          echo "base=$PNPORT_BASE" >> "$GITHUB_OUTPUT"
          echo "tree=$PNPORT_TREE" >> "$GITHUB_OUTPUT"

  prepare:
    if: github.repository == 'delinoio/oss' && github.ref == 'refs/heads/main' && needs.pnport-complete.result == 'success'
    needs: pnport-complete
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      project: ${{ steps.prepare.outputs.project }}
      kind: ${{ steps.prepare.outputs.kind }}
      previous_version: ${{ steps.prepare.outputs.previous_version }}
      version: ${{ steps.prepare.outputs.version }}
      tag: ${{ steps.prepare.outputs.tag }}
      revision: ${{ steps.prepare.outputs.revision }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Validate configuration before committing
        env:
          CLIENT_ID: ${{ vars.DELINO_RELEASE_BOT_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.DELINO_RELEASE_BOT_PRIVATE_KEY }}
          REGISTRY_TOKEN: ${{ inputs.project != 'clibox' && inputs.project != 'pnport' && inputs.project != 'async-commit-hook' && secrets.CARGO_REGISTRY_TOKEN || '' }}
        run: |
          node --input-type=module <<'JS'
          import { requiresCargoPublish, versionChanges } from './scripts/release/project.mjs';
          import { readFileSync } from 'node:fs';
          const plan = versionChanges(process.env.RELEASE_PROJECT, process.env.RELEASE_BUMP, file => readFileSync(file, 'utf8'));
          if (!process.env.CLIENT_ID || !process.env.PRIVATE_KEY) throw new Error('Release bot configuration is required');
          if (requiresCargoPublish(plan.project) && !process.env.REGISTRY_TOKEN) throw new Error('CARGO_REGISTRY_TOKEN is required');
          JS
      - name: Create source repository token
        id: bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DELINO_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DELINO_RELEASE_BOT_PRIVATE_KEY }}
          owner: delinoio
          repositories: oss
          permission-contents: write
      - name: Resolve bot commit identity
        id: identity
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: node scripts/release/project.mjs bot-identity
      - name: Commit or resume selected version
        id: prepare
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          RELEASE_BOT_NAME: ${{ steps.identity.outputs.name }}
          RELEASE_BOT_EMAIL: ${{ steps.identity.outputs.email }}
          RELEASE_CANDIDATE_BASE: ${{ needs.pnport-complete.outputs.base }}
          RELEASE_CANDIDATE_TREE: ${{ needs.pnport-complete.outputs.tree }}
        run: node scripts/release/project.mjs prepare

  registry:
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_REVISION: ${{ needs.prepare.outputs.revision }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Validate immutable release source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/project.mjs validate
      - name: Install Rust toolchain
        if: needs.prepare.outputs.kind == 'rust' && inputs.project != 'clibox' && inputs.project != 'pnport'
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-01-01
      - name: Cache Rust dependencies
        if: needs.prepare.outputs.kind == 'rust' && inputs.project != 'clibox' && inputs.project != 'pnport'
        uses: Swatinem/rust-cache@v2
      - name: Publish only the selected crate
        if: needs.prepare.outputs.kind == 'rust' && inputs.project != 'clibox' && inputs.project != 'pnport'
        env:
          CARGO_REGISTRY_TOKEN: ${{ inputs.project != 'clibox' && inputs.project != 'pnport' && inputs.project != 'async-commit-hook' && secrets.CARGO_REGISTRY_TOKEN || '' }}
        run: cargo run --locked -p cargo-mono -- publish --package "$RELEASE_PROJECT"

  tag:
    needs: [prepare, registry]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_REVISION: ${{ needs.prepare.outputs.revision }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Create fresh source repository token
        id: bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DELINO_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DELINO_RELEASE_BOT_PRIVATE_KEY }}
          owner: delinoio
          repositories: oss
          permission-contents: write
      - name: Push or verify the single release tag
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: node scripts/release/project.mjs tag

  summary:
    if: always()
    needs: [pnport-source, pnport-native, pnport-complete, prepare, registry, tag]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report release outcome
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const jobs = JSON.parse(process.env.RESULTS);
          const source = jobs.prepare.outputs;
          const lines = [
            `## ${process.env.RELEASE_PROJECT} release`, '',
            `Version: ${source.previous_version || 'unresolved'} → ${source.version || 'unresolved'}`,
            `Commit: ${source.revision || 'unresolved; inspect prepare logs'}`, `Tag: ${source.tag || 'unresolved'}`, '',
            '| Phase | Result |', '| --- | --- |',
            ...Object.entries(jobs).map(([name, job]) => `| ${name} | ${job.result} |`), '',
          ];
          const failed = Object.entries(jobs).filter(([name, job]) => job.result !== 'success' && !(process.env.RELEASE_PROJECT !== 'pnport' && name.startsWith('pnport-'))).map(([name]) => name);
          if (failed.length) lines.push(`Incomplete phases: ${failed.join(', ')}. Fix the failed phase, then rerun this release run to reuse any recorded version.`);
          else if (process.env.RELEASE_PROJECT === 'async-commit-hook') lines.push(
            'Version and tag preparation is complete. Signing, GitHub Release, and Homebrew require a separate manual run of [Release async-commit-hook](https://github.com/delinoio/oss/actions/workflows/release-async-commit-hook.yml). Consolidated Public Docs deploys automatically through Cloudflare Pages from main.',
            `Select main and version ${source.version}; dry_run defaults to true. Publication requires the dispatch commit to match ${source.revision}. If main has advanced, the existing tag check rejects publication; never move the tag.`,
          );
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          if (failed.length) process.exitCode = 1;
          JS
