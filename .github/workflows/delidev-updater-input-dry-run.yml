name: DeliDev updater input dry run

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delidev-updater-input-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version-file: .nvmrc, package-manager-cache: false }
      - id: targets
        run: echo "matrix=$(node apps/delidev/scripts/bundle-native-dry-run.mjs --plan)" >> "$GITHUB_OUTPUT"

  package:
    name: ${{ matrix.target }} keyless package
    needs: plan
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { lfs: true, persist-credentials: false }
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with: { version: 10.26.2 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          architecture: ${{ matrix.arch }}
          package-manager-cache: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with: { go-version-file: go.mod, cache: false }
      - uses: dtolnay/rust-toolchain@v1
        with: { toolchain: nightly-2026-09-28 }
      - name: Select the native Rust host
        run: rustup set default-host ${{ matrix.target }}
      - name: Install both pinned macOS CEF helper targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Install Linux build and package inspection tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libayatana-appindicator3-dev libgtk-3-dev libgtk-4-dev xdg-desktop-portal xdg-desktop-portal-gtk zenity libgbm-dev libx11-dev libxkbcommon-x11-0 libxtst-dev libssl-dev pkg-config patchelf
      - name: Prepare immutable host Tauri CLI
        id: prebuilt
        uses: ./.github/actions/setup-prebuilt

      - name: Install locked build dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify package tooling
        run: pnpm --dir apps/delidev test:bundle-dry-run
      - name: Build verified desktop and Worker updater inputs without release credentials
        run: pnpm --dir apps/delidev bundle:updater-dry-run --target ${{ matrix.target }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: delidev-updater-input-${{ matrix.target }}-${{ github.sha }}
          path: target/delidev-updater-input/${{ matrix.target }}/${{ github.sha }}/
          if-no-files-found: error
          retention-days: 7

      - name: Save verified CLI after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.prebuilt.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.prebuilt.outputs.cache-path }}
          key: ${{ steps.prebuilt.outputs.cache-key }}
