name: Release async-commit-hook
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact committed MAJOR.MINOR.PATCH
        type: string
        required: true
        default: '0.1.0'
      dry_run:
        description: Build and validate without signing or publication
        type: boolean
        required: true
        default: true
permissions:
  contents: read
concurrency:
  group: release-async-commit-hook
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: true
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10.26.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Validate identity and source versions
        env:
          VERSION: ${{ inputs.version }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          python3 scripts/release/build-async-commit-hook.py --validate
          node -e 'if (require("./packaging/async-commit-hook/release-metadata.json").version !== process.env.VERSION) process.exit(1)'
      - name: Install and validate
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter devhud-admin build:embedded
          pnpm --filter async-commit-hook build:embedded
          go test ./...
          go test -race ./cmds/async-commit-hook/...
          pnpm --filter async-commit-hook test
          pnpm --filter public-docs test
          pnpm --filter @delinoio/async-commit-hook-api-client test
          pnpm proto:check
          node --test scripts/release/async-commit-hook.test.mjs
          node --test scripts/ci/async-commit-hook-release.test.mjs
      - name: Build all six unsigned archives
        run: python3 scripts/release/build-async-commit-hook.py --output "$RUNNER_TEMP/ach-release"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !inputs.dry_run }}
        with:
          name: ach-unsigned
          path: ${{ runner.temp }}/ach-release
          retention-days: 7
          if-no-files-found: error
  publish:
    if: ${{ !inputs.dry_run }}
    needs: validate
    environment: async-commit-hook-release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-clibox
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ach-unsigned
          path: release
      - name: Verify existing release tag before signing
        run: python3 scripts/release/build-async-commit-hook.py --verify-tag "$GITHUB_SHA"
      - uses: sigstore/cosign-installer@v4
      - name: Sign every artifact and checksum manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('release/compatibility.json')
          m = json.loads(p.read_text())
          m['signed'] = True
          m['published'] = True
          p.write_text(json.dumps(m, indent=2) + '\n')
          PY
          REQUIRE_COSIGN=1 scripts/release/generate-checksums.sh --artifacts-dir release
      - name: Publish exact version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          python3 scripts/release/publish-async-commit-hook.py --assets release --version "$VERSION" --revision "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
  homebrew:
    if: ${{ !inputs.dry_run }}
    needs: publish
    environment: async-commit-hook-release
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ach-unsigned
          path: release
      - name: Update Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GH_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          gh repo clone delinoio/homebrew-tap "$RUNNER_TEMP/ach-tap" -- --depth=1
          mkdir -p "$RUNNER_TEMP/ach-tap/Formula"
          cp release/async-commit-hook.rb "$RUNNER_TEMP/ach-tap/Formula/async-commit-hook.rb"
          cd "$RUNNER_TEMP/ach-tap"
          git config user.name github-actions[bot]
          git config user.email github-actions@users.noreply.github.com
          gh auth setup-git
          git add Formula/async-commit-hook.rb
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update async-commit-hook formula'
            git push origin HEAD:main
          fi
