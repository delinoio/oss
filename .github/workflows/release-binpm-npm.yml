name: Release binpm npm

# Every npm Trusted Publisher names this exact file. Keep publication here.
on:
  push:
    tags: ["binpm@v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify without publishing; publication requires the exact version tag
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-binpm-npm
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'delinoio/oss'
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.source.outputs.version }}
      revision: ${{ steps.source.outputs.revision }}
      dry_run: ${{ steps.source.outputs.dry_run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Validate exact release source
        id: source
        env:
          REQUESTED_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          import { releaseIdentity } from './packages/binpm/scripts/common.mjs';
          const identity = releaseIdentity();
          appendFileSync(process.env.GITHUB_OUTPUT, Object.entries(identity).map(([key, value]) => `${key}=${value}\n`).join(''));
          JS

  build:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            suffix: darwin-x64
          - runner: macos-14
            target: aarch64-apple-darwin
            suffix: darwin-arm64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: win32-x64-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            suffix: win32-arm64-msvc
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            suffix: linux-x64-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            suffix: linux-arm64-gnu
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
          architecture: ${{ startsWith(matrix.target, 'aarch64-') && 'arm64' || 'x64' }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly-2026-09-28
          targets: ${{ matrix.target }}
      - name: Build Linux with the pinned compatibility image
        if: runner.os == 'Linux'
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          image=$(node -p 'JSON.parse(require("node:fs").readFileSync("packaging/linux/pins.json")).rust_image')
          docker run --rm -v "$PWD:/workspace" -w /workspace "$image" bash scripts/release/linux-packages/build-rust.sh binpm "$RELEASE_TARGET"
          sudo chown -R "$(id -u):$(id -g)" target
      - name: Build native binary and package
        shell: bash
        env:
          BINPM_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [[ "$BINPM_TARGET" != *-linux-gnu ]]; then
            cargo build --locked --release -p binpm --target "$BINPM_TARGET"
          fi
          binary="target/$BINPM_TARGET/release/binpm"
          if [[ "$BINPM_TARGET" == *windows* ]]; then binary="$binary.exe"; fi
          node packages/binpm/scripts/package.mjs binary --target "$BINPM_TARGET" --binary "$binary"
      - name: Verify installed npm consumer
        run: node packages/binpm/scripts/smoke.mjs --directory packages/binpm/dist/tarballs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: binpm-npm-native-${{ matrix.suffix }}
          path: packages/binpm/dist/tarballs/*.tgz
          if-no-files-found: error
          retention-days: 30

  package:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: binpm-npm-native-*
          path: packages/binpm/dist/tarballs
          merge-multiple: true
      - name: Package launcher and verify all seven tarballs
        run: |
          node packages/binpm/scripts/package.mjs main
          node packages/binpm/scripts/package.mjs verify --output packages/binpm/dist/tarballs
          node packages/binpm/scripts/publish.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: binpm-npm-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.revision }}
          path: packages/binpm/dist/tarballs/*.tgz
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [prepare, package]
    if: needs.prepare.outputs.dry_run == 'false' && github.repository == 'delinoio/oss' && startsWith(github.ref, 'refs/tags/binpm@v')
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    env:
      REQUESTED_DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install pinned npm for trusted publishing
        run: npm install --global npm@11.6.2 --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: binpm-npm-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.revision }}
          path: packages/binpm/dist/tarballs
      - name: Publish exact verified tarballs through OIDC
        run: node packages/binpm/scripts/publish.mjs --publish
