name: Release binpm npm

# Publishes the binpm npm packages (`@delino/binpm` and `@delino/binpm-*`) through npm
# trusted publishing. The npm Trusted Publisher entry for every package names
# this exact file, so do not rename it or move publication to another workflow.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Package and verify without publishing
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-binpm-npm
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'delinoio/oss' && github.ref == 'refs/heads/main'
    name: Package and verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Package npm tarballs
        run: node packages/binpm/scripts/package.mjs
      - name: Dry-run publication
        run: node packages/binpm/scripts/publish.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: binpm-npm-${{ github.sha }}
          path: packages/binpm/dist/tarballs/*
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: package
    if: ${{ !inputs.dry_run && github.repository == 'delinoio/oss' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install pinned npm for trusted publishing
        run: npm install --global npm@11.6.2 --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: binpm-npm-${{ github.sha }}
          path: packages/binpm/dist/tarballs
      - name: Publish exact verified tarballs through OIDC
        run: node packages/binpm/scripts/publish.mjs --publish
