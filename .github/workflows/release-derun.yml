name: Release derun

on:
  push:
    tags:
      - "derun@v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semver without v prefix (for example: 0.2.0)"
        required: true
      dry_run:
        description: "If true, skip release publication and Homebrew tap push"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-derun-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Validate source and release metadata
        id: meta
        env:
          RELEASE_PROJECT: derun
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/release/project.mjs source

  build:
    name: Build (${{ matrix.asset_os }}-${{ matrix.asset_arch }})
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset_os: linux
            asset_arch: amd64
            archive_ext: tar.gz
          - goos: linux
            goarch: arm64
            asset_os: linux
            asset_arch: arm64
            archive_ext: tar.gz
          - goos: darwin
            goarch: amd64
            asset_os: darwin
            asset_arch: amd64
            archive_ext: tar.gz
          - goos: darwin
            goarch: arm64
            asset_os: darwin
            asset_arch: arm64
            archive_ext: tar.gz
          - goos: windows
            goarch: amd64
            asset_os: windows
            asset_arch: amd64
            archive_ext: zip
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build derun
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          artifact_name="derun-${{ matrix.asset_os }}-${{ matrix.asset_arch }}.${{ matrix.archive_ext }}"

          output_name="derun"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            output_name="derun.exe"
          fi

          CGO_ENABLED=0 GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" \
            go build -trimpath -ldflags="-s -w" -o "$output_name" ./cmds/derun

          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -j "dist/${artifact_name}" "$output_name"
          else
            tar -czf "dist/${artifact_name}" "$output_name"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: derun-${{ matrix.asset_os }}-${{ matrix.asset_arch }}
          path: dist/*

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: ./.github/actions/setup-clibox

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist

      - name: Flatten artifact directory
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-dist
          find dist -maxdepth 2 -type f -exec cp {} release-dist/ \;
          rm -rf dist
          mv release-dist dist
          find dist -maxdepth 1 -type f | pnpm exec clibox text replace '(?m)^(.+)$' "artifact: \$1" --regex >&2

      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Generate checksums and signatures
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./scripts/release/generate-checksums.sh
          ./scripts/release/generate-checksums.sh --artifacts-dir dist

      - name: Create GitHub release
        if: env.DRY_RUN != 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*
          generate_release_notes: true

      - name: Render Homebrew update
        if: env.DRY_RUN == 'true'
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./scripts/release/update-homebrew.sh

          darwin_amd64_asset="derun-darwin-amd64.tar.gz"
          darwin_amd64_sha="$(grep " ${darwin_amd64_asset}$" dist/SHA256SUMS | awk '{print $1}')"
          darwin_amd64_url="https://github.com/delinoio/oss/releases/download/${RELEASE_TAG}/${darwin_amd64_asset}"

          darwin_arm64_asset="derun-darwin-arm64.tar.gz"
          darwin_arm64_sha="$(grep " ${darwin_arm64_asset}$" dist/SHA256SUMS | awk '{print $1}')"
          darwin_arm64_url="https://github.com/delinoio/oss/releases/download/${RELEASE_TAG}/${darwin_arm64_asset}"

          linux_amd64_asset="derun-linux-amd64.tar.gz"
          linux_amd64_sha="$(grep " ${linux_amd64_asset}$" dist/SHA256SUMS | awk '{print $1}')"
          linux_amd64_url="https://github.com/delinoio/oss/releases/download/${RELEASE_TAG}/${linux_amd64_asset}"

          linux_arm64_asset="derun-linux-arm64.tar.gz"
          linux_arm64_sha="$(grep " ${linux_arm64_asset}$" dist/SHA256SUMS | awk '{print $1}')"
          linux_arm64_url="https://github.com/delinoio/oss/releases/download/${RELEASE_TAG}/${linux_arm64_asset}"

          ./scripts/release/update-homebrew.sh \
            --project derun \
            --version "$RELEASE_VERSION" \
            --darwin-amd64-url "$darwin_amd64_url" \
            --darwin-amd64-sha256 "$darwin_amd64_sha" \
            --darwin-arm64-url "$darwin_arm64_url" \
            --darwin-arm64-sha256 "$darwin_arm64_sha" \
            --linux-amd64-url "$linux_amd64_url" \
            --linux-amd64-sha256 "$linux_amd64_sha" \
            --linux-arm64-url "$linux_arm64_url" \
            --linux-arm64-sha256 "$linux_arm64_sha" \
            --dry-run >/dev/null

      - name: Setup Node for release bot identity
        if: env.DRY_RUN != 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Create Homebrew repository token
        if: env.DRY_RUN != 'true'
        id: tap-bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DELINO_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DELINO_RELEASE_BOT_PRIVATE_KEY }}
          owner: delinoio
          repositories: homebrew-tap
          permission-contents: write

      - name: Resolve Homebrew bot identity
        if: env.DRY_RUN != 'true'
        id: tap-identity
        env:
          GH_TOKEN: ${{ steps.tap-bot.outputs.token }}
        run: node scripts/release/project.mjs bot-identity

      - name: Submit Homebrew update
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ steps.tap-bot.outputs.token }}
          RELEASE_BOT_NAME: ${{ steps.tap-identity.outputs.name }}
          RELEASE_BOT_EMAIL: ${{ steps.tap-identity.outputs.email }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./scripts/release/update-homebrew.sh

          darwin_amd64_asset="derun-darwin-amd64.tar.gz"
          darwin_amd64_sha="$(grep " ${darwin_amd64_asset}$" dist/SHA256SUMS | awk '{print $1}')"
          darwin_amd64_url="https://github.com/delinoio/oss/releases/download/${RELEASE_TAG}/${darwin_amd64_asset}"

          darwin_arm64_asset="derun-darwin-arm64.tar.gz"
          darwin_arm64_sha="$(grep " ${darwin_arm64_asset}$" dist/SHA256SUMS | awk '{print $1}')"
          darwin_arm64_url="https://github.com/delinoio/oss/releases/download/${RELEASE_TAG}/${darwin_arm64_asset}"

          linux_amd64_asset="derun-linux-amd64.tar.gz"
          linux_amd64_sha="$(grep " ${linux_amd64_asset}$" dist/SHA256SUMS | awk '{print $1}')"
          linux_amd64_url="https://github.com/delinoio/oss/releases/download/${RELEASE_TAG}/${linux_amd64_asset}"

          linux_arm64_asset="derun-linux-arm64.tar.gz"
          linux_arm64_sha="$(grep " ${linux_arm64_asset}$" dist/SHA256SUMS | awk '{print $1}')"
          linux_arm64_url="https://github.com/delinoio/oss/releases/download/${RELEASE_TAG}/${linux_arm64_asset}"

          ./scripts/release/update-homebrew.sh \
            --project derun \
            --version "$RELEASE_VERSION" \
            --darwin-amd64-url "$darwin_amd64_url" \
            --darwin-amd64-sha256 "$darwin_amd64_sha" \
            --darwin-arm64-url "$darwin_arm64_url" \
            --darwin-arm64-sha256 "$darwin_arm64_sha" \
            --linux-amd64-url "$linux_amd64_url" \
            --linux-amd64-sha256 "$linux_amd64_sha" \
            --linux-arm64-url "$linux_arm64_url" \
            --linux-arm64-sha256 "$linux_arm64_sha"

  linux-packages:
    name: Publish native Linux packages
    needs: [prepare, publish]
    if: needs.prepare.outputs.dry_run != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/release-linux-packages.yml
    # Required for the called job to resolve its protected environment secrets.
    # Remove only when actions/runner#4453 is fixed and environment access is verified.
    secrets: inherit
    with:
      project: derun
      version: ${{ needs.prepare.outputs.version }}
      revision: ${{ github.sha }}
      mode: publish
