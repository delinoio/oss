name: DevHud CEF security review

on:
  schedule:
    - cron: '17 4 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devhud-cef-security-review
  cancel-in-progress: false

jobs:
  compare:
    name: Compare pinned Tauri CEF revision
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout pinned repository state
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Compare revision and collect safe metadata
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPOSITORY: tauri-apps/tauri
          UPSTREAM_BRANCH: feat/cef
          EXPECTED_REVISION: 4af26a3f7f8b692d62cca549bbacd93f5ce90b41
        run: |
          set -euo pipefail
          report=devhud-cef-security-review.json
          pin=$(node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const pins = JSON.parse(readFileSync('apps/devhud/cef-pins.json', 'utf8'));
          if (pins?.tauri?.revision !== '4af26a3f7f8b692d62cca549bbacd93f5ce90b41') process.exit(2);
          process.stdout.write(pins.tauri.revision);
          NODE
          )
          test "$pin" = "$EXPECTED_REVISION"
          lock_revisions=$(awk '/^source = "git\+https:\/\/github\.com\/tauri-apps\/tauri\?rev=/{print}' Cargo.lock | sort -u)
          test "$(printf '%s\n' "$lock_revisions" | wc -l)" -eq 1
          grep -Fq "rev=$EXPECTED_REVISION#$EXPECTED_REVISION" <<< "$lock_revisions"
          gh api "repos/$UPSTREAM_REPOSITORY/compare/$EXPECTED_REVISION...$UPSTREAM_BRANCH" > cef-compare.json
          gh api "repos/$UPSTREAM_REPOSITORY/commits/$UPSTREAM_BRANCH" > cef-branch.json
          node --input-type=module - "$report" "$pin" "$GITHUB_SHA" <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const [, , output, pin, workflowRevision] = process.argv;
          const compare = JSON.parse(readFileSync('cef-compare.json', 'utf8'));
          const branch = JSON.parse(readFileSync('cef-branch.json', 'utf8'));
          const commits = Array.isArray(compare.commits) ? compare.commits : [];
          const signals = commits
            .map((commit) => ({ sha: commit.sha, message: String(commit.commit?.message ?? '').split('\n')[0] }))
            .filter(({ message }) => /\b(?:CVE|security|vulnerab|exploit|chromium|cef)\b/i.test(message))
            .map(({ sha }) => ({ sha, securityKeyword: true }))
            .slice(0, 50);
          const report = {
            schemaVersion: 1,
            repository: 'tauri-apps/tauri',
            branch: 'feat/cef',
            committedRevision: pin,
            upstreamRevision: branch.sha,
            upstreamCommitDate: branch.commit?.committer?.date ?? null,
            comparison: {
              status: compare.status ?? null,
              aheadBy: compare.ahead_by ?? null,
              behindBy: compare.behind_by ?? null,
              totalCommits: compare.total_commits ?? null,
            },
            securitySignals: signals,
            workflowRevision,
            mutationPerformed: false,
            publicationPerformed: false,
          };
          writeFileSync(output, `${JSON.stringify(report, null, 2)}\n`, { mode: 0o600 });
          console.log(JSON.stringify({ ...report, securitySignals: signals.length }));
          NODE

      - name: Write maintainer summary
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('devhud-cef-security-review.json', 'utf8'));
          console.log('## DevHud CEF security review');
          console.log(`- Committed Tauri revision: \`${report.committedRevision}\``);
          console.log(`- Upstream \\`feat/cef\\`: \`${report.upstreamRevision}\``);
          console.log(`- Comparison: ${report.comparison.status}, ahead ${report.comparison.aheadBy}, behind ${report.comparison.behindBy}`);
          console.log(`- Security-related commit signals: ${report.securitySignals.length}`);
          console.log('- Mutation/publication performed: false/false');
          console.log('- High-risk findings require the maintainer pin-update, compatibility, signed-release, and updater-publication runbook gates.');
          NODE

      - name: Upload bounded metadata report
        uses: actions/upload-artifact@v7
        with:
          name: devhud-cef-security-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: devhud-cef-security-review.json
          if-no-files-found: error
          retention-days: 35
