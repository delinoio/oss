name: CacheCow release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact committed MAJOR.MINOR.PATCH
        required: true
        type: string
      dry_run:
        description: Build and accept without publishing
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-ccow
  cancel-in-progress: false

jobs:
  # The Rust CLI builds each native target on a matching GitHub-hosted host with
  # the pinned toolchain. Ubuntu 22.04 keeps the Linux glibc floor. Compilation
  # here is not native acceptance; the native job below still owns it.
  build:
    if: github.repository == 'delinoio/oss' && github.ref == 'refs/heads/main'
    name: Build native binary (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: darwin-arm64
            rust: aarch64-apple-darwin
            runner: macos-15
          - target: linux-x64
            rust: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: windows-x64
            rust: x86_64-pc-windows-msvc
            runner: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          lfs: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly-2026-09-28
          targets: ${{ matrix.rust }}
      - name: Validate exact version and source
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: node scripts/release/ccow-acceptance.mjs plan "$REQUESTED_VERSION" "$GITHUB_SHA" "$GITHUB_REF"
      - name: Build native binary with embedded release identity
        shell: bash
        env:
          CCOW_TARGET: ${{ matrix.target }}
        run: node packages/ccow/scripts/build-native.mjs --target "$CCOW_TARGET" --output "$RUNNER_TEMP/ccow-binaries"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ccow-binary-${{ matrix.target }}-${{ github.sha }}
          path: ${{ runner.temp }}/ccow-binaries
          if-no-files-found: error

  candidate:
    needs: build
    if: github.repository == 'delinoio/oss' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          lfs: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Validate exact version and source
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: node scripts/release/ccow-acceptance.mjs plan "$REQUESTED_VERSION" "$GITHUB_SHA" "$GITHUB_REF"
      - name: Test distribution contracts
        run: node --test packages/ccow/test/*.test.mjs scripts/release/ccow-acceptance.test.mjs scripts/release/ccow-publish.test.mjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: ccow-binary-*-${{ github.sha }}
          merge-multiple: true
          path: ${{ runner.temp }}/ccow-binaries
      - name: Package and verify versioned candidate archives
        run: |
          # Artifact transfer drops execute bits; archives set modes explicitly.
          chmod 0755 "$RUNNER_TEMP"/ccow-binaries/*/ccow*
          node packages/ccow/scripts/package.mjs --binaries "$RUNNER_TEMP/ccow-binaries" --output "$RUNNER_TEMP/ccow-candidate" --revision "$GITHUB_SHA"
          node packages/ccow/scripts/verify.mjs --directory "$RUNNER_TEMP/ccow-candidate" --revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ccow-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/ccow-candidate/*
          if-no-files-found: error

  # Native acceptance runs on GitHub-hosted runners. Each lane formats only new
  # disposable image files under RUNNER_TEMP, never a runner volume, to supply
  # the CoW workspace, a second CoW volume and an unsupported-filesystem path.
  native:
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: macos15-apfs
            runner: macos-15
          - lane: ubuntu22-btrfs
            runner: ubuntu-22.04
            filesystem: btrfs
          - lane: ubuntu22-xfs
            runner: ubuntu-22.04
            filesystem: xfs
          - lane: windows24h2-refs
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          lfs: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Install the minimum Cargo toolchain
        shell: bash
        run: rustup toolchain install 1.99.1 --profile minimal --no-self-update
      - name: Provision Linux acceptance volumes
        if: runner.os == 'Linux'
        shell: bash
        env:
          CCOW_FILESYSTEM: ${{ matrix.filesystem }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends btrfs-progs xfsprogs e2fsprogs time zsh
          volumes="$RUNNER_TEMP/ccow-volumes"
          # The unsupported path stays on the runner's ext4 disk.
          mkdir -p "$volumes/unsupported"
          for name in workspace copy; do
            image="$volumes/$name.img"
            truncate --size 8G "$image"
            case "$CCOW_FILESYSTEM" in
              btrfs) mkfs.btrfs --quiet "$image" ;;
              xfs) mkfs.xfs -q -m reflink=1 "$image" ;;
              *) echo "Unknown acceptance filesystem" >&2; exit 1 ;;
            esac
            mkdir "$volumes/$name"
            sudo mount -o loop,nosuid,nodev "$image" "$volumes/$name"
            sudo chown "$(id -u):$(id -g)" "$volumes/$name"
          done
          {
            echo "CCOW_NATIVE_WORKSPACE=$volumes/workspace"
            echo "CCOW_ACCEPTANCE_COPY_WORKSPACE=$volumes/copy"
            echo "CCOW_ACCEPTANCE_UNSUPPORTED_WORKSPACE=$volumes/unsupported"
          } >> "$GITHUB_ENV"
      - name: Provision macOS acceptance volumes
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          volumes="$RUNNER_TEMP/ccow-volumes"
          # The workspace stays on the runner's APFS disk. The copy volume is a
          # second APFS volume and the unsupported volume uses HFS+.
          mkdir -p "$volumes/workspace" "$volumes/copy" "$volumes/unsupported"
          hdiutil create -size 8g -fs APFS -volname ccow-copy -type SPARSE "$volumes/copy.sparseimage"
          hdiutil create -size 2g -fs HFS+ -volname ccow-unsupported -type SPARSE "$volumes/unsupported.sparseimage"
          for name in copy unsupported; do
            hdiutil attach -nobrowse -owners on -mountpoint "$volumes/$name" "$volumes/$name.sparseimage"
            sudo chown "$(id -u):$(id -g)" "$volumes/$name"
          done
          {
            echo "CCOW_NATIVE_WORKSPACE=$volumes/workspace"
            echo "CCOW_ACCEPTANCE_COPY_WORKSPACE=$volumes/copy"
            echo "CCOW_ACCEPTANCE_UNSUPPORTED_WORKSPACE=$volumes/unsupported"
          } >> "$GITHUB_ENV"
      - name: Provision Windows acceptance volumes
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $volumes = Join-Path $env:RUNNER_TEMP 'ccow-volumes'
          # The unsupported path stays on the runner's NTFS disk.
          New-Item -ItemType Directory -Force -Path (Join-Path $volumes 'unsupported') | Out-Null
          $letters = [ordered]@{ workspace = 'R'; copy = 'S' }
          foreach ($name in $letters.Keys) {
            $letter = $letters[$name]
            $vhd = Join-Path $volumes "$name.vhdx"
            $script = Join-Path $volumes "$name.diskpart"
            Set-Content -Path $script -Encoding ascii -Value @(
              "create vdisk file=`"$vhd`" maximum=16384 type=expandable",
              "select vdisk file=`"$vhd`"",
              'attach vdisk',
              'create partition primary',
              "assign letter=$letter"
            )
            diskpart /s $script
            if ($LASTEXITCODE -ne 0) { throw "diskpart failed for the $name volume" }
            Format-Volume -DriveLetter $letter -FileSystem ReFS -NewFileSystemLabel "ccow-$name" -Confirm:$false -Force | Out-Null
            New-Item -ItemType Directory -Force -Path "${letter}:\ccow" | Out-Null
          }
          Add-Content -Path $env:GITHUB_ENV -Value @(
            'CCOW_NATIVE_WORKSPACE=R:\ccow',
            'CCOW_ACCEPTANCE_COPY_WORKSPACE=S:\ccow',
            "CCOW_ACCEPTANCE_UNSUPPORTED_WORKSPACE=$(Join-Path $volumes 'unsupported')"
          )
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ccow-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/ccow-candidate
      - name: Execute native minimum-environment acceptance
        shell: bash
        env:
          CCOW_LANE: ${{ matrix.lane }}
        run: |
          node scripts/release/ccow-acceptance.mjs native "$CCOW_LANE" "$RUNNER_TEMP/ccow-candidate" "$CCOW_NATIVE_WORKSPACE" "$RUNNER_TEMP/$CCOW_LANE.json" "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ccow-evidence-${{ matrix.lane }}-${{ github.sha }}
          path: ${{ runner.temp }}/${{ matrix.lane }}.json
          if-no-files-found: error

  gate:
    needs: [candidate, native]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ccow-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/ccow-candidate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: ccow-evidence-*-${{ github.sha }}
          merge-multiple: true
          path: ${{ runner.temp }}/ccow-evidence
      - name: Require complete evidence for the exact candidate
        run: node scripts/release/ccow-acceptance.mjs gate "$RUNNER_TEMP/ccow-evidence" "$RUNNER_TEMP/ccow-candidate" "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ccow-accepted-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ccow-candidate/*
            ${{ runner.temp }}/ccow-evidence/*
          if-no-files-found: error

  publish:
    needs: [candidate, native, gate]
    if: ${{ !inputs.dry_run && github.repository == 'delinoio/oss' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-22.04
    environment: ccow-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          lfs: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ccow-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/ccow-candidate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: ccow-evidence-*-${{ github.sha }}
          merge-multiple: true
          path: ${{ runner.temp }}/ccow-evidence
      - name: Revalidate native acceptance before credentials
        run: node scripts/release/ccow-acceptance.mjs gate "$RUNNER_TEMP/ccow-evidence" "$RUNNER_TEMP/ccow-candidate" "$GITHUB_SHA"
      - name: Create repository release token
        id: release-bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DELINO_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DELINO_RELEASE_BOT_PRIVATE_KEY }}
          owner: delinoio
          repositories: oss
          permission-contents: write
      - name: Reconcile exact GitHub and npm publication
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: node scripts/release/ccow-publish.mjs "$RUNNER_TEMP/ccow-candidate" "$RUNNER_TEMP/ccow-evidence" "$REQUESTED_VERSION"
