name: Package DevHUD private candidate

on:
  workflow_call:
    inputs:
      mode:
        description: Plan without secrets, or build a fully signed private candidate
        required: false
        default: signed-private
        type: string
      revision:
        description: Exact source revision selected by the coordinated release workflow
        required: false
        default: ""
        type: string
    outputs:
      version:
        description: Validated DevHud release version
        value: ${{ jobs.plan.outputs.version }}
      artifact_id:
        description: Immutable complete private candidate artifact ID
        value: ${{ jobs.assemble.outputs.artifact_id }}
      artifact_name:
        description: Revision-bound complete private candidate artifact name
        value: ${{ jobs.assemble.outputs.artifact_name }}
      run_id:
        description: Candidate provenance workflow run ID
        value: ${{ jobs.assemble.outputs.run_id }}
      run_attempt:
        description: Candidate provenance workflow run attempt
        value: ${{ jobs.assemble.outputs.run_attempt }}
  workflow_dispatch:
    inputs:
      mode:
        description: Plan without secrets, or build a fully signed private candidate
        required: true
        default: plan-only
        type: choice
        options: [plan-only, signed-private]

permissions:
  contents: read

concurrency:
  group: devhud-private-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Secret-redacted release plan
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.identity.outputs.version }}
      started_on: ${{ steps.invocation.outputs.started_on }}
    steps:
      - name: Validate invocation mode
        env:
          PRIVATE_MODE: ${{ inputs.mode }}
          SOURCE_REVISION: ${{ inputs.revision || github.sha }}
        run: |
          set -euo pipefail
          case "$PRIVATE_MODE" in
            plan-only|signed-private) ;;
            *) echo "unsupported private candidate mode" >&2; exit 1 ;;
          esac
          [[ "$SOURCE_REVISION" =~ ^[a-f0-9]{40}$ ]]
          if [ "$PRIVATE_MODE" = signed-private ] && [ "$SOURCE_REVISION" != "$GITHUB_SHA" ]; then
            echo "signed private candidates must be built from the caller revision" >&2
            exit 1
          fi
      - name: Capture provenance start time
        id: invocation
        run: echo "started_on=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with: { fetch-depth: 0, ref: "${{ inputs.revision || github.sha }}" }
      - uses: actions/setup-node@v6
        with: { node-version-file: .nvmrc }
      - name: Validate release tooling
        run: node --test scripts/release/*.test.mjs
      - name: Write redacted plan
        run: node scripts/release/devhud-release.mjs plan --output devhud-private-plan.json
      - name: Expose validated non-secret identity
        id: identity
        run: echo "version=$(node -p \"require('./packaging/devhud/release-metadata.json').version\")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: release-plan-devhud-${{ github.run_id }}-${{ github.run_attempt }}
          path: devhud-private-plan.json
          if-no-files-found: error

  preflight:
    name: Fail-closed signing preflight
    if: ${{ inputs.mode == 'signed-private' }}
    needs: plan
    runs-on: ubuntu-22.04
    environment: devhud-private-build
    env:
      DEVHUD_CHROME_EXTENSION_ID: ${{ vars.DEVHUD_CHROME_EXTENSION_ID }}
      DEVHUD_CHROME_EXTENSION_PUBLIC_KEY: ${{ secrets.DEVHUD_CHROME_EXTENSION_PUBLIC_KEY }}
      DEVHUD_UPDATER_SIGNING_KEY_B64: ${{ secrets.DEVHUD_UPDATER_SIGNING_KEY_B64 }}
      DEVHUD_MACOS_DEVELOPER_ID_P12_B64: ${{ secrets.DEVHUD_MACOS_DEVELOPER_ID_P12_B64 }}
      DEVHUD_MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVHUD_MACOS_DEVELOPER_ID_P12_PASSWORD }}
      DEVHUD_MACOS_SIGNING_IDENTITY: ${{ vars.DEVHUD_MACOS_SIGNING_IDENTITY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_PRIVATE_KEY_B64: ${{ secrets.APPLE_API_PRIVATE_KEY_B64 }}
      DEVHUD_WINDOWS_SIGNING_PFX_B64: ${{ secrets.DEVHUD_WINDOWS_SIGNING_PFX_B64 }}
      DEVHUD_WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.DEVHUD_WINDOWS_SIGNING_PFX_PASSWORD }}
      DEVHUD_WINDOWS_CERTIFICATE_SHA256: ${{ vars.DEVHUD_WINDOWS_CERTIFICATE_SHA256 }}
      DEVHUD_WINDOWS_TIMESTAMP_URL: ${{ vars.DEVHUD_WINDOWS_TIMESTAMP_URL }}
      DEVHUD_IOS_DISTRIBUTION_P12_B64: ${{ secrets.DEVHUD_IOS_DISTRIBUTION_P12_B64 }}
      DEVHUD_IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.DEVHUD_IOS_DISTRIBUTION_P12_PASSWORD }}
      DEVHUD_IOS_APP_PROFILE_B64: ${{ secrets.DEVHUD_IOS_APP_PROFILE_B64 }}
      DEVHUD_IOS_WIDGET_PROFILE_B64: ${{ secrets.DEVHUD_IOS_WIDGET_PROFILE_B64 }}
      DEVHUD_IOS_WIDGET_INTENT_PROFILE_B64: ${{ secrets.DEVHUD_IOS_WIDGET_INTENT_PROFILE_B64 }}
      DEVHUD_APPLE_TEAM_ID: ${{ vars.DEVHUD_APPLE_TEAM_ID }}
      DEVHUD_ANDROID_UPLOAD_KEYSTORE_B64: ${{ secrets.DEVHUD_ANDROID_UPLOAD_KEYSTORE_B64 }}
      DEVHUD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.DEVHUD_ANDROID_KEYSTORE_PASSWORD }}
      DEVHUD_ANDROID_KEY_ALIAS: ${{ secrets.DEVHUD_ANDROID_KEY_ALIAS }}
      DEVHUD_ANDROID_KEY_PASSWORD: ${{ secrets.DEVHUD_ANDROID_KEY_PASSWORD }}
      DEVHUD_ANDROID_CERTIFICATE_SHA256: ${{ vars.DEVHUD_ANDROID_CERTIFICATE_SHA256 }}
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0, ref: "${{ inputs.revision || github.sha }}" }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with: { node-version-file: .nvmrc }
      - name: Validate every signing input and active updater root
        run: |
          node scripts/release/devhud-release.mjs plan --signed
          pnpm --filter devhud release:validate-updater

  desktop:
    name: ${{ matrix.id }} signed package
    if: ${{ inputs.mode == 'signed-private' }}
    needs: preflight
    environment: devhud-private-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: macos-x64, runner: macos-15-intel, bundle: dmg, artifact: devhud-macos-x64.dmg, updater: devhud-macos-x64-macos-app.tar.gz }
          - { id: macos-arm64, runner: macos-15, bundle: dmg, artifact: devhud-macos-arm64.dmg, updater: devhud-macos-arm64-macos-app.tar.gz }
          - { id: windows-x64-msi, runner: windows-2022, bundle: msi, artifact: devhud-windows-x64-windows-msi.msi }
          - { id: windows-x64-nsis, runner: windows-2022, bundle: nsis, artifact: devhud-windows-x64-windows-nsis.exe }
          - { id: windows-arm64-msi, runner: windows-11-arm, bundle: msi, artifact: devhud-windows-arm64-windows-msi.msi }
          - { id: windows-arm64-nsis, runner: windows-11-arm, bundle: nsis, artifact: devhud-windows-arm64-windows-nsis.exe }
          - { id: ubuntu-x64-appimage, runner: ubuntu-22.04, bundle: appimage, artifact: devhud-ubuntu-x64-linux-appimage.AppImage }
          - { id: ubuntu-x64-deb, runner: ubuntu-22.04, bundle: deb, artifact: devhud-ubuntu-x64-linux-deb.deb }
          - { id: ubuntu-arm64-appimage, runner: ubuntu-22.04-arm, bundle: appimage, artifact: devhud-ubuntu-arm64-linux-appimage.AppImage }
          - { id: ubuntu-arm64-deb, runner: ubuntu-22.04-arm, bundle: deb, artifact: devhud-ubuntu-arm64-linux-deb.deb }
    runs-on: ${{ matrix.runner }}
    env:
      CI: "true"
      DEVHUD_PRIVATE_RELEASE: "1"
      DEVHUD_CHROME_EXTENSION_ID: ${{ vars.DEVHUD_CHROME_EXTENSION_ID }}
      DEVHUD_CHROME_EXTENSION_PUBLIC_KEY: ${{ secrets.DEVHUD_CHROME_EXTENSION_PUBLIC_KEY }}
      DEVHUD_MACOS_SIGNING_IDENTITY: ${{ vars.DEVHUD_MACOS_SIGNING_IDENTITY }}
      APPLE_SIGNING_IDENTITY: ${{ vars.DEVHUD_MACOS_SIGNING_IDENTITY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      DEVHUD_WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.DEVHUD_WINDOWS_SIGNING_PFX_PASSWORD }}
      DEVHUD_WINDOWS_CERTIFICATE_SHA256: ${{ vars.DEVHUD_WINDOWS_CERTIFICATE_SHA256 }}
      DEVHUD_WINDOWS_TIMESTAMP_URL: ${{ vars.DEVHUD_WINDOWS_TIMESTAMP_URL }}
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0, ref: "${{ inputs.revision || github.sha }}" }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with: { node-version-file: .nvmrc, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: anchore/sbom-action/download-syft@v0.21.0
        id: syft
      - name: Install macOS Rust targets
        if: ${{ startsWith(matrix.id, 'macos-') }}
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Install Ubuntu packaging prerequisites
        if: ${{ startsWith(matrix.id, 'ubuntu-') }}
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dbus-x11 gnome-keyring libayatana-appindicator3-dev libfuse2 libgbm-dev libgtk-3-dev libx11-dev libxkbcommon-x11-0 libxtst-dev ninja-build patchelf squashfs-tools xauth xdg-utils xvfb
      - name: Materialize macOS signing and notarization credentials
        if: ${{ startsWith(matrix.id, 'macos-') }}
        shell: bash
        env:
          P12_B64: ${{ secrets.DEVHUD_MACOS_DEVELOPER_ID_P12_B64 }}
          P12_PASSWORD: ${{ secrets.DEVHUD_MACOS_DEVELOPER_ID_P12_PASSWORD }}
          API_KEY_B64: ${{ secrets.APPLE_API_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$P12_B64" | base64 --decode > "$RUNNER_TEMP/devhud-macos.p12"
          printf '%s' "$API_KEY_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          security create-keychain -p "$RUNNER_TEMP" "$RUNNER_TEMP/devhud.keychain-db"
          security unlock-keychain -p "$RUNNER_TEMP" "$RUNNER_TEMP/devhud.keychain-db"
          security import "$RUNNER_TEMP/devhud-macos.p12" -k "$RUNNER_TEMP/devhud.keychain-db" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$RUNNER_TEMP" "$RUNNER_TEMP/devhud.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/devhud.keychain-db"
      - name: Materialize Windows PFX
        if: ${{ startsWith(matrix.id, 'windows-') }}
        shell: pwsh
        env: { PFX_B64: "${{ secrets.DEVHUD_WINDOWS_SIGNING_PFX_B64 }}" }
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\devhud.pfx", [Convert]::FromBase64String($env:PFX_B64))
          "DEVHUD_WINDOWS_SIGNING_PFX_PATH=$env:RUNNER_TEMP\devhud.pfx" | Out-File $env:GITHUB_ENV -Append
      - name: Install locked dependencies and validate pins
        run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter devhud verify:pins
      - name: Build private release package
        env: { DEVHUD_PACKAGE_KIND: "${{ startsWith(matrix.id, 'macos-') && 'macos-app' || startsWith(matrix.id, 'windows-') && format('windows-{0}', matrix.bundle) || format('linux-{0}', matrix.bundle) }}" }
        run: pnpm --filter devhud build -- --bundles ${{ matrix.bundle }}
      - name: Normalize and validate macOS artifacts
        if: ${{ startsWith(matrix.id, 'macos-') }}
        shell: bash
        run: |
          set -euo pipefail
          app=target/release/bundle/macos/DevHUD.app
          dmg=$(find target/release/bundle/dmg -name '*.dmg' -type f -print -quit)
          codesign --verify --deep --strict --verbose=4 "$app"
          xcrun notarytool submit "$dmg" --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          mount=$(mktemp -d)
          installed=$(mktemp -d)/Applications
          mkdir -p "$installed"
          hdiutil attach "$dmg" -nobrowse -mountpoint "$mount"
          ditto "$mount/DevHUD.app" "$installed/DevHUD.app"
          test -n "$(find "$installed/DevHUD.app" -name 'DevHUD Helper*.app' -print -quit)"
          pnpm --filter devhud smoke:platform -- --artifact "$installed/DevHUD.app/Contents/MacOS/devhud"
          host=$(find "$installed/DevHUD.app" -type f -name 'devhud-native-messaging-host' -print -quit)
          test -n "$host"
          HOME="$RUNNER_TEMP/native-home" "$host" register "$host"
          HOME="$RUNNER_TEMP/native-home" "$host" unregister
          hdiutil detach "$mount"
          rm -rf "$installed" "$mount"
          mkdir -p private-artifacts/validation/targets private-artifacts/sbom
          cp "$dmg" private-artifacts/${{ matrix.artifact }}
          brew list gnu-tar >/dev/null 2>&1 || brew install gnu-tar
          COPYFILE_DISABLE=1 gtar --sort=name --mtime="@$(git show -s --format=%ct HEAD)" --owner=0 --group=0 --numeric-owner -czf private-artifacts/${{ matrix.updater }} -C target/release/bundle/macos DevHUD.app
          "${{ steps.syft.outputs.cmd }}" scan "dir:$app" --output "spdx-json=private-artifacts/sbom/${{ matrix.artifact }}.spdx.json"
          "${{ steps.syft.outputs.cmd }}" scan "dir:$app" --output "spdx-json=private-artifacts/sbom/${{ matrix.updater }}.spdx.json"
          node scripts/release/devhud-evidence.mjs record --id ${{ matrix.id }} --output private-artifacts/validation/targets/${{ matrix.id }}.json --checks namesVersionsTargets,cefHelpers,cefSandbox,trayLifecycle,updaterMaterial,nativeMessaging,installLaunchQuitUninstall,platformSignature
      - name: Normalize and validate Windows artifact and lifecycle
        if: ${{ startsWith(matrix.id, 'windows-') }}
        shell: pwsh
        run: |
          $extension = if ("${{ matrix.bundle }}" -eq "msi") { "*.msi" } else { "*.exe" }
          $source = Get-ChildItem -Recurse "target/release/bundle/${{ matrix.bundle }}" -Filter $extension | Select-Object -First 1
          if (-not $source) { throw "installer missing" }
          signtool.exe verify /pa /all /v $source.FullName
          $installDir = Join-Path $env:RUNNER_TEMP "devhud-installed"
          if ("${{ matrix.bundle }}" -eq "msi") {
            $process = Start-Process msiexec.exe -ArgumentList "/i", $source.FullName, "/qn", "INSTALLDIR=$installDir" -Wait -PassThru
          } else {
            $process = Start-Process $source.FullName -ArgumentList "/S", "/D=$installDir" -Wait -PassThru
          }
          if ($process.ExitCode -notin @(0, 3010)) { throw "install failed: $($process.ExitCode)" }
          pnpm --filter devhud smoke:platform -- --artifact "$installDir\devhud.exe"
          if ($LASTEXITCODE -ne 0) { throw "platform smoke failed with exit code $LASTEXITCODE" }
          New-Item -ItemType Directory -Force private-artifacts/sbom | Out-Null
          & "${{ steps.syft.outputs.cmd }}" scan "dir:$installDir" --output "spdx-json=private-artifacts/sbom/${{ matrix.artifact }}.spdx.json"
          if ($LASTEXITCODE -ne 0) { throw "component SBOM generation failed with exit code $LASTEXITCODE" }
          $registration = Get-ItemProperty "HKCU:\Software\Google\Chrome\NativeMessagingHosts\io.delino.devhud.native_messaging" -ErrorAction Stop
          if (-not (Test-Path -LiteralPath $registration.'(default)')) { throw "Native Messaging manifest missing" }
          if ("${{ matrix.bundle }}" -eq "msi") {
            $product = Get-CimInstance Win32_Product | Where-Object Name -eq "DevHUD" | Select-Object -First 1
            if (-not $product) { throw "installed MSI product missing" }
            $process = Start-Process msiexec.exe -ArgumentList "/x", $product.IdentifyingNumber, "/qn" -Wait -PassThru
          } else {
            $process = Start-Process "$installDir\uninstall.exe" -ArgumentList "/S" -Wait -PassThru
          }
          if ($process.ExitCode -notin @(0, 3010)) { throw "uninstall failed: $($process.ExitCode)" }
          if (Test-Path "HKCU:\Software\Google\Chrome\NativeMessagingHosts\io.delino.devhud.native_messaging") { throw "Native Messaging registration survived uninstall" }
          New-Item -ItemType Directory -Force private-artifacts/validation/targets | Out-Null
          Copy-Item $source.FullName private-artifacts/${{ matrix.artifact }}
          node scripts/release/devhud-evidence.mjs record --id ${{ matrix.id }} --output private-artifacts/validation/targets/${{ matrix.id }}.json --checks namesVersionsTargets,cefHelpers,cefSandbox,trayLifecycle,updaterMaterial,nativeMessaging,installLaunchQuitUninstall,platformSignature
      - name: Normalize and validate Ubuntu artifact and lifecycle
        if: ${{ startsWith(matrix.id, 'ubuntu-') }}
        shell: bash
        run: |
          set -euo pipefail
          run_native_messaging_lifecycle() {
            local host="$1"
            local user_manifest="$2"
            dbus-run-session -- bash -euo pipefail -c '
              export HOME="$1"
              host="$2"
              user_manifest="$3"
              unset GNOME_KEYRING_CONTROL
              control_directory="$HOME/.cache/keyring"
              mkdir -p "$control_directory"
              chmod 700 "$control_directory"
              # Clean runners have no user Secret Service, so keep one alive for the complete lifecycle.
              gnome-keyring-daemon --foreground --components=secrets --control-directory="$control_directory" >/dev/null &
              keyring_pid=$!
              stop_keyring() {
                kill "$keyring_pid" 2>/dev/null || true
                wait "$keyring_pid" 2>/dev/null || true
              }
              trap stop_keyring EXIT
              gdbus wait --session --timeout=5 org.freedesktop.secrets >/dev/null
              "$host" register "$host"
              test -e "$user_manifest"
              "$host" unregister "$user_manifest"
              test ! -e "$user_manifest"
            ' native-messaging-lifecycle "$RUNNER_TEMP/native-home" "$host" "$user_manifest"
          }
          source=$(find target/release/bundle/${{ matrix.bundle }} -type f -print -quit)
          test -n "$source"
          mkdir -p private-artifacts/validation/targets private-artifacts/sbom
          if [ "${{ matrix.bundle }}" = deb ]; then
            SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD) bash scripts/release/finalize-devhud-deb.sh "$source" "$RUNNER_TEMP/devhud-final.deb"
            source="$RUNNER_TEMP/devhud-final.deb"
            dpkg-deb --info "$source" >/dev/null
            sbom_root=$(mktemp -d)
            dpkg-deb --extract "$source" "$sbom_root"
            "${{ steps.syft.outputs.cmd }}" scan "dir:$sbom_root" --output "spdx-json=private-artifacts/sbom/${{ matrix.artifact }}.spdx.json"
            rm -rf "$sbom_root"
            sandbox=$(dpkg-deb --fsys-tarfile "$source" | tar --numeric-owner -tvf - | awk '$6 ~ /chrome-sandbox$/ {print $1, $2}')
            test "$sandbox" = "-rwsr-xr-x 0/0"
            package=$(dpkg-deb -f "$source" Package)
            sudo dpkg -i "$source"
            dbus-run-session -- xvfb-run -a pnpm --filter devhud smoke:platform -- --artifact /usr/bin/devhud
            host=$(find /usr -type f -name devhud-native-messaging-host -print -quit)
            test -n "$host"
            user_manifest="$RUNNER_TEMP/native-home/.config/google-chrome/NativeMessagingHosts/io.delino.devhud.native_messaging.json"
            run_native_messaging_lifecycle "$host" "$user_manifest"
            sudo dpkg -r "$package"
            test ! -e /usr/bin/devhud
            test ! -e /etc/opt/chrome/native-messaging-hosts/io.delino.devhud.native_messaging.json
          else
            chmod +x "$source"
            offset=$("$source" --appimage-offset)
            sandbox_metadata=$(unsquashfs -lln -o "$offset" "$source" usr/share/DevHUD/chrome-sandbox | awk '$NF ~ /chrome-sandbox$/ { print $1, $2 }')
            if [ "$sandbox_metadata" != "-rwsr-xr-x 0/0" ]; then
              echo "DevHUD AppImage chrome-sandbox must record UID/GID 0/0 and mode 4755; found: ${sandbox_metadata:-missing}" >&2
              exit 1
            fi
            "$source" --appimage-extract >/dev/null
            appdir=$(realpath squashfs-root)
            sandbox=$(realpath "$appdir/usr/share/DevHUD/chrome-sandbox")
            sudo chown root:root "$sandbox"
            sudo chmod 4755 "$sandbox"
            executable=$(realpath "$appdir/usr/bin/devhud")
            install -Dm755 "$source" "$RUNNER_TEMP/devhud-installed/DevHUD.AppImage"
            appimage=$(realpath "$RUNNER_TEMP/devhud-installed/DevHUD.AppImage")
            APPIMAGE="$appimage" APPDIR="$appdir" dbus-run-session -- xvfb-run -a pnpm --filter devhud smoke:platform -- --artifact "$executable"
            "${{ steps.syft.outputs.cmd }}" scan "dir:$appdir" --output "spdx-json=private-artifacts/sbom/${{ matrix.artifact }}.spdx.json"
            host=$(find squashfs-root -type f -name devhud-native-messaging-host -print -quit)
            test -n "$host"
            user_manifest="$RUNNER_TEMP/native-home/.config/google-chrome/NativeMessagingHosts/io.delino.devhud.native_messaging.json"
            run_native_messaging_lifecycle "$host" "$user_manifest"
            rm "$appimage"
            test ! -e "$appimage"
          fi
          cp "$source" private-artifacts/${{ matrix.artifact }}
          node scripts/release/devhud-evidence.mjs record --id ${{ matrix.id }} --output private-artifacts/validation/targets/${{ matrix.id }}.json --checks namesVersionsTargets,cefHelpers,cefSandbox,trayLifecycle,updaterMaterial,nativeMessaging,installLaunchQuitUninstall
      - uses: actions/upload-artifact@v7
        with: { name: "devhud-${{ matrix.id }}", path: private-artifacts, if-no-files-found: error, retention-days: 7 }

  extension:
    name: Reproducible Chrome extension inputs
    if: ${{ inputs.mode == 'signed-private' }}
    needs: preflight
    runs-on: ubuntu-22.04
    environment: devhud-private-build
    env:
      DEVHUD_CHROME_EXTENSION_ID: ${{ vars.DEVHUD_CHROME_EXTENSION_ID }}
      DEVHUD_CHROME_EXTENSION_PUBLIC_KEY: ${{ secrets.DEVHUD_CHROME_EXTENSION_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v6
        with: { ref: "${{ inputs.revision || github.sha }}" }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with: { node-version-file: .nvmrc, cache: pnpm }
      - uses: anchore/sbom-action/download-syft@v0.21.0
        id: syft
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter devhud-chrome-extension lint && pnpm --filter devhud-chrome-extension test:package
      - run: pnpm --filter devhud-chrome-extension build
      - name: Verify two publication inputs are byte-equivalent
        run: |
          mkdir -p private-artifacts/validation/targets private-artifacts/sbom
          cp apps/devhud-chrome-extension/artifacts/devhud-chrome-*.zip private-artifacts/
          cmp private-artifacts/devhud-chrome-web-store.zip private-artifacts/devhud-chrome-github-validation.zip
          for artifact in devhud-chrome-web-store.zip devhud-chrome-github-validation.zip; do
            "${{ steps.syft.outputs.cmd }}" scan dir:apps/devhud-chrome-extension/dist --output "spdx-json=private-artifacts/sbom/$artifact.spdx.json"
          done
          node scripts/release/devhud-evidence.mjs record --id chrome-extension --output private-artifacts/validation/targets/chrome-extension.json --checks namesVersionsTargets,permissions,reproducible,byteParity,nativeMessagingIdentity
      - uses: actions/upload-artifact@v7
        with: { name: devhud-chrome-extension, path: private-artifacts, if-no-files-found: error, retention-days: 7 }

  mobile:
    name: Signed store inputs
    if: ${{ inputs.mode == 'signed-private' }}
    needs: preflight
    strategy: { fail-fast: false, matrix: { platform: [ios, android] } }
    runs-on: ${{ matrix.platform == 'ios' && 'macos-15' || 'ubuntu-22.04' }}
    environment: devhud-private-build
    env:
      CI: "true"
      DEVHUD_APPLE_TEAM_ID: ${{ vars.DEVHUD_APPLE_TEAM_ID }}
      APPLE_DEVELOPMENT_TEAM: ${{ vars.DEVHUD_APPLE_TEAM_ID }}
      DEVHUD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.DEVHUD_ANDROID_KEYSTORE_PASSWORD }}
      DEVHUD_ANDROID_KEY_ALIAS: ${{ secrets.DEVHUD_ANDROID_KEY_ALIAS }}
      DEVHUD_ANDROID_KEY_PASSWORD: ${{ secrets.DEVHUD_ANDROID_KEY_PASSWORD }}
      DEVHUD_ANDROID_CERTIFICATE_SHA256: ${{ vars.DEVHUD_ANDROID_CERTIFICATE_SHA256 }}
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0, ref: "${{ inputs.revision || github.sha }}" }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with: { node-version-file: .nvmrc, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: anchore/sbom-action/download-syft@v0.21.0
        id: syft
      - name: Install macOS Rust targets
        if: ${{ matrix.platform == 'ios' }}
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Setup Java 17
        if: ${{ matrix.platform == 'android' }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Download checksum-pinned bundletool
        id: bundletool
        if: ${{ matrix.platform == 'android' }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./apps/devhud/mobile-platforms.json').androidArtifactInspector.version")
          url=$(node -p "require('./apps/devhud/mobile-platforms.json').androidArtifactInspector.url")
          expected=$(node -p "require('./apps/devhud/mobile-platforms.json').androidArtifactInspector.sha256")
          jar="$RUNNER_TEMP/bundletool-all-$version.jar"
          curl --fail --location --silent --show-error --output "$jar" "$url"
          printf '%s  %s\n' "$expected" "$jar" | sha256sum --check
          echo "jar=$jar" >> "$GITHUB_OUTPUT"
      - name: Install Android Linux host prerequisites
        if: ${{ matrix.platform == 'android' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libayatana-appindicator3-dev libgbm-dev libgtk-3-dev libx11-dev libxtst-dev ninja-build
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter devhud mobile:generate -- --platform ${{ matrix.platform }}
      - name: Build and verify signed Android App Bundle
        if: ${{ matrix.platform == 'android' }}
        env: { KEYSTORE_B64: "${{ secrets.DEVHUD_ANDROID_UPLOAD_KEYSTORE_B64 }}" }
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/devhud-upload.jks"
          export TAURI_ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/devhud-upload.jks"
          export TAURI_ANDROID_KEYSTORE_PASSWORD="$DEVHUD_ANDROID_KEYSTORE_PASSWORD"
          export TAURI_ANDROID_KEY_ALIAS="$DEVHUD_ANDROID_KEY_ALIAS"
          export TAURI_ANDROID_KEY_PASSWORD="$DEVHUD_ANDROID_KEY_PASSWORD"
          node apps/devhud/scripts/run-mobile.mjs android build --target aarch64 --target armv7 --aab
          aab=$(find apps/devhud/target/devhud-mobile target/devhud-mobile apps/devhud/src-tauri/gen/android -name '*.aab' -type f 2>/dev/null | head -1)
          test -n "$aab"
          mkdir -p private-artifacts/validation/targets private-artifacts/sbom
          cp "$aab" private-artifacts/devhud-android-arm64-armv7-google-play.aab
          jarsigner -verify -certs private-artifacts/devhud-android-arm64-armv7-google-play.aab
          actual=$(keytool -printcert -jarfile private-artifacts/devhud-android-arm64-armv7-google-play.aab | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          expected=$(printf '%s' "$DEVHUD_ANDROID_CERTIFICATE_SHA256" | tr -d ': ' | tr '[:upper:]' '[:lower:]')
          test -n "$actual" && test "$actual" = "$expected"
          pnpm --filter devhud verify:mobile -- --android-artifact "$PWD/private-artifacts/devhud-android-arm64-armv7-google-play.aab" --android-abi arm64-v8a --android-abi armeabi-v7a --bundletool-jar "${{ steps.bundletool.outputs.jar }}"
          sbom_root=$(mktemp -d)
          unzip -q private-artifacts/devhud-android-arm64-armv7-google-play.aab -d "$sbom_root"
          "${{ steps.syft.outputs.cmd }}" scan "dir:$sbom_root" --output spdx-json=private-artifacts/sbom/devhud-android-arm64-armv7-google-play.aab.spdx.json
          rm -rf "$sbom_root"
          node scripts/release/devhud-evidence.mjs record --id android-google-play --output private-artifacts/validation/targets/android-google-play.json --checks namesVersionsTargets,platformSignature,nativeDeckWidget
      - name: Build and verify signed iOS archive
        if: ${{ matrix.platform == 'ios' }}
        shell: bash
        env:
          P12_B64: ${{ secrets.DEVHUD_IOS_DISTRIBUTION_P12_B64 }}
          P12_PASSWORD: ${{ secrets.DEVHUD_IOS_DISTRIBUTION_P12_PASSWORD }}
          APP_PROFILE_B64: ${{ secrets.DEVHUD_IOS_APP_PROFILE_B64 }}
          WIDGET_PROFILE_B64: ${{ secrets.DEVHUD_IOS_WIDGET_PROFILE_B64 }}
          INTENT_PROFILE_B64: ${{ secrets.DEVHUD_IOS_WIDGET_INTENT_PROFILE_B64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$P12_B64" | base64 --decode > "$RUNNER_TEMP/ios.p12"
          security create-keychain -p "$RUNNER_TEMP" "$RUNNER_TEMP/ios.keychain-db"
          security unlock-keychain -p "$RUNNER_TEMP" "$RUNNER_TEMP/ios.keychain-db"
          security import "$RUNNER_TEMP/ios.p12" -k "$RUNNER_TEMP/ios.keychain-db" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$RUNNER_TEMP" "$RUNNER_TEMP/ios.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/ios.keychain-db"
          for item in APP WIDGET INTENT; do value="${item}_PROFILE_B64"; printf '%s' "${!value}" | base64 --decode > "$RUNNER_TEMP/${item}.mobileprovision"; uuid=$(security cms -D -i "$RUNNER_TEMP/${item}.mobileprovision" | plutil -extract UUID raw -); mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"; cp "$RUNNER_TEMP/${item}.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"; done
          pnpm --filter devhud build:ios -- --ci
          app=$(find apps/devhud/src-tauri/gen/apple/build -name '*.app' -type d | head -1)
          test -d "$app/PlugIns/DevHUD Deck.appex"
          test -d "$app/PlugIns/DevHUD Deck Selection.appex"
          node scripts/release/validate-devhud-ios-signing.mjs --app "$app" --team-id "$DEVHUD_APPLE_TEAM_ID"
          mkdir -p private-artifacts/Payload private-artifacts/validation/targets private-artifacts/sbom
          "${{ steps.syft.outputs.cmd }}" scan "dir:$app" --output spdx-json=private-artifacts/sbom/devhud-ios-arm64-app-store.ipa.spdx.json
          cp -R "$app" private-artifacts/Payload/
          (cd private-artifacts && zip -X -q -r devhud-ios-arm64-app-store.ipa Payload)
          rm -rf private-artifacts/Payload
          node scripts/release/devhud-evidence.mjs record --id ios-app-store --output private-artifacts/validation/targets/ios-app-store.json --checks namesVersionsTargets,platformSignature,nativeDeckWidget
      - uses: actions/upload-artifact@v7
        with: { name: "devhud-${{ matrix.platform }}-store", path: private-artifacts, if-no-files-found: error, retention-days: 7 }

  oci:
    name: ${{ matrix.id }} multi-arch OCI layout
    if: ${{ inputs.mode == 'signed-private' }}
    needs: preflight
    strategy:
      matrix:
        include:
          - { id: devhud-api-oci, target: api, artifact: devhud-api-linux-amd64-arm64.oci.tar }
          - { id: devhud-api-sweeper-oci, target: sweeper, artifact: devhud-api-sweeper-linux-amd64-arm64.oci.tar }
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:15-bookworm
        env:
          POSTGRES_DB: devhud_api_test
          POSTGRES_PASSWORD: devhud
          POSTGRES_USER: devhud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devhud -d devhud_api_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0, ref: "${{ inputs.revision || github.sha }}" }
      - uses: actions/setup-go@v6
        with: { go-version-file: go.mod, cache: true }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with: { node-version-file: .nvmrc, cache: pnpm, cache-dependency-path: pnpm-lock.yaml }
      - uses: docker/setup-buildx-action@v4
      - uses: anchore/sbom-action/download-syft@v0.21.0
        id: syft
      - name: Generate and verify embedded administrator assets
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter devhud-admin build:embedded
      - name: Validate PostgreSQL migrations and schema readiness
        env:
          DEVHUD_TEST_DATABASE_URL: postgres://devhud:devhud@127.0.0.1:5432/devhud_api_test?sslmode=disable
        run: go test -tags=integration ./servers/devhud-api/internal/postgres
      - name: Validate health, migrations, sweeper readiness, and embedded administrator assets
        run: go test ./servers/devhud-api/...
      - name: Build local two-platform OCI layout
        run: |
          mkdir -p private-artifacts/validation/targets private-artifacts/sbom
          sudo apt-get update && sudo apt-get install -y --no-install-recommends skopeo
          version=$(node -p "require('./packaging/devhud/release-metadata.json').version")
          docker buildx build --platform linux/amd64,linux/arm64 --target ${{ matrix.target }} --build-arg VERSION="$version" --build-arg REVISION="$GITHUB_SHA" --output type=oci,dest=private-artifacts/${{ matrix.artifact }} -f servers/devhud-api/Dockerfile .
          tar -tf private-artifacts/${{ matrix.artifact }} | grep index.json
          for arch in amd64 arm64; do
            skopeo inspect --override-arch "$arch" --config oci-archive:private-artifacts/${{ matrix.artifact }} | jq -e '.config.User == "65532" and .config.Labels["io.delino.devhud.migrations"] == "embedded" and .config.Labels["io.delino.devhud.administrator-assets"] == "embedded"'
          done
          "${{ steps.syft.outputs.cmd }}" scan "oci-archive:private-artifacts/${{ matrix.artifact }}" --output "spdx-json=private-artifacts/sbom/${{ matrix.artifact }}.spdx.json"
          node scripts/release/devhud-evidence.mjs record --id ${{ matrix.id }} --output private-artifacts/validation/targets/${{ matrix.id }}.json --checks namesVersionsTargets,multiArch,nonRoot,health,migrations,administratorAssets
      - uses: actions/upload-artifact@v7
        with: { name: "${{ matrix.id }}", path: private-artifacts, if-no-files-found: error, retention-days: 7 }

  assemble:
    name: Assemble, attest, and validate private candidate
    if: ${{ inputs.mode == 'signed-private' }}
    needs: [plan, desktop, extension, mobile, oci]
    runs-on: ubuntu-22.04
    environment: devhud-private-build
    permissions:
      contents: read
      id-token: write
    outputs:
      artifact_id: ${{ steps.candidate.outputs.artifact-id }}
      artifact_name: devhud-v${{ needs.plan.outputs.version }}-private-signed-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
    env:
      DEVHUD_RELEASE_REVISION: ${{ inputs.revision || github.sha }}
      DEVHUD_UPDATER_SIGNING_KEY_B64: ${{ secrets.DEVHUD_UPDATER_SIGNING_KEY_B64 }}
      DEVHUD_MACOS_DEVELOPER_ID_P12_B64: ${{ secrets.DEVHUD_MACOS_DEVELOPER_ID_P12_B64 }}
      DEVHUD_MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVHUD_MACOS_DEVELOPER_ID_P12_PASSWORD }}
      APPLE_API_PRIVATE_KEY_B64: ${{ secrets.APPLE_API_PRIVATE_KEY_B64 }}
      DEVHUD_WINDOWS_SIGNING_PFX_B64: ${{ secrets.DEVHUD_WINDOWS_SIGNING_PFX_B64 }}
      DEVHUD_WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.DEVHUD_WINDOWS_SIGNING_PFX_PASSWORD }}
      DEVHUD_IOS_DISTRIBUTION_P12_B64: ${{ secrets.DEVHUD_IOS_DISTRIBUTION_P12_B64 }}
      DEVHUD_IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.DEVHUD_IOS_DISTRIBUTION_P12_PASSWORD }}
      DEVHUD_IOS_APP_PROFILE_B64: ${{ secrets.DEVHUD_IOS_APP_PROFILE_B64 }}
      DEVHUD_IOS_WIDGET_PROFILE_B64: ${{ secrets.DEVHUD_IOS_WIDGET_PROFILE_B64 }}
      DEVHUD_IOS_WIDGET_INTENT_PROFILE_B64: ${{ secrets.DEVHUD_IOS_WIDGET_INTENT_PROFILE_B64 }}
      DEVHUD_ANDROID_UPLOAD_KEYSTORE_B64: ${{ secrets.DEVHUD_ANDROID_UPLOAD_KEYSTORE_B64 }}
      DEVHUD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.DEVHUD_ANDROID_KEYSTORE_PASSWORD }}
      DEVHUD_ANDROID_KEY_PASSWORD: ${{ secrets.DEVHUD_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0, ref: "${{ inputs.revision || github.sha }}" }
      - uses: actions/download-artifact@v8
        with: { pattern: devhud-*, path: private-artifacts, merge-multiple: true }
      - uses: sigstore/cosign-installer@v4.1.0
      - name: Merge evidence and sign updater material
        run: |
          umask 077
          mkdir -p private-artifacts/validation
          node scripts/release/devhud-evidence.mjs merge --input private-artifacts/validation/targets --output private-artifacts/validation/evidence.json
          printf '%s' "$DEVHUD_UPDATER_SIGNING_KEY_B64" > "$RUNNER_TEMP/devhud-updater.key"
          node scripts/release/generate-devhud-updater.mjs --artifacts-dir private-artifacts --output-dir private-artifacts/updater --key-file "$RUNNER_TEMP/devhud-updater.key"
          rm "$RUNNER_TEMP/devhud-updater.key"
      - name: Generate SPDX, SLSA provenance, checksums, and separate Sigstore bundles
        env:
          DEVHUD_PROVENANCE_INVOCATION_ID: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          DEVHUD_PROVENANCE_STARTED_ON: ${{ needs.plan.outputs.started_on }}
        run: |
          build_finished_on=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          node scripts/release/generate-devhud-supply-chain.mjs --artifacts-dir private-artifacts --output-dir private-artifacts --invocation-id "$DEVHUD_PROVENANCE_INVOCATION_ID" --started-on "$DEVHUD_PROVENANCE_STARTED_ON" --finished-on "$build_finished_on"
          REQUIRE_COSIGN=1 scripts/release/generate-checksums.sh --artifacts-dir private-artifacts --sigstore-dir private-artifacts/sigstore
      - name: Validate complete private candidate and absence of secrets
        env:
          DEVHUD_PRIVATE_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/package-devhud-private.yml@${{ github.ref }}
        run: node scripts/release/validate-devhud-private-build.mjs --artifacts-dir private-artifacts
      - uses: actions/upload-artifact@v7
        id: candidate
        with:
          name: devhud-v${{ needs.plan.outputs.version }}-private-signed-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: private-artifacts
          if-no-files-found: error
          retention-days: 35
