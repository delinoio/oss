name: Release delibase

on:
  push:
    tags:
      - "delibase@v*"

permissions:
  contents: read

concurrency:
  group: release-delibase-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/delinoio/delibase
  IMAGE_SOURCE: https://github.com/delinoio/oss

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate tag and resolve version
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(servers/delibase/scripts/resolve-release-tag.sh "$RELEASE_TAG")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  validate-images:
    name: Validate image (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: metadata
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: delibase
          POSTGRES_PASSWORD: delibase_test
          POSTGRES_DB: delibase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U delibase -d delibase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push architecture image by digest
        id: architecture-image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: servers/delibase/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ needs.metadata.outputs.version }}
            REVISION=${{ github.sha }}
            SOURCE=${{ env.IMAGE_SOURCE }}
          provenance: false
          cache-from: type=gha,scope=delibase-release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=delibase-release-${{ matrix.arch }}

      - name: Pull the exact architecture digest for validation
        env:
          IMAGE_DIGEST: ${{ steps.architecture-image.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "build did not return a valid architecture digest" >&2
            exit 1
          fi
          docker pull --platform "$PLATFORM" "${IMAGE_NAME}@${IMAGE_DIGEST}"
          docker tag "${IMAGE_NAME}@${IMAGE_DIGEST}" "delibase:release-${{ matrix.arch }}"

      - name: Validate image contract
        env:
          DELIBASE_TEST_IMAGE: delibase:release-${{ matrix.arch }}
          DELIBASE_TEST_BUILD_IMAGE: "false"
          DELIBASE_TEST_EXPECTED_VERSION: ${{ needs.metadata.outputs.version }}
          DELIBASE_TEST_EXPECTED_REVISION: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          image_user="$(docker image inspect --format '{{.Config.User}}' "$DELIBASE_TEST_IMAGE")"
          test "$image_user" = "65532:65532"
          test "$(docker image inspect --format '{{json .Config.Entrypoint}}' "$DELIBASE_TEST_IMAGE")" = '["/delibase"]'
          test "$(docker image inspect --format '{{json .Config.ExposedPorts}}' "$DELIBASE_TEST_IMAGE")" = '{"8080/tcp":{}}'
          if docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$DELIBASE_TEST_IMAGE" |
            grep -Eq '^(DELIBASE_|PUBLIC_)'; then
            echo "image contains baked runtime configuration" >&2
            exit 1
          fi

          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.title" }}' "$DELIBASE_TEST_IMAGE")" = "delibase"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$DELIBASE_TEST_IMAGE")" = "$DELIBASE_TEST_EXPECTED_VERSION"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$DELIBASE_TEST_IMAGE")" = "$DELIBASE_TEST_EXPECTED_REVISION"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' "$DELIBASE_TEST_IMAGE")" = "$IMAGE_SOURCE"

          container_id="$(docker create "$DELIBASE_TEST_IMAGE")"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          docker export "$container_id" | tar -tf - > image-files.txt
          grep -qx delibase image-files.txt
          grep -qx etc/delibase/catalog.json image-files.txt
          if grep -Eq '^(src|go\.mod|go\.sum|\.git|Dockerfile|scripts)(/|$)' image-files.txt; then
            echo "image contains build-only material" >&2
            exit 1
          fi

      - name: Validate non-root runtime and health endpoints
        env:
          DELIBASE_TEST_IMAGE: delibase:release-${{ matrix.arch }}
          DELIBASE_TEST_BUILD_IMAGE: "false"
          DELIBASE_TEST_EXPECTED_VERSION: ${{ needs.metadata.outputs.version }}
          DELIBASE_TEST_EXPECTED_REVISION: ${{ github.sha }}
        run: servers/delibase/scripts/test-image.sh

      - name: Export validated architecture digest
        env:
          IMAGE_DIGEST: ${{ steps.architecture-image.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p digests
          touch "digests/${IMAGE_DIGEST#sha256:}"

      - name: Upload validated architecture digest
        uses: actions/upload-artifact@v7
        with:
          name: delibase-digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish signed multi-architecture image
    runs-on: ubuntu-latest
    needs:
      - metadata
      - validate-images
    outputs:
      image_digest: ${{ steps.image.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download validated architecture digests
        uses: actions/download-artifact@v8
        with:
          pattern: delibase-digest-*
          path: digests
          merge-multiple: true

      - name: Create staging manifest from validated digests
        id: image
        env:
          CANDIDATE_TAG: candidate-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t digests < <(find digests -maxdepth 1 -type f -printf '%f\n' | sort)
          if [ "${#digests[@]}" -ne 2 ]; then
            echo "expected exactly two validated architecture digests" >&2
            exit 1
          fi

          sources=()
          for digest in "${digests[@]}"; do
            if [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
              echo "invalid architecture digest artifact: ${digest}" >&2
              exit 1
            fi
            sources+=("${IMAGE_NAME}@sha256:${digest}")
          done

          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.title=delibase" \
            --annotation "index:org.opencontainers.image.version=${{ needs.metadata.outputs.version }}" \
            --annotation "index:org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "index:org.opencontainers.image.source=${IMAGE_SOURCE}" \
            --metadata-file manifest-metadata.json \
            --tag "${IMAGE_NAME}:${CANDIDATE_TAG}" \
            "${sources[@]}"

          digest="$(jq -r '.["containerimage.descriptor"].digest' manifest-metadata.json)"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "staging manifest did not return a valid digest" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Validate staging manifest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect --raw "${IMAGE_NAME}@${IMAGE_DIGEST}" > manifest.json

          jq -e --arg version "$VERSION" --arg revision "$GITHUB_SHA" --arg source "$IMAGE_SOURCE" '
            .annotations["org.opencontainers.image.title"] == "delibase" and
            .annotations["org.opencontainers.image.version"] == $version and
            .annotations["org.opencontainers.image.revision"] == $revision and
            .annotations["org.opencontainers.image.source"] == $source and
            ([.manifests[]
              | select(.platform.os == "linux")
              | "\(.platform.os)/\(.platform.architecture)"] | sort) ==
              ["linux/amd64", "linux/arm64"]
          ' manifest.json >/dev/null

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.1

      - name: Sign published digest with keyless identity
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: delibase.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Validate SPDX SBOM
        run: jq -e '.spdxVersion | startswith("SPDX-")' delibase.spdx.json >/dev/null

      - name: Upload SPDX SBOM
        uses: actions/upload-artifact@v7
        with:
          name: delibase-${{ needs.metadata.outputs.version }}-spdx
          path: delibase.spdx.json
          if-no-files-found: error

      - name: Publish GitHub build provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Publish GitHub SBOM attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: delibase.spdx.json
          push-to-registry: true

      - name: Publish signed version tag
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${VERSION}" \
            "${IMAGE_NAME}@${IMAGE_DIGEST}"
          tagged_digest="sha256:$(docker buildx imagetools inspect --raw "${IMAGE_NAME}:${VERSION}" | sha256sum | cut -d ' ' -f 1)"
          test "$tagged_digest" = "$IMAGE_DIGEST"

  publish-latest:
    name: Publish latest tag for newest release
    runs-on: ubuntu-latest
    needs:
      - metadata
      - publish
    concurrency:
      group: release-delibase-latest
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check whether this is the newest release
        id: latest
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          versions=()
          while read -r _ ref; do
            tag="${ref#refs/tags/}"
            if version="$(servers/delibase/scripts/resolve-release-tag.sh "$tag" 2>/dev/null)"; then
              versions+=("$version")
            fi
          done < <(git ls-remote --refs --tags origin 'refs/tags/delibase@v*')

          if [ "${#versions[@]}" -eq 0 ]; then
            echo "no valid delibase release tags were found" >&2
            exit 1
          fi
          newest="$(printf '%s\n' "${versions[@]}" | sort -V | tail -n 1)"
          if [ "$VERSION" = "$newest" ]; then
            echo "promote=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping latest: ${VERSION} is older than ${newest}"
            echo "promote=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: ${{ steps.latest.outputs.promote == 'true' }}
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: ${{ steps.latest.outputs.promote == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish latest tag
        if: ${{ steps.latest.outputs.promote == 'true' }}
        env:
          IMAGE_DIGEST: ${{ needs.publish.outputs.image_digest }}
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:latest" \
            "${IMAGE_NAME}@${IMAGE_DIGEST}"
          tagged_digest="sha256:$(docker buildx imagetools inspect --raw "${IMAGE_NAME}:latest" | sha256sum | cut -d ' ' -f 1)"
          test "$tagged_digest" = "$IMAGE_DIGEST"
