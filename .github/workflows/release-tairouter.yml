name: Release TaiRouter

on:
  push:
    tags: ["tairouter@v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Exact committed MAJOR.MINOR.PATCH version
        required: true
        type: string
      dry_run:
        description: Validate and build without signing or publication
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: release-tairouter
  cancel-in-progress: false

env:
  REQUESTED_VERSION: ${{ inputs.version }}
  DRY_RUN: ${{ inputs.dry_run }}

jobs:
  plan:
    if: github.repository == 'delinoio/oss'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Validate immutable release identity
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/tairouter.mjs

  validate:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:14.19-bookworm
        env:
          POSTGRES_DB: tairouter_test
          POSTGRES_USER: tairouter
          POSTGRES_PASSWORD: fixture-only-password
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U tairouter -d tairouter_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          lfs: true
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - name: Install workspace and pinned protoc
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          mkdir -p "$RUNNER_TEMP/protoc-download" "$RUNNER_TEMP/protoc"
          gh release download v33.0 --repo protocolbuffers/protobuf --pattern protoc-33.0-linux-x86_64.zip --dir "$RUNNER_TEMP/protoc-download"
          echo "d99c011b799e9e412064244f0be417e5d76c9b6ace13a2ac735330fa7d57ad8f  $RUNNER_TEMP/protoc-download/protoc-33.0-linux-x86_64.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/protoc-download/protoc-33.0-linux-x86_64.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
      - name: Generated bindings and TypeScript client
        run: |
          pnpm exec buf lint
          pnpm exec buf format --diff --exit-code
          pnpm --dir packages/tairouter-client generate:check
          pnpm --dir packages/tairouter-client typecheck
          pnpm --dir packages/tairouter-client test
      - name: Console tests and build
        run: |
          pnpm --dir apps/tairouter test
          pnpm --dir apps/tairouter build
      - name: Unit and fixture validation
        env:
          TAIROUTER_TEST_DATABASE_URL: postgres://tairouter:fixture-only-password@127.0.0.1:55432/tairouter_test?sslmode=disable
        run: |
          go mod download all
          go test -race ./servers/tairouter/... ./cmds/tairouter/... ./packages/tairouter/... ./protos/tairouter/... ./scripts/tairouter/...
          scripts/tairouter/validate.sh
      - name: Alert condition fixtures
        run: docker run --rm --entrypoint promtool -v "$PWD/packaging/tairouter/observability:/rules:ro" prom/prometheus:v3.5.0 test rules /rules/alerts.test.yml
      - name: Compose installation and recovery fixture
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/tairouter/compose-smoke.py
      - name: Cross-platform binaries and npm package validation
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/tairouter/build-release.py "$RUNNER_TEMP/tairouter-release"
      - name: Authenticated router load with synthetic upstream
        env:
          TAIROUTER_TEST_DATABASE_URL: postgres://tairouter:fixture-only-password@127.0.0.1:55432/tairouter_test?sslmode=disable
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/tairouter/router-load.py --output "$RUNNER_TEMP/tairouter-load.json"
      - name: Stage self-hosting assets
        run: |
          tar -czf "$RUNNER_TEMP/tairouter-release/tairouter-compose.tar.gz" -C "$GITHUB_WORKSPACE/packaging/tairouter" compose.yml .env.example observability -C "$GITHUB_WORKSPACE" LICENSE NOTICE
          rm -rf "$RUNNER_TEMP/tairouter-release/npm"
          scripts/release/generate-checksums.sh --artifacts-dir "$RUNNER_TEMP/tairouter-release" --skip-signing
      - uses: actions/upload-artifact@v7
        with:
          name: tairouter-release
          path: ${{ runner.temp }}/tairouter-release
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tairouter-load
          path: ${{ runner.temp }}/tairouter-load.json
          if-no-files-found: warn
      - name: Record validation boundaries
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          {
            echo "Source: $GITHUB_SHA; validation: $RESULT"
            echo 'Commands: generated-binding checks; console/client tests and builds; go test -race; validate.sh; promtool; compose-smoke.py; build-release.py; router-load.py.'
            echo 'Synthetic fixture and cross-build evidence only. Production deployment, live providers/accounts and native macOS/Windows acceptance were not performed.'
          } >> "$GITHUB_STEP_SUMMARY"

  image:
    needs: [plan, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          lfs: true
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        if: needs.plan.outputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Recheck release tag before image publication
        if: needs.plan.outputs.dry_run == 'false'
        run: node scripts/release/tairouter.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build Linux images
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_DRY_RUN: ${{ needs.plan.outputs.dry_run }}
        run: |
          output=(--output "type=oci,dest=$RUNNER_TEMP/tairouter-image.tar")
          if [[ "$RELEASE_DRY_RUN" == false ]]; then output=(--push); fi
          docker buildx build --platform linux/amd64,linux/arm64 \
            --file packaging/tairouter/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/delinoio/oss" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" \
            --tag "ghcr.io/delinoio/tairouter:$VERSION" "${output[@]}" .

  publish:
    if: needs.plan.outputs.dry_run == 'false'
    needs: [plan, validate, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: tairouter-release
          path: release
      - name: Recheck release tag before signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/tairouter.mjs
      - uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
      - name: Verify and sign staged assets
        run: |
          cd release
          sha256sum --check SHA256SUMS
          for artifact in *; do
            cosign sign-blob --yes --bundle "${artifact}.sigstore.json" "$artifact"
          done
      - name: Publish versioned release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "TaiRouter $TAG" --notes-file scripts/release/tairouter-release-notes.md

  publish-npm:
    if: needs.plan.outputs.dry_run == 'false' && vars.TAIROUTER_NPM_PUBLISH_ENABLED == 'true'
    needs: [plan, publish]
    environment: tairouter-npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v8
        with:
          name: tairouter-release
          path: release
      - name: Recheck release identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/tairouter.mjs
      - name: Verify assets and publish through the configured npm trusted publisher
        run: |
          cd release
          sha256sum --check SHA256SUMS
          npm publish ./*.tgz --access public --provenance --ignore-scripts

  summary:
    if: always()
    needs: [plan, validate, image, publish, publish-npm]
    runs-on: ubuntu-latest
    steps:
      - name: Record publication results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const jobs = JSON.parse(process.env.RESULTS);
          const lines = ['## TaiRouter release', '', `Source: ${process.env.GITHUB_SHA}`, `Tag: ${jobs.plan.outputs.tag || 'unresolved'}`, `Dry run: ${jobs.plan.outputs.dry_run || 'unresolved'}`, '', '| Phase | Result |', '| --- | --- |', ...Object.entries(jobs).map(([name, job]) => `| ${name} | ${job.result} |`), '', 'Production deployment, live-provider/account and native macOS/Windows acceptance were not performed. npm publication requires TAIROUTER_NPM_PUBLISH_ENABLED=true and the configured trusted publisher.'];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          if (Object.values(jobs).some(job => ['failure', 'cancelled'].includes(job.result))) process.exitCode = 1;
          JS
