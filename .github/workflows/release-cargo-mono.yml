name: Release cargo-mono

on:
  push:
    tags:
      - "cargo-mono@v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semver without v prefix (for example: 0.2.0)"
        required: true
      dry_run:
        description: "If true, skip GitHub release publication"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-cargo-mono-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Validate source and release metadata
        id: meta
        env:
          RELEASE_PROJECT: cargo-mono
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/release/project.mjs source

  build:
    name: Build (${{ matrix.asset_os }}-${{ matrix.asset_arch }})
    runs-on: ${{ matrix.os }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_os: linux
            asset_arch: amd64
            archive_ext: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_os: linux
            asset_arch: arm64
            archive_ext: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset_os: darwin
            asset_arch: amd64
            archive_ext: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            asset_os: darwin
            asset_arch: arm64
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_os: windows
            asset_arch: amd64
            archive_ext: zip
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset_os: windows
            asset_arch: arm64
            archive_ext: zip
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly-2026-01-01
          target: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build Linux with the pinned compatibility image
        if: runner.os == 'Linux'
        env:
          RELEASE_PROJECT: cargo-mono
          RELEASE_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          image=$(node -p 'JSON.parse(require("node:fs").readFileSync("packaging/linux/pins.json")).rust_image')
          docker run --rm -v "$PWD:/workspace" -w /workspace "$image" bash scripts/release/linux-packages/build-rust.sh "$RELEASE_PROJECT" "$RELEASE_TARGET"
          sudo chown -R "$(id -u):$(id -g)" target

      - name: Build cargo-mono
        if: runner.os != 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p cargo-mono --release --target "${{ matrix.target }}"

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          artifact_name="cargo-mono-${{ matrix.asset_os }}-${{ matrix.asset_arch }}.${{ matrix.archive_ext }}"

          if [ "${{ matrix.asset_os }}" = "windows" ]; then
            cp "target/${{ matrix.target }}/release/cargo-mono.exe" dist/cargo-mono.exe
            pwsh -NoLogo -NoProfile -Command "Compress-Archive -Path dist/cargo-mono.exe -DestinationPath dist/${artifact_name}"
            rm -f dist/cargo-mono.exe
          else
            cp "target/${{ matrix.target }}/release/cargo-mono" dist/cargo-mono
            tar -C dist -czf "dist/${artifact_name}" cargo-mono
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cargo-mono-${{ matrix.asset_os }}-${{ matrix.asset_arch }}
          path: dist/*

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: ./.github/actions/setup-clibox

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist

      - name: Flatten artifact directory
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-dist
          find dist -maxdepth 2 -type f -exec cp "{}" "release-dist/" \;
          rm -rf dist
          mv release-dist dist
          find dist -maxdepth 1 -type f | pnpm exec clibox text replace '(?m)^(.+)$' "artifact: \$1" --regex >&2

      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Generate checksums and signatures
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./scripts/release/generate-checksums.sh
          ./scripts/release/generate-checksums.sh --artifacts-dir dist

      - name: Create GitHub release
        if: env.DRY_RUN != 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*
          generate_release_notes: true

  linux-packages:
    name: Publish native Linux packages
    needs: [prepare, publish]
    if: needs.prepare.outputs.dry_run != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/release-linux-packages.yml
    # Required for the called job to resolve its protected environment secrets.
    # Remove only when actions/runner#4453 is fixed and environment access is verified.
    secrets: inherit
    with:
      project: cargo-mono
      version: ${{ needs.prepare.outputs.version }}
      revision: ${{ github.sha }}
      mode: publish
