name: Setup CI Go dependencies
description: Restore Go modules and build cache without saving before validation
inputs:
  cache-scope:
    description: Optional validation scope isolating independently saved Go caches
    required: false
    default: ""
  cache-fallback-scope:
    description: Optional prior producer scope to restore after the current scope
    required: false
    default: ""
outputs:
  cache-key:
    description: Exact cache key for a successful main job to save
    value: ${{ steps.restore.outputs.cache-primary-key }}
  cache-hit:
    description: Whether the exact cache key was restored
    value: ${{ steps.restore.outputs.cache-hit }}
  cache-path:
    description: Go module and build cache directories
    value: ${{ steps.paths.outputs.paths }}
runs:
  using: composite
  steps:
    # The v6.5.0 commit archive returns 404 from codeload despite a valid tag.
    # Keep shared CI on the downloadable v6.4.0 release with the same inputs.
    # Remove this fallback when the v6.5.0 or newer pinned archive is available.
    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      id: go
      with:
        go-version-file: go.mod
        cache: false
    - name: Locate Go caches
      id: paths
      shell: bash
      run: |
        {
          echo 'paths<<CI_GO_CACHE_PATHS'
          go env GOMODCACHE GOCACHE
          echo 'CI_GO_CACHE_PATHS'
        } >> "$GITHUB_OUTPUT"
        # Turbo's strict task environment excludes Windows LocalAppData. Export
        # the prepared cache locations explicitly instead of passing user state.
        echo "GOCACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"
        echo "GOPATH=$(go env GOPATH)" >> "$GITHUB_ENV"
    - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      id: restore
      with:
        path: ${{ steps.paths.outputs.paths }}
        key: ci-go-v1${{ inputs.cache-scope != '' && format('-{0}', inputs.cache-scope) || '' }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}
        restore-keys: |
          ci-go-v1${{ inputs.cache-scope != '' && format('-{0}', inputs.cache-scope) || '' }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
          ${{ inputs.cache-fallback-scope != '' && format('ci-go-v1-{0}-{1}-{2}-{3}-', inputs.cache-fallback-scope, runner.os, runner.arch, steps.go.outputs.go-version) || '' }}
          ci-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
